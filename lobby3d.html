<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRISM Hall 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;800&family=Figtree:wght@600;800&display=swap">
<style>
/* 3D walk-around of the PRISM exhibition: banner + live screen at the back, glass prism in the middle,
   four coloured desks in an arc, each joined to the prism by a beam of light on the floor. */
:root{--ink:#1B2559;--navy:#232C7A;--night:#141A4D;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#E9EDF6;font-family:Figtree,"Segoe UI",Arial,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:16px;top:16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:16px;padding:12px 16px;box-shadow:0 6px 24px rgba(27,37,89,.14);max-width:min(330px,calc(100vw - 32px))}
.hud b{font-family:Lexend,Arial,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;display:block}
.hud b span{background:linear-gradient(90deg,#F68922,#3B56A8,#E5484D,#12A36B);-webkit-background-clip:text;background-clip:text;color:transparent}
.hud small{display:block;color:#5A6488;font-weight:600;font-size:13px;margin-top:2px}
.views{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:18px;padding:6px;box-shadow:0 6px 24px rgba(27,37,89,.14);max-width:calc(100vw - 24px)}
.views button{border:0;background:transparent;font:inherit;font-weight:800;font-size:13px;color:var(--ink);padding:8px 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.views button i{width:10px;height:10px;border-radius:50%}
.views button:hover{background:#F0F3FA}
.views button.on{background:var(--navy);color:#fff}
.views button:focus-visible{outline:3px solid #3B56A8;outline-offset:1px}
.hint{position:fixed;right:16px;top:16px;background:rgba(20,26,77,.85);color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:99px}
.err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-weight:700}
@media (max-width:640px){.hint{display:none}.hud{padding:10px 12px}.hud b{font-size:17px}.views button{padding:7px 9px;font-size:12px}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D view of the PRISM exhibition hall"></canvas>
<div class="hud"><b><span>PRISM</span> · Exhibition lobby</b><small>Four desks, one spectrum. Drag to turn, pinch or scroll to zoom.</small></div>
<div class="hint">Drag to look around</div>
<nav class="views" id="views" aria-label="Camera views">
  <button data-v="overview" class="on">Overview</button>
  <button data-v="entrance">Entrance</button>
  <button data-v="top">Top view</button>
  <button data-v="d0"><i style="background:#F68922"></i>Idea Exchange</button>
  <button data-v="d1"><i style="background:#3B56A8"></i>Leadership Lab</button>
  <button data-v="d2"><i style="background:#E5484D"></i>Crisis Room</button>
  <button data-v="d3"><i style="background:#12A36B"></i>Guest desk</button>
  <button data-v="tour" id="tourb">▶ Tour</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function () {
  if (!window.THREE || !THREE.OrbitControls) { document.body.insertAdjacentHTML("beforeend", '<div class="err">The 3D view needs an internet connection to load. Please refresh.</div>'); return; }
  try { await Promise.all([document.fonts.load('800 80px Lexend'), document.fonts.load('800 40px Figtree'), document.fonts.load('600 40px Figtree')]); } catch {}

  const DESKS = [
    {name: "Idea Exchange", line: "Invest in the best ideas", c: "#F68922", d: "#C9530F"},
    {name: "Leadership Lab", line: "Discover your leadership style", c: "#3B56A8", d: "#2A338E"},
    {name: "Crisis Room", line: "Lead a company through 5 crises", c: "#E5484D", d: "#A3262A"},
    {name: "Guest desk", line: "Leadership and innovation", c: "#12A36B", d: "#0A7A4E"}
  ];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true, preserveDrawingBuffer: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#E9EDF6");
  scene.fog = new THREE.Fog("#E9EDF6", 38, 70);
  const camera = new THREE.PerspectiveCamera(45, 1, .1, 200);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.05; controls.minDistance = 4; controls.maxDistance = 42;

  /* ---------- helpers ---------- */
  const tex = (w, h, draw) => { const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const g = cv.getContext("2d"); draw(g, w, h); const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial({color: c, roughness: .6, metalness: .05, ...o});
  const box = (w, h, d, m, x = 0, y = 0, z = 0) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; return b; };
  const rr = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
  const qr = (g, x, y, s, seed) => { // decorative QR-style pattern
    let v = seed; const R = () => (v = (v * 16807) % 2147483647) / 2147483647; const n = 21, c = s / n;
    g.fillStyle = "#fff"; g.fillRect(x - c, y - c, s + 2 * c, s + 2 * c); g.fillStyle = "#1B2559";
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (R() < .5) g.fillRect(x + i * c, y + j * c, c, c);
    [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => { g.fillStyle = "#1B2559"; g.fillRect(x + a * c, y + b * c, 7 * c, 7 * c); g.fillStyle = "#fff"; g.fillRect(x + (a + 1) * c, y + (b + 1) * c, 5 * c, 5 * c); g.fillStyle = "#1B2559"; g.fillRect(x + (a + 2) * c, y + (b + 2) * c, 3 * c, 3 * c); });
  };
  const prismIcon = (g, cx, cy, s, beams = true) => {
    if (beams) { g.lineCap = "round"; g.lineWidth = s * .09; g.strokeStyle = "#fff"; g.beginPath(); g.moveTo(cx - s * 1.6, cy + s * .1); g.lineTo(cx - s * .25, cy + s * .05); g.stroke();
      ["#F68922", "#7F9BFF", "#FF6B70", "#3FD69A"].forEach((c, i) => { g.strokeStyle = c; g.beginPath(); g.moveTo(cx + s * .25, cy - s * .06 + i * s * .06); g.lineTo(cx + s * 1.7, cy - s * .75 + i * s * .5); g.stroke(); }); }
    g.fillStyle = "rgba(255,255,255,.28)"; g.strokeStyle = "#fff"; g.lineWidth = s * .05; g.beginPath(); g.moveTo(cx, cy - s * .6); g.lineTo(cx + s * .52, cy + s * .42); g.lineTo(cx - s * .52, cy + s * .42); g.closePath(); g.fill(); g.stroke();
  };
  const spectrum = (g, x, y, w) => { const gr = g.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, "#F68922"); gr.addColorStop(.35, "#7F9BFF"); gr.addColorStop(.68, "#FF6B70"); gr.addColorStop(1, "#3FD69A"); return gr; };

  /* ---------- lights ---------- */
  scene.add(new THREE.HemisphereLight("#ffffff", "#B8C0D6", .6));
  const sun = new THREE.DirectionalLight("#ffffff", .75); sun.position.set(8, 18, 12); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -14, right: 14, top: 14, bottom: -14}); sun.shadow.bias = -.0005; scene.add(sun);

  /* ---------- lobby (from the sketch: front main entrance, back entrance, side doors to classes and offices) ---------- */
  const W = 14, D = 13, H = 4.6, HW = W / 2, HD = D / 2, DOOR = 4.4, DH = 2.9, SIDEZ = -1.9, SDW = 1.8;
  const floorT = tex(1024, 1024, (g, w, h) => { for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { g.fillStyle = (i + j) % 2 ? "#E4DBCB" : "#ECE5D8"; g.fillRect(i * 128, j * 128, 128, 128); } g.strokeStyle = "#D6CCB9"; g.lineWidth = 3; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke(); } });
  floorT.wrapS = floorT.wrapT = THREE.RepeatWrapping; floorT.repeat.set(W / 4.8, D / 4.8);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat("#fff", {map: floorT, roughness: .22, metalness: .08}));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // outside paving in front and behind
  const paveT = tex(512, 512, (g, w, h) => { g.fillStyle = "#CDBFB0"; g.fillRect(0, 0, w, h); g.strokeStyle = "#B9AA99"; g.lineWidth = 4; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); } });
  paveT.wrapS = paveT.wrapT = THREE.RepeatWrapping; paveT.repeat.set(5, 2);
  [HD + 3.2, -HD - 3.2].forEach(z => { const p = new THREE.Mesh(new THREE.PlaneGeometry(W + 6, 6.4), mat("#fff", {map: paveT, roughness: .95})); p.rotation.x = -Math.PI / 2; p.position.set(0, -.02, z); p.receiveShadow = true; scene.add(p); });
  // cream wall panels like the building's cladding
  const wallT = tex(512, 512, (g, w, h) => { g.fillStyle = "#EFE8DC"; g.fillRect(0, 0, w, h); g.strokeStyle = "#D9D0C0"; g.lineWidth = 5; g.strokeRect(2, 2, w - 4, h - 4); });
  wallT.wrapS = wallT.wrapT = THREE.RepeatWrapping;
  // walls are one-sided planes facing into the lobby, so from outside you can see straight in (cut-away view)
  function wall(u0, u1, v0, v1, place) {
    const w = u1 - u0, h = v1 - v0, t = wallT.clone(); t.needsUpdate = true; t.repeat.set(w / 1.5, h / 1.5);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat("#fff", {map: t, roughness: .85}));
    m.receiveShadow = true; place(m, (u0 + u1) / 2, (v0 + v1) / 2); scene.add(m); return m;
  }
  const back = (m, u, v) => m.position.set(u, v, -HD);
  const front = (m, u, v) => { m.rotation.y = Math.PI; m.position.set(u, v, HD); };
  const left = (m, u, v) => { m.rotation.y = Math.PI / 2; m.position.set(-HW, v, u); };
  const right = (m, u, v) => { m.rotation.y = -Math.PI / 2; m.position.set(HW, v, u); };
  [back, front].forEach(f => { wall(-HW, -DOOR / 2, 0, H, f); wall(DOOR / 2, HW, 0, H, f); wall(-DOOR / 2, DOOR / 2, DH, H, f); });
  [left, right].forEach(f => { wall(-HD, SIDEZ - SDW / 2, 0, H, f); wall(SIDEZ + SDW / 2, HD, 0, H, f); wall(SIDEZ - SDW / 2, SIDEZ + SDW / 2, DH - .4, H, f); });
  // dark granite skirting, like the base outside
  const skirt = mat("#6B3A3A", {roughness: .4});
  scene.add(box(W, .12, .03, skirt, 0, .06, -HD + .02));
  [-1, 1].forEach(sx => scene.add(box(.03, .12, D, skirt, sx * (HW - .02), .06, 0)));
  // glass double doors with aluminium frames
  const glassM = new THREE.MeshPhysicalMaterial({color: "#CFE3EE", transparent: true, opacity: .25, roughness: .05, metalness: .1, side: THREE.DoubleSide, depthWrite: false});
  const alu = mat("#C9CDD3", {metalness: .6, roughness: .3});
  function doors(z, label) {
    const g = new THREE.Group(); g.position.set(0, 0, z); scene.add(g);
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(DOOR - .1, DH - .05), glassM); pane.position.set(0, DH / 2, 0); g.add(pane);
    [-DOOR / 2, -DOOR / 4, 0, DOOR / 4, DOOR / 2].forEach(x => g.add(box(.07, DH, .09, alu, x, DH / 2, 0)));
    g.add(box(DOOR + .1, .1, .1, alu, 0, DH, 0)); g.add(box(DOOR + .1, .06, .1, alu, 0, .03, 0));
    [-.12, .12].forEach(x => g.add(box(.03, .6, .06, alu, x, 1.1, .08)));
    const st = z > 0 ? 1 : -1;
    g.add(box(DOOR + 1.4, .14, .6, mat("#6B3A3A", {roughness: .4}), 0, -.06, st * .4));
    const lb = tex(1024, 128, (c, w, h) => { c.fillStyle = "#1B2559"; c.font = "800 70px Figtree"; c.textAlign = "center"; c.fillText(label, w / 2, 92); });
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(3.6, .45), new THREE.MeshBasicMaterial({map: lb, transparent: true, toneMapped: false}));
    sign.position.set(0, .01, st * 1.6); sign.rotation.x = -Math.PI / 2; if (z < 0) sign.rotation.z = Math.PI; g.add(sign);
  }
  doors(HD, "FRONT MAIN ENTRANCE"); doors(-HD, "BACK ENTRANCE");
  // corridor doors on the sides
  [[-1, "Classes"], [1, "Offices"]].forEach(([sx, label]) => {
    const dark = new THREE.Mesh(new THREE.PlaneGeometry(SDW, DH - .4), new THREE.MeshBasicMaterial({color: "#9A9284"}));
    dark.position.set(sx * (HW + .8), (DH - .4) / 2, SIDEZ); dark.rotation.y = -sx * Math.PI / 2; scene.add(dark);
    const corridor = new THREE.Mesh(new THREE.PlaneGeometry(.8, SDW), mat("#D9D0C0")); corridor.rotation.x = -Math.PI / 2; corridor.position.set(sx * (HW + .4), .001, SIDEZ); scene.add(corridor);
    const st = tex(512, 128, (c, w, h) => { c.fillStyle = "#1B2559"; rr(c, 0, 0, w, h, 24); c.fill(); c.fillStyle = "#fff"; c.font = "800 60px Figtree"; c.textAlign = "center"; c.fillText((sx < 0 ? "‹  " : "") + label + (sx > 0 ? "  ›" : ""), w / 2, 86); });
    const sg = new THREE.Mesh(new THREE.PlaneGeometry(1.4, .35), new THREE.MeshBasicMaterial({map: st, toneMapped: false}));
    sg.position.set(sx * (HW - .02), DH - .15, SIDEZ); sg.rotation.y = -sx * Math.PI / 2; scene.add(sg);
  });

  /* ---------- main PRISM banner above the back entrance ---------- */
  const bannerT = tex(2400, 900, (g, w, h) => {
    const bg = g.createRadialGradient(w * .3, 0, 50, w * .5, h * .6, w * .8); bg.addColorStop(0, "#2B3590"); bg.addColorStop(1, "#141A4D"); g.fillStyle = bg; g.fillRect(0, 0, w, h);
    prismIcon(g, w * .72, h * .5, 300);
    g.fillStyle = "#fff"; g.font = "800 300px Lexend"; g.textBaseline = "alphabetic"; g.fillText("PRISM", 120, 430);
    g.fillStyle = spectrum(g, 120, 0, 1000); g.fillRect(124, 470, 1000, 14);
    g.fillStyle = "#fff"; g.font = "600 92px Lexend"; g.fillText("Many Ideas, One Light", 120, 600);
    g.font = "600 52px Figtree"; g.fillStyle = "rgba(255,255,255,.78)"; g.fillText("MBA Leadership & Innovation · UTAS Ibra", 124, 700);
  });
  const banner = new THREE.Mesh(new THREE.PlaneGeometry(4.3, 1.6), new THREE.MeshBasicMaterial({map: bannerT, toneMapped: false}));
  banner.position.set(0, 3.75, -HD + .03); scene.add(banner);
  // PRISM Pass poster left of the back door
  const passT = tex(900, 1200, (g, w, h) => {
    g.fillStyle = "#141A4D"; g.fillRect(0, 0, w, h); prismIcon(g, w / 2, 160, 110);
    g.fillStyle = "#fff"; g.textAlign = "center"; g.font = "800 84px Lexend"; g.fillText("PRISM Pass", w / 2, 360);
    g.font = "600 40px Figtree"; g.fillStyle = "rgba(255,255,255,.8)"; g.fillText("Visit, play and rate all 4 desks", w / 2, 430);
    const steps = ["Scan the desk QR", "Play the experience", "Rate the desk", "Collect its colour"], cols = ["#F68922", "#3B56A8", "#E5484D", "#12A36B"];
    steps.forEach((t, i) => { const y = 540 + i * 130; g.fillStyle = cols[i]; g.beginPath(); g.arc(150, y, 44, 0, 7); g.fill(); g.fillStyle = "#fff"; g.font = "800 46px Lexend"; g.fillText(i + 1, 150, y + 16); g.textAlign = "left"; g.font = "800 50px Figtree"; g.fillText(t, 230, y + 17); g.textAlign = "center"; });
    g.fillStyle = spectrum(g, 100, 0, 700); rr(g, 100, 1060, 700, 90, 45); g.fill(); g.fillStyle = "#fff"; g.font = "800 46px Figtree"; g.fillText("Full Spectrum = all 4 colours", w / 2, 1120);
  });
  const pass = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2), new THREE.MeshBasicMaterial({map: passT, toneMapped: false}));
  pass.position.set(-4.4, 1.85, -HD + .03); scene.add(pass);

  /* ---------- PRISM Live screen (animated bars) ---------- */
  const liveCv = document.createElement("canvas"); liveCv.width = 1280; liveCv.height = 720;
  const liveT = new THREE.CanvasTexture(liveCv); liveT.encoding = THREE.sRGBEncoding;
  const scores = [91, 88, 85, 80];
  function drawLive(t) {
    const g = liveCv.getContext("2d"), w = 1280, h = 720;
    g.fillStyle = "#141A4D"; g.fillRect(0, 0, w, h);
    g.font = "800 64px Lexend"; g.fillStyle = spectrum(g, 60, 0, 260); g.fillText("PRISM", 60, 110); g.fillStyle = "#fff"; g.fillText("Live", 300, 110);
    g.fillStyle = "#3FD69A"; g.beginPath(); g.arc(470, 88, 10 + Math.sin(t * 4) * 2, 0, 7); g.fill(); g.font = "800 30px Figtree"; g.fillText("LIVE", 490, 100);
    g.fillStyle = "rgba(255,255,255,.6)"; g.font = "800 28px Figtree"; g.fillText("WHICH DESK SHINES BRIGHTEST?", 700, 100);
    const order = DESKS.map((d, i) => ({d, s: scores[i] + Math.sin(t * .6 + i * 1.7) * 2})).sort((a, b) => b.s - a.s);
    order.forEach((o, i) => {
      const y = 190 + i * 125;
      g.fillStyle = "rgba(255,255,255,.55)"; g.font = "800 40px Lexend"; g.fillText(i + 1, 60, y + 38);
      g.fillStyle = "#fff"; g.font = "800 36px Figtree"; g.fillText(o.d.name, 120, y + 36);
      rr(g, 470, y, 620, 46, 23); g.fillStyle = "rgba(255,255,255,.1)"; g.fill();
      g.save(); g.shadowColor = o.d.c; g.shadowBlur = 30; rr(g, 470, y, 620 * o.s / 100, 46, 23); g.fillStyle = o.d.c; g.fill(); g.restore();
      g.fillStyle = "#fff"; g.font = "800 44px Lexend"; g.fillText(Math.round(o.s), 1120, y + 40);
    });
    liveT.needsUpdate = true;
  }
  drawLive(0);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.03), new THREE.MeshBasicMaterial({map: liveT, toneMapped: false}));
  scr.position.set(4.6, 2.05, -HD + .45); scene.add(scr);
  scene.add(box(3.8, 2.2, .12, mat("#0B0F33", {metalness: .4, roughness: .3}), 4.6, 2.05, -HD + .37));
  scene.add(box(.12, 1.1, .12, mat("#3A3F55"), 4.6, .55, -HD + .4));
  scene.add(box(1.4, .06, .8, mat("#3A3F55"), 4.6, .03, -HD + .5));

  /* ---------- glass prism centrepiece ---------- */
  const PC = new THREE.Vector3(0, 0, .6);
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(.75, .85, 1, 48), mat("#232C7A", {roughness: .35}));
  ped.position.set(PC.x, .5, PC.z); ped.castShadow = ped.receiveShadow = true; scene.add(ped);
  const triShape = new THREE.Shape(); triShape.moveTo(0, .62); triShape.lineTo(.55, -.32); triShape.lineTo(-.55, -.32); triShape.closePath();
  const triGeo = new THREE.ExtrudeGeometry(triShape, {depth: .6, bevelEnabled: true, bevelSize: .02, bevelThickness: .02, bevelSegments: 2});
  triGeo.center();
  const glass = new THREE.Mesh(triGeo, new THREE.MeshPhysicalMaterial({color: "#9FB4FF", emissive: "#3B56A8", emissiveIntensity: .25, metalness: .1, roughness: .05, transparent: true, opacity: .75, clearcoat: 1, side: THREE.DoubleSide}));
  glass.position.set(PC.x, 1.38, PC.z); glass.castShadow = true; scene.add(glass);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(triGeo), new THREE.LineBasicMaterial({color: "#ffffff"}));
  glass.add(edges);
  const pLight = new THREE.PointLight("#ffffff", .6, 6); pLight.position.set(PC.x, 1.6, PC.z); scene.add(pLight);

  /* ---------- desks: two along each side wall, facing the walkway ---------- */
  const deskPos = [[-5.2, .5, Math.PI / 2], [-5.2, 3.6, Math.PI / 2], [5.2, .5, -Math.PI / 2], [5.2, 3.6, -Math.PI / 2]];  // x, z, rotation
  const beams = [];
  const people = [];
  DESKS.forEach((d, i) => {
    const [x, z, ry] = deskPos[i];
    const grp = new THREE.Group(); grp.position.set(x, 0, z); grp.rotation.y = ry; scene.add(grp);
    // table with coloured front panel
    grp.add(box(2.6, .08, 1, mat("#FFFFFF", {roughness: .4}), 0, .92, 0));
    const frontT = tex(1040, 360, (g, w, h) => { g.fillStyle = d.c; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(255,255,255,.14)"; g.beginPath(); g.arc(w - 60, 40, 150, 0, 7); g.fill(); prismIcon(g, 110, 150, 70, false); g.fillStyle = "#fff"; g.font = "800 84px Lexend"; g.fillText(d.name, 200, 175); g.font = "600 42px Figtree"; g.fillStyle = "rgba(255,255,255,.9)"; g.fillText(d.line, 202, 250); });
    const front = new THREE.Mesh(new THREE.BoxGeometry(2.6, .88, .9), [mat(d.c), mat(d.c), mat(d.c), mat(d.c), mat("#fff", {map: frontT}), mat(d.c)]);
    front.position.set(0, .44, 0); front.castShadow = front.receiveShadow = true; grp.add(front);
    // laptop + small screen on table
    const lapT = tex(512, 320, (g, w, h) => { g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.fillStyle = d.c; g.fillRect(0, 0, w, 56); g.fillStyle = "#fff"; g.font = "800 30px Figtree"; g.fillText(d.name, 18, 38); for (let k = 0; k < 4; k++) { g.fillStyle = "#EEF1F8"; rr(g, 18, 76 + k * 58, w - 36, 44, 10); g.fill(); g.fillStyle = d.c; rr(g, 18, 76 + k * 58, (w - 36) * (.9 - k * .15), 44, 10); g.fill(); } });
    const lap = new THREE.Group(); lap.position.set(-.5, .96, -.05); lap.rotation.y = .25; grp.add(lap);
    lap.add(box(.7, .03, .48, mat("#9AA1B8", {metalness: .5, roughness: .3}), 0, 0, 0));
    const lid = new THREE.Mesh(new THREE.BoxGeometry(.7, .46, .02), [mat("#9AA1B8"), mat("#9AA1B8"), mat("#9AA1B8"), mat("#9AA1B8"), new THREE.MeshBasicMaterial({map: lapT, toneMapped: false}), mat("#9AA1B8")]);
    lid.position.set(0, .23, -.24); lid.rotation.x = -.18; lid.rotation.y = Math.PI; lid.castShadow = true; lap.add(lid);
    // QR stand on the table
    const qrT = tex(400, 520, (g, w, h) => { g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.fillStyle = d.c; g.fillRect(0, 0, w, 90); g.fillStyle = "#fff"; g.font = "800 40px Figtree"; g.textAlign = "center"; g.fillText("SCAN & RATE", w / 2, 60); qr(g, 70, 130, 260, 7 + i * 13); g.fillStyle = "#1B2559"; g.font = "800 32px Figtree"; g.fillText("Play + rate this desk", w / 2, 490); });
    const qs = new THREE.Mesh(new THREE.PlaneGeometry(.34, .44), new THREE.MeshBasicMaterial({map: qrT, toneMapped: false}));
    qs.position.set(.75, 1.18, .2); qs.rotation.x = -.2; qs.rotation.y = Math.PI; grp.add(qs);
    // roll-up banner behind the desk
    const rollT = tex(600, 1600, (g, w, h) => {
      g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
      g.fillStyle = "#141A4D"; g.fillRect(0, 0, w, 300); prismIcon(g, w / 2, 150, 95); g.fillStyle = "#fff"; g.font = "800 56px Lexend"; g.textAlign = "center"; g.fillText("PRISM", w / 2, 285);
      g.fillStyle = d.c; g.fillRect(0, 300, w, 760);
      g.save(); g.globalAlpha = .18; g.fillStyle = "#fff"; g.beginPath(); g.moveTo(0, 520); g.lineTo(w, 360); g.lineTo(w, 460); g.lineTo(0, 600); g.fill(); g.restore();
      g.fillStyle = "#fff"; g.font = "800 30px Figtree"; g.fillText(`DESK ${i + 1}`, w / 2, 390);
      g.font = "800 86px Lexend"; const words = d.name.split(" "); words.forEach((wd, k) => g.fillText(wd, w / 2, 520 + k * 100));
      g.font = "600 38px Figtree"; const ln = d.line.split(" "), half = Math.ceil(ln.length / 2); g.fillText(ln.slice(0, half).join(" "), w / 2, 780); g.fillText(ln.slice(half).join(" "), w / 2, 830);
      qr(g, 150, 1120, 300, 3 + i * 17); g.fillStyle = "#1B2559"; g.font = "800 40px Figtree"; g.fillText("Scan to play & rate", w / 2, 1505);
      g.fillStyle = d.c; g.fillRect(0, h - 40, w, 40);
    });
    const roll = new THREE.Mesh(new THREE.PlaneGeometry(.95, 2.53), new THREE.MeshBasicMaterial({map: rollT, toneMapped: false}));
    roll.position.set(1.65, 1.36, -.9); grp.add(roll);
    grp.add(box(1, .1, .3, mat("#9AA1B8", {metalness: .5}), 1.65, .05, -.9));
    grp.add(box(.97, 2.55, .02, mat("#E8EBF2"), 1.65, 1.36, -.92));
    // two chairs
    [-.6, .6].forEach(cx => { grp.add(box(.5, .06, .5, mat("#2A2F45"), cx, .5, -1)); grp.add(box(.5, .6, .06, mat("#2A2F45"), cx, .8, -1.24)); grp.add(box(.05, .5, .05, mat("#555"), cx, .25, -1)); });
    // team member behind the desk + visitor in front
    const person = (px, pz, col, rot) => { const p = new THREE.Group(); p.position.set(px, 0, pz); p.rotation.y = rot;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(.2, .24, 1.15, 16), mat(col)); body.position.y = .95; body.castShadow = true; p.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.16, 20, 16), mat("#C99A7A")); head.position.y = 1.7; head.castShadow = true; p.add(head);
      const legs = new THREE.Mesh(new THREE.CylinderGeometry(.18, .16, .45, 12), mat("#2B2F3E")); legs.position.y = .22; p.add(legs); grp.add(p); return p; };
    person(.1, -.75, "#FFFFFF", 0);
    people.push(person(i % 2 ? 1.05 : -1.05, 1.2, ["#1B2559", "#7A5C3E", "#3E4A6B", "#5A3E5E"][i], Math.PI + (i % 2 ? -.3 : .3)));

    // light beam on the floor from the prism to the desk
    const target = new THREE.Vector3(x, 0, z).add(new THREE.Vector3(0, 0, 1.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), ry));
    const from = new THREE.Vector3(PC.x, 0, PC.z), dir = target.clone().sub(from), len = dir.length() - 1;
    const beamT = tex(64, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(1, "rgba(255,255,255,.35)"); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(255,255,255,.6)"; for (let k = 0; k < h; k += 48) g.fillRect(0, k, w, 18); });
    beamT.wrapT = THREE.RepeatWrapping; beamT.repeat.set(1, len / 1.5);
    const bm = new THREE.Mesh(new THREE.PlaneGeometry(.38, len), new THREE.MeshBasicMaterial({color: d.c, map: beamT, transparent: true, opacity: .95, toneMapped: false}));
    bm.rotation.x = -Math.PI / 2; bm.rotation.z = -Math.atan2(dir.x, -dir.z) ;
    const mid = from.clone().add(dir.clone().normalize().multiplyScalar(.85 + len / 2)); bm.position.set(mid.x, .012, mid.z); scene.add(bm); beams.push(beamT);
    // glow halo for the beam
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, len), new THREE.MeshBasicMaterial({color: d.c, transparent: true, opacity: .16, toneMapped: false, depthWrite: false}));
    glow.rotation.copy(bm.rotation); glow.position.set(mid.x, .01, mid.z); scene.add(glow);
    // coloured beam out of the prism (3D, slightly rising)
    const ray = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, 2.6, 8), new THREE.MeshBasicMaterial({color: d.c, transparent: true, opacity: .85, toneMapped: false}));
    const rdir = dir.clone().normalize(); const rpos = new THREE.Vector3(PC.x, 1.38, PC.z).add(rdir.clone().multiplyScalar(1.6)); rpos.y = .9;
    ray.position.copy(rpos); ray.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(rdir.x, -.45, rdir.z).normalize()); scene.add(ray);
    d.focus = {pos: new THREE.Vector3(x, 1.2, z), cam: new THREE.Vector3(x, 0, z).add(new THREE.Vector3(0, 3, 6).applyAxisAngle(new THREE.Vector3(0, 1, 0), ry))};
  });
  // white beam into the prism from the entrance side
  const white = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, 3.2, 8), new THREE.MeshBasicMaterial({color: "#ffffff", toneMapped: false}));
  white.position.set(PC.x, 1.7, PC.z + 2.1); white.rotation.x = Math.PI / 2 - .2; scene.add(white);

  // entrance sign on the floor
  const entT = tex(1024, 256, (g, w, h) => { g.fillStyle = "#fff"; g.font = "800 92px Lexend"; g.textAlign = "center"; g.fillText("WELCOME TO PRISM", w / 2, 150); g.fillStyle = spectrum(g, 200, 0, 624); g.fillRect(200, 185, 624, 12); });
  const ent = new THREE.Mesh(new THREE.PlaneGeometry(3, .75), new THREE.MeshBasicMaterial({map: entT, transparent: true, toneMapped: false}));
  ent.rotation.x = -Math.PI / 2; ent.position.set(0, .015, HD - 1.4); scene.add(ent);

  // a few plants for warmth
  [[-2.9, -HD + .6], [6.2, HD - .6], [-6.2, HD - .6]].forEach(([x, z]) => { scene.add(box(.6, .6, .6, mat("#E8EBF2"), x, .3, z)); const lf = new THREE.Mesh(new THREE.SphereGeometry(.55, 16, 12), mat("#3F9B6A")); lf.position.set(x, 1.05, z); lf.castShadow = true; scene.add(lf); });

  /* ---------- views ---------- */
  const V = {
    entrance: {cam: [-1.2, 3.6, 6.2], at: [0, .9, -1.5]},
    top: {cam: [0, 21, 1.5], at: [0, 0, 0]},
    overview: {cam: [11, 11, 14], at: [0, .8, 0]}
  };
  DESKS.forEach((d, i) => V["d" + i] = {cam: d.focus.cam.toArray(), at: d.focus.pos.toArray()});
  let anim = null, tour = null;
  function go(name, dur = 1600) {
    const v = V[name]; if (!v) return;
    const c0 = camera.position.clone(), t0 = controls.target.clone(), c1 = new THREE.Vector3(...v.cam), t1 = new THREE.Vector3(...v.at), s = performance.now();
    anim = {c0, t0, c1, t1, s, dur: reduce ? 1 : dur};
    document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === name || (b.dataset.v === "tour" && tour)));
  }
  camera.position.set(...V.overview.cam); controls.target.set(...V.overview.at);
  const SEQ = ["entrance", "d0", "d1", "d2", "d3", "overview", "top"];
  function stopTour() { clearInterval(tour); tour = null; document.getElementById("tourb").textContent = "▶ Tour"; }
  document.getElementById("views").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return; const v = b.dataset.v;
    if (v === "tour") { if (tour) { stopTour(); go("entrance"); return; } let k = 0; tour = setInterval(() => { k = (k + 1) % SEQ.length; go(SEQ[k], 2200); }, 4200); b.textContent = "■ Stop"; go(SEQ[0], 1800); return; }
    stopTour(); go(v);
  });
  controls.addEventListener("start", () => { anim = null; if (tour) stopTour(); });

  /* ---------- loop ---------- */
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 62 : 45; camera.updateProjectionMatrix(); }
  addEventListener("resize", resize); resize();
  const clock = new THREE.Clock(); let liveAcc = 0;
  (function loop() {
    const dt = clock.getDelta(), t = clock.elapsedTime;
    if (anim) { const k = Math.min(1, (performance.now() - anim.s) / anim.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(anim.c0, anim.c1, e); controls.target.lerpVectors(anim.t0, anim.t1, e); if (k >= 1) anim = null; }
    if (!reduce) {
      glass.rotation.y = t * .35;
      beams.forEach(b => b.offset.y = -t * .6);
      people.forEach((p, i) => p.position.y = Math.abs(Math.sin(t * 1.5 + i)) * .02);
      liveAcc += dt; if (liveAcc > .1) { drawLive(t); liveAcc = 0; }
    }
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
  })();
})();
