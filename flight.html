body{background:var(--night);color:#fff;font-family:var(--B);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes fadeUp{from{transform:translateY(.8em);opacity:0}to{transform:none;opacity:1}}
@keyframes popin{from{transform:scale(0);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:.3}}
.av{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85em;flex:none}

/* ================= HOST ================= */
.host{height:100vh;display:grid;grid-template-rows:auto 1fr auto;font-size:clamp(14px,1.16vw,30px);
  background:radial-gradient(80em 40em at 50% 0%,#132a55 0%,transparent 60%),linear-gradient(180deg,#081329,#040a16)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:1.5vh 2vw;gap:1em}
.logo{display:flex;align-items:center;gap:.7em}
.logo svg{width:2.3em;height:2.3em}
.logo b{font-family:var(--D);font-weight:800;font-size:1.45em;letter-spacing:.04em;line-height:1}
.logo small{display:block;font-family:var(--M);font-weight:700;font-size:.62em;letter-spacing:.2em;color:var(--glow);margin-top:.35em}
.chips{display:flex;gap:.5em;align-items:center}
.chip{display:flex;align-items:center;gap:.45em;border:1px solid #ffffff2e;background:#ffffff0d;border-radius:.6em;padding:.4em .85em;font-weight:800;font-size:.82em}
.chip b{font-family:var(--M)}
.chip.live{border-color:var(--red);color:#fff;background:#ff3b4e26}
.chip.live i{width:.6em;height:.6em;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.chip.demo{border-color:var(--amber);color:var(--amber)}
.chip.off{opacity:.4}
.ticker{background:var(--red);color:#fff;overflow:hidden;white-space:nowrap;font-family:var(--M);font-weight:800;letter-spacing:.16em;font-size:.8em;padding:.6em 0}
.ticker.calm{background:var(--ok)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.ticker i{font-style:normal;opacity:.65;margin:0 1.2em}

.stage{display:grid;grid-template-columns:1fr 22em;grid-template-rows:minmax(0,1fr) auto;gap:1.2vw;padding:0 2vw 1.6vh;min-height:0}
.wall{position:relative;border-radius:1.2em;overflow:hidden;background:var(--wall);border:1px solid #ffffff1c;min-height:0;box-shadow:0 30px 60px -30px #000}
.wall>svg.map{position:absolute;inset:0;width:100%;height:100%}
.wall .ov{position:absolute;z-index:2}

/* white brief card on the wall */
.brief{left:1.2em;top:1.2em;width:min(31em,58%);background:var(--paper);color:var(--ink);border-radius:1.1em;padding:1.1em 1.3em 1.2em;box-shadow:0 24px 50px -20px #000c;animation:fadeUp .6s both;display:flex;flex-direction:column;gap:.7em}
.tagrow{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.qtag{display:inline-flex;align-items:center;gap:.5em;font-family:var(--M);font-weight:800;font-size:.72em;letter-spacing:.14em;background:var(--ink);color:#fff;border-radius:.45em;padding:.35em .7em}
.qtag.red{background:var(--red)}
.qtag.ok{background:var(--ok)}
.situ{font-size:1.08em;line-height:1.45;font-weight:600;color:var(--ink2)}
.situ b{color:var(--ink)}
.qline{display:flex;align-items:center;gap:.8em}
.q{font-family:var(--D);font-weight:800;font-size:2.15em;line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
.timer{position:relative;width:4.4em;height:4.4em;flex:none}
.timer svg{width:100%;height:100%}
.t-bg{fill:#fff;stroke:var(--line);stroke-width:9}
.t-fg{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .15s linear}
.timer.low .t-fg{stroke:var(--red)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--M);font-weight:800;font-size:1.6em;color:var(--ink)}
.timer.low b{color:var(--red)}
.conseq{background:var(--ink);color:#fff;border-radius:.9em;padding:.8em 1em}
.conseq small{display:block;font-family:var(--M);font-weight:800;letter-spacing:.14em;font-size:.68em;color:var(--red2);margin-bottom:.3em}
.conseq.good small{color:#8ff0db}
.conseq p{font-family:var(--D);font-weight:700;font-size:1.25em;line-height:1.3}
.fact{border-left:.28em solid var(--amber);padding:.1em 0 .1em .8em;font-weight:700;line-height:1.4;color:var(--ink)}
.fact small{display:block;color:var(--mute);font-weight:600;font-size:.78em;margin-top:.15em}
.nextsc{font-weight:800;color:var(--ink);line-height:1.35}
.nextsc b{color:var(--red)}
.nextsc.good b{color:var(--ok)}

/* side status panel */
.side{display:flex;flex-direction:column;gap:.8em;min-height:0;font-size:min(1em,1.95vh);overflow:hidden}
.tile{background:#0d1d3c;border:1px solid #ffffff1f;border-left:.3em solid var(--glow);border-radius:.8em;padding:.7em .9em;animation:fadeUp .5s both}
.tile.red{border-left-color:var(--red)}
.tile.amber{border-left-color:var(--amber)}
.tile small{display:block;font-family:var(--M);font-weight:800;font-size:.66em;letter-spacing:.16em;color:#9fb3d6}
.tile b{font-family:var(--M);font-weight:800;font-size:2em;line-height:1.1;display:block}
.tile.red b{color:var(--red2)}
.meter{background:#0d1d3c;border:1px solid #ffffff1f;border-radius:.8em;padding:.65em .9em}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--M);font-weight:800;font-size:.68em;letter-spacing:.14em;color:#9fb3d6}
.meter .row b{font-size:2em;color:#fff;letter-spacing:0}
.meter .row i{font-style:normal;margin-left:.4em;font-size:1.25em}
.meter .trk{height:.55em;border-radius:99px;background:#ffffff1c;margin-top:.45em;overflow:hidden}
.meter .trk i{display:block;height:100%;border-radius:99px;transition:width 1.4s cubic-bezier(.2,.9,.3,1)}
.up{color:#8ff0db} .dn{color:var(--red2)}
.decided{display:flex;justify-content:space-between;align-items:center;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:.8em;padding:.6em .9em;font-weight:800}
.decided b{font-family:var(--M);font-size:1.4em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;background:var(--glow);color:#04132a;font-weight:800;padding:.8em 1.4em;border-radius:.7em;font-size:1em;box-shadow:0 0 0 .25em #4fd1ff33,0 14px 30px -12px #4fd1ff88;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 0 0 .25em #ff3b4e33,0 14px 30px -12px #ff3b4e99}

/* options */
.opts{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);gap:1vw}
.opt{position:relative;background:var(--paper);color:var(--ink);border-radius:1em;padding:.9em 1em 1.2em;display:flex;flex-direction:column;gap:.5em;overflow:hidden;animation:fadeUp .5s both;transition:opacity .5s,transform .5s,box-shadow .5s;border:2px solid transparent}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
.offline .opt{cursor:pointer}.offline .opt:hover{border-color:var(--glow)}
.ohd{display:flex;align-items:center;gap:.6em}
.olet{width:1.9em;height:1.9em;border-radius:.5em;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--M);font-weight:800;font-size:1.05em;flex:none}
.role{font-family:var(--M);font-weight:800;font-size:.66em;letter-spacing:.12em;text-transform:uppercase;color:var(--rc);line-height:1.25}
.say{font-weight:700;font-size:1.04em;line-height:1.38}
.vote{position:absolute;left:0;right:0;bottom:0;height:.5em}
.vote i{display:block;height:100%;width:0;background:var(--rc);transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.pct{position:absolute;right:.7em;top:.5em;font-family:var(--M);font-weight:800;font-size:1.3em;opacity:0;transition:opacity .5s .3s}
.stamp{position:absolute;right:.6em;bottom:.8em;width:2.5em;height:2.5em;opacity:0}
.stamp circle{fill:var(--ok)}
.stamp path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.revealed .opt{opacity:.38;animation:none}
.revealed .opt .pct{opacity:1}
.revealed .opt.best{opacity:1;border-color:var(--ok);box-shadow:0 0 0 .3em #2ec4a655,0 0 2.5em #2ec4a655;transform:translateY(-.3em)}
.revealed .opt.best .olet{background:var(--ok)}
.revealed .opt.best .stamp{opacity:1;animation:stampIn .5s .5s cubic-bezier(.3,1.7,.5,1) both}
.revealed .opt.best .stamp path{animation:draw .5s .9s ease forwards}
.revealed .opt.picked{opacity:1;border-color:var(--red)}
@keyframes stampIn{from{transform:scale(2.4) rotate(-20deg);opacity:0}}

/* map */
.map .land{fill:var(--land);stroke:#3a5f9a;stroke-width:.8}
.map .grat{fill:none;stroke:#ffffff0c;stroke-width:1}
.map .rt{fill:none;stroke-width:2;transition:stroke .8s,opacity .8s}
.map .rt.ok{stroke:var(--glow);filter:url(#gl);opacity:.85}
.map .rt.down{stroke:var(--red);stroke-dasharray:4 7;opacity:.55}
.map .pl{fill:#fff;filter:url(#gl);transition:opacity .6s}
.map .pl.hide{opacity:0}
.map .hub circle{fill:var(--glow2);filter:url(#gl)}
.map .hub.down circle{fill:var(--red2)}
.map .hub text{font-family:var(--M);font-weight:800;font-size:13px;fill:#cfe6ff;letter-spacing:.08em}
.map .mct circle{fill:var(--amber)}
.map .mct .ring{fill:none;stroke:var(--amber);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(4);opacity:0}}
.wall.fail::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 40%,#ff3b4e33);animation:blink 1.4s infinite;pointer-events:none}

/* types map */
.tmap{width:100%;height:100%}
.tmap .ql{font-family:var(--D);font-weight:800;font-size:17px}
.tmap .ax{font-family:var(--M);font-weight:800;font-size:10.5px;letter-spacing:.16em;fill:#9fb3d6}
.tmap .dot{transition:transform 1.5s cubic-bezier(.3,1.2,.4,1)}
.tmap .dot text{font-family:var(--B);font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central}
.tmap .avg{transition:transform 1.5s cubic-bezier(.3,1.2,.4,1)}
.typeswrap{flex:1;min-height:0;background:#0d1d3c;border:1px solid #ffffff1f;border-radius:.9em;padding:.6em;display:flex;flex-direction:column}
.typeswrap h4{font-family:var(--M);font-weight:800;font-size:.68em;letter-spacing:.16em;color:var(--glow);padding:.2em .3em .3em}
.typeswrap .tw{flex:1;min-height:0}
.top5{display:flex;flex-wrap:wrap;gap:.4em}
.pill{display:inline-flex;align-items:center;gap:.4em;background:#fff;color:var(--ink);border-radius:99px;padding:.2em .75em .2em .2em;font-weight:800;font-size:.8em;animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.pill .av{width:1.6em;height:1.6em;font-size:.8em}
.pill b{font-family:var(--M);margin-left:.25em}
.top5 .pill{border:1px solid var(--line)}

/* lobby */
.lobbycard{left:1.4em;top:1.4em;bottom:1.4em;width:min(30em,46%);background:var(--paper);color:var(--ink);border-radius:1.2em;padding:1.4em 1.6em;display:flex;flex-direction:column;justify-content:safe center;gap:min(1em,1.6vh);overflow:hidden;box-shadow:0 24px 50px -20px #000c;animation:fadeUp .7s both}
.kick{font-family:var(--M);font-weight:800;color:var(--red);letter-spacing:.18em;font-size:.78em;display:flex;align-items:center;gap:.6em}
.kick i{width:.6em;height:.6em;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.h1{font-family:var(--D);font-weight:800;font-size:min(3.2em,6.6vh);line-height:.98;letter-spacing:-.03em}
.h1 em{font-style:normal;color:var(--red)}
.lead{font-size:1.1em;line-height:1.5;color:var(--ink2);font-weight:600}
.lead b{color:var(--ink)}
.joinrow{display:flex;gap:1.1em;align-items:center;border-top:2px solid var(--line);padding-top:1em}
#qr{line-height:0;width:min(7.6em,15vh);height:min(7.6em,15vh);flex:none;overflow:hidden;background:#fff}
#qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
#qr canvas+img{display:block}
#qr img+canvas,#qr canvas:has(+img[style*="block"]){display:none!important}
.joinrow>div:last-child{min-width:0}
.joinrow .lbl{font-family:var(--M);font-weight:800;font-size:.66em;letter-spacing:.16em;color:var(--mute)}
.code{font-family:var(--M);font-weight:800;font-size:min(3em,6vh);letter-spacing:.12em;line-height:1.05}
.url{font-size:.68em;color:var(--mute);font-weight:600;word-break:break-all}
.board{right:1.4em;top:1.4em;width:min(21em,34%);background:#050d1ccc;border:1px solid #ffffff22;border-radius:1em;overflow:hidden;backdrop-filter:blur(6px)}
.board .bh{display:flex;justify-content:space-between;padding:.6em .9em;font-family:var(--M);font-weight:800;font-size:.68em;letter-spacing:.16em;color:var(--amber);border-bottom:1px solid #ffffff1f}
.board .br{display:grid;grid-template-columns:4.6em 1fr 6em;padding:.42em .9em;font-family:var(--M);font-weight:700;font-size:.78em;border-bottom:1px solid #ffffff10}
.board .br span:last-child{text-align:right;color:var(--ok)}
.board.fail .br span:last-child{color:var(--red);animation:blink 1s infinite}
.crew{left:1.4em;right:1.4em;bottom:1.4em;display:flex;flex-wrap:wrap;gap:.4em;justify-content:flex-end;padding-left:calc(min(30em,46%) + 1em)}
.crew .lbl{font-family:var(--M);font-weight:800;font-size:.72em;letter-spacing:.16em;color:#fff;background:#050d1ccc;border:1px solid #ffffff22;border-radius:.6em;padding:.45em .8em}
.crew .lbl b{color:var(--glow);font-size:1.4em;margin-left:.3em}

/* final */
.final{display:grid;grid-template-columns:1.05fr 1fr;gap:1.4vw;padding:0 2vw 1.6vh;min-height:0}
.fpanel{background:var(--paper);color:var(--ink);border-radius:1.2em;padding:1.2em 1.4em;display:flex;flex-direction:column;gap:.8em;min-height:0}
.fpanel h2,.typesbig h2{font-family:var(--D);font-weight:800;font-size:1.8em;letter-spacing:-.02em;line-height:1.05}
.fpanel h2 small,.typesbig h2 small{display:block;font-family:var(--M);font-size:.36em;letter-spacing:.18em;color:var(--mute);margin-top:.4em}
.typesbig{background:#0d1d3c;border:1px solid #ffffff1f;border-radius:1.2em;padding:1.1em 1.2em;display:flex;flex-direction:column;min-height:0}
.typesbig h2 small{color:var(--glow)}
.typesbig .tw{flex:1;min-height:0;margin:.3em 0 .6em}
.tcount{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
.tc em{display:block;font-style:normal;font-family:var(--M);font-weight:800;font-size:.58em;letter-spacing:.06em;opacity:.9;margin-top:.25em;line-height:1.3}
.tc p{font-size:.72em;font-weight:600;line-height:1.35;margin-top:.3em;color:#fff}
.tc .tci{display:flex;align-items:center;justify-content:space-between}
.tc .tci svg{width:1.4em;height:1.4em;opacity:.9}
.tc{border-radius:.7em;padding:.45em .6em;animation:fadeUp .5s both}
.tc b{font-family:var(--M);font-weight:800;font-size:1.5em;display:block;line-height:1;color:#fff}
.tc span{font-weight:800;font-size:.72em;color:#fff}
.ldr{display:flex;align-items:center;gap:.8em;border:2px solid var(--line);border-radius:.9em;padding:.55em .9em;animation:fadeUp .5s both}
.ldr .pos{font-family:var(--D);font-weight:800;font-size:1.7em;width:1.1em;text-align:center}
.ldr .av{width:2.4em;height:2.4em;font-size:1em}
.ldr .nm{font-weight:800;font-size:1.1em}
.ldr .ty{font-family:var(--M);font-weight:800;font-size:.66em;letter-spacing:.12em;text-transform:uppercase}
.ldr .sc{margin-left:auto;font-family:var(--M);font-weight:800;font-size:1.25em}
.ldr.first{border-color:var(--amber);background:#fff8ea}
.verdict{background:var(--ok-l);border-radius:.9em;padding:.8em 1em;font-weight:700;line-height:1.45;animation:fadeUp .6s 1.2s both}
.verdict b{font-family:var(--D)}
.lesson{font-family:var(--D);font-weight:800;font-size:1.45em;line-height:1.2}
.lesson span{color:var(--red)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-4vh;width:.8vw;height:1.4vw;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;animation:flash .6s ease-out forwards}
@keyframes flash{from{opacity:.8}to{opacity:0}}

/* ================= PHONE ================= */
.phone{min-height:100vh;background:#f4f7fb;color:var(--ink);font-size:16px}
.phead{background:linear-gradient(180deg,#0a1730,#10224a);color:#fff;padding:max(14px,env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead .logo{white-space:nowrap}
.phead .logo b{font-size:17px}
.phead .logo svg{width:28px;height:28px}
.phead .who{font-weight:800;font-size:13px;display:flex;align-items:center;gap:7px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{padding:18px 16px 30px;display:flex;flex-direction:column;gap:13px;max-width:520px;margin:0 auto}
.pbig{font-family:var(--D);font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.02em}
.pmute{color:var(--mute);font-size:15px;line-height:1.5;font-weight:600}
.fld{font-family:var(--M);font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mute);margin:14px 0 6px}
.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:14px;font-size:19px;font-weight:700;background:#fff;color:var(--ink);outline:none;font-family:var(--B)}
.inp:focus{border-color:var(--glow)}
.pbtn{width:100%;margin-top:14px;background:var(--ink);color:#fff;font-weight:800;font-size:18px;padding:16px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 22px -12px #0a1730}
.pbtn:disabled{opacity:.4}
.pbtn.glow{background:var(--glow);color:#04132a}
.err{color:var(--red);font-weight:700;font-size:14px;min-height:18px;margin-top:6px}
.pcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px}
.pclock{display:flex;justify-content:space-between;align-items:center}
.pclock .t{font-family:var(--M);font-weight:800;font-size:11.5px;letter-spacing:.12em;color:#fff;background:var(--red);border-radius:6px;padding:4px 8px}
.pclock .s{font-family:var(--M);font-weight:800;font-size:21px;width:50px;height:50px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center}
.pclock .s.low{border-color:var(--red);color:var(--red)}
.psitu{font-size:15px;line-height:1.45;font-weight:600;color:var(--ink2)}
.psitu b{color:var(--ink)}
.pq{font-family:var(--D);font-weight:800;font-size:25px;line-height:1.1}
.popts{display:flex;flex-direction:column;gap:10px}
.popt{position:relative;display:flex;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 13px 13px 15px;align-items:flex-start;overflow:hidden}
.popt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rc)}
.popt:active{transform:scale(.98)}
.popt .olet{width:32px;height:32px;font-size:15px}
.popt p{font-size:15px;line-height:1.4;font-weight:700;margin-top:3px}
.lockc{text-align:center;padding:26px 14px}
.lockc svg{width:110px;height:110px}
.lk{fill:none;stroke:var(--glow);stroke-width:6;stroke-dasharray:300;stroke-dashoffset:300;animation:draw .8s ease forwards;transform-origin:center;transform:rotate(-90deg)}
.lkt{font-family:var(--M);font-weight:800;font-size:36px;fill:var(--ink)}
.res{text-align:center}
.ok{color:var(--ok)} .no{color:var(--red)}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pst div{background:#f4f7fb;border:2px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.pst b{display:block;font-family:var(--M);font-size:20px;font-weight:800}
.pst span{font-family:var(--M);font-size:9.5px;color:var(--mute);font-weight:800;letter-spacing:.12em}

function evalRound(r, ans, qStart, branch){
  if (!ans || !ans.opt) return {pts:0, sp:-1, op:-1, none:true};
  const o = roundData(r, branch).opts.find(x => x.k === ans.opt); if (!o) return {pts:0, sp:-1, op:-1, none:true};
  const el = qStart ? (ans.at - qStart) : 0;
  if (el > Tms(r) + 3000) return {pts:0, sp:-1, op:-1, none:true};
  return {pts: Math.round(o.base * (.6 + .4 * clamp(1 - el / Tms(r), 0, 1))), sp:o.sp, op:o.op, opt:o.k, best:!!o.best};
}

const Sound = {
  ctx:null, out:null, on:true, amb:null,
  init(){ try{ if (!this.ctx){ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); this.out = this.ctx.createGain(); this.out.gain.value = .55; this.out.connect(this.ctx.destination); } if (this.ctx.state === "suspended") this.ctx.resume(); }catch(e){} },
  tone(f, dur, type="sine", vol=.25, when=0, to=null){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .05);
  },
  noiseBuf(sec){ const len = Math.floor(this.ctx.sampleRate * sec), b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1; return b; },
  noise(dur, vol=.2, freq=1200, when=0, q=.8, toFreq=null){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = this.noiseBuf(dur); f.type = "bandpass"; f.Q.value = q; f.frequency.setValueAtTime(freq, t); if (toFreq) f.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur*.3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.out); src.start(t); src.stop(t + dur);
  },
  hum(onOff){   // low tension drone, like the video's music bed
    if (!this.ctx) return;
    if (!onOff || !this.on){ if (this.amb){ try{ const t = this.ctx.currentTime; this.amb.g.gain.linearRampToValueAtTime(0, t + 1); this.amb.o.forEach(o => o.stop(t + 1.1)); }catch(e){} this.amb = null; } return; }
    if (this.amb) return;
    const g = this.ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(.05, this.ctx.currentTime + 1.5); g.connect(this.out);
    const o = [55, 82.4, 110.6].map(f => { const x = this.ctx.createOscillator(); x.type = "sawtooth"; x.frequency.value = f; const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 260; x.connect(lp); lp.connect(g); x.start(); return x; });
    this.amb = {g, o};
  },
  alert(){ [0,.22,.44].forEach(w => { this.tone(988,.16,"square",.07,w); this.tone(740,.16,"square",.06,w+.11); }); },
  fail(){ this.noise(.9,.25,180,0,.5,60); this.tone(220,1,"sawtooth",.12,0,55); },
  chime(){ this.tone(1046,.25,"sine",.12); this.tone(1568,.35,"sine",.08,.1); },
  pop(){ this.tone(720,.09,"sine",.13,0,1080); },
  beat(fast){ this.tone(fast?72:58,.2,"sine",.42,0,40); },
  tick(){ this.tone(1500,.05,"square",.07); },
  reveal(){ this.noise(.6,.18,300,0,.6,2600); [523,659,784,1047].forEach((f,i) => this.tone(f,.5,"triangle",.13,.25+i*.09)); },
  final(){ [[523,659,784],[587,740,880],[659,831,988,1319]].forEach((ch,i) => ch.forEach(f => this.tone(f,.9,"triangle",.1,i*.35))); for (let i=0;i<40;i++) this.noise(.09,.05+Math.random()*.05,1800+Math.random()*1800,1.1+Math.random()*2.6,1.2); }
};

  async function startRound(r){

  async function reveal(){

    Object.values(players).forEach(p => { const a = p.answers?.[r]; if (a && c[a.opt] != null){ c[a.opt]++; n++; } });
    if (n) R.opts.forEach(o => { dI += o.dI * c[o.k] / n; dT += o.dT * c[o.k] / n; }); else { dI = -8; dT = -12; }

  });

  setInterval(() => {
    if (room.state !== "question") return;
    const r = room.round, T = Tms(r), el = Date.now() - localQStart, left = Math.max(0, T - el), frac = clamp(el / T, 0, 1), s = Math.ceil(left / 1000);

    const a = answered(r), n = Object.keys(players).length;
    const ae = $("#ans"); if (ae) ae.textContent = a; const te = $("#tot"); if (te) te.textContent = n;
    if (!OFFLINE && !revealing && (left <= 0 || (n > 0 && a >= n && el > 5000))) setTimeout(reveal, 600);
  }, 100);

  lobby();
  if (DEMO) demoJoin();
}

  let pid = null, name = "", room = null, me = {}, tick = null, lastKey = "", sent = {};
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };
  const whoH = r => `${avatar(name)}${esc(name)}${r ? " · " + r : ""}`;

  function joinView(err){
    app.innerHTML = `<div class="phone">${head("")}<div class="pbody">
      <div class="pbig">The video asked: what would you do?</div>
      <p class="pmute">Now you decide. 5 questions, 35 seconds each. At the end you get your Leadership Card.</p>
      <div class="fld">ROOM CODE</div><input class="inp" id="rc" maxlength="4" value="${esc(code)}" placeholder="ABCD" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.25em;font-family:var(--M)">
      <div class="fld">YOUR NAME (FOR YOUR CARD)</div><input class="inp" id="nm" maxlength="20" placeholder="e.g. Yousuf Al Shabibi" autocomplete="off">
      <div class="err" id="er">${esc(err||"")}</div>
      <button class="pbtn" id="jb">Join the crisis room</button>
      <p class="pmute" style="text-align:center;font-size:12px">Fictional crisis simulation</p></div></div>`;
    $("#jb").onclick = join; $("#nm").addEventListener("keydown", e => { if (e.key === "Enter") join(); });
  }
  async function join(){
    code = $("#rc").value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4); name = $("#nm").value.trim().slice(0,20);
    if (code.length !== 4) return joinView("Enter the 4-letter room code.");
    if (!name){ $("#er").textContent = "Enter your name."; return; }
    $("#jb").disabled = true;
    try {
      const rs = await fb.get(R_(code + "/state")); if (!rs.exists()) return joinView("Room not found. Check the code on the big screen.");
      const key = "cr_pid_" + code; try { pid = sessionStorage.getItem(key); } catch(e){}
      if (!pid){ pid = Math.random().toString(36).slice(2,10); try { sessionStorage.setItem(key, pid); } catch(e){} }
      await fb.update(R_(code + "/players/" + pid), {name, joinedAt: now()});
      fb.onValue(R_(code), s => {
        room = s.val(); if (!room) return;
        if (room.ver && room.ver !== VERSION){
          app.innerHTML = `<div class="phone">${head("")}<div class="pbody"><div class="pbig" style="font-size:28px">Updating…</div><p class="pmute">Your phone had an old copy of the game. Loading the new one now.</p><button class="pbtn" id="rl">Reload</button></div></div>`;
          const go = () => location.replace(location.pathname + "?room=" + code + "&v=" + room.ver + "&t=" + Date.now());
          $("#rl").onclick = go; setTimeout(go, 1200); return;
        }
        me = room.players?.[pid] || {}; render();
      });
    } catch(e){ joinView("Connection problem. Please try again."); }
  }
  const elapsed = r => { const q = room?.qStarts?.[r]; return q ? (now() - q) / 1000 : 0; };

  function render(){
    if (!room) return;
    const r = room.round || 0, res = room.results?.[pid], done = sent[r] || me.answers?.[r];
    const key = [room.state, r, room.branch, done ? "a" : "", res ? res.score + ":" + (res.type||"") : ""].join("|");
    if (key === lastKey) return; lastKey = key; clearInterval(tick);

    if (room.state === "lobby"){
      app.innerHTML = `<div class="phone">${head(whoH())}<div class="pbody" style="text-align:center">
        <svg class="wait-ill" viewBox="0 0 200 110"><path id="wp" d="M20 90 Q100 -10 180 90" fill="none" stroke="#4fd1ff" stroke-width="3" stroke-dasharray="5 7"/><circle cx="20" cy="90" r="6" fill="#ffb547"/><circle cx="180" cy="90" r="6" fill="#ff3b4e"/><path d="M-9 -5l18 5-18 5 4-5z" fill="#0a1730"><animateMotion dur="3s" repeatCount="indefinite" rotate="auto"><mpath href="#wp"/></animateMotion></path></svg>
        <div class="pbig" style="font-size:28px">You're in the crisis room.</div>
        <p class="pmute">Watch the big screen. The crisis starts soon.</p></div></div>`;
      return;
    }
    if (room.state === "question"){
      const R = roundData(r, room.branch);
      if (done){
        const k = sent[r] || me.answers[r].opt;
        app.innerHTML = `<div class="phone">${head(whoH((r+1) + "/" + NQ))}<div class="pbody"><div class="pcard lockc">
          <svg viewBox="0 0 120 120"><circle class="lk" cx="60" cy="60" r="50" pathLength="300"/><text class="lkt" x="60" y="72" text-anchor="middle">${esc(k)}</text></svg>
          <div class="pbig" style="font-size:28px;margin-top:6px">Decision locked.</div><p class="pmute" style="margin-top:6px">Watch the big screen to see what happens.</p></div></div></div>`;
        return;
      }
      buzz([150,60,150]);
      app.innerHTML = `<div class="phone">${head(whoH((r+1) + "/" + NQ))}<div class="pbody">
        <div class="pclock"><span class="t">${esc(R.title.toUpperCase())} · ${esc(R.clock)}</span><span class="s" id="ps">${SECS[r]}</span></div>
        <p class="psitu">${R.situ}</p>
        <div class="pq">${esc(R.q)}</div>
        <div class="popts">${R.opts.map(o => `<button class="popt" data-k="${o.k}" style="--rc:${ROLES[o.role].color}"><span class="olet">${o.k}</span><span><span class="role">${esc(ROLES[o.role].name)}</span><p>${esc(o.t)}</p></span></button>`).join("")}</div></div></div>`;
      document.querySelectorAll(".popt").forEach(b => b.onclick = () => answer(r, b.dataset.k));
      const upd = () => { const s = Math.max(0, Math.ceil(SECS[r] - elapsed(r))); const el = $("#ps"); if (el){ el.textContent = s; el.classList.toggle("low", s <= 5); } };
      upd(); tick = setInterval(upd, 250);
      return;
    }
    if (room.state === "reveal"){
      const best = room.bestOpt, ok = res?.best, none = !res?.opt;
      buzz(ok ? [60,60,60] : 250);
      app.innerHTML = `<div class="phone">${head(whoH((r+1) + "/" + NQ))}<div class="pbody"><div class="pcard res">
        <div class="pbig ${ok ? "ok" : "no"}" style="font-size:30px">${none ? "No decision." : ok ? "Strong call." : "Not the strongest move."}</div>
        <p class="pmute" style="margin-top:8px">${none ? "Silence is also a message." : ok ? "Honest, specific, and in time." : `You chose ${esc(res.opt)}. The strongest move was ${esc(best)}.`}</p>
        <div class="pst"><div><b>+${res?.pts||0}</b><span>POINTS</span></div><div><b>${res?.score||0}</b><span>TOTAL</span></div><div><b>${res ? "#" + res.rank : "–"}</b><span>OF ${res?.of||"–"}</span></div></div>
        ${r === BRANCH_AT && room.branch ? `<p class="pmute" style="margin-top:12px">The class result changes the story. Next: <b style="color:var(--ink)">${esc(QS[3][room.branch].title)}</b></p>` : ""}</div></div></div>`;
      return;
    }
    if (room.state === "final"){
      buzz([80,60,80,60,200]);
      if (!res){ app.innerHTML = `<div class="phone">${head(whoH())}<div class="pbody"><div class="pbig" style="font-size:26px">Thanks for joining.</div><p class="pmute">You joined too late for a Leadership Card this time.</p></div></div>`; return; }
      const T = TYPES[res.type] || TYPES.CAPTAIN;
      const card = {name, type:res.type, score:res.score, rank:res.rank, of:res.of, sp:res.sp, op:res.op, bestN:res.bestN, cls:room.cls, date:today()};
      const dots = [{pid:"me", name, x:tx(res.op), y:ty(res.sp), fx:TM, fy:TM, me:true}], avg = room.cls ? {x:tx(room.cls.op), y:ty(room.cls.sp), fx:TM, fy:TM} : null;
      app.innerHTML = `<div class="phone">${head(whoH("#" + res.rank + " of " + res.of))}<div class="pbody">
        <div class="ptype" style="background:${T.color}"><small>YOUR CRISIS LEADERSHIP TYPE</small><h2>${esc(T.name)}</h2><p>${esc(T.axes)}. ${esc(T.desc)}</p>${svgI(T.icon, "i big")}</div>
        <div class="pmap" id="pmap">${typesSVG(dots, avg, {r:12})}</div>
        <div class="pcard" style="display:flex;flex-direction:column;gap:10px">
          <div class="trait"><b style="color:#14957d">STRENGTH</b>${esc(T.strength)}</div>
          <div class="trait"><b style="color:var(--red)">BLIND SPOT</b>${esc(T.blind)}</div>
          <div class="trait"><b style="color:#2563eb">THEORY</b>${esc(T.theory)}</div></div>
        <div class="pst" style="margin-top:0"><div><b>${res.score}</b><span>POINTS</span></div><div><b>#${res.rank}</b><span>RANK</span></div><div><b>${res.bestN ?? 0}/${NQ}</b><span>BEST MOVES</span></div></div>
        <div class="pcard" style="display:flex;flex-direction:column;gap:12px"><div class="fld" style="margin:0">ALL FOUR LEADERSHIP TYPES</div>
          ${Object.entries(TYPES).map(([k,t]) => `<div style="display:flex;gap:11px;align-items:flex-start;${k === res.type ? `background:${t.color}1f;border-radius:12px;padding:8px;margin:-8px` : ""}"><span style="width:34px;height:34px;border-radius:10px;background:${t.color};color:#fff;display:grid;place-items:center;flex:none">${svgI(t.icon)}</span><div><b style="font-family:var(--D);font-size:16px">${t.name}${k === res.type ? " · YOU" : ""}</b><div style="font-family:var(--M);font-weight:800;font-size:10.5px;letter-spacing:.06em;color:${t.color};margin:2px 0">${t.axes.toUpperCase()}</div><div class="trait">${t.desc}</div></div></div>`).join("")}</div>
        <button class="pbtn glow" id="dl">${svgI(ICON.pdf)} Download my Leadership Card (PDF)</button>
        <p style="text-align:center;font-family:var(--D);font-weight:800;font-size:17px">Communicate early. <span style="color:var(--red)">Share verified facts.</span> Update continuously.</p></div></div>`;
      animateDots($("#pmap")); $("#dl").onclick = e => downloadCard(card, e.currentTarget);
    }
  }
  async function answer(r, k){
    if (sent[r] || room.state !== "question" || room.round !== r) return;
    sent[r] = k; buzz(40); lastKey = ""; render();
    try { await fb.set(R_(code + "/players/" + pid + "/answers/" + r), {opt:k, at:now()}); } catch(e){ delete sent[r]; lastKey = ""; render(); }
  }
  joinView();
}

(IS_HOST ? host : player)().catch(e => { app.innerHTML = `<div class="phone"><div class="pbody"><div class="pbig" style="font-size:24px">Could not start</div><p class="pmute">${esc(e.message)}</p></div></div>`; console.error(e); });
</script>
</body>
</html>
