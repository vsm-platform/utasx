<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMS Challenge — Don't Train the Enemy</title>
<meta name="theme-color" content="#c8102e">
<style>
:root{--red:#c8102e;--red2:#86091d;--redbg:#fdf0f2;--ink:#16181d;--ink2:#4b5160;--ink3:#8a90a0;--line:#e6e8ee;--bg:#f6f7fa;--ok:#15803d;--okbg:#e9f7ef;
  --a0:#c8102e;--a1:#1d4ed8;--a2:#d97706;--a3:#15803d;--font:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.card{background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 34px rgba(22,24,29,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:16px;padding:.85em 1.5em;font-weight:850;background:var(--red);color:#fff;font-size:1.15em;box-shadow:0 10px 24px -10px rgba(200,16,46,.7);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.dark{background:var(--ink);box-shadow:none}
.kick{display:inline-flex;align-items:center;gap:.6em;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-size:.85em}
.kick i{width:.6em;height:.6em;border-radius:50%;background:var(--red);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(200,16,46,.5)}80%,100%{box-shadow:0 0 0 .6em rgba(200,16,46,0)}}
.flash{position:fixed;inset:0;z-index:50;pointer-events:none;animation:flash .6s forwards}
@keyframes flash{from{opacity:.55}to{opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.pill{display:inline-flex;align-items:center;gap:.45em;background:#fff;border:1px solid var(--line);border-radius:99px;padding:.3em .8em .3em .3em;font-weight:750;animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes popin{from{transform:scale(.3);opacity:0}}
.av{width:1.9em;height:1.9em;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:850;font-size:.8em;flex:none}

/* ===== HOST ===== */
body.host{height:100vh;overflow:hidden;font-size:clamp(12px,.78vw + .42vh,32px)}
.hs{height:100vh;padding:1.1em 1.4em;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1em;position:relative}
.hbar{display:flex;align-items:center;gap:1em}
.hbar img{height:3.2em}
.hbar .t{font-weight:900;font-size:1.25em;letter-spacing:-.01em}.hbar .t span{color:var(--red)}
.hbar .r{margin-left:auto;display:flex;gap:.6em;align-items:center}
.tag{font-weight:850;font-size:.85em;letter-spacing:.1em;text-transform:uppercase;padding:.45em .9em;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.tag.red{background:var(--red);color:#fff;border-color:var(--red)}.tag.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.snd{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.35em .8em;font-weight:800;font-size:.85em}
.snd.off{opacity:.45}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.2em;min-height:0}
.lb-l{padding:2em 2.4em;display:flex;flex-direction:column;gap:1.1em;position:relative;overflow:hidden}
.lb-l h1{font-size:4.2em;line-height:.98;letter-spacing:-.035em;margin:.1em 0 0;font-weight:900}
.lb-l h1 em{font-style:normal;color:var(--red);display:block}
.lb-l .lead{font-size:1.35em;color:var(--ink2);margin:0;max-width:30em}
.lb-l .lead b{color:var(--ink)}
.join{display:flex;align-items:center;gap:1.4em;background:var(--ink);color:#fff;border-radius:22px;padding:1em;margin-top:auto}
.join #qr{width:11em;height:11em;background:#fff;border-radius:14px;padding:.5em;flex:none}
.join #qr img,.join #qr canvas{width:100%!important;height:100%!important}
.join .lbl{font-weight:850;letter-spacing:.14em;font-size:.85em;opacity:.75}
.join .code{font-size:4.2em;font-weight:900;letter-spacing:.14em;line-height:1.05}
.join .url{font-size:.85em;opacity:.7;word-break:break-all}
.lb-r{padding:1.4em 1.6em;display:flex;flex-direction:column;min-height:0}
.lb-r h3{margin:0;display:flex;align-items:baseline;gap:.5em;font-size:1.2em}
.lb-r h3 b{font-size:3em;color:var(--red);line-height:1}
.crew{display:flex;flex-wrap:wrap;gap:.5em;align-content:flex-start;margin-top:1em;overflow:hidden;flex:1}
.bug{position:absolute;right:-1em;bottom:-1em;width:20em;opacity:.08;pointer-events:none}
/* question */
.qv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:minmax(0,1fr) auto;gap:1em;min-height:0}
.ill{grid-row:1;padding:1.2em;display:flex;flex-direction:column;gap:.8em;min-height:0}
.ill svg.art{flex:1;min-height:0;width:100%}
.situ{font-size:1.25em;line-height:1.4;color:var(--ink2);margin:0}
.situ b{color:var(--ink)}
.qbox{padding:1.4em 1.6em;display:flex;flex-direction:column;gap:1em;min-height:0}
.qtop{display:flex;align-items:center;gap:1.2em}
.timer{width:7.5em;height:7.5em;position:relative;flex:none}
.timer svg{width:100%;height:100%}
.timer .bg{fill:none;stroke:#eef0f3;stroke-width:9}
.timer .fg{fill:none;stroke:var(--red);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4em;font-weight:900}
.timer.low b{color:var(--red);animation:beat .5s infinite alternate}
@keyframes beat{to{transform:scale(1.15)}}
.qq{font-size:2.3em;font-weight:900;line-height:1.12;letter-spacing:-.02em}
.dec{margin-left:auto;text-align:right}.dec b{display:block;font-size:2.6em;font-weight:900;line-height:1}.dec span{font-size:.85em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.fact{background:var(--redbg);border-left:6px solid var(--red);border-radius:14px;padding:1em 1.2em;font-size:1.2em;line-height:1.4;animation:popin .5s}
.fact small{display:block;color:var(--ink3);font-size:.75em;margin-top:.4em}
.top5{display:flex;flex-wrap:wrap;gap:.5em}
.top5 .pill b{color:var(--red);margin-left:.3em}
.opts{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.opt{position:relative;border-radius:18px;color:#fff;padding:1em 1.3em;display:flex;align-items:center;gap:.9em;font-size:1.4em;font-weight:750;line-height:1.25;overflow:hidden;min-height:4.2em;animation:optin .5s cubic-bezier(.2,.9,.2,1) both}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
@keyframes optin{from{opacity:0;transform:translateY(20px)}}
.opt .sh{width:1.9em;height:1.9em;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;font-size:.95em}
.opt .tx{position:relative;z-index:1;flex:1}
.opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.18);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.opt .pc{position:relative;z-index:1;font-size:1.3em;font-weight:900;margin-left:auto}
.o0{background:var(--a0)}.o1{background:var(--a1)}.o2{background:var(--a2)}.o3{background:var(--a3)}
.rev .opt{opacity:.32;filter:saturate(.4)}
.rev .opt.ok{opacity:1;filter:none;box-shadow:0 0 0 5px #fff,0 0 0 9px var(--ok);transform:scale(1.02)}
.stamp{position:absolute;right:.6em;top:50%;width:2.6em;height:2.6em;margin-top:-1.3em;border-radius:50%;background:#fff;color:var(--ok);display:grid;place-items:center;font-size:1.2em;font-weight:900;z-index:2;animation:stamp .5s .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.4);opacity:0}}
.rev .opt.ok .pc{margin-right:2.6em}
/* final */
.fin{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.2em;min-height:0}
.podwrap{padding:1.4em;display:flex;flex-direction:column;min-height:0}
.podwrap h1{margin:0;font-size:3em;letter-spacing:-.03em}.podwrap h1 span{color:var(--red)}
.podium{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:1.2em;padding-top:1em}
.pd{width:12em;text-align:center}
.pd .nm{font-size:1.6em;font-weight:900;opacity:0;transition:opacity .6s 1.3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .sc{color:var(--ink3);font-weight:800;margin-bottom:.5em;opacity:0;transition:opacity .6s 1.3s}
.pd.show .nm,.pd.show .sc{opacity:1}
.pd .blk{border-radius:18px 18px 0 0;color:#fff;font-size:4.5em;font-weight:900;display:flex;justify-content:center;padding-top:.15em;height:0;transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.rest{padding:1.4em;display:flex;flex-direction:column;gap:.6em;min-height:0;overflow:hidden}
.rest h3{margin:0 0 .3em;font-size:1.3em}
.rw{display:flex;align-items:center;gap:.8em;background:var(--bg);border-radius:14px;padding:.6em .9em;font-size:1.15em;font-weight:750;animation:popin .4s both}
.rw i{font-style:normal;width:2em;height:2em;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.85em}
.rw .nm2{flex:1}.rw b{color:var(--red)}
.endv{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em;padding:2em;animation:popin .7s}
.endv img{height:6em}.endv h1{font-size:8em;line-height:1;margin:.1em 0 0;letter-spacing:-.04em;color:var(--red)}
.endv .big{font-size:2.6em;font-weight:900;margin:0}.endv .sub{font-size:1.4em;color:var(--ink2);margin:0}
.endv .who{display:block;margin-top:1.4em;font-size:1.25em;color:var(--ink2);line-height:1.5;border-top:3px solid var(--red);padding-top:1em}.endv .who b{color:var(--ink);font-size:1.2em}
.endv .slog{font-weight:900;color:var(--red);font-size:1.6em;margin:.6em 0 0}
.lesson{margin-top:auto;background:var(--red);color:#fff;border-radius:16px;padding:1em 1.2em;font-size:1.5em;font-weight:900;text-align:center}

/* ===== PHONE ===== */
body.player{padding:0 14px 30px}
.phone{max-width:460px;margin:0 auto}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.phead img{height:38px}
.who{display:flex;align-items:center;gap:.4em;font-weight:800;font-size:.9em}
.pb{display:flex;flex-direction:column;gap:14px}
.pbig{font-size:1.9em;font-weight:900;line-height:1.1;letter-spacing:-.02em}
.pmute{color:var(--ink2);margin:0}
.fld{font-weight:800;font-size:.78em;letter-spacing:.1em;color:var(--ink3)}
.inp{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:.9em 1em;font-size:1.05em;width:100%}
.inp:focus{outline:none;border-color:var(--red)}
.pbtn{border:0;border-radius:16px;padding:1em;font-weight:850;font-size:1.05em;background:var(--red);color:#fff;width:100%}
.pbtn:disabled{opacity:.4}
.err{color:var(--red);font-weight:700;min-height:1.1em}
.pclock{display:flex;justify-content:space-between;align-items:center}
.pclock .t{font-weight:850;font-size:.8em;letter-spacing:.1em;color:var(--red)}
.pclock .s{width:2.6em;height:2.6em;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.2em}
.pclock .s.low{background:var(--red)}
.pq{font-size:1.3em;font-weight:850;line-height:1.25}
.psitu{font-size:.95em;color:var(--ink2);margin:0}
.popts{display:grid;gap:10px}
.popt{border:0;border-radius:16px;color:#fff;padding:1em;display:flex;gap:.8em;align-items:center;text-align:left;font-weight:750;font-size:1.02em;min-height:4em}
.popt .sh{width:2em;height:2em;border-radius:10px;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.popt:active{transform:scale(.98)}
.pcard{background:#fff;border-radius:22px;padding:1.4em;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.07)}
.pres{color:#fff;border-radius:22px;padding:1.6em 1.2em;text-align:center}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pst div{background:rgba(255,255,255,.18);border-radius:14px;padding:.6em}
.pst b{display:block;font-size:1.5em}.pst span{font-size:.7em;font-weight:800;letter-spacing:.1em;opacity:.85}
.lock{width:110px;height:110px;margin:0 auto;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:3em;font-weight:900;animation:popin .5s cubic-bezier(.2,1.5,.4,1)}
.wait svg{width:200px;height:150px;display:block;margin:0 auto}
svg .lift{animation:lift 1.2s ease-in-out infinite;transform-box:view-box}
@keyframes lift{50%{transform:translateY(-16px)}}
svg .spin{animation:spin 16s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
svg .bnc{animation:bnc 3.6s infinite ease-out;transform-box:fill-box}
@keyframes bnc{0%{transform:translate(-160px,var(--sy));opacity:0}10%{opacity:1}45%{transform:none}100%{transform:translate(-140px,var(--by));opacity:0}}
svg .drip{animation:drip 1.6s infinite ease-in}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:0}}
svg .grow{transform-box:fill-box;transform-origin:bottom;animation:growy 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes growy{from{transform:scaleY(0)}}
svg .sweep{stroke-dasharray:100;stroke-dashoffset:100;animation:sweep 30s linear forwards}
@keyframes sweep{to{stroke-dashoffset:0}}
svg .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08)}}
svg .xin{animation:xin 3.6s infinite}
@keyframes xin{0%,40%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
@media (max-width:900px){body.host{height:auto;overflow:auto;font-size:12px}.hs{height:auto}.lobby,.qv,.fin{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
</style>
</head>

        app.innerHTML = `<div class="phone">${head(whoH((r + 1) + "/" + NQ))}<div class="pb" style="text-align:center;padding-top:30px"><div class="lock" style="background:var(--a${k})">${SH[k]}</div><div class="pbig">Answer locked.</div><p class="pmute">Watch the big screen for the answer.</p></div></div>`; return; }
      buzz([120, 60, 120]);
      app.innerHTML = `<div class="phone">${head(whoH((r + 1) + "/" + NQ))}<div class="pb">
        <div class="pclock"><span class="t">QUESTION ${r + 1} · ${esc(Q.title.toUpperCase())}</span><span class="s" id="ps">${SECS}</span></div>
        <p class="psitu">${Q.situ}</p><div class="pq">${esc(Q.q)}</div>
        <div class="popts">${Q.o.map((t, i) => `<button class="popt o${i}" data-k="${i}"><span class="sh">${SH[i]}</span><span>${esc(t)}</span></button>`).join("")}</div></div></div>`;
      document.querySelectorAll(".popt").forEach(b => b.onclick = () => answer(r, +b.dataset.k));
      const upd = () => { const s = Math.max(0, Math.ceil(SECS - elapsed(r))); const el = $("#ps"); if (el){ el.textContent = s; el.classList.toggle("low", s <= 5); } };
      upd(); tick = setInterval(upd, 250); return;
    }
    if (room.state === "reveal"){
      const Q = QS[r], ok = res && res.ok, none = !res || res.opt < 0;
      buzz(ok ? [60, 60, 60] : 250);
      app.innerHTML = `<div class="phone">${head(whoH((r + 1) + "/" + NQ))}<div class="pb"><div class="pres" style="background:${ok ? "var(--ok)" : none ? "var(--ink)" : "var(--red)"}">
        <div class="pbig" style="font-size:2.2em">${none ? "⏱ Time's up" : ok ? "✓ Correct!" : "✗ Not this time"}</div>
        <p style="margin:.5em 0 0;opacity:.9">Answer: <b>${SH[Q.a]} ${esc(Q.o[Q.a])}</b></p>
        <div class="pst"><div><b>+${res ? res.pts : 0}</b><span>POINTS</span></div><div><b>${res ? res.score : 0}</b><span>TOTAL</span></div><div><b>${res ? "#" + res.rank : "–"}</b><span>OF ${res ? res.of : "–"}</span></div></div></div>
        <div class="pcard" style="text-align:left">💡 ${esc(Q.fact)}<div style="color:var(--ink3);font-size:.8em;margin-top:.4em">${esc(Q.src)}</div></div></div></div>`; return;
    }
    if (room.state === "final"){
      buzz([80, 60, 80, 60, 200]);
      if (!res){ app.innerHTML = `<div class="phone">${head(whoH())}<div class="pb"><div class="pbig">Thanks for joining!</div><p class="pmute">You joined after the challenge started.</p></div></div>`; return; }
      const badge = res.rank === 1 ? "🏆 Camp Champion" : res.rank <= 3 ? "🥇 Podium Finisher" : res.nOk >= 4 ? "🛡️ Enemy Stopper" : "🎖️ Stewardship Recruit";
      app.innerHTML = `<div class="phone">${head(whoH("#" + res.rank + " of " + res.of))}<div class="pb">
        <div class="pres" style="background:linear-gradient(140deg,#c8102e,#86091d)"><div style="font-weight:800;letter-spacing:.12em;font-size:.8em;opacity:.85">YOUR RESULT</div>
          <div class="pbig" style="font-size:2.4em;margin:.2em 0">${badge}</div>
          <div class="pst"><div><b>#${res.rank}</b><span>RANK</span></div><div><b>${res.score}</b><span>POINTS</span></div><div><b>${res.nOk}/${NQ}</b><span>CORRECT</span></div></div></div>
        <div class="pcard"><b style="font-size:1.3em">Don't train the enemy.</b><p class="pmute" style="margin-top:.5em">Clarify the indication · Make the plan visible · Review and act at 48–72 h</p></div></div></div>`;
      if (res.rank <= 3) setTimeout(confetti, 300);
    }
  }
  async function answer(r, k){
    if (sent[r] != null || room.state !== "question" || room.round !== r) return;
    sent[r] = k; buzz(40); lastKey = ""; render();
    try { await R_(code + "/players/" + pid + "/answers/" + r).set({opt:k, at:now()}); } catch(e){ delete sent[r]; lastKey = ""; render(); }
  }
  joinView();
}

(IS_HOST ? host : player)().catch(e => { app.innerHTML = `<div class="phone"><div class="pb"><div class="pbig">Could not start</div><p class="pmute">${esc(e.message)}</p></div></div>`; console.error(e); });
</script>
</body>
</html>
