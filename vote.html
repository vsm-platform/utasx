<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UTAS Open Day Desk Vote</title>
<meta name="theme-color" content="#232C7A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Presenter deck (default view) + phone ranking ballot (#vote). Same UTAS family as the desks:
   navy ink, orange/blue from the logo, one accent per idea. Slides are 16:9 and scale with the window. */
:root{
  --bg:#F4F6FB; --surface:#fff; --ink:#1B2559; --ink-2:#5A6488; --ink-3:#8E96B3; --line:#E3E7F2;
  --navy:#232C7A; --blue:#3B56A8; --orange:#F68922; --orange-2:#E66926;
  --ie:#F68922; --ll:#3B56A8; --cr:#E5484D;
  --display:"Lexend","Segoe UI",Arial,sans-serif; --body:"Figtree","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* ============ DECK ============ */
.deck{position:fixed;inset:0;display:grid;place-items:center;background:#E9EDF7;overflow:hidden}
.stage{width:min(100vw,177.78vh);height:min(56.25vw,100vh);position:relative;container-type:inline-size;background:#fff;overflow:hidden;box-shadow:0 10px 40px rgba(27,37,89,.12)}
.slide{position:absolute;inset:0;padding:4cqw 5cqw 5.2cqw;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.slide.on{opacity:1;visibility:visible}
.slide.on .in{animation:up .6s cubic-bezier(.2,.9,.2,1) both}
.slide.on .in2{animation:up .6s .12s cubic-bezier(.2,.9,.2,1) both}
.slide.on .in3{animation:up .6s .24s cubic-bezier(.2,.9,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(2cqw)}}
.bar{display:flex;align-items:center;justify-content:space-between;font-size:1.05cqw;color:var(--ink-2);font-weight:600}
.bar img{height:4.2cqw}
.bar b{color:var(--ink);letter-spacing:.06em}
.deco{position:absolute;pointer-events:none}

/* title slide */
.s-title{background:linear-gradient(125deg,#232C7A,#2F3A8C 55%,#3B56A8);color:#fff}
.s-title .bar{color:rgba(255,255,255,.75)} .s-title .bar b{color:#fff}
.s-title .logo-chip{background:#fff;border-radius:1cqw;padding:.6cqw 1cqw;display:inline-flex}
.s-title h1{font-family:var(--display);font-weight:800;font-size:6.2cqw;line-height:1;letter-spacing:-.04em;margin:5cqw 0 1.6cqw}
.s-title h1 em{font-style:normal;color:var(--orange)}
.s-title .lead{font-size:1.9cqw;opacity:.9;margin:0;max-width:60cqw}
.agenda{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:auto}
.agenda div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:1.6cqw;padding:2cqw 2.2cqw}
.agenda i{font-style:normal;display:grid;place-items:center;width:3.6cqw;height:3.6cqw;border-radius:50%;background:var(--orange);font-family:var(--display);font-weight:800;font-size:1.8cqw}
.agenda b{display:block;font-family:var(--display);font-size:2.2cqw;margin:1.2cqw 0 .4cqw}
.agenda span{font-size:1.35cqw;opacity:.85}
.ring{border-radius:50%;border:2.2cqw solid var(--orange);opacity:.35}

/* idea slides */
.s-idea{--a:var(--ie)}
.idea{flex:1;display:grid;grid-template-columns:40cqw 1fr;gap:4cqw;margin-top:2.6cqw;min-height:0}
.kick{display:inline-block;background:var(--a);color:#fff;font-weight:800;font-size:1cqw;letter-spacing:.16em;text-transform:uppercase;padding:.45cqw 1cqw;border-radius:.5cqw}
.idea h2{font-family:var(--display);font-weight:800;font-size:4.6cqw;letter-spacing:-.04em;line-height:1;margin:1.4cqw 0 1cqw}
.idea h2 span{color:var(--a)}
.idea .one{font-size:1.75cqw;line-height:1.35;color:var(--ink-2);margin:0 0 2cqw}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.1cqw}
.steps li{display:grid;grid-template-columns:3.2cqw 1fr;gap:1.2cqw;align-items:center;font-size:1.6cqw;font-weight:600}
.steps i{font-style:normal;width:3.2cqw;height:3.2cqw;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5cqw}
.gets{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;margin-top:auto}
.gets div{background:var(--bg);border-radius:1.2cqw;padding:1.3cqw 1.5cqw}
.gets small{display:block;font-size:.95cqw;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-bottom:.4cqw}
.gets span{font-size:1.3cqw;font-weight:600;line-height:1.3}
.right{position:relative;min-height:0;display:flex;flex-direction:column}
.right .screen{width:92%;margin:0 auto}
.screen{border-radius:1.2cqw;overflow:hidden;border:.5cqw solid #1B2559;box-shadow:0 1.4cqw 3cqw rgba(27,37,89,.22);background:#1B2559}
.screen img{display:block;width:100%}
.stand{width:12cqw;height:1cqw;background:#1B2559;margin:0 auto 1.6cqw;border-radius:0 0 .6cqw .6cqw}
.try{margin-top:auto;width:92%;margin-left:auto;margin-right:auto;display:flex;gap:1.6cqw;align-items:center;background:#fff;border-radius:1.4cqw;padding:1cqw 1.6cqw 1cqw 1cqw;box-shadow:0 .6cqw 2cqw rgba(27,37,89,.12);border:.25cqw solid var(--a)}
.try img{width:9.6cqw;height:9.6cqw;display:block;flex:none}
.try b{display:block;font-family:var(--display);font-size:2cqw;line-height:1.1}
.try span{display:block;font-size:1.25cqw;color:var(--ink-2);margin-top:.4cqw}
.try .tx{flex:1}
.try a{display:inline-block;margin-top:.8cqw;font-size:1.1cqw;font-weight:800;color:var(--a);text-decoration:none}

/* vote slide */
.s-vote .wrap{flex:1;display:grid;grid-template-columns:30cqw 1fr;gap:4.5cqw;margin-top:2.4cqw;min-height:0}
.s-vote h2{font-family:var(--display);font-weight:800;font-size:4.2cqw;letter-spacing:-.04em;line-height:1;margin:0 0 1cqw}
.s-vote h2 em{font-style:normal;color:var(--orange)}
.s-vote .one{font-size:1.5cqw;color:var(--ink-2);margin:0 0 2cqw;line-height:1.35}
.vqr{background:#fff;border:.3cqw solid var(--navy);border-radius:2cqw;padding:1.6cqw;display:flex;flex-direction:column;align-items:center}
.vqr img{width:21cqw;height:21cqw}
.vqr b{font-family:var(--display);font-size:1.7cqw;margin-top:.8cqw}
.votes{display:flex;align-items:baseline;gap:.8cqw;margin-top:1.6cqw;font-weight:700;color:var(--ink-2);font-size:1.4cqw}
.votes b{font-family:var(--display);font-size:3.4cqw;color:var(--ink)}
.res{display:flex;flex-direction:column;gap:1.8cqw;justify-content:center}
.res .h{display:flex;justify-content:space-between;font-size:1.05cqw;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.row{display:grid;grid-template-columns:4.6cqw 1fr;gap:1.4cqw;align-items:center}
.row .pos{font-family:var(--display);font-weight:800;font-size:3cqw;color:var(--ink-3);text-align:center}
.row.lead .pos{color:var(--orange)}
.row .nm{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6cqw}
.row .nm b{font-family:var(--display);font-size:2.1cqw}
.row .nm span{font-size:1.25cqw;color:var(--ink-2);font-weight:600}
.row .nm span b{font-size:1.25cqw;font-family:var(--body);color:var(--ink)}
.track{height:3.2cqw;border-radius:99px;background:var(--bg);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c);transition:width 1s cubic-bezier(.2,.9,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:1.2cqw;color:#fff;font-family:var(--display);font-weight:800;font-size:1.5cqw;min-width:4cqw}
.mix{display:flex;gap:.5cqw;margin-top:.6cqw;font-size:1.05cqw;color:var(--ink-3);font-weight:700}
.crown{display:inline-block;margin-left:.6cqw;font-size:1.1cqw;background:var(--orange);color:#fff;padding:.2cqw .7cqw;border-radius:99px;vertical-align:.3cqw;font-family:var(--body);font-weight:800;letter-spacing:.06em}
.method{font-size:1.05cqw;color:var(--ink-3);margin-top:1cqw}
.reset{position:absolute;right:5cqw;bottom:1.4cqw;font-size:.9cqw;color:var(--ink-3);display:flex;gap:.6cqw;align-items:center}
.reset button,.reset input{border:1px solid var(--line);background:#fff;border-radius:.5cqw;padding:.3cqw .7cqw;font-size:.9cqw}
.reset input{width:6cqw}

/* controls */
.ctl{position:fixed;left:50%;bottom:1.4vh;transform:translateX(-50%);display:flex;align-items:center;gap:.6em;background:rgba(27,37,89,.88);color:#fff;border-radius:99px;padding:.35em .5em;font-size:14px;z-index:5;opacity:.25;transition:opacity .3s}
.ctl:hover,.ctl:focus-within{opacity:1}
.ctl button{background:none;border:0;color:#fff;width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;font-size:1em}
.ctl button:hover{background:rgba(255,255,255,.15)}
.dots{display:flex;gap:.35em}
.dots i{width:.55em;height:.55em;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.dots i.on{background:var(--orange)}

/* ============ PHONE BALLOT (#vote) ============ */
.ph{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100%}
.ph-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph-top img{height:40px}
.ph-top span{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.ph h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1.1;margin:6px 0 6px}
.ph h1 em{font-style:normal;color:var(--orange)}
.ph p.sub{margin:0 0 16px;color:var(--ink-2)}
.cards{display:flex;flex-direction:column;gap:12px}
.cd{position:relative;display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;transition:border-color .2s,transform .15s,box-shadow .2s}
.cd:active{transform:scale(.98)}
.cd .rk{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;background:var(--bg);color:var(--ink-3);border:2px dashed #C9D0E3}
.cd.picked{border-color:var(--c);box-shadow:0 6px 18px rgba(27,37,89,.1)}
.cd.picked .rk{background:var(--c);color:#fff;border:0;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4)}}
.cd b{display:block;font-family:var(--display);font-size:18px}
.cd span{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:17px;background:var(--navy);color:#fff;margin-top:16px}
.btn[disabled]{opacity:.4}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.hint{text-align:center;color:var(--ink-3);font-size:13px;margin-top:10px}
.done{background:linear-gradient(125deg,#232C7A,#3B56A8);color:#fff;border-radius:20px;padding:20px;margin-bottom:16px}
.done b{font-family:var(--display);font-size:22px;display:block}
.done ol{margin:10px 0 0;padding-left:1.3em;font-weight:700}
.pres{background:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.pres h3{margin:0;font-family:var(--display);font-size:17px}
.pr .nm{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.pr .nm span{color:var(--ink-2);font-weight:600;font-size:14px}
.pr .track{height:16px}
.pr .track i{font-size:0;min-width:0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;transition:transform .3s;z-index:9}
.toast.show{transform:translateX(-50%)}
.demo-note{position:fixed;top:8px;right:8px;z-index:9;background:#FFF4DB;color:#8A5A00;font:700 12px var(--body);padding:4px 10px;border-radius:99px}
.demo-note a{color:inherit;margin-left:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- data ---------- */
function fbBackend(cfg) {
  firebase.initializeApp(cfg);
  const root = firebase.database().ref("vt");
  return {live: true,
    subscribe(cb) { root.child("votes").on("value", s => cb(s.val() || {})); },
    vote(id, r) { return root.child("votes/" + id).set({r, ts: firebase.database.ServerValue.TIMESTAMP}); },
    reset() { return root.child("votes").remove(); }};
}
function localBackend() {
  const K = "utas-vt-demo", subs = [];
  const load = () => { try { return JSON.parse(store.get(K)) || {}; } catch { return {}; } };
  const ch = "BroadcastChannel" in window ? new BroadcastChannel("utas-vt") : null;
  const emit = () => subs.forEach(f => f(load()));
  if (ch) ch.onmessage = emit;
  addEventListener("storage", e => { if (e.key === K) emit(); });
  const save = v => { store.set(K, JSON.stringify(v)); ch && ch.postMessage(1); emit(); };
  return {live: false,
    subscribe(cb) { subs.push(cb); cb(load()); },
    async vote(id, r) { const v = load(); v[id] = {r, ts: Date.now()}; save(v); },
    async reset() { save({}); }};
}
function tally(votes) {
  const T = {}; KEYS.forEach(k => T[k] = {k, pts: 0, first: 0, second: 0, third: 0});
  let n = 0;
  Object.values(votes || {}).forEach(v => {
    if (!v || !Array.isArray(v.r) || v.r.length !== 3) return; n++;
    v.r.forEach((k, i) => { if (!T[k]) return; T[k].pts += 3 - i; T[k][["first", "second", "third"][i]]++; });
  });
  const order = KEYS.map(k => T[k]).sort((a, b) => b.pts - a.pts || b.first - a.first);
  return {n, order, max: n * 3};
}

  });
}

function Ballot(be) {
  let id = store.get("vt-id"); if (!id) { id = "v" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set("vt-id", id); }
  let mine = null; try { mine = JSON.parse(store.get("vt-mine")); } catch {}

  const order = [...KEYS].sort(() => Math.random() - .5);   // shuffled so position does not bias the vote
  function draw() {
    const box = $("#app");
    if (mine) {
      const T = tally(votes);
      box.innerHTML = `<div class="ph"><div class="ph-top"><img src="${LOGO}" alt="UTAS Ibra"><span>Live results</span></div>
        <div class="done"><b>Thank you! Your ranking is in.</b><ol>${mine.map(k => `<li>${IDEAS[k].t1} ${IDEAS[k].t2}</li>`).join("")}</ol></div>

        <button class="btn ghost" id="chg">Change my ranking</button></div>`;
      $("#chg").onclick = () => { pick = []; mine = null; draw(); };
      return;
    }
    box.innerHTML = `<div class="ph"><div class="ph-top"><img src="${LOGO}" alt="UTAS Ibra"><span>Anonymous vote</span></div>
      <h1>Rank the <em>3 ideas</em></h1><p class="sub">Tap your favourite first, then your second. Tap again to undo.</p>
      <div class="cards">${order.map(k => { const I = IDEAS[k], p = pick.indexOf(k); return `<button class="cd${p >= 0 ? " picked" : ""}" data-k="${k}" style="--c:${I.c}" aria-pressed="${p >= 0}"><span class="rk">${p >= 0 ? p + 1 : ""}</span><span><b>${I.t1} ${I.t2}</b><span>${I.tag}</span></span></button>`; }).join("")}</div>
      <button class="btn" id="sub" ${pick.length < 3 ? "disabled" : ""}>${pick.length < 3 ? `Pick ${3 - pick.length} more` : "Submit my ranking"}</button>
      <p class="hint">1st = 3 points · 2nd = 2 · 3rd = 1</p></div>`;
    box.querySelectorAll(".cd").forEach(b => b.onclick = () => {
      const k = b.dataset.k, p = pick.indexOf(k);
      if (p >= 0) pick.splice(p); else pick.push(k);
      if (pick.length === 2) pick.push(KEYS.find(x => !pick.includes(x)));   // the last one is automatically 3rd
      navigator.vibrate?.(15); draw();
    });
    $("#sub").onclick = async () => {
      if (pick.length < 3) return; $("#sub").disabled = true; $("#sub").textContent = "Sending…";
      try { await be.vote(id, pick); mine = [...pick]; store.set("vt-mine", JSON.stringify(mine)); draw(); }
      catch { toast("Could not send. Check your internet."); $("#sub").disabled = false; $("#sub").textContent = "Submit my ranking"; }
    };
  }
  be.subscribe(v => { votes = v; if (mine) draw(); });
  draw();
}

/* ---------- boot ---------- */
(async () => {
  let be = null;
  if (CONFIG.firebase && CONFIG.firebase.databaseURL) {
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js");
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js");
      be = fbBackend(CONFIG.firebase);
    } catch (e) { console.warn(e); }
  }
  const phone = location.hash === "#vote";
  if (!be) {
    be = localBackend();
    const n = document.createElement("div"); n.className = "demo-note";
    n.innerHTML = `DEMO${phone ? `<a href="#s5">Slides</a>` : `<a href="#vote">Phone vote</a>`}`; document.body.appendChild(n);
  }
  phone ? Ballot(be) : Deck(be);
  addEventListener("hashchange", () => { const p = location.hash === "#vote"; if (p !== phone) location.reload(); });
})();
</script>
