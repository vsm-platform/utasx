<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#TRENDING — Salary Day Blackout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#0f172a; --ink2:#334155; --mute:#64748b; --line:#e3e0d6; --line2:#d3cfc2;
  --coral:#e5402a; --coral-l:#fde7e2; --blue:#2453d6; --blue-l:#e3ebff; --green:#15803d; --green-l:#dcfce7; --amber:#d97706; --amber-l:#fef3c7;
  --sh:0 1px 0 #0f172a0d,0 10px 30px -14px #0f172a40;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85em;flex:none}
@keyframes popin{from{transform:scale(0);opacity:0}}
@keyframes rise{from{transform:translateY(1em);opacity:0}}
@keyframes fadeUp{from{transform:translateY(1em);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ping{to{transform:scale(2.6);opacity:0}}
.live{width:.7em;height:.7em;border-radius:50%;background:var(--coral);position:relative;flex:none}
.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--coral);animation:ping 1.4s infinite}

/* ============ HOST ============ */
.host{height:100vh;padding:2vh 2.2vw 1.6vh;display:flex;flex-direction:column;gap:1.5vh;font-size:clamp(14px,1.18vw,30px);background:
  radial-gradient(60em 30em at 100% 0%,#ffe9e2 0%,transparent 60%),radial-gradient(50em 30em at 0% 100%,#e6edff 0%,transparent 60%),var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:1em}
.mark{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.9em;letter-spacing:-.02em;display:flex;align-items:center;gap:.25em;color:var(--ink)}
.mark .h{color:var(--coral)}
.mark small{font-family:"Figtree";font-weight:700;font-size:.4em;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;margin-left:.8em}
.chips{display:flex;gap:.5em;align-items:center}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:.35em .9em;font-weight:700;font-size:.85em;display:flex;align-items:center;gap:.4em}
.chip.demo{border-color:var(--amber);color:var(--amber)}
.chip b{font-family:"Bricolage Grotesque";font-weight:800}
.snd.off{opacity:.45}
.foot{display:flex;justify-content:space-between;color:var(--mute);font-size:.72em;font-weight:600;letter-spacing:.05em}
.btn{display:inline-flex;align-items:center;gap:.5em;background:var(--ink);color:#fff;font-weight:800;padding:.75em 1.4em;border-radius:.8em;box-shadow:0 .25em 0 #00000033;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.coral{background:var(--coral)}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:2.4vw;min-height:0}
.lb-l{display:flex;flex-direction:column;justify-content:center;gap:2.2vh}
.eyebrow{display:inline-flex;align-items:center;gap:.6em;color:var(--coral);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.85em}
.lb-l h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:4.4em;line-height:.95;letter-spacing:-.03em}
.lb-l h1 .hl{color:var(--coral);position:relative;white-space:nowrap}
.lb-l h1 .hl svg{position:absolute;left:0;bottom:-.12em;width:100%;height:.25em;overflow:visible}
.lb-l h1 .hl path{fill:none;stroke:var(--coral);stroke-width:5;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.2s .4s ease forwards}
.lb-l h1 .soft{color:var(--mute);font-size:.55em;display:block;margin-top:.25em}
.lead{font-size:1.2em;color:var(--ink2);max-width:31em;line-height:1.45}
.lead b{color:var(--ink)}
.types4{display:grid;grid-template-columns:repeat(4,1fr);gap:.7em}
.tcard{background:var(--card);border:2px solid var(--line);border-radius:1em;padding:.8em .9em;box-shadow:var(--sh);animation:rise .6s both}
.tcard:nth-child(2){animation-delay:.1s}.tcard:nth-child(3){animation-delay:.2s}.tcard:nth-child(4){animation-delay:.3s}
.tcard .ti{width:2.3em;height:2.3em;border-radius:.65em;display:grid;place-items:center;margin-bottom:.5em}
.tcard .ti svg{width:1.4em;height:1.4em}
.tcard b{display:block;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.05em;line-height:1.1}
.tcard span{display:block;color:var(--mute);font-size:.75em;font-weight:700;margin-top:.2em}
.lb-r{display:flex;flex-direction:column;gap:1.6vh;min-height:0}
.join{background:var(--card);border-radius:1.2em;padding:1.2em;display:flex;gap:1.3em;align-items:center;box-shadow:var(--sh);border:2px solid var(--line)}
#qr{line-height:0;padding:.4em;border:2px solid var(--line);border-radius:.7em;background:#fff;min-width:2em;min-height:2em}
#qr img,#qr canvas{width:9.5em!important;height:9.5em!important}
.join .lbl{font-size:.75em;font-weight:800;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.code{font-family:"Bricolage Grotesque";font-weight:800;font-size:4em;letter-spacing:.06em;line-height:1;margin:.1em 0}
.code span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.code span:nth-child(2){animation-delay:.15s}.code span:nth-child(3){animation-delay:.3s}.code span:nth-child(4){animation-delay:.45s}
@keyframes bob{50%{transform:translateY(-.08em)}}
.url{font-size:.72em;color:var(--mute);word-break:break-all;font-weight:600}
.crowd{flex:1;background:var(--card);border-radius:1.2em;border:2px solid var(--line);box-shadow:var(--sh);padding:1em 1.2em;display:flex;flex-direction:column;min-height:0}
.crowd-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;color:var(--mute)}
.crowd-h b{font-family:"Bricolage Grotesque";font-size:2.6em;font-weight:800;line-height:1;color:var(--ink)}
.bubbles{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.55em;margin-top:.8em;overflow:hidden}
.bub{display:inline-flex;align-items:center;gap:.4em;background:var(--bg);border-radius:99px;padding:.22em .8em .22em .22em;font-weight:700;font-size:.9em;animation:popin .5s cubic-bezier(.3,1.6,.5,1) both}
.empty{color:var(--mute);margin:auto;text-align:center;font-weight:600}
.lb-go{display:flex;justify-content:flex-end}

/* stage */
.stage{flex:1;display:grid;grid-template-columns:1fr 24em;gap:1.8vw;min-height:0}
.main{display:flex;flex-direction:column;gap:1.4vh;min-height:0}
.alertc{display:flex;gap:1em;align-items:center;background:var(--card);border:2px solid var(--coral);border-radius:1em;padding:.85em 1.2em;box-shadow:0 0 0 .35em var(--coral-l);animation:fadeUp .6s cubic-bezier(.2,.9,.3,1) both}
.bell{width:2.6em;height:2.6em;border-radius:.7em;background:var(--coral);color:#fff;display:grid;place-items:center;flex:none}
.bell svg{width:1.5em;height:1.5em;animation:ring 1.6s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(10deg)}40%{transform:rotate(-6deg)}}
.alertc .clk{font-weight:800;color:var(--coral);letter-spacing:.1em;font-size:.8em;text-transform:uppercase}
.alertc p{font-size:1.15em;line-height:1.35;font-weight:600;margin-top:.15em}
.branch{display:inline-block;background:var(--ink);color:#fff;border-radius:.5em;padding:.15em .6em;font-size:.75em;font-weight:800;letter-spacing:.06em;margin-bottom:.3em}
.qrow{display:flex;align-items:center;gap:1em}
.q{font-family:"Bricolage Grotesque";font-weight:800;font-size:2.6em;line-height:1;letter-spacing:-.02em}
.qsub{color:var(--ink2);font-weight:600;font-size:1.05em;margin-top:.35em;line-height:1.35}
.timer{position:relative;width:5.2em;height:5.2em;flex:none;margin-left:auto}
.timer svg{width:100%;height:100%}
.t-bg{fill:#fff;stroke:var(--line);stroke-width:8}
.t-fg{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .15s linear,stroke .3s}
.timer.low .t-fg{stroke:var(--coral)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:2em}
.timer.low b{color:var(--coral);animation:thump .5s infinite}
@keyframes thump{50%{transform:scale(1.12)}}

/* R1 drip + live timeline */
.drip{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.8em;align-content:start;min-height:0}
.fact{display:flex;gap:.8em;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:1em;padding:.8em 1em;box-shadow:var(--sh);animation:factIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes factIn{from{transform:translateY(-.8em) scale(.9);opacity:0}}
.fact .fi{width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-weight:800}
.fact.V .fi{background:var(--green)} .fact.R .fi,.fact.P .fi{background:var(--amber)} .fact.E .fi,.fact.U .fi{background:var(--blue)}
.fact .fi svg{width:1.3em;height:1.3em}
.fact small{display:block;font-weight:800;letter-spacing:.1em;font-size:.68em;text-transform:uppercase}
.fact.V small{color:var(--green)} .fact.R small,.fact.P small{color:var(--amber)} .fact.E small,.fact.U small{color:var(--blue)}
.fact p{font-weight:700;font-size:1.02em;line-height:1.3}
.fact.wait{border-style:dashed;box-shadow:none;background:transparent;animation:none;color:var(--mute)}
.fact.wait .fi{background:var(--line);color:var(--mute)}
.ltl{background:var(--card);border:2px solid var(--line);border-radius:1em;padding:.8em 1.1em;box-shadow:var(--sh)}
.ltl-h{display:flex;justify-content:space-between;font-weight:800;font-size:.9em;margin-bottom:.4em}
.ltl-h b{font-family:"Bricolage Grotesque";font-size:1.3em}
.ltl svg{width:100%;height:auto;display:block;overflow:visible}
.tl-dot{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}

/* MC options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.1vw;flex:1;min-height:0}
.opt{position:relative;background:var(--card);border:2px solid var(--line);border-radius:1em;padding:.95em 1.1em 1.3em;display:flex;flex-direction:column;gap:.5em;overflow:hidden;box-shadow:var(--sh);animation:rise .55s cubic-bezier(.2,.9,.3,1) both;transition:opacity .5s,transform .5s,border-color .5s,box-shadow .5s}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.4em;background:var(--rc)}
.ohead{display:flex;align-items:center;gap:.6em}
.olet{width:1.9em;height:1.9em;border-radius:.5em;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.1em;flex:none}
.role{display:flex;align-items:center;gap:.4em;color:var(--rc);font-weight:800;font-size:.85em;letter-spacing:.04em;text-transform:uppercase}
.role svg{width:1.3em;height:1.3em}
.say{font-size:1.13em;line-height:1.36;font-weight:600}
.vote{position:absolute;left:0;right:0;bottom:0;height:.55em}
.vote i{display:block;height:100%;width:0;background:var(--rc);transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.pct{position:absolute;right:.7em;top:.55em;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.5em;opacity:0;transition:opacity .5s .3s}
.stamp{position:absolute;right:.6em;bottom:.8em;width:2.8em;height:2.8em;opacity:0}
.stamp circle{fill:var(--green)}
.stamp path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.revealed .opt{opacity:.42;animation:none}
.revealed .opt .pct{opacity:1}
.revealed .opt.best{opacity:1;border-color:var(--green);box-shadow:0 0 0 .3em var(--green-l),var(--sh);transform:scale(1.02)}
.revealed .opt.best .olet{background:var(--green)}
.revealed .opt.best .stamp{opacity:1;animation:stampIn .5s .5s cubic-bezier(.3,1.7,.5,1) both}
.revealed .opt.best .stamp path{animation:draw .5s .9s ease forwards}
@keyframes stampIn{from{transform:scale(2.5) rotate(-20deg);opacity:0}}
.headline{display:flex;gap:.8em;align-items:center;background:var(--ink);color:#fff;border-radius:.9em;padding:.7em 1em;font-weight:700;font-size:1.05em;animation:fadeUp .6s .5s both}
.headline .tg{background:var(--coral);border-radius:.4em;padding:.15em .5em;font-size:.72em;font-weight:800;letter-spacing:.1em;flex:none}
.headline.good .tg{background:var(--green)}
.note{display:flex;gap:1em;align-items:center;background:var(--amber-l);border:2px solid #f5d27a;border-radius:1em;padding:.7em 1.1em;animation:fadeUp .6s .9s both}
.note .bulb{width:2.3em;height:2.3em;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;flex:none}
.note .bulb svg{width:1.3em;height:1.3em}
.note p{font-weight:700;font-size:1em;line-height:1.35}
.note small{display:block;color:#92400e;font-weight:600;font-size:.78em;margin-top:.15em}
.top5{display:flex;gap:.5em;flex-wrap:wrap}
.top5 .bub{background:var(--card);border:2px solid var(--line);font-size:.82em}
.top5 .bub b{font-family:"Bricolage Grotesque";margin-left:.35em}
.rk{color:var(--mute);font-weight:800}

/* R1 reveal */
.r1stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.stt{background:var(--card);border:2px solid var(--line);border-radius:1em;padding:.7em 1em;box-shadow:var(--sh);display:flex;align-items:center;gap:.8em;animation:rise .5s both}
.stt b{font-family:"Bricolage Grotesque";font-weight:800;font-size:2.2em;line-height:1}
.stt span{font-weight:700;font-size:.9em;color:var(--ink2);line-height:1.25}
.stt i{width:1em;height:1em;border-radius:50%;flex:none}
.bestpost{background:var(--card);border:2px solid var(--green);border-radius:1em;padding:.9em 1.1em;box-shadow:0 0 0 .3em var(--green-l);animation:fadeUp .6s .4s both}
.bestpost .bh{display:flex;align-items:center;gap:.6em;font-weight:800;font-size:.85em;color:var(--green);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.4em}
.bestpost p{font-size:1.2em;font-weight:700;line-height:1.4}
.next-scene{display:flex;align-items:center;gap:.8em;background:var(--ink);color:#fff;border-radius:1em;padding:.8em 1.1em;font-weight:700;animation:fadeUp .6s 1s both}
.next-scene b{color:#ffb4a6}

/* side panel */
.side{background:var(--card);border:2px solid var(--line);border-radius:1.2em;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-h{display:flex;align-items:center;gap:.55em;padding:.75em 1em;border-bottom:2px solid var(--line);font-weight:800}
.side-h .tag{margin-left:auto;background:var(--coral-l);color:var(--coral);border-radius:99px;padding:.2em .7em;font-size:.82em}
.posts{flex:1;overflow:hidden;padding:.3em .8em;display:flex;flex-direction:column;min-height:0}
.post{display:flex;gap:.6em;padding:.55em .4em;border-bottom:1px solid var(--line);animation:postin .55s cubic-bezier(.2,.9,.3,1)}
@keyframes postin{from{transform:translateX(1.2em);opacity:0}}
.post .av{width:2em;height:2em}
.post .h{font-weight:800;font-size:.78em;color:var(--mute)}
.post p{font-size:.95em;line-height:1.3;font-weight:600;color:#7f1d1d}
.post .m{display:flex;gap:1em;color:var(--mute);font-size:.7em;font-weight:700;margin-top:.2em}
.post .m svg{width:1.1em;height:1.1em;vertical-align:-.2em;margin-right:.2em}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:.4em;padding:.5em .8em .4em;border-top:2px solid var(--line);background:#fbfaf6}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:8.5em;display:block;margin:0 auto}
.g-bg{fill:none;stroke:#ebe8de;stroke-width:12;stroke-linecap:round}
.g-arc{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.9,.3,1)}
.g-ndl{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.g-hub{fill:var(--ink)}
.gauge g{transform-box:view-box;transition:transform 1.3s cubic-bezier(.3,1.4,.5,1)}
.g-val b{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.5em;line-height:1}
.g-val span{display:block;font-size:.7em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.g-val i{font-style:normal;font-weight:800;font-size:.8em;margin-left:.3em}
.up{color:var(--green)} .dn{color:var(--coral)}
.fstat{display:flex;justify-content:space-between;align-items:center;padding:.55em 1em;border-top:2px solid var(--line);font-weight:700;font-size:.85em;color:var(--mute)}
.fstat b{font-family:"Bricolage Grotesque";font-size:1.5em;color:var(--ink)}
.mapwrap{flex:1;min-height:0;padding:.6em .8em 0;display:flex;flex-direction:column}
.mapwrap h4{font-size:.75em;font-weight:800;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-bottom:.3em}
.mapwrap svg{flex:1;min-height:0;width:100%}
.ctrl{padding:.6em .8em;display:flex;justify-content:flex-end;border-top:2px solid var(--line)}

/* DNA map */
.dna text{font-family:"Figtree";font-weight:800}
.dna .ql{font-family:"Bricolage Grotesque";font-weight:800;font-size:17px}
.dna .ax{font-size:11px;letter-spacing:.14em;fill:#64748b}
.dna .dot{transition:transform 1.5s cubic-bezier(.3,1.2,.4,1)}
.dna .dot text{font-size:11px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.dna .avg{transition:transform 1.5s cubic-bezier(.3,1.2,.4,1)}

/* final */
.final{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:2vw;min-height:0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:1.2em;box-shadow:var(--sh);padding:1em 1.3em;display:flex;flex-direction:column;min-height:0}
.panel h2{font-family:"Bricolage Grotesque";font-weight:800;font-size:2em;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.5em}
.panel h2 small{font-family:"Figtree";font-size:.38em;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
.panel .bigmap{flex:1;min-height:0;display:flex;gap:1em;margin-top:.4em}
.panel .bigmap svg{flex:1;min-height:0;height:100%}
.tcount{display:flex;flex-direction:column;gap:.5em;justify-content:center;width:10.5em}
.tc{border-radius:.8em;padding:.5em .7em;animation:rise .5s both}
.tc b{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.6em;line-height:1}
.tc span{display:block;font-weight:800;font-size:.8em}
.leaders{display:flex;flex-direction:column;gap:.55em;margin-top:.6em}
.ldr{display:flex;align-items:center;gap:.8em;border:2px solid var(--line);border-radius:.9em;padding:.55em .8em;animation:rise .5s both}
.ldr .pos{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.6em;width:1.2em;text-align:center}
.ldr .av{width:2.4em;height:2.4em;font-size:1em}
.ldr .nm{font-weight:800;font-size:1.1em}
.ldr .ty{font-size:.78em;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ldr .sc{margin-left:auto;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.3em}
.ldr.first{border-color:#f59e0b;background:#fffbeb}
.verdict{margin-top:auto;background:var(--green-l);border:2px solid #86efac;border-radius:1em;padding:.8em 1em;font-weight:700;line-height:1.4;animation:fadeUp .6s 1.4s both}
.verdict b{font-family:"Bricolage Grotesque";font-size:1.2em}
.cardcall{display:flex;align-items:center;gap:.7em;margin-top:.7em;color:var(--ink2);font-weight:700;font-size:.9em}

/* ---- scoring: one place, used by big screen ---- */
function evalRound(r, ans, qStart, branch){
  if (r === 0){
    if (!ans || !ans.pub) return {pts:0, sp:-1, op:-1, silent:true};
    const sec = clamp(((ans.at||0) - (qStart||0)) / 1000, 0, SECS[0]);
    if (qStart && (ans.at - qStart) > Tms(0) + 3000) return {pts:0, sp:-1, op:-1, silent:true};
    const ids = String(ans.chips||"").split(",").filter(Boolean), n = k => ids.filter(id => CH[id]?.kind === k).length;
    const V = n("V"), U = n("U"), E = n("E"), Rr = n("R"), P = n("P");
    const base = 250*V + 150*U + 100*E - 350*Rr - 300*P;
    const pts = Math.max(0, Math.round(base * 1.3 * (1 - .6 * sec / SECS[0])));
    const op = clamp(.45*V + .35*U + .2*E - .8*Rr - .8*P, -1, 1);
    return {pts, sp: 1 - 2*sec/SECS[0], op, sec, clean: Rr + P === 0, ids};
  }
  if (!ans || !ans.opt) return {pts:0, sp:-1, op:-1, none:true};
  const o = roundData(r, branch).opts.find(x => x.k === ans.opt); if (!o) return {pts:0, sp:-1, op:-1, none:true};
  const el = qStart ? (ans.at - qStart) : 0;
  if (el > Tms(r) + 3000) return {pts:0, sp:-1, op:-1, none:true};
  return {pts: Math.round(o.base * (.6 + .4 * clamp(1 - el / Tms(r), 0, 1))), sp:o.sp, op:o.op, opt:o.k, best:!!o.best};
}

const Sound = {
  ctx:null, out:null, on:true, lastPost:0,
  init(){ try{ if (!this.ctx){ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); this.out = this.ctx.createGain(); this.out.gain.value = .55; this.out.connect(this.ctx.destination); } if (this.ctx.state === "suspended") this.ctx.resume(); }catch(e){} },
  tone(f, dur, type="sine", vol=.25, when=0, to=null){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .05);
  },
  noise(dur, vol=.2, freq=1200, when=0, q=.8, toFreq=null){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.Q.value = q; f.frequency.setValueAtTime(freq, t); if (toFreq) f.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur*.3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.out); src.start(t); src.stop(t + dur);
  },
  pop(){ this.tone(660,.09,"sine",.16,0,990); },
  post(){ const n = performance.now(); if (n - this.lastPost < 140) return; this.lastPost = n; this.tone(1180,.05,"sine",.06); this.tone(1580,.07,"sine",.045,.04); },
  join(){ this.tone(520,.1,"triangle",.14); this.tone(780,.14,"triangle",.12,.07); },
  ding(){ this.tone(1046,.25,"triangle",.18); this.tone(1568,.4,"triangle",.14,.12); },
  alert(){ for (let i=0;i<3;i++){ this.tone(880,.13,"square",.08,i*.26); this.tone(660,.13,"square",.07,i*.26+.13); } this.noise(.6,.12,600,0,.7,2400); },
  beat(fast){ this.tone(fast?70:58,.22,"sine",.5,0,38); this.tone(fast?70:58,.18,"sine",.32,.16,38); },
  tick(){ this.tone(1500,.05,"square",.08); },
  whoosh(){ this.noise(.55,.22,300,0,.6,3200); },
  reveal(){ this.whoosh(); [523,659,784,1047].forEach((f,i) => this.tone(f,.45,"triangle",.16,.25+i*.09)); },
  final(){
    [[523,659,784],[587,740,880],[659,831,988,1319]].forEach((ch,i) => ch.forEach(f => this.tone(f,.9,"triangle",.11,i*.35)));
    for (let i=0;i<40;i++) this.noise(.09,.05+Math.random()*.06,1800+Math.random()*1800,1.1+Math.random()*2.6,1.2);
  }
};

    Object.keys(players).forEach(pid => {
      const style = hash(pid) % 4;          // each bot has a personality

function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrap(ctx, text, x, y, maxW, lh){
  const words = String(text).split(" "); let line = "", yy = y;
  for (const w of words){ const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh; } else line = t; }
  if (line) ctx.fillText(line, x, yy); return yy + lh;
}

  if (d.cls){ const cx = px(d.cls.op), cy = py(d.cls.sp); ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI/4); ctx.fillStyle = "#0f172a"; ctx.fillRect(-14,-14,28,28); ctx.restore(); ctx.fillStyle = "#0f172a"; ctx.font = `800 17px ${BF}`; ctx.fillText("CLASS", cx, cy+40); }
  const ux = px(d.op), uy = py(d.sp);
  ctx.fillStyle = "rgba(229,64,42,.18)"; ctx.beginPath(); ctx.arc(ux, uy, 46, 0, 7); ctx.fill();
  ctx.fillStyle = "#e5402a"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(ux, uy, 28, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = `800 18px ${BF}`; ctx.fillText("YOU", ux, uy+6);
  ctx.textAlign = "left";
  // stats
  const sx = 690, sw = W - 100 - sx;
  const stat = (y, label, value, sub) => {
    ctx.fillStyle = "#f6f4ee"; roundRect(ctx, sx, y, sw, 150, 24); ctx.fill();
    ctx.fillStyle = "#64748b"; ctx.font = `800 20px ${BF}`; ctx.fillText(label, sx+30, y+42);
    ctx.fillStyle = "#0f172a"; ctx.font = `800 56px ${DF}`; ctx.fillText(value, sx+28, y+102);
    if (sub){ ctx.fillStyle = "#64748b"; ctx.font = `600 22px ${BF}`; ctx.fillText(sub, sx+30, y+134); }
  };
  stat(800, "TRUST SCORE", String(d.score), "points from 3 decisions");
  stat(965, "RANK", `#${d.rank}`, `out of ${d.of} leaders`);
  stat(1130, "FIRST STATEMENT", d.silent ? "Silent" : mmss(d.sec), d.silent ? "you stayed silent" : d.clean ? "confirmed facts only" : "included a guess or promise");
  // traits
  let y = 1385;
  const trait = (label, text, col) => {
    ctx.fillStyle = col; ctx.font = `800 20px ${BF}`; ctx.fillText(label, 100, y);
    ctx.fillStyle = "#0f172a"; ctx.font = `600 27px ${BF}`; y = wrap(ctx, text, 290, y, W - 390, 35) + 10;
  };
  trait("STRENGTH", T.strength, "#15803d");
  trait("BLIND SPOT", T.blind, "#e5402a");
  trait("THEORY", T.theory, "#2453d6");
  // footer
  ctx.fillStyle = "#0f172a"; roundRect(ctx, 100, H-160, W-200, 84, 24); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = `800 30px ${DF}`; ctx.textAlign = "center";
  ctx.fillText("Communicate early  •  Share verified facts  •  Update continuously", W/2, H-107);
  ctx.textAlign = "left";
  return cv;
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadCard(d, btn){
  const old = btn ? btn.innerHTML : "";
  if (btn){ btn.disabled = true; btn.textContent = "Preparing your card…"; }
  try {
    const cv = await drawCard(d);
    const safe = String(d.name || "Leader").replace(/[^\p{L}\p{N}]+/gu, "-").slice(0,30);
    try {
      if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
      const pdf = new window.jspdf.jsPDF({unit:"mm", format:"a5", orientation:"portrait"});
      pdf.addImage(cv.toDataURL("image/jpeg", .93), "JPEG", 0, 0, 148, 210);
      const url = URL.createObjectURL(pdf.output("blob")), a = document.createElement("a");
      a.href = url; a.download = `Leadership-Card-${safe}.pdf`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch(e){
      const a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = `Leadership-Card-${safe}.png`; a.click();
    }
  } finally { if (btn){ btn.disabled = false; btn.innerHTML = old; } }
}

          <g class="n1"><rect x="18" y="28" width="70" height="18" rx="9" fill="#e5402a"/><circle cx="29" cy="37" r="5" fill="#fff"/></g>
          <g class="n2"><rect x="62" y="54" width="76" height="18" rx="9" fill="#2453d6"/><circle cx="73" cy="63" r="5" fill="#fff"/></g>
          <g class="n3"><rect x="24" y="80" width="64" height="18" rx="9" fill="#d97706"/><circle cx="35" cy="89" r="5" fill="#fff"/></g></svg>
        <div class="pbig" style="font-size:32px">You're in!</div>
        <p class="pmute" style="margin-top:8px">You lead the crisis team of</p>

        const ids = (published[0] || me.answers[0].chips || "").split(",");

          <div class="pbig" style="font-size:30px;margin-top:8px">Published!</div>

    if (room.state === "question"){
