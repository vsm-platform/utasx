<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#TRENDING — The Crisis Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#0f172a; --ink2:#334155; --mute:#64748b; --line:#e3e0d6; --line2:#d3cfc2;
  --coral:#e5402a; --coral-l:#fde7e2; --blue:#2453d6; --blue-l:#e3ebff; --green:#15803d; --green-l:#dcfce7; --amber:#d97706; --amber-l:#fef3c7;
  --sh:0 1px 0 #0f172a0d,0 10px 30px -14px #0f172a40;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.disp{font-family:"Bricolage Grotesque",sans-serif}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============ HOST ============ */
.host{min-height:100vh;height:100vh;padding:2vh 2.2vw 1.6vh;display:flex;flex-direction:column;gap:1.6vh;font-size:clamp(14px,1.18vw,30px);background:
  radial-gradient(60em 30em at 100% 0%,#ffe9e2 0%,transparent 60%),radial-gradient(50em 30em at 0% 100%,#e6edff 0%,transparent 60%),var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:1em}
.mark{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.9em;letter-spacing:-.02em;display:flex;align-items:center;gap:.25em}
.mark .h{color:var(--coral)}
.mark small{font-family:"Figtree";font-weight:600;font-size:.4em;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;margin-left:.8em}
.chips{display:flex;gap:.5em;align-items:center}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:.35em .9em;font-weight:700;font-size:.85em;display:flex;align-items:center;gap:.4em}
.chip.demo{border-color:var(--amber);color:var(--amber)}
.chip b{font-family:"Bricolage Grotesque";font-weight:800}
.snd{cursor:pointer}
.snd.off{opacity:.45}
.foot{display:flex;justify-content:space-between;color:var(--mute);font-size:.72em;font-weight:600;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;gap:.5em;background:var(--ink);color:#fff;font-weight:800;padding:.8em 1.5em;border-radius:.8em;font-size:1em;box-shadow:0 .25em 0 #00000033;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.coral{background:var(--coral)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line2);box-shadow:none}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:2.4vw;min-height:0}
.lb-l{display:flex;flex-direction:column;justify-content:center;gap:2.2vh}
.eyebrow{display:inline-flex;align-items:center;gap:.5em;color:var(--coral);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.85em}
.live{width:.7em;height:.7em;border-radius:50%;background:var(--coral);position:relative}
.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--coral);animation:ping 1.4s infinite}
@keyframes ping{to{transform:scale(2.6);opacity:0}}
.lb-l h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:4.6em;line-height:.95;letter-spacing:-.03em}
.lb-l h1 .hl{color:var(--coral);position:relative;white-space:nowrap}
.lb-l h1 .hl svg{position:absolute;left:0;bottom:-.12em;width:100%;height:.25em;overflow:visible}
.lb-l h1 .hl path{fill:none;stroke:var(--coral);stroke-width:5;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.2s .4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lb-l h1 .soft{color:var(--mute);font-size:.55em;display:block;margin-top:.25em;letter-spacing:-.01em}
.lead{font-size:1.25em;color:var(--ink2);max-width:30em;line-height:1.45}
.lead b{color:var(--ink)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.scen{background:var(--card);border:3px solid var(--line);border-radius:1.1em;padding:1.1em 1.2em;text-align:left;display:flex;gap:1em;align-items:flex-start;box-shadow:var(--sh);transition:border-color .25s,transform .25s}
.scen:hover{transform:translateY(-3px)}
.scen .ic{width:3em;height:3em;border-radius:.8em;display:grid;place-items:center;font-size:1.1em;flex:none}
.scen .ic svg{width:1.6em;height:1.6em}
.scen h3{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.35em;line-height:1.05}
.scen p{color:var(--mute);font-size:.88em;margin-top:.3em;line-height:1.35}
.scen .key{display:inline-block;margin-top:.5em;font-size:.7em;font-weight:800;letter-spacing:.12em;color:var(--mute);border:2px solid var(--line);border-radius:.4em;padding:.1em .45em}
.scen.on{border-color:var(--coral);transform:translateY(-3px)}
.scen.on .key{background:var(--coral);border-color:var(--coral);color:#fff}
.lb-r{display:flex;flex-direction:column;gap:1.6vh;min-height:0}
.join{background:var(--card);border-radius:1.2em;padding:1.2em;display:flex;gap:1.3em;align-items:center;box-shadow:var(--sh);border:2px solid var(--line)}
#qr{line-height:0;padding:.4em;border:2px solid var(--line);border-radius:.7em;background:#fff}
#qr img,#qr canvas{width:9.5em!important;height:9.5em!important}
.join .lbl{font-size:.75em;font-weight:800;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.code{font-family:"Bricolage Grotesque";font-weight:800;font-size:4em;letter-spacing:.06em;line-height:1;margin:.1em 0}
.code span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.code span:nth-child(2){animation-delay:.15s}.code span:nth-child(3){animation-delay:.3s}.code span:nth-child(4){animation-delay:.45s}
@keyframes bob{50%{transform:translateY(-.08em)}}
.url{font-size:.72em;color:var(--mute);word-break:break-all;font-weight:600}
.crowd{flex:1;background:var(--card);border-radius:1.2em;border:2px solid var(--line);box-shadow:var(--sh);padding:1em 1.2em;display:flex;flex-direction:column;min-height:0}
.crowd-h{display:flex;justify-content:space-between;align-items:baseline}
.crowd-h b{font-family:"Bricolage Grotesque";font-size:2.6em;font-weight:800;line-height:1}
.crowd-h span{color:var(--mute);font-weight:700;font-size:.85em}
.bubbles{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.55em;margin-top:.8em;overflow:hidden}
.bub{display:flex;align-items:center;gap:.4em;background:var(--bg);border-radius:99px;padding:.22em .8em .22em .22em;font-weight:700;font-size:.9em;animation:popin .5s cubic-bezier(.3,1.6,.5,1) both}
.av{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85em;flex:none}
@keyframes popin{from{transform:scale(0);opacity:0}}
.crowd .empty{color:var(--mute);margin:auto;text-align:center;font-weight:600}
.lb-go{display:flex;justify-content:flex-end}

/* stage */
.stage{flex:1;display:grid;grid-template-columns:1fr 24em;gap:1.8vw;min-height:0}
.main{display:flex;flex-direction:column;gap:1.5vh;min-height:0}
.alertc{display:flex;gap:1em;align-items:center;background:var(--card);border:2px solid var(--coral);border-radius:1em;padding:.9em 1.2em;box-shadow:0 0 0 .35em var(--coral-l);animation:slideD .6s cubic-bezier(.2,.9,.3,1)}
@keyframes slideD{from{transform:translateY(-1em);opacity:0}}
.bell{width:2.6em;height:2.6em;border-radius:.7em;background:var(--coral);color:#fff;display:grid;place-items:center;flex:none}
.bell svg{width:1.5em;height:1.5em;animation:ring 1.6s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(10deg)}40%{transform:rotate(-6deg)}}
.alertc .clk{font-weight:800;color:var(--coral);letter-spacing:.1em;font-size:.8em;text-transform:uppercase}
.alertc p{font-size:1.18em;line-height:1.35;font-weight:600;margin-top:.15em}
.qrow{display:flex;align-items:center;gap:1em}
.q{font-family:"Bricolage Grotesque";font-weight:800;font-size:2.7em;line-height:1;letter-spacing:-.02em;flex:1}
.timer{position:relative;width:5.4em;height:5.4em;flex:none}
.timer svg{width:100%;height:100%}
.t-bg{fill:#fff;stroke:var(--line);stroke-width:8}
.t-fg{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .15s linear,stroke .3s}
.timer.low .t-fg{stroke:var(--coral)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:2.1em}
.timer.low b{color:var(--coral);animation:thump .5s infinite}
@keyframes thump{50%{transform:scale(1.12)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.1vw;flex:1;min-height:0}
.opt{position:relative;background:var(--card);border:2px solid var(--line);border-radius:1em;padding:1em 1.1em 1.3em;display:flex;flex-direction:column;gap:.55em;overflow:hidden;box-shadow:var(--sh);animation:rise .55s cubic-bezier(.2,.9,.3,1) both;transition:opacity .5s,transform .5s,border-color .5s,box-shadow .5s}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
@keyframes rise{from{transform:translateY(1em);opacity:0}}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.4em;background:var(--rc)}
.ohead{display:flex;align-items:center;gap:.6em}
.olet{width:1.9em;height:1.9em;border-radius:.5em;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.1em;flex:none}
.role{display:flex;align-items:center;gap:.4em;color:var(--rc);font-weight:800;font-size:.85em;letter-spacing:.04em;text-transform:uppercase}
.role svg{width:1.3em;height:1.3em}
.say{font-size:1.15em;line-height:1.38;font-weight:600;color:var(--ink)}
.vote{position:absolute;left:0;right:0;bottom:0;height:.55em;background:#0000}
.vote i{display:block;height:100%;width:0;background:var(--rc);transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.pct{position:absolute;right:.7em;top:.6em;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.5em;opacity:0;transition:opacity .5s .3s}
.stamp{position:absolute;right:.6em;bottom:.8em;width:3em;height:3em;opacity:0}
.stamp circle{fill:var(--green)}
.stamp path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.revealed .opt{opacity:.42;animation:none}
.revealed .opt .pct{opacity:1}
.revealed .opt.best{opacity:1;border-color:var(--green);box-shadow:0 0 0 .3em var(--green-l),var(--sh);transform:scale(1.02)}
.revealed .opt.best .olet{background:var(--green)}
.revealed .opt.best .stamp{opacity:1;animation:stampIn .5s .5s cubic-bezier(.3,1.7,.5,1) both}
.revealed .opt.best .stamp path{animation:draw .5s .9s ease forwards}
@keyframes stampIn{from{transform:scale(2.5) rotate(-20deg);opacity:0}}
.note{display:flex;gap:1em;align-items:center;background:var(--amber-l);border:2px solid #f5d27a;border-radius:1em;padding:.8em 1.1em;animation:slideU .6s .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes slideU{from{transform:translateY(1em);opacity:0}}
.note .bulb{width:2.4em;height:2.4em;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;flex:none}
.note .bulb svg{width:1.4em;height:1.4em}
.note p{font-weight:700;font-size:1.05em;line-height:1.35}
.note small{display:block;color:#92400e;font-weight:600;font-size:.78em;margin-top:.2em}

/* feed panel */
.feed{background:var(--card);border:2px solid var(--line);border-radius:1.2em;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.feed-h{display:flex;align-items:center;gap:.55em;padding:.8em 1em;border-bottom:2px solid var(--line);font-weight:800}
.feed-h .tag{margin-left:auto;background:var(--coral-l);color:var(--coral);border-radius:99px;padding:.2em .7em;font-size:.82em}
.feed-h .tag.good{background:var(--green-l);color:var(--green)}
.posts{flex:1;overflow:hidden;padding:.4em .8em;display:flex;flex-direction:column;gap:.45em;min-height:0}
.post{display:flex;gap:.6em;padding:.6em .5em;border-bottom:1px solid var(--line);animation:postin .55s cubic-bezier(.2,.9,.3,1)}
@keyframes postin{from{transform:translateX(1.2em);opacity:0;max-height:0}to{max-height:10em}}
.post .av{width:2.1em;height:2.1em}
.post .h{font-weight:800;font-size:.8em;color:var(--mute)}
.post p{font-size:.98em;line-height:1.32;font-weight:600}
.post .m{display:flex;gap:1em;color:var(--mute);font-size:.72em;font-weight:700;margin-top:.25em}
.post .m svg{width:1.1em;height:1.1em;vertical-align:-.2em;margin-right:.2em}
.post.bad p{color:#7f1d1d}
.post.good p{color:#14532d}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:.4em;padding:.6em .8em .4em;border-top:2px solid var(--line);background:#fbfaf6}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:9em;display:block;margin:0 auto}
.g-bg{fill:none;stroke:#ebe8de;stroke-width:12;stroke-linecap:round}
.g-arc{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.9,.3,1)}
.g-ndl{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.g-hub{fill:var(--ink)}
.gauge g{transform-box:view-box;transition:transform 1.3s cubic-bezier(.3,1.4,.5,1)}
.g-val{margin-top:-.2em}
.g-val b{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.6em;line-height:1}
.g-val span{display:block;font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.g-val i{font-style:normal;font-weight:800;font-size:.8em;margin-left:.3em}
.up{color:var(--green)} .dn{color:var(--coral)}
.fstat{display:flex;justify-content:space-between;align-items:center;padding:.6em 1em;border-top:2px solid var(--line);font-weight:700;font-size:.85em;color:var(--mute)}
.fstat b{font-family:"Bricolage Grotesque";font-size:1.5em;color:var(--ink)}
.drift{font-size:.75em;color:var(--coral);font-weight:800;text-align:center;padding:0 .8em .5em;background:#fbfaf6}
.top5{display:flex;gap:.5em;flex-wrap:wrap}
.top5 .bub{background:var(--card);border:2px solid var(--line);font-size:.85em}
.top5 .bub b{font-family:"Bricolage Grotesque";margin-left:.4em}
.top5 .rk{color:var(--mute);font-weight:800;margin-right:.1em}
.ctrl{display:flex;gap:.6em;justify-content:flex-end}

/* final */
.final{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2.4vw;min-height:0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:1.2em;box-shadow:var(--sh);padding:1.2em 1.4em;display:flex;flex-direction:column;min-height:0}
.panel h2{font-family:"Bricolage Grotesque";font-weight:800;font-size:2.2em;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.5em}
.panel h2 small{font-family:"Figtree";font-size:.36em;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
.podium{flex:1;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:.8em;margin-top:.6em;min-height:0}
.pod{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pod .av{width:2.8em;height:2.8em;font-size:1.1em;margin-bottom:.4em;animation:popin .6s both}
.pod .nm{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.5em;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{color:var(--mute);font-weight:700;font-size:.85em;margin:.2em 0 .5em}
.pod .ttl{color:var(--coral);font-weight:800;font-size:.75em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3em}
.pod .blk{width:100%;border-radius:.8em .8em 0 0;display:grid;place-items:start center;padding-top:.3em;font-family:"Bricolage Grotesque";font-weight:800;font-size:2.6em;color:#fff;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.9,.3,1) both}
.pod.p1 .blk{height:22vh;background:linear-gradient(180deg,#f59e0b,#d97706);animation-delay:.6s}
.pod.p2 .blk{height:15vh;background:linear-gradient(180deg,#94a3b8,#64748b);animation-delay:.3s}
.pod.p3 .blk{height:10vh;background:linear-gradient(180deg,#d6a07a,#a0683f)}
.pod.p1 .av,.pod.p1 .nm,.pod.p1 .pts,.pod.p1 .ttl{animation:popin .6s 1.3s both}
@keyframes grow{from{transform:scaleY(0)}}
.rest{display:flex;flex-wrap:wrap;gap:.45em;margin-top:.8em}
.rest .bub{background:var(--bg);font-size:.8em}
.srow{position:relative;border:2px solid var(--line);border-radius:.9em;padding:.75em 1em;margin-top:.8em;overflow:hidden}
.srow .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue-l);transition:width 1.4s cubic-bezier(.2,.9,.3,1)}
.srow.win{border-color:var(--green)} .srow.win .fill{background:var(--green-l)}
.srow .t{position:relative;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:1.15em}
.srow .t b{font-family:"Bricolage Grotesque";font-size:1.25em}
.srow .s{position:relative;color:var(--mute);font-weight:600;font-size:.8em;margin-top:.15em}
.win-b{background:var(--green);color:#fff;font-size:.6em;padding:.2em .55em;border-radius:.35em;margin-left:.5em;letter-spacing:.1em;vertical-align:middle}
.lesson{display:flex;justify-content:center;gap:1.2em;align-items:center;background:var(--ink);color:#fff;border-radius:1em;padding:.9em 1.2em;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.6em;letter-spacing:-.01em}
.lesson span{animation:fadeUp .6s both}
@keyframes fadeUp{from{transform:translateY(1em);opacity:0}to{transform:none;opacity:1}}
.lesson span:nth-child(1){animation-delay:1.8s}.lesson span:nth-child(3){animation-delay:2.3s}.lesson span:nth-child(5){animation-delay:2.8s}
.lesson .dot{width:.35em;height:.35em;border-radius:50%;background:var(--coral);opacity:1;animation:none}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-4vh;width:.9vw;height:1.6vw;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:40;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.85}to{opacity:0}}

/* ============ PLAYER ============ */
.play{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px 28px;display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto}
.ptop{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:var(--mute)}
.ptop .mark{font-size:22px;color:var(--ink)}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.pbig{font-family:"Bricolage Grotesque";font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em}
.pmute{color:var(--mute);font-size:15px;line-height:1.5;font-weight:500}
.fld{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin:16px 0 6px}
.inp{width:100%;border:2px solid var(--line2);border-radius:14px;padding:14px;font-size:20px;font-weight:700;background:#fff;color:var(--ink);outline:none;font-family:inherit}
.inp:focus{border-color:var(--coral)}
.pbtn{width:100%;margin-top:18px;background:var(--coral);color:#fff;font-weight:800;font-size:18px;padding:16px;border-radius:14px;box-shadow:0 4px 0 #a52a18}
.pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #a52a18}
.pbtn:disabled{opacity:.5}
.err{color:var(--coral);font-weight:700;font-size:14px;min-height:20px;margin-top:8px}
.palert{background:var(--card);border:2px solid var(--coral);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px;line-height:1.4}

function scoreFor(S, round, ans, qStartMs){
  const o = S.rounds[round].opts.find(x => x.k === ans.opt); if (!o) return 0;
  const at = toMs(ans.at); const el = (at != null && qStartMs != null) ? at - qStartMs : 0;
  if (el > T + 2500) return 0;
  return Math.round(o.base * (0.6 + 0.4 * clamp(1 - el / T, 0, 1)));
}

const Sound = {
  ctx:null, out:null, on:true,

  tone(f, dur, type="sine", vol=.25, when=0, to=null){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .05);
  },
  noise(dur, vol=.2, freq=1200, when=0, q=.8, toFreq=null){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, len = Math.floor(this.ctx.sampleRate * dur);

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur*.3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.out); src.start(t); src.stop(t + dur);
  },

  post(){ this.tone(1180,.05,"sine",.07); this.tone(1580,.07,"sine",.05,.04); },
  join(){ this.tone(520,.1,"triangle",.14); this.tone(780,.14,"triangle",.12,.07); },
  alert(){ for (let i=0;i<3;i++){ this.tone(880,.13,"square",.08,i*.26); this.tone(660,.13,"square",.07,i*.26+.13); } this.noise(.6,.12,600,0,.7,2400); },
  beat(fast){ this.tone(fast?70:58,.22,"sine",.5,0,38); this.tone(fast?70:58,.18,"sine",.32,.16,38); },
  tick(){ this.tone(1500,.05,"square",.08); },
  whoosh(){ this.noise(.55,.22,300,0,.6,3200); },
  reveal(){ this.whoosh(); [523,659,784,1047].forEach((f,i) => this.tone(f,.45,"triangle",.16,.25+i*.09)); },
  final(){
    [[523,659,784],[587,740,880],[659,831,988,1319]].forEach((ch,i) => ch.forEach(f => this.tone(f,.9,"triangle",.11,i*.35)));
    for (let i=0;i<40;i++) this.noise(.09,.05+Math.random()*.06,1800+Math.random()*1800,1.1+Math.random()*2.6,1.2);
  }
};

function confetti(){

  const cols = ["#e5402a","#2453d6","#f59e0b","#15803d","#db2777","#0891b2"];

/* =========================================================
   HOST — big screen (projector)
   ========================================================= */
async function host(){
  await initFB();
  const code = Array.from({length:4}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");
  const room = {state:"lobby", round:0, scenario:"bank", qStarts:{}, meters:{trust:50, rumour:50}, results:{}};
  let players = {}, localQStart = 0, revealing = false, shown = {trust:50, rumour:50};
  let nextPostAt = 0, stormIdx = 0, lastSec = null, reactTimers = [];
  const S = () => SCEN[room.scenario];
  async function push(patch){ Object.assign(room, patch); if (!DEMO) await fb.update(R_(code), patch); }
  if (!DEMO){
    await fb.set(R_(code), {state:"lobby", round:0, scenario:"bank", createdAt: now()});
    fb.onValue(R_(code + "/players"), s => {
      const p = s.val() || {};
      const added = Object.keys(p).filter(k => !players[k]); players = p; onPlayers(added);
    });
  }

  /* ---- demo class ---- */
  const BOTN = ["Aisha","Khalid","Maryam","Saif","Fatma","Hamed","Noor","Yousuf","Salma","Ahmed","Reem","Majid","Huda","Talal","Muna","Omar","Shamsa","Badr","Laila","Nasser","Asma","Hilal","Zainab","Rashid","Buthaina","Faisal","Amal","Sultan"];
  function demoJoin(){
    let i = 0;
    const iv = setInterval(() => {
      if (i >= DEMO_PLAYERS || room.state !== "lobby"){ clearInterval(iv); return; }
      const id = "bot"+i; players[id] = {name: BOTN[i % BOTN.length], answers:{}}; i++; onPlayers([id]);
    }, 420);
  }
  function demoAnswer(r){
    const opts = S().rounds[r].opts;
    Object.keys(players).forEach(pid => setTimeout(() => {
      if (room.state !== "question" || room.round !== r) return;
      const x = Math.random(), ap = x < .48 ? "OPEN" : x < .7 ? "WAIT" : x < .87 ? "PROMISE" : "DEFLECT";
      const pool = opts.filter(o => o.ap === ap); const o = (pool.length ? pool : opts)[Math.floor(Math.random()*(pool.length || opts.length))];
      players[pid].answers[r] = {opt:o.k, at:Date.now()};
    }, 2500 + Math.random() * (T - 7000)));
  }

  /* ---- maths ---- */
  const qStartMs = r => toMs(room.qStarts?.[r]);
  function compute(upTo){
    const rows = Object.entries(players).map(([pid,p]) => {
      let score = 0, last = null; const aps = [];
      for (let r = 0; r <= upTo; r++){
        const a = p.answers?.[r]; if (!a) continue;
        const pts = scoreFor(S(), r, a, qStartMs(r)); score += pts;
        const o = S().rounds[r].opts.find(x => x.k === a.opt); if (o) aps.push(o.ap);
        if (r === upTo) last = {opt:a.opt, pts, best: o?.ap === "OPEN"};
      }
      return {pid, name:p.name || "Player", score, last, aps};
    });
    rows.sort((a,b) => b.score - a.score || a.name.localeCompare(b.name));
    rows.forEach((x,i) => x.rank = i + 1);
    return rows;
  }
  function votes(r){
    const c = {A:0,B:0,C:0,D:0}; let n = 0;
    Object.values(players).forEach(p => { const a = p.answers?.[r]; if (a && c[a.opt] != null){ c[a.opt]++; n++; } });
    return {c, n};
  }
  const answeredCount = r => Object.values(players).filter(p => p.answers?.[r]).length;
  function dominant(aps){
    const c = {}; aps.forEach(t => c[t] = (c[t]||0) + 1);
    return Object.keys(c).sort((a,b) => c[b] - c[a] || (a==="OPEN"?-1:b==="OPEN"?1:0))[0] || "OPEN";
  }

  /* ---- shell ---- */
  function shell(inner){
    app.innerHTML = `<div class="host">
      <div class="top">
        <div class="mark"><span class="h">#</span>TRENDING<small>The Crisis Feed</small></div>
        <div class="chips">
          ${DEMO ? `<span class="chip demo">Demo mode · simulated class</span>` : ""}
          ${room.state !== "lobby" ? `<span class="chip">${svgI(ICONS[S().icon])}${esc(S().company)}</span>` : ""}
          <span class="chip">Room <b>${code}</b></span>
          <span class="chip">${svgI('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6"/>')}<b id="crewN">${Object.keys(players).length}</b></span>
          <button class="chip snd ${Sound.on?"":"off"}" id="snd" title="Sound (M)">${svgI(ICONS.sound)}</button>
        </div>
      </div>
      ${inner}
      <div class="foot"><span>Fictional companies · Crisis simulation · MBA Communicating &amp; Negotiating · UTAS-Ibra</span><span>Next: Space / → / clicker · Sound: M</span></div>
    </div>`;
    $("#snd").onclick = toggleSound;
  }
  function toggleSound(){ Sound.on = !Sound.on; const b = $("#snd"); if (b) b.classList.toggle("off", !Sound.on); }

  /* ---- lobby ---- */
  function lobby(){
    const url = location.origin + location.pathname + "?room=" + code;
    shell(`<div class="lobby">
      <div class="lb-l">
        <span class="eyebrow"><span class="live"></span> Live crisis simulation</span>
        <h1>Your company is <span class="hl">trending.<svg viewBox="0 0 300 20" preserveAspectRatio="none"><path d="M4 14 C 80 4, 160 4, 296 10"/></svg></span><span class="soft">Not in a good way.</span></h1>
        <p class="lead">You are the <b>crisis team</b>. Make <b>3 decisions</b>, with <b>30 seconds</b> for each. Every choice changes public trust. Be right, and be fast.</p>
        <div class="picker">${Object.values(SCEN).map((s,i) => `
          <button class="scen ${room.scenario===s.id?"on":""}" data-s="${s.id}">
            <span class="ic" style="background:${s.tint};color:${s.ink}">${svgI(ICONS[s.icon])}</span>
            <span><h3>${esc(s.name)}</h3><p>${esc(s.company)} · ${esc(s.tagline)}</p><span class="key">PRESS ${i+1}</span></span>
          </button>`).join("")}</div>
      </div>
      <div class="lb-r">
        <div class="join">
          <div id="qr"></div>
          <div><div class="lbl">Scan or open the link, then enter</div>
            <div class="code">${[...code].map(c => `<span>${c}</span>`).join("")}</div>
            <div class="url">${esc(url)}</div></div>
        </div>
        <div class="crowd">
          <div class="crowd-h"><span><b id="bigN">${Object.keys(players).length}</b> &nbsp;in the crisis room</span><span>waiting…</span></div>
          <div class="bubbles" id="bubs">${Object.keys(players).length ? "" : `<div class="empty">Scan the code to join the team</div>`}</div>
        </div>
        <div class="lb-go"><button class="btn coral" id="go">Start the crisis ${svgI('<path d="M5 12h14M13 6l6 6-6 6"/>')}</button></div>
      </div>
    </div>`);
    try { new QRCode($("#qr"), {text:url, width:240, height:240, colorDark:"#0f172a", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M}); } catch(e){}
    document.querySelectorAll(".scen").forEach(b => b.onclick = () => pick(b.dataset.s));
    $("#go").onclick = next;
    Object.entries(players).forEach(([id,p]) => addBubble(p.name, false));
  }
  function pick(id){
    if (room.state !== "lobby" || !SCEN[id]) return;
    push({scenario:id}); Sound.pop();
    document.querySelectorAll(".scen").forEach(b => b.classList.toggle("on", b.dataset.s === id));
  }
  function addBubble(name, sound=true){
    const el = $("#bubs"); if (!el) return;
    const e = el.querySelector(".empty"); if (e) e.remove();
    el.insertAdjacentHTML("beforeend", `<span class="bub">${avatar(name)}${esc(name)}</span>`);
    if (sound) Sound.join();
  }
  function onPlayers(added){
    const n = Object.keys(players).length;
    const c = $("#crewN"); if (c) c.textContent = n;
    const b = $("#bigN"); if (b) b.textContent = n;
    if (room.state === "lobby") added.forEach(id => addBubble(players[id]?.name || "Player"));
  }

  /* ---- feed ---- */
  function addPost(str, mood){
    const box = $("#posts"); if (!box) return;
    let [h, text] = str.split("|"); if (text === undefined){ text = h; h = "user"; }
    const likes = 20 + (hash(text) % 900), shares = 3 + (hash(h) % 300);
    box.insertAdjacentHTML("afterbegin", `<div class="post ${mood||""}">${avatar(h)}<div><div class="h">@${esc(h)}</div><p>${esc(text)}</p>
      <div class="m"><span>${svgI(ICONS.heart)}${likes}</span><span>${svgI(ICONS.share)}${shares}</span></div></div></div>`);
    while (box.children.length > 7) box.lastElementChild.remove();
    Sound.post();
  }
  const HANDLES = ["om_voice","gulf_watch","citizen_88","daily_take","muscat_now","fatma_r","ibra_life","just_asking"];

  /* ---- question ---- */
  function optHTML(o){
    const R = ROLES[o.role];
    return `<div class="opt" data-k="${o.k}" style="--rc:${R.color}">
      <div class="ohead"><span class="olet">${o.k}</span><span class="role">${svgI(R.icon)}${esc(R.name)}</span></div>
      <p class="say">${esc(o.t)}</p><span class="pct"></span><span class="vote"><i></i></span>${stampSVG}</div>`;
  }
  function questionView(){
    const R = S().rounds[room.round];
    shell(`<div class="stage">
      <div class="main">
        <div class="alertc"><span class="bell">${svgI(ICONS.bell)}</span><div><div class="clk">Round ${room.round+1} of 3 · ${esc(R.clock)}</div><p>${esc(R.inject)}</p></div></div>
        <div class="qrow"><h2 class="q">${esc(R.q)}</h2>${timerHTML()}</div>
        <div class="opts">${R.opts.map(optHTML).join("")}</div>
      </div>
      <aside class="feed">
        <div class="feed-h"><span class="live"></span> Live feed <span class="tag">${esc(S().tag)}</span></div>
        <div class="posts" id="posts"></div>
        <div class="gauges">${gaugeHTML("gt","Public trust","#15803d",shown.trust)}${gaugeHTML("gr","Rumours","#e5402a",shown.rumour)}</div>
        <div class="drift">While you wait, rumours grow…</div>
        <div class="fstat"><span>Decisions in</span><span><b id="ans">0</b> / <span id="tot">${Object.keys(players).length}</span></span></div>
      </aside>
    </div>`);
  }

  /* ---- reveal ---- */
  function revealView(dt, dr){
    const r = room.round, R = S().rounds[r], {c, n} = votes(r);
    const best = R.opts.find(o => o.ap === "OPEN");
    const top = n ? R.opts.reduce((a,b) => c[b.k] > c[a.k] ? b : a) : R.opts.find(o => o.ap === "WAIT") || R.opts[0];
    const good = top.ap === "OPEN";
    const ranks = compute(r).slice(0,5);
    shell(`<div class="stage">
      <div class="main">
        <div class="qrow"><h2 class="q" style="font-size:2.1em">${esc(R.q)}</h2></div>
        <div class="opts revealed">${R.opts.map(o => optHTML(o).replace('class="opt"', `class="opt${o.k===best.k?" best":""}"`)).join("")}</div>
        <div class="note"><span class="bulb">${svgI(ICONS.bulb)}</span><div><p>${esc(R.fact)}</p><small>${esc(R.src)}</small></div></div>
        <div class="top5">${ranks.map(x => `<span class="bub">${avatar(x.name)}<span class="rk">${x.rank}</span>${esc(x.name)}<b>${x.score}</b></span>`).join("")}</div>
      </div>
      <aside class="feed">
        <div class="feed-h"><span class="live"></span> ${n ? `The class chose ${top.k}` : "Nobody decided"} <span class="tag ${good?"good":""}">${esc(good ? S().goodTag : S().tag)}</span></div>
        <div class="posts" id="posts"></div>
        <div class="gauges">${gaugeHTML("gt","Public trust","#15803d",shown.trust)}${gaugeHTML("gr","Rumours","#e5402a",shown.rumour)}</div>
        <div class="ctrl" style="padding:.7em .8em"><button class="btn" id="nx">${r < 2 ? "Next round" : "Final results"} ${svgI('<path d="M5 12h14M13 6l6 6-6 6"/>')}</button></div>
      </aside>
    </div>`);
    $("#nx").onclick = next;
    document.querySelectorAll(".opt").forEach(el => {
      const k = el.dataset.k, p = n ? Math.round(c[k] / n * 100) : 0;
      el.querySelector(".pct").textContent = p + "%";
      setTimeout(() => el.querySelector(".vote i").style.width = p + "%", 120);
    });
    setTimeout(() => { setGauge("gt", room.meters.trust, Math.round(dt)); setGauge("gr", room.meters.rumour, Math.round(dr)); shown = {...room.meters}; }, 500);
    reactTimers.forEach(clearTimeout); reactTimers = [];
    top.react.forEach((s,i) => reactTimers.push(setTimeout(() => { const [m, t] = s.split("|"); addPost(HANDLES[(i + r*3) % HANDLES.length] + "|" + t, m); }, 700 + i*1100)));
  }

  /* ---- final ---- */
  function finalView(){
    const rows = compute(2);
    const stats = Object.keys(APPROACH).map(ap => {
      let picks = 0, pts = 0;
      Object.values(players).forEach(p => S().rounds.forEach((R,r) => {
        const a = p.answers?.[r]; if (!a) return;
        const o = R.opts.find(x => x.k === a.opt);
        if (o?.ap === ap){ picks++; pts += scoreFor(S(), r, a, qStartMs(r)); }
      }));
      return {ap, picks, avg: picks ? Math.round(pts/picks) : 0};
    }).sort((a,b) => b.avg - a.avg);
    const total = stats.reduce((s,x) => s + x.picks, 0) || 1, maxAvg = Math.max(1, ...stats.map(s => s.avg));
    const win = stats[0];
    const pod = (x, cls, num) => x ? `<div class="pod ${cls}">${cls==="p1" ? `<div class="ttl">${esc(APPROACH[dominant(x.aps)].title)}</div>` : ""}${avatar(x.name)}<div class="nm">${esc(x.name)}</div><div class="pts">${x.score} pts</div><div class="blk">${num}</div></div>` : `<div class="pod ${cls}"></div>`;
    shell(`<div class="final">
      <div class="panel">
        <h2>Best leader <small>Most points · right and fast</small></h2>
        <div class="podium">${pod(rows[1],"p2",2)}${pod(rows[0],"p1",1)}${pod(rows[2],"p3",3)}</div>
        <div class="rest">${rows.slice(3,10).map(x => `<span class="bub">${avatar(x.name)}<span class="rk">${x.rank}</span>&nbsp;${esc(x.name)} · ${x.score}</span>`).join("")}</div>
      </div>
      <div class="panel">
        <h2>Best strategy <small>Average points per decision</small></h2>
        ${stats.map(s => `<div class="srow ${s.ap===win.ap && s.picks ? "win":""}"><span class="fill" data-w="${Math.round(s.avg/maxAvg*100)}"></span>
          <div class="t"><span>${esc(APPROACH[s.ap].name)}${s.ap===win.ap && s.picks ? `<span class="win-b">WINNER</span>`:""}</span><b>${s.avg}</b></div>
          <div class="s">${esc(APPROACH[s.ap].desc)} · chosen ${Math.round(s.picks/total*100)}% of the time</div></div>`).join("")}
        <div class="gauges" style="margin-top:auto;border:0;background:none">${gaugeHTML("gt","Final trust","#15803d",shown.trust)}${gaugeHTML("gr","Final rumours","#e5402a",shown.rumour)}</div>
      </div>
    </div>
    <div class="lesson"><span>Communicate early</span><i class="dot"></i><span>Share verified facts</span><i class="dot"></i><span>Update continuously</span></div>`);
    setTimeout(() => document.querySelectorAll(".srow .fill").forEach(b => b.style.width = b.dataset.w + "%"), 200);
    return rows;
  }

  /* ---- flow ---- */
  async function startQuestion(r){
    reactTimers.forEach(clearTimeout); reactTimers = [];
    revealing = false; localQStart = Date.now(); stormIdx = 0; nextPostAt = Date.now() + 900; lastSec = null;
    room.qStarts[r] = DEMO ? localQStart : now();
    await push({state:"question", round:r, qStarts: {...room.qStarts}});
    questionView(); Sound.alert();
    if (DEMO) demoAnswer(r);
  }
  async function reveal(){
    if (revealing) return; revealing = true;
    const r = room.round, R = S().rounds[r], {c, n} = votes(r);
    let dt = 0, dr = 0;
    if (n) R.opts.forEach(o => { dt += o.trust * c[o.k] / n; dr += o.rumour * c[o.k] / n; });
    else { const s = R.opts.find(o => o.ap === "WAIT") || R.opts[0]; dt = s.trust; dr = s.rumour; }
    const meters = {trust: clamp(room.meters.trust + dt, 0, 100), rumour: clamp(room.meters.rumour + dr, 0, 100)};
    room.meters = meters;
    const rows = compute(r), N = rows.length, results = {};
    rows.forEach(x => results[x.pid] = {score:x.score, rank:x.rank, of:N, pts:x.last?.pts || 0, opt:x.last?.opt || null, best:!!x.last?.best});
    await push({state:"reveal", meters, results, bestOpt: R.opts.find(o => o.ap === "OPEN").k});
    flash(); revealView(dt, dr); Sound.reveal();
  }
  async function finish(){
    const rows = finalView(), N = rows.length, results = {};
    rows.forEach(x => { const ap = dominant(x.aps); results[x.pid] = {score:x.score, rank:x.rank, of:N, title:APPROACH[ap].title, strat:APPROACH[ap].name}; });
    Sound.final(); confetti();
    await push({state:"final", results});
  }
  function next(){
    if (room.state === "lobby"){ shown = {trust:50, rumour:50}; room.meters = {trust:50, rumour:50}; return startQuestion(0); }
    if (room.state === "question") return reveal();
    if (room.state === "reveal") return room.round < 2 ? startQuestion(room.round + 1) : finish();
  }
  document.addEventListener("keydown", e => {
    if ([" ","Enter","ArrowRight","PageDown"].includes(e.key)){ e.preventDefault(); next(); }
    else if (e.key === "m" || e.key === "M") toggleSound();
    else if (room.state === "lobby" && (e.key === "1" || e.key === "2")) pick(Object.keys(SCEN)[+e.key - 1]);
  });

  /* ---- ticker ---- */
  setInterval(() => {
    if (room.state !== "question") return;
    const now = Date.now(), el = now - localQStart, left = Math.max(0, T - el), frac = clamp(el / T, 0, 1), s = Math.ceil(left / 1000);
    const tr = $("#tring"); if (tr) tr.style.strokeDashoffset = 100 * frac;
    const ts = $("#tsec"); if (ts) ts.textContent = s;
    const tm = $("#timer"); if (tm) tm.classList.toggle("low", s <= 5);
    if (s !== lastSec && left > 0){
      lastSec = s;
      if (s <= 5) Sound.tick(); else if (s % 2 === 0 || s <= 10) Sound.beat(s <= 10);
      setGauge("gr", clamp(shown.rumour + 12*frac, 0, 100));
    }
    if (now >= nextPostAt && left > 0){
      const st = S().rounds[room.round].storm; addPost(st[stormIdx % st.length], "bad"); stormIdx++;
      nextPostAt = now + 3200 - 1800*frac;
    }
    const a = answeredCount(room.round), n = Object.keys(players).length;
    const ae = $("#ans"); if (ae) ae.textContent = a;
    const te = $("#tot"); if (te) te.textContent = n;
    if (!revealing && (left <= 0 || (n > 0 && a >= n && el > 4000))) setTimeout(reveal, 600);
  }, 100);

  lobby();
  if (DEMO) demoJoin();
}

/* =========================================================
   PLAYER — phone
   ========================================================= */
async function player(){
  if (DEMO){
    app.innerHTML = `<div class="play"><div class="ptop"><div class="mark"><span class="h">#</span>TRENDING</div><span>Setup</span></div>
      <div class="pcard"><div class="pbig" style="font-size:30px">Not connected yet</div>
      <p class="pmute" style="margin-top:10px">Students can join once the Firebase settings are added at the top of this file. You can preview the big screen now with a simulated class.</p>
      <button class="pbtn" id="demoGo">Open big-screen demo</button></div></div>`;
    $("#demoGo").onclick = () => host();
    return;
  }
  await initFB();
  let code = (params.get("room") || "").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
  let pid = null, name = "", room = null, me = null, seenQ = {}, sentFor = {}, tick = null, lastKey = "";
  const S = () => SCEN[room?.scenario] || SCEN.bank;
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

  function joinView(err){
    app.innerHTML = `<div class="play">
      <div class="ptop"><div class="mark"><span class="h">#</span>TRENDING</div><span>Crisis team</span></div>
      <div class="pcard">
        <div class="pbig">Join the<br>crisis team.</div>
        <p class="pmute" style="margin-top:8px">3 decisions. 30 seconds each. Be right and be fast.</p>
        <div class="fld">Room code</div><input class="inp" id="rc" maxlength="4" value="${esc(code)}" placeholder="ABCD" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em">
        <div class="fld">Your name</div><input class="inp" id="nm" maxlength="16" placeholder="e.g. Maryam" autocomplete="off">
        <div class="err" id="er">${esc(err||"")}</div>
        <button class="pbtn" id="jb">Join now</button>
      </div>
      <p class="pmute" style="text-align:center;font-size:12px">Fictional crisis simulation</p>
    </div>`;
    $("#jb").onclick = join;
    $("#nm").addEventListener("keydown", e => { if (e.key === "Enter") join(); });
  }
  async function join(){
    code = $("#rc").value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
    name = $("#nm").value.trim().slice(0,16);
    if (code.length !== 4) return joinView("Enter the 4-letter room code.");
    if (!name){ $("#er").textContent = "Enter your name."; return; }
    $("#jb").disabled = true;
    try {
      const rs = await fb.get(R_(code + "/state"));
      if (!rs.exists()) return joinView("Room not found. Check the code on the big screen.");
      const key = "tr_pid_" + code;
      try { pid = sessionStorage.getItem(key); } catch(e){}
      if (!pid){ pid = Math.random().toString(36).slice(2,10); try { sessionStorage.setItem(key, pid); } catch(e){} }
      await fb.update(R_(code + "/players/" + pid), {name, joinedAt: now()});
      fb.onValue(R_(code), s => { room = s.val(); if (!room) return; me = room.players?.[pid] || {}; render(); });
    } catch(e){ joinView("Connection problem. Please try again."); }
  }
  const head = right => `<div class="ptop"><span style="display:flex;align-items:center;gap:8px">${avatar(name)}<b style="color:var(--ink)">${esc(name)}</b></span><span>${right||""}</span></div>`;

  function render(){
    if (!room) return;
    const r = room.round, res = room.results?.[pid];
    const key = room.state + ":" + r + ":" + room.scenario + ":" + (res ? res.score : "");
    if (key === lastKey && room.state !== "question") return; lastKey = key;
    clearInterval(tick);
    if (room.state === "lobby"){
      const s = S();
      app.innerHTML = `<div class="play">${head("Room " + esc(code))}<div class="pcard" style="text-align:center">
        <svg class="wait-ill" viewBox="0 0 150 120"><rect x="45" y="6" width="60" height="108" rx="12" fill="#fff" stroke="#0f172a" stroke-width="4"/><rect x="66" y="12" width="18" height="4" rx="2" fill="#0f172a"/>
          <g class="n1"><rect x="18" y="28" width="70" height="18" rx="9" fill="#e5402a"/><circle cx="29" cy="37" r="5" fill="#fff"/></g>
          <g class="n2"><rect x="62" y="54" width="76" height="18" rx="9" fill="#2453d6"/><circle cx="73" cy="63" r="5" fill="#fff"/></g>
          <g class="n3"><rect x="24" y="80" width="64" height="18" rx="9" fill="#d97706"/><circle cx="35" cy="89" r="5" fill="#fff"/></g></svg>
        <div class="pbig" style="font-size:32px">You're in!</div>
        <p class="pmute" style="margin-top:8px">Today's crisis:</p>
        <span class="badge">${esc(s.company)} · ${esc(s.name)}</span>
        <p class="pmute" style="margin-top:12px">Watch the big screen. The crisis starts soon.</p></div></div>`;
      return;
    }
    if (room.state === "question"){
      const R = S().rounds[r];
      if (!seenQ[r]){ seenQ[r] = Date.now(); buzz(120); }
      if (sentFor[r] || me?.answers?.[r]){
        const k = sentFor[r] || me.answers[r].opt;
        if (lastKey === key + ":lock") return; lastKey = key + ":lock";
        app.innerHTML = `<div class="play">${head("Round " + (r+1) + " of 3")}<div class="pcard lockc">
          <svg viewBox="0 0 120 120"><circle class="lk-ring" cx="60" cy="60" r="50" pathLength="300"/><text class="lk-l" x="60" y="76" text-anchor="middle">${esc(k)}</text></svg>
          <div class="pbig" style="font-size:30px;margin-top:10px">Decision locked</div>
          <p class="pmute" style="margin-top:6px">Watch the screen to see how the public reacts.</p></div></div>`;
        return;
      }
      if (lastKey === key + ":q") return; lastKey = key + ":q";
      app.innerHTML = `<div class="play">${head("Round " + (r+1) + " of 3")}
        <div class="pclock"><span class="badge">${esc(R.clock)}</span><span class="s" id="ps">${ROUND_SECONDS}</span></div>
        <div class="palert"><b>ALERT</b>${esc(R.inject)}</div>
        <div class="pq">${esc(R.q)}</div>
        <div class="popts">${R.opts.map(o => { const RL = ROLES[o.role]; return `<button class="popt" data-k="${o.k}" style="--rc:${RL.color}"><span class="olet">${o.k}</span><span><span class="role">${svgI(RL.icon)}${esc(RL.name)}</span><p>${esc(o.t)}</p></span></button>`; }).join("")}</div></div>`;
      document.querySelectorAll(".popt").forEach(b => b.onclick = () => answer(r, b.dataset.k));
      const upd = () => { const s = Math.max(0, Math.ceil((T - (Date.now() - seenQ[r])) / 1000)); const el = $("#ps"); if (el){ el.textContent = s; el.classList.toggle("low", s <= 5); } };
      upd(); tick = setInterval(upd, 250);
      return;
    }
    if (room.state === "reveal"){
      const best = room.bestOpt, ok = res?.best, none = !res?.opt;
      buzz(ok ? [60,60,60] : 200);
      app.innerHTML = `<div class="play">${head("Round " + (r+1) + " of 3")}<div class="pcard res">
        <span class="badge">Best answer: ${esc(best||"")}</span>
        <div class="pbig ${ok?"ok":"no"}" style="margin-top:14px">${none ? "No decision." : ok ? "Strong call!" : "The public noticed."}</div>
        <p class="pmute" style="margin-top:8px">${none ? "Silence is also a message." : ok ? "Facts, honesty and a next step. Trust goes up." : `You chose ${esc(res.opt)}. The best move was ${esc(best)}.`}</p>
        <div class="stats"><div class="stat"><b>+${res?.pts||0}</b><span>Round</span></div><div class="stat"><b>${res?.score||0}</b><span>Total</span></div><div class="stat"><b>${res ? "#" + res.rank : "–"}</b><span>of ${res?.of||"–"}</span></div></div>
      </div></div>`;
      return;
    }
    if (room.state === "final"){
      buzz([80,60,80,60,200]);
      app.innerHTML = `<div class="play">${head("Final")}<div class="pcard res">
        <div class="fld" style="margin-top:0">Your leadership style</div>
        <div class="pbig" style="color:var(--coral)">${esc(res?.title || "Team member")}</div>
        <p class="pmute" style="margin-top:6px">${esc(res?.strat || "")}</p>
        <div class="stats"><div class="stat"><b>${res?.score||0}</b><span>Points</span></div><div class="stat"><b>#${res?.rank||"–"}</b><span>Rank</span></div><div class="stat"><b>${res?.of||"–"}</b><span>Players</span></div></div>
        <p style="margin-top:18px;font-weight:800">Communicate early · Share verified facts · Update continuously</p>
      </div></div>`;
    }
  }
  async function answer(r, k){
    if (sentFor[r] || room.state !== "question" || room.round !== r) return;
    sentFor[r] = k; buzz(40); render();
    try { await fb.set(R_(code + "/players/" + pid + "/answers/" + r), {opt:k, at: now()}); }
    catch(e){ delete sentFor[r]; lastKey = ""; render(); }
  }
  joinView();
}

(IS_HOST ? host : player)().catch(e => { app.innerHTML = `<div class="play"><div class="pcard"><div class="pbig" style="font-size:26px">Could not start</div><p class="pmute" style="margin-top:8px">${esc(e.message)}</p></div></div>`; console.error(e); });
</script>
</body>
</html>
