<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Voice — AMS Live Poll</title>
<meta name="theme-color" content="#c8102e">
<style>
:root{--red:#c8102e;--red2:#8e0a20;--redbg:#fdf0f2;--ink:#16181d;--ink2:#4b5160;--ink3:#8a90a0;--line:#e6e8ee;--bg:#f6f7fa;--sf:#fff;--ok:#15803d;
  --font:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body.v-screen #app{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.card{background:var(--sf);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(22,24,29,.07)}
.status{display:inline-flex;align-items:center;gap:.5em;font-weight:800;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;padding:.45em .9em;border-radius:99px;background:#e9f7ef;color:#0a7a4e}
.status i{width:.6em;height:.6em;border-radius:50%;background:#12a36b;animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(18,163,107,.5)}80%,100%{box-shadow:0 0 0 .55em rgba(18,163,107,0)}}
.status.demo{background:#fff4e0;color:#9a5b00}.status.demo i{background:#f59e0b}

/* ============ BIG SCREEN ============ */
body.v-screen{font-size:clamp(10px,.62vw + .3vh,26px);height:100vh;overflow:hidden;padding:1em 1.2em}
.scr{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.9em;height:100%}
.s-head{display:flex;align-items:center;gap:1.3em}
.logo{background:#fff;border-radius:16px;padding:.55em .9em;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.logo img{height:3.6em;display:block}
.ttl{min-width:0}
.ttl small{display:block;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-size:.82em}
.ttl b{display:block;font-size:2.05em;line-height:1.08;letter-spacing:-.02em;font-weight:850}
.ttl b em{font-style:normal;color:var(--red)}
.s-head .mid{margin-left:auto;display:flex;align-items:center;gap:1.2em}
.bigc{text-align:right}.bigc b{display:block;font-size:2.6em;line-height:1;font-weight:900;letter-spacing:-.03em}
.bigc span{font-size:.78em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.scan{display:flex;align-items:center;gap:1em;background:var(--red);color:#fff;border-radius:22px;padding:.6em .6em .6em 1.2em;position:relative;overflow:hidden}
.scan::before{content:"";position:absolute;left:-2em;bottom:-2.5em;width:6em;height:6em;border-radius:50%;background:#fff;opacity:.12}
.scan b{display:block;font-size:1.3em;line-height:1.1;position:relative}.scan span{font-size:.9em;opacity:.9;position:relative}
.qr{width:7.2em;height:7.2em;background:#fff;border-radius:12px;padding:.4em;display:grid;place-items:center;flex:none;position:relative}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.s-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1em;min-height:0}
.panel{padding:1em 1.2em;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel h2{margin:0 0 .5em;font-size:1.2em;display:flex;align-items:center;gap:.5em}
.panel h2 small{font-weight:600;font-size:.68em;color:var(--ink3);margin-left:auto}
.map{flex:1;min-height:0;position:relative}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.links line{stroke:#e7c3ca;stroke-width:2;stroke-dasharray:2 10;stroke-linecap:round;animation:flow 5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-120}}
.flt{animation:bob 5.5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.ring{fill:none;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
.ring.go{animation:ring 1.3s ease-out}
@keyframes ring{0%{opacity:.85;stroke-width:8;transform:scale(1)}100%{opacity:0;stroke-width:1;transform:scale(1.7)}}
.core circle{animation:corep 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes corep{50%{transform:scale(1.05)}}
.side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:1em;min-height:0}
.prof{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em}
.pf{background:var(--bg);border-radius:14px;padding:.6em .7em;min-width:0}
.pf .h{display:flex;align-items:center;gap:.4em;font-weight:800;font-size:.9em}
.pf .h i{font-style:normal;font-size:1.3em}
.pf .n{font-size:1.9em;font-weight:900;line-height:1.1}
.pf .t{font-size:.78em;color:var(--ink2);line-height:1.25;min-height:2.5em}
.pf .t b{color:var(--red)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em;overflow:hidden}
.feed li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:.7em;align-items:center}
.feed li.in{animation:feedin .6s cubic-bezier(.2,.9,.2,1)}
@keyframes feedin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.av{width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9em;color:#fff}
.feed .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .t span{color:var(--ink3);font-size:.82em}
.chip{display:inline-flex;align-items:center;gap:.35em;font-weight:700;font-size:.8em;padding:.3em .7em;border-radius:99px;color:#fff;white-space:nowrap;max-width:14em;overflow:hidden;text-overflow:ellipsis}
.tape{overflow:hidden;background:var(--ink);color:#fff;border-radius:14px;white-space:nowrap}
.tape-in{display:inline-flex;gap:3em;padding:.7em 1.2em;animation:tape 70s linear infinite}
.tape-in span{font-weight:600}.tape-in em{font-style:normal;color:#ff8597;font-weight:800;margin-right:.5em;letter-spacing:.06em;font-size:.85em}
@keyframes tape{to{transform:translateX(-50%)}}
.rst{position:fixed;right:.8em;bottom:.8em;opacity:.25;border:0;background:#fff;border-radius:10px;padding:.4em .7em;font-size:.8em;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:5}
.rst:hover{opacity:1}
.cfm{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:9}
.cfm div{background:#fff;border-radius:18px;padding:1.4em;max-width:26em;text-align:center;font-size:1.2em}
.cfm button{margin:.8em .3em 0;border:0;border-radius:12px;padding:.7em 1.2em;font-weight:800}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink2);pointer-events:none}
.empty b{display:block;font-size:1.6em;color:var(--ink)}

/* ============ PHONE ============ */
body.v-vote{padding:0 16px 30px}
.app{max-width:460px;margin:0 auto;padding-top:14px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:.4em 0 1em}
.ph img{height:40px}
.hero{text-align:center;padding:.4em 0}
.hero h1{font-size:1.85em;line-height:1.1;letter-spacing:-.03em;margin:.3em 0}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--ink2);margin:0}
.form{padding:1.2em;display:flex;flex-direction:column;gap:1em;margin-top:1.1em}
.fld label{font-weight:700;font-size:.85em;color:var(--ink2);display:block;margin-bottom:.4em}
.fld input{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:.9em 1em;font-size:1.02em;width:100%}
.fld input:focus{border-color:var(--red);outline:none;background:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.55em}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:.8em .4em;font-weight:800;display:flex;align-items:center;justify-content:center;gap:.4em}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:14px;padding:1em 1.3em;font-weight:800;background:var(--red);color:#fff;width:100%;font-size:1.05em}
.btn:disabled{opacity:.35}
.err{color:var(--red);font-weight:600;font-size:.9em;min-height:1.2em;margin:-.3em 0}
.qc{padding:1.2em;margin-top:.6em;animation:qin .45s cubic-bezier(.2,.9,.2,1)}
@keyframes qin{from{opacity:0;transform:translateX(30px)}}
.qc h2{font-size:1.3em;line-height:1.25;margin:0 0 1em}
.opts{display:flex;flex-direction:column;gap:.6em}
.opts button{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:.9em 1em;font-weight:650;display:grid;grid-template-columns:2.2em 1fr;gap:.6em;align-items:center}
.opts button span:first-child{font-size:1.5em;text-align:center}
.opts button.sel{border-color:var(--red);background:var(--redbg)}
.done{text-align:center;padding:2em 1em}
.done .tick{width:96px;height:96px;margin:0 auto;border-radius:50%;background:var(--red);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.4,.3,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h1{font-size:1.8em;margin:.5em 0 .2em}
.same{margin-top:1.2em;padding:1em;display:flex;gap:.8em;align-items:center;text-align:left}
.same .pc{font-size:2em;font-weight:900;color:var(--red);flex:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (max-width:900px){body.v-screen{font-size:12px;height:auto;overflow:auto}.s-main{grid-template-columns:1fr}.map{min-height:26em}.s-head{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OK = Object.fromEntries(OPTS.map(o => [o.k, o]));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const initials = n => String(n || "?").replace(/^(Dr|Mr|Ms|Mrs)\.?\s*/i, "").split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase() || "?";
const ago = ts => { const s = Math.max(0, (Date.now() - ts) / 1000); return s < 10 ? "just now" : s < 60 ? Math.floor(s) + "s ago" : s < 3600 ? Math.floor(s / 60) + "m ago" : Math.floor(s / 3600) + "h ago"; };
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const params = new URLSearchParams(location.search), DEMO = params.has("demo");
const baseURL = () => location.origin + location.pathname;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }

/* ---------------- backends ---------------- */
function fbBackend(){
  firebase.initializeApp(CONFIG.firebase);
  const root = firebase.database().ref(CONFIG.root + "/v");
  return {live:true, subscribe(cb){ root.on("value", s => cb(s.val() || {})); },
    async vote(uid, rec){ await root.child(uid).set({...rec, ts: firebase.database.ServerValue.TIMESTAMP}); },
    async reset(){ await root.remove(); }};
}
function localBackend(){
  const KEY = "ams-poll-demo"; const load = () => { try { return JSON.parse(store.get(KEY)) || {}; } catch { return {}; } };
  let st = load(), subs = []; const emit = () => subs.forEach(f => f(JSON.parse(JSON.stringify(st))));
  addEventListener("storage", e => { if (e.key === KEY){ st = load(); emit(); } });
  const save = () => { store.set(KEY, JSON.stringify(st)); emit(); };
  return {live:false, subscribe(cb){ subs.push(cb); cb(JSON.parse(JSON.stringify(st))); },
    async vote(uid, rec){ st = load(); st[uid] = {...rec, ts: Date.now()}; save(); }, async reset(){ st = {}; save(); }};
}
function derive(v){
  const people = Object.entries(v || {}).map(([id, x]) => ({id, ...x})).filter(p => OK[p.choice]).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const all = Object.fromEntries(OPTS.map(o => [o.k, 0])); people.forEach(p => all[p.choice]++);
  const byRole = {}; Object.keys(ROLES).forEach(r => { const c = Object.fromEntries(OPTS.map(o => [o.k, 0])); const L = people.filter(p => p.role === r); L.forEach(p => c[p.choice]++); byRole[r] = {n: L.length, c}; });
  const top = people.length ? OPTS.map(o => o.k).sort((a, b) => all[b] - all[a])[0] : null;
  return {people, all, byRole, n: people.length, top};
}

/* ---------------- effects ---------------- */
let AC = null;
function unlockAudio(){ if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
function chime(){ if (!AC) return; const t0 = AC.currentTime; [660, 880, 1320].forEach((f, i) => { const o = AC.createOscillator(), v = AC.createGain(); o.frequency.value = f; v.gain.setValueAtTime(0, t0 + i*.08); v.gain.linearRampToValueAtTime(.1, t0 + i*.08 + .01); v.gain.exponentialRampToValueAtTime(.0001, t0 + i*.08 + .8); o.connect(v).connect(AC.destination); o.start(t0 + i*.08); o.stop(t0 + i*.08 + .9); }); }
function confetti(){
  if (reduce) return; const cv = $("#confetti"); cv.hidden = false; const ctx = cv.getContext("2d"), d = devicePixelRatio || 1; cv.width = innerWidth*d; cv.height = innerHeight*d;
  const P = Array.from({length:80}, () => ({x:innerWidth/2*d, y:200*d, vx:(Math.random()-.5)*14*d, vy:(-Math.random()*11-4)*d, r:Math.random()*6, s:(5+Math.random()*6)*d, c:OPTS[Math.floor(Math.random()*6)].color}));
  const end = Date.now() + 2400; (function f(){ ctx.clearRect(0,0,cv.width,cv.height); P.forEach(p => { p.vy += .45*d; p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }); if (Date.now() < end) requestAnimationFrame(f); else { ctx.clearRect(0,0,cv.width,cv.height); cv.hidden = true; } })();
}

          <g class="core"><circle cx="${CX}" cy="${CY}" r="54" fill="#16181d"/><text x="${CX}" y="${CY - 4}" text-anchor="middle" font-size="30">🩺</text><text x="${CX}" y="${CY + 26}" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">PRESCRIBER</text></g>
          ${OPTS.map((o, i) => { const [x, y] = POS[o.k]; return `<g class="flt" style="animation-delay:-${(i*1.1).toFixed(1)}s">
            <circle class="ring" id="rg-${o.k}" cx="${x}" cy="${y}" r="60" stroke="${o.color}"/>
            <circle id="b-${o.k}" cx="${x}" cy="${y}" r="38" fill="${o.color}"/>
            <g id="o-${o.k}"></g>
            <text id="ic-${o.k}" x="${x}" y="${y}" text-anchor="middle" font-size="26">${o.ic}</text>
            <text id="pc-${o.k}" x="${x}" y="${y}" text-anchor="middle" font-weight="900" font-size="20" fill="#fff"></text>
            <text id="l1-${o.k}" x="${x}" y="${y}" text-anchor="middle" font-weight="800" font-size="19" fill="#16181d">${esc(o.name)}</text>
            <text id="l2-${o.k}" x="${x}" y="${y}" text-anchor="middle" font-weight="600" font-size="15" fill="#6b7280"></text></g>`; }).join("")}

          <div class="empty" id="empty"><div><b>Scan the QR code to add your voice</b>Answers appear here instantly</div></div></div></section>
      <div class="side">
        <section class="card panel"><h2>By profession <small>most common answer</small></h2><div class="prof" id="prof"></div></section>
        <section class="card panel"><h2>Latest voices <small>live</small></h2><ul class="feed" id="feed"></ul></section>
      </div>
    </main>
    <div class="tape"><div class="tape-in" id="tape"></div></div>
  </div><button class="rst" id="rst">⟲ Reset</button>`;
  try { new QRCode($("#qr"), {text: voteURL, width: 256, height: 256, colorDark: "#16181d", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M}); }
  catch { $("#qr").innerHTML = `<span style="font-size:.5em;word-break:break-all">${esc(voteURL)}</span>`; }
  const tips = ["Most pressures are system pressures — the system can help", "Every voice is anonymous unless you add your name", "Doctors, nurses and pharmacists: one team", "Don't train the enemy", "Antibiotics… Wise Use… Better Outcomes"];
  const tp = tips.map(t => `<span><em>AMS</em>${t}</span>`).join(""); $("#tape").innerHTML = tp + tp + tp + tp;
  addEventListener("pointerdown", unlockAudio, {once: true});
  $("#rst").onclick = () => { const c = document.createElement("div"); c.className = "cfm"; c.innerHTML = `<div>Clear all answers and start the poll again?<br><button id="cy" style="background:#c8102e;color:#fff">Yes, reset</button><button id="cn">Cancel</button></div>`; document.body.appendChild(c);
    $("#cy").onclick = async () => { await be.reset(); c.remove(); }; $("#cn").onclick = () => c.remove(); };

  const NS = "http://www.w3.org/2000/svg", cur = {}, tgt = {}, cnt = {}, orbit = {}, arriving = new Set();
  OPTS.forEach(o => { cur[o.k] = tgt[o.k] = 38; cnt[o.k] = 0; orbit[o.k] = []; });
  let D = null, seen = null;
  function render(v){
    D = derive(v);
    $("#cnt").textContent = D.n; $("#empty").hidden = D.n > 0;
    const max = Math.max(1, ...OPTS.map(o => D.all[o.k]));
    OPTS.forEach(o => { const n = D.all[o.k]; cnt[o.k] = n; tgt[o.k] = D.n ? 30 + 40 * Math.sqrt(n / max) : 38;
      $("#b-" + o.k).setAttribute("fill-opacity", n || !D.n ? 1 : .3);
      $("#pc-" + o.k).textContent = n ? Math.round(n / D.n * 100) + "%" : "";
      $("#l2-" + o.k).textContent = `${n} ${n === 1 ? "voice" : "voices"}`;
      syncOrbit(o.k, D.people.filter(p => p.choice === o.k).slice(0, 12)); });
    if (seen) D.people.filter(p => !seen.has(p.id)).slice(0, 5).forEach(flyIn);
    renderProf(); renderFeed(seen);
    seen = new Set(D.people.map(p => p.id));
  }
  function syncOrbit(k, list){
    const g = $("#o-" + k), keep = new Set(list.map(p => p.id));
    orbit[k] = orbit[k].filter(o => { if (keep.has(o.id)) return true; o.el.remove(); return false; });
    const have = new Set(orbit[k].map(o => o.id));
    list.forEach(p => { if (have.has(p.id)) return; const el = document.createElementNS(NS, "g");
      el.innerHTML = `<circle r="11" fill="#fff" stroke="${OK[k].color}" stroke-width="2.5"/><text text-anchor="middle" dy="3.5" font-size="9" font-weight="800" fill="${(ROLES[p.role] || ROLES.oth).color}">${esc(initials(p.name))}</text>`;
      g.appendChild(el); orbit[k].push({id: p.id, el}); });
  }
  function flyIn(p){
    const k = p.choice, [ex, ey] = POS[k]; if (reduce){ kick(k); return; }
    arriving.add(p.id); const g = document.createElementNS(NS, "g"), R = ROLES[p.role] || ROLES.oth;
    g.innerHTML = `<circle r="17" fill="${OK[k].color}" stroke="#fff" stroke-width="3"/><text text-anchor="middle" dy="4" font-size="11" font-weight="800" fill="#fff">${esc(initials(p.name))}</text>
      <text text-anchor="middle" y="-26" font-size="15" font-weight="800" fill="#16181d" stroke="#fff" stroke-width="5" paint-order="stroke">${esc((p.name || "Anonymous").split(" ").slice(0, 2).join(" "))} · ${R.name}</text>`;
    $("#fly").appendChild(g);
    const sx = W + 30, sy = -30, cx = (sx + ex) / 2 + (Math.random() * 160 - 80), cy = Math.min(sy, ey) - 60, t0 = performance.now(), dur = 1700;
    (function step(now){ const u = Math.min(1, (now - t0) / dur), e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
      const x = (1-e)**2*sx + 2*(1-e)*e*cx + e*e*ex, y = (1-e)**2*sy + 2*(1-e)*e*cy + e*e*ey;
      g.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${(1.2 - .6*e).toFixed(3)})`); g.setAttribute("opacity", u > .9 ? (1-u)*10 : 1);
      if (u < 1) requestAnimationFrame(step); else { g.remove(); arriving.delete(p.id); kick(k); } })(t0);
  }
  function kick(k){ cur[k] += 14; const rg = $("#rg-" + k); rg.setAttribute("r", cur[k]); rg.classList.remove("go"); void rg.getBBox(); rg.classList.add("go"); chime(); }
  function renderProf(){
    $("#prof").innerHTML = Object.entries(ROLES).map(([r, R]) => { const x = D.byRole[r]; const top = x.n ? OPTS.slice().sort((a, b) => x.c[b.k] - x.c[a.k])[0] : null;
      return `<div class="pf"><div class="h"><i>${R.ic}</i>${R.pl}</div><div class="n">${x.n}</div><div class="t">${top ? `${top.ic} <b>${esc(top.name)}</b> · ${Math.round(x.c[top.k] / x.n * 100)}%` : "No answers yet"}</div></div>`; }).join("");
  }
  function renderFeed(prev){
    const L = D.people.slice(0, 6);
    $("#feed").innerHTML = L.length ? L.map(p => { const R = ROLES[p.role] || ROLES.oth, o = OK[p.choice];
      return `<li class="${prev && !prev.has(p.id) ? "in" : ""}"><span class="av" style="background:${R.color}">${esc(initials(p.name))}</span><div class="t"><b>${esc(p.name || "Anonymous")}</b><span>${R.name} · ${ago(p.ts || Date.now())}</span></div><span class="chip" style="background:${o.color}">${o.ic} ${esc(o.name)}</span></li>`; }).join("")
      : `<li style="display:block;color:var(--ink2)">New answers appear here the moment someone taps Send.</li>`;
  }
  (function loop(t){
    OPTS.forEach((o, idx) => { cur[o.k] += (tgt[o.k] - cur[o.k]) * .07; const r = cur[o.k], [x, y] = POS[o.k], n = cnt[o.k];
      $("#b-" + o.k).setAttribute("r", r.toFixed(2));
      $("#ic-" + o.k).setAttribute("y", (y + (n ? -r * .12 : 9)).toFixed(1)); $("#ic-" + o.k).setAttribute("font-size", (r * .62).toFixed(1));
      $("#pc-" + o.k).setAttribute("y", (y + r * .55).toFixed(1));
      $("#l1-" + o.k).setAttribute("y", (y + r + 38).toFixed(1)); $("#l2-" + o.k).setAttribute("y", (y + r + 58).toFixed(1));
      const list = orbit[o.k], m = list.length, R = r + 18, dir = idx % 2 ? -1 : 1;
      list.forEach((ob, i) => { if (arriving.has(ob.id)) { ob.el.setAttribute("opacity", 0); return; }
        const a = (i / Math.max(m, 1)) * Math.PI * 2 + (reduce ? 0 : t * .00022 * dir) - Math.PI / 2;
        ob.el.setAttribute("opacity", 1); ob.el.setAttribute("transform", `translate(${(x + Math.cos(a) * R).toFixed(1)},${(y + Math.sin(a) * R).toFixed(1)})`); }); });
    requestAnimationFrame(loop);
  })(performance.now());
  be.subscribe(render);
  setInterval(() => D && renderFeed(null), 20000);
  if (!be.live){ const N = ["Aisha Al Habsi","Dr. Khalid","Maryam","Saif Al Rawahi","Fatma","Hamed","Noor","Dr. Yousuf","Salma","Ahmed","Reem","Majid","Huda","Talal","Muna"]; let i = 0;
    setInterval(() => { if (i > 40) return; const rl = ["doc","nur","pha","oth"][Math.floor(Math.random() * 4)], ch = Math.random() < .35 ? "P" : OPTS[Math.floor(Math.random() * 6)].k;
      be.vote("demo" + (i++) + rid(), {name: Math.random() < .25 ? "" : N[i % N.length], role: rl, choice: ch}); }, 2200); }
}

/* =====================================================================
   PHONE  (#vote)
   ===================================================================== */
function Vote(be){
  document.body.classList.add("v-vote");
  let uid = store.get("amsp-uid"); if (!uid){ uid = "u" + rid(); store.set("amsp-uid", uid); }
  let D = null, me = null, name = "", role = null, choice = null, sending = false;
  $("#app").innerHTML = `<div class="app"><div class="ph"><img src="${LOGO}" alt="Ministry of Health"><span class="status ${be.live ? "" : "demo"}"><i></i>${be.live ? "Live" : "Demo"}</span></div><div id="body"></div></div>`;
  function draw(){
    const b = $("#body");
    if (me){
      const o = OK[me.choice], same = D ? D.all[me.choice] : 1, p = D && D.n ? Math.round(same / D.n * 100) : 100;
      b.innerHTML = `<div class="done"><div class="tick"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
        <h1>Thank you!</h1><p style="color:var(--ink2);margin:0">Look at the big screen — your answer just flew in.</p>
        <div class="card same"><span class="pc">${p}%</span><span>of the ${D ? D.n : 1} people in the room chose <b>${o.ic} ${esc(o.long)}</b>.</span></div></div>`;
      return;
    }
    if (!role){
      b.innerHTML = `<div class="hero"><h1>What makes it hardest to <em>avoid or stop</em> an antibiotic?</h1><p>One tap. Your answer appears on the big screen.</p></div>
        <form class="card form" id="jf" novalidate>
          <div class="fld"><label for="nm">Your name (optional)</label><input id="nm" maxlength="28" placeholder="Leave empty to stay anonymous" value="${esc(name)}" autocomplete="off"></div>
          <div class="fld"><label>I am a…</label><div class="seg">${Object.entries(ROLES).map(([k, R]) => `<button type="button" data-r="${k}" aria-pressed="false">${R.ic} ${R.name}</button>`).join("")}</div></div>
          <div class="err" id="je"></div><button class="btn" type="submit">Next ▶</button></form>`;
      let pick = null;
      b.querySelectorAll("[data-r]").forEach(x => x.onclick = () => { pick = x.dataset.r; b.querySelectorAll("[data-r]").forEach(y => y.setAttribute("aria-pressed", y === x)); });
      $("#jf").onsubmit = e => { e.preventDefault(); if (!pick) return $("#je").textContent = "Choose your profession."; name = $("#nm").value.trim(); role = pick; unlockAudio(); draw(); };
      return;
    }
    b.innerHTML = `<div class="card qc"><h2>What makes it hardest to avoid or stop an antibiotic?</h2><div class="opts">${OPTS.map(o => `<button data-k="${o.k}"><span>${o.ic}</span><span>${esc(o.long)}</span></button>`).join("")}</div>
      <div class="err" id="ve" style="margin-top:.8em"></div><button class="btn" id="send" disabled style="margin-top:.6em">Send ▶</button></div>`;
    b.querySelectorAll("[data-k]").forEach(x => x.onclick = () => { choice = x.dataset.k; b.querySelectorAll("[data-k]").forEach(y => y.classList.toggle("sel", y === x)); $("#send").disabled = false; try { navigator.vibrate && navigator.vibrate(15); } catch {} });
    $("#send").onclick = async () => { if (!choice || sending) return; sending = true; $("#send").disabled = true;
      try { await be.vote(uid, {name: name.slice(0, 28), role, choice}); setTimeout(confetti, 200); }
      catch { $("#ve").textContent = "Could not send. Check your internet and try again."; $("#send").disabled = false; }
      sending = false; };
  }
  be.subscribe(v => { D = derive(v); const was = !!me; me = D.people.find(p => p.id === uid) || null; if (!!me !== was || me) draw(); });
  draw();
}

/* keys pass through to the presentation when embedded */
if (window.parent !== window) addEventListener("keydown", e => { if (["ArrowRight","ArrowLeft","PageDown","PageUp"," ","Enter"].includes(e.key) && !/INPUT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); window.parent.postMessage({ams:"key", key:e.key}, "*"); } });
/* ---------------- boot ---------------- */
(async function boot(){
  let be = null;
  if (!DEMO && CONFIG.firebase && CONFIG.firebase.databaseURL){
    try { await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"); await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"); be = fbBackend(); }
    catch (e){ console.warn("Firebase failed, demo mode", e); }
  }
  if (!be) be = localBackend();
  const h = location.hash.replace("#", "");
  if (h === "vote") Vote(be); else Screen(be);
  addEventListener("hashchange", () => location.reload());
})();
</script>
