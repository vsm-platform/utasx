<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Your Voice — AMS Poll</title>
<style>
:root{--red:#c8102e;--ink:#16181d;--ink2:#3a3f48;--muted:#6b7280;--line:#e4e6ea;--soft:#f5f6f8;--redbg:#fdf0f2;--green:#15803d;--font:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#fff;color:var(--ink);min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:4px solid var(--red)}
.top img{height:48px}.top b{font-size:20px;color:var(--red)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--red);color:#fff;border:none;border-radius:14px;padding:16px 26px;font-size:20px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4}
/* voter */
.pw{max-width:560px;margin:0 auto;padding:20px}
.pw h1{font-size:26px;line-height:1.25;margin:10px 0 6px}
.pw p.s{color:var(--muted);font-size:16px;margin-bottom:16px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--soft);border:3px solid transparent;border-radius:16px;padding:16px;font-size:19px;font-weight:600;color:var(--ink2);margin-bottom:10px;transition:.2s}
.opt span{font-size:26px;flex:none}
.opt.sel{border-color:var(--red);background:var(--redbg);color:var(--ink)}
textarea{width:100%;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:14px;padding:14px;min-height:90px;margin:6px 0 14px}
textarea:focus{outline:none;border-color:var(--red)}
.thanks{text-align:center;padding:50px 10px}
.thanks div{font-size:70px}
/* results */
.rw{max-width:1500px;margin:0 auto;padding:26px 40px}
.rw h1{font-size:clamp(28px,3.6vw,52px);line-height:1.1;margin-bottom:6px}
.rw h1 em{font-style:normal;color:var(--red)}
.meta{display:flex;justify-content:space-between;align-items:center;margin:10px 0 24px;color:var(--muted);font-size:22px}
.meta b{color:var(--red);font-size:34px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:34px}
.bars{display:flex;flex-direction:column;gap:14px}
.br{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}
.br .ic{font-size:36px;text-align:center}
.br .lb{font-size:22px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;color:var(--ink2)}
.br .lb b{color:var(--ink)}
.br .trk{height:34px;background:var(--soft);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.br .trk div{height:100%;width:0;background:#e8899a;border-radius:10px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.br.top1 .trk div{background:var(--red)}
.cm{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:20px;max-height:560px;overflow:hidden}
.cm h3{font-size:22px;color:var(--muted);margin-bottom:12px}
.cm .c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:20px;margin-bottom:10px;animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.setup{max-width:760px;margin:40px auto;line-height:1.6;font-size:18px;padding:0 20px}
.setup pre{background:#111;color:#eee;padding:14px;border-radius:10px;overflow:auto;font-size:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>

  vRef.on('value',s=>{
    const n=OPTIONS.map(()=>0),cm=[];let tot=0;
    s.forEach(d=>{const v=d.val();tot++;if(v.choice>=0&&v.choice<n.length)n[v.choice]++;if(v.text)cm.push({t:v.text,at:v.at||0});});
    const mx=Math.max(1,...n);$('total').textContent=tot;
    OPTIONS.forEach((_,i)=>{const el=$('b'+i);el.querySelector('.lb b').textContent=n[i]+(tot?` · ${Math.round(n[i]/tot*100)}%`:'');
      el.querySelector('.trk div').style.width=(n[i]/mx*100)+'%';el.classList.toggle('top1',n[i]===mx&&n[i]>0);});
    OPTIONS.map((_,i)=>i).sort((a,b)=>n[b]-n[a]).forEach(i=>$('bars').appendChild($('b'+i)));
    $('comments').innerHTML=cm.sort((a,b)=>b.at-a.at).slice(0,10).map(c=>`<div class="c">${esc(c.t)}</div>`).join('')||'<p style="color:#9ca3af;font-size:18px">Comments will appear here</p>';
  });
  $('resetBtn').onclick=()=>{if(window.confirm('Clear all poll answers?'))vRef.remove();};
}else{
  $('voter').classList.remove('hidden');
  let voted=false;try{voted=localStorage.getItem('ams_voted')==='1';}catch(e){}
  if(voted){$('vForm').classList.add('hidden');$('vDone').classList.remove('hidden');}
  let choice=-1;
  $('opts').innerHTML=OPTIONS.map(([ic,t],i)=>`<button class="opt" data-i="${i}"><span>${ic}</span>${esc(t)}</button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{choice=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));$('sendBtn').disabled=false;});
  $('sendBtn').onclick=async()=>{if(choice<0)return;$('sendBtn').disabled=true;
    await vRef.push({choice,text:$('txt').value.trim().slice(0,140),at:TS});
    try{localStorage.setItem('ams_voted','1');}catch(e){}
    $('vForm').classList.add('hidden');$('vDone').classList.remove('hidden');};
}
})();
</script>
</body>
</html>
