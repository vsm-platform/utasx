<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UTAS Idea Exchange</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#232C7A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: UTAS-branded exchange floor. Orange = Staff, Blue = Students, straight from the two halves of the UTAS mark.
   Big screen: tug of war on top, idea race left, leading idea + live trades right, pitch spotlight takes over the screen.
   Phone: pocket wallet with bottom tabs. Desk: moderation, pitch control, report. One committed light look. */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#1B2559; --ink-2:#5A6488; --ink-3:#8E96B3; --line:#E3E7F2;
  --blue:#3B56A8; --navy:#2A338E; --night:#222B78; --night-2:#2F3A8C;
  --orange:#F68922; --orange-2:#E66926; --orange-soft:#FFF0E0; --blue-soft:#E8EDFA;
  --up:#12A36B; --up-soft:#E2F6EC; --down:#E5484D; --down-soft:#FDECEC;
  --staff:var(--orange); --student:var(--blue);
  --display:"Lexend","Arial Rounded MT Bold","Segoe UI",sans-serif;
  --body:"Figtree","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute}
.deco .d1{width:46vmax;left:-14vmax;bottom:-20vmax;opacity:.07;animation:drift 18s ease-in-out infinite}
.deco .d2{width:36vmax;right:-10vmax;top:-14vmax;opacity:.06;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(2vmax,-2vmax) rotate(4deg)}}
#app{position:relative;z-index:1}

.chip{display:inline-flex;align-items:center;gap:.35em;font-weight:700;font-size:.72em;letter-spacing:.06em;text-transform:uppercase;padding:.28em .65em;border-radius:99px;white-space:nowrap}
.chip.staff{background:var(--orange-soft);color:#B4500E}
.chip.student{background:var(--blue-soft);color:var(--navy)}
.chip.ace{background:#F1EEFF;color:#4B3BB0;text-transform:none;letter-spacing:0}
.tick{font-family:var(--mono);font-weight:700;font-size:.8em;background:var(--night);color:#fff;padding:.25em .55em;border-radius:7px;letter-spacing:.04em}
.delta{display:inline-flex;align-items:center;gap:.2em;font-family:var(--mono);font-weight:700;font-size:.82em;padding:.18em .5em;border-radius:7px}
.delta.up{background:var(--up-soft)} .delta.down{background:var(--down-soft)} .delta.flat{background:var(--bg)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:0 1px 2px rgba(27,37,89,.04),0 10px 30px rgba(27,37,89,.07)}
.status{display:inline-flex;align-items:center;gap:.5em;font-weight:700;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;padding:.45em .9em;border-radius:99px;background:var(--up-soft);color:#0A7A4E;white-space:nowrap}
.status i{width:.6em;height:.6em;border-radius:50%;background:var(--up);animation:ping 1.6s infinite}
.status.closed{background:var(--down-soft);color:#A3262A}.status.closed i{background:var(--down);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(18,163,107,.5)}80%,100%{box-shadow:0 0 0 .55em rgba(18,163,107,0)}}
.brand{display:flex;align-items:center;gap:.65em}
.brand b{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1}
.brand .em{width:1.6em;height:auto;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:14px;padding:.95em 1.3em;font-weight:800;background:var(--night);color:#fff;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.orange{background:var(--orange);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:var(--down);color:#fff}
.btn.sm{padding:.5em .8em;border-radius:10px;font-size:.85em}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* demo navigator (demo mode only) */
.demo{position:fixed;z-index:90;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:var(--night);color:#fff;border-radius:99px;padding:4px;box-shadow:0 8px 24px rgba(27,37,89,.3);font-size:12.5px;max-width:calc(100% - 20px);overflow-x:auto}
.demo a,.demo button{color:#C9D0EC;text-decoration:none;border:0;background:none;padding:.45em .85em;border-radius:99px;font-weight:700;white-space:nowrap}
.demo a.on{background:#fff;color:var(--night)}
.demo button.on{color:var(--orange)}
.demo span{padding:0 .4em 0 .7em;color:var(--orange);font-weight:800;letter-spacing:.06em;font-size:.85em}
body.has-demo.v-screen{padding-top:58px}
body.has-demo .app,body.has-demo .rep{padding-top:calc(60px + env(safe-area-inset-top,0px))}

/* ================= BIG SCREEN ================= */
body.v-screen{font-size:clamp(10px,.7vw + .25vh,30px);padding-block:1.1em}
@media (min-width:821px){body.v-screen{height:100vh;overflow:hidden}body.v-screen #app,.scr{height:100%}.aside .panel,.s-main>.panel{overflow:hidden}}
.scr{display:grid;gap:1em;grid-template-rows:auto auto minmax(0,1fr) auto}
.s-head{display:flex;align-items:center;gap:1.4em;flex-wrap:wrap}
.logo-card{background:#fff;border-radius:18px;padding:.7em 1.1em;box-shadow:0 6px 20px rgba(27,37,89,.06);display:flex;align-items:center}
.logo-card img{height:4.4em;width:auto;display:block}
.title-block b{display:block;font-family:var(--display);font-weight:800;font-size:2.5em;letter-spacing:-.035em;line-height:1}
.title-block b span{color:var(--orange)}
.title-block small{display:block;font-weight:600;color:var(--ink-2);font-size:1em;margin-top:.4em}
.s-head .mid{margin-left:auto;display:flex;align-items:center;gap:1em}
.clock{font-size:1.5em;font-weight:700;color:var(--ink-2)}
.scan{display:flex;align-items:center;gap:1em;background:var(--night);color:#fff;border-radius:22px;padding:.6em .6em .6em 1.2em;position:relative;overflow:hidden}
.scan::before{content:"";position:absolute;left:-2em;bottom:-2.5em;width:6em;height:6em;border-radius:50%;background:var(--orange);opacity:.25}
.scan b{display:block;font-family:var(--display);font-size:1.35em;font-weight:700;line-height:1.1;position:relative}
.scan span{font-size:.9em;color:#B9C2E6;position:relative}
.scan .pts{color:var(--orange);font-weight:800}
.qr{width:7em;height:7em;background:#fff;border-radius:12px;padding:.4em;display:grid;place-items:center;flex:none;position:relative}
.qr img,.qr canvas{width:100%!important;height:100%!important}

.duel{padding:.9em 1.4em}
.duel-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:1em}
.side .who{font-weight:800;font-size:.9em;letter-spacing:.1em;text-transform:uppercase}
.side .big{font-family:var(--display);font-weight:800;font-size:2.5em;line-height:1;letter-spacing:-.03em}
.side .sub{color:var(--ink-2);font-weight:600;font-size:.95em}
.side.l .who{color:var(--orange-2)} .side.r{text-align:right} .side.r .who{color:var(--blue)}
.vs{font-family:var(--display);font-weight:800;color:var(--ink-3);font-size:1.3em;padding-bottom:.3em}
.rope{position:relative;height:1.6em;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--navy));margin-top:.8em}
.rope .fill{position:absolute;inset:0 auto 0 0;border-radius:99px 0 0 99px;background:linear-gradient(90deg,var(--orange),var(--orange-2));width:50%;transition:width 1.2s cubic-bezier(.3,1.3,.4,1)}
.rope .knot{position:absolute;top:50%;left:50%;width:3em;height:3em;transform:translate(-50%,-50%);transition:left 1.2s cubic-bezier(.3,1.3,.4,1);filter:drop-shadow(0 4px 10px rgba(27,37,89,.3))}
.rope .mid-line{position:absolute;left:50%;top:-.5em;bottom:-.5em;width:2px;background:var(--ink);opacity:.2}
.duel-msg{text-align:center;font-weight:700;color:var(--ink-2);margin-top:.7em}

.s-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.1em;min-height:0}
.panel{padding:1.1em 1.3em;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel h2{margin:0 0 .8em;font-family:var(--display);font-weight:700;font-size:1.25em;letter-spacing:-.01em;display:flex;align-items:center;gap:.5em}
.panel h2 small{font-family:var(--body);font-weight:600;font-size:.62em;color:var(--ink-3);margin-left:auto;letter-spacing:0}
.race{position:relative;--rowh:5.2em;transition:height .6s}
.row{position:absolute;left:0;right:0;top:0;height:var(--rowh);transform:translateY(calc(var(--y,0) * var(--rowh)));transition:transform .8s cubic-bezier(.2,.9,.2,1);display:grid;grid-template-columns:2.4em minmax(0,1fr) 7.2em;gap:.9em;align-items:center}
.row.enter{animation:rowin .7s ease-out}
@keyframes rowin{from{opacity:0}}
.rank{width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--bg);color:var(--ink-2);font-size:1.05em}
.row.first .rank{background:var(--orange);color:#fff}
.r-mid{min-width:0}
.r-name{display:flex;align-items:center;gap:.55em;min-width:0}
.r-name strong{font-weight:800;font-size:1.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-name .amt{margin-left:auto;font-family:var(--mono);font-size:.8em;font-weight:700;color:var(--ink-3);white-space:nowrap}
.r-pitch{color:var(--ink-2);font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15em}
.track{position:relative;height:.9em;border-radius:99px;background:var(--bg);margin-top:.35em;overflow:hidden}
.track .bar{position:absolute;inset:0 auto 0 0;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.9,.2,1)}
.row.staff .bar{background:linear-gradient(90deg,#FBC58E,var(--orange))}
.row.student .bar{background:linear-gradient(90deg,#9CB0E4,var(--blue))}
.r-px{text-align:right}
.r-px .num{font-size:1.45em;font-weight:700;display:block;line-height:1.1}
.row.pop .r-px .num{animation:pop .9s}
@keyframes pop{30%{transform:scale(1.18);color:var(--up)}}
.race-empty{display:grid;place-items:center;text-align:center;color:var(--ink-2);padding:2em 1em;flex:1}
.race-empty b{display:block;font-family:var(--display);font-size:1.6em;color:var(--ink);margin:.4em 0 .2em}
.more{margin-top:auto;padding-top:.6em;color:var(--ink-3);font-weight:600;font-size:.9em}

.aside{display:grid;grid-template-rows:auto minmax(0,1fr);gap:1.1em;min-height:0;min-width:0}
.leader{background:var(--night);color:#fff;position:relative;overflow:hidden}
.leader::after{content:"";position:absolute;right:-3em;bottom:-3em;width:9em;height:9em;border-radius:50%;background:var(--orange);opacity:.12}
.leader h2{color:#fff} .leader h2 small{color:#9AA5D6}
.leader .ln{display:flex;align-items:baseline;justify-content:space-between;gap:1em;position:relative}
.leader .ln strong{font-size:1.25em;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader .lp{font-family:var(--display);font-weight:800;font-size:2.4em;line-height:1;letter-spacing:-.03em}
.leader .lp small{font-family:var(--body);font-size:.35em;color:var(--orange);font-weight:700;letter-spacing:.06em;margin-left:.3em}
.leader svg{display:block;width:100%;height:6.5em;margin-top:.6em;position:relative}
.leader .draw{stroke-dasharray:2000;animation:draw 1.6s ease-out}
@keyframes draw{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em;overflow:hidden}
.feed li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:.75em;align-items:center}
.feed li.in{animation:feedin .6s cubic-bezier(.2,.9,.2,1)}
@keyframes feedin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.av{width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9em;color:#fff}
.av.staff{background:var(--orange)} .av.student{background:var(--blue)}
.feed .t{min-width:0;line-height:1.25}
.feed .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .t span{color:var(--ink-2);font-size:.88em}
.feed .a{text-align:right;font-family:var(--mono);font-weight:700}
.feed .a small{display:block;color:var(--ink-3);font-family:var(--body);font-weight:600;font-size:.75em}
.tape{overflow:hidden;background:var(--night);color:#fff;border-radius:14px;white-space:nowrap}
.tape-in{display:inline-flex;gap:2.6em;padding:.75em 1.2em;animation:tape var(--dur,40s) linear infinite}
.tape-in span{display:inline-flex;gap:.55em;align-items:baseline;font-family:var(--mono);font-weight:700}
.tape-in em{font-style:normal;color:var(--orange)}
.tape-in .up{color:#4FE0A0}.tape-in .down{color:#FF8A8D}
@keyframes tape{to{transform:translateX(-50%)}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(244,246,251,.95);backdrop-filter:blur(10px);display:grid;place-items:center;padding:2em;text-align:center;animation:fade .35s}
@keyframes fade{from{opacity:0}}
.bell-svg{width:6em;height:6em;transform-origin:50% 10%;animation:ring 1.1s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-15deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.overlay h1{font-family:var(--display);font-weight:800;font-size:4.2em;letter-spacing:-.04em;margin:.15em 0 .6em;line-height:1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1em}
.pod{width:12em;display:flex;flex-direction:column;align-items:center;gap:.4em}
.pod .nm{font-weight:800;font-size:1.1em;line-height:1.2;min-height:2.4em;display:flex;align-items:flex-end}
.pod .blk{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:start center;padding-top:.6em;font-family:var(--display);font-weight:800;font-size:2em;color:#fff;transform-origin:bottom;animation:rise 1s cubic-bezier(.2,1.2,.3,1) both}
.pod:nth-child(1) .blk{height:5.5em;background:var(--blue);animation-delay:.3s}
.pod:nth-child(2) .blk{height:8em;background:var(--orange)}
.pod:nth-child(3) .blk{height:4em;background:var(--navy);animation-delay:.5s}
@keyframes rise{from{transform:scaleY(0)}}
.cert{max-width:44em;margin:0 auto;background:var(--surface);border-radius:24px;padding:2.2em 2.6em;position:relative;box-shadow:0 30px 80px rgba(27,37,89,.18);border:2px solid var(--orange)}
.cert .k{font-weight:800;letter-spacing:.24em;font-size:.8em;color:var(--orange-2);text-transform:uppercase}
.cert h2{font-family:var(--display);font-weight:800;font-size:3em;line-height:1.05;margin:.3em 0;letter-spacing:-.035em;text-wrap:balance}
.cert .by{color:var(--ink-2);font-weight:600}
.cert-stats{display:flex;justify-content:center;gap:2.5em;margin-top:1.3em;flex-wrap:wrap}
.cert-stats b{display:block;font-family:var(--display);font-size:1.6em}
.cert-stats span{font-size:.75em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.seal{position:absolute;top:-1.8em;right:-1.6em;width:5.8em;height:5.8em;animation:spinin 1s cubic-bezier(.2,1.4,.3,1) .4s both}
@keyframes spinin{from{transform:scale(0) rotate(-120deg)}}
.awards{display:flex;justify-content:center;gap:1em;margin-top:1.6em;flex-wrap:wrap}
.award{background:var(--surface);border-radius:16px;padding:.9em 1.4em;min-width:14em;box-shadow:0 8px 24px rgba(27,37,89,.08)}
.award span{font-size:.75em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.award b{display:block;font-family:var(--display);font-size:1.45em;margin:.15em 0}

/* pitch spotlight */
.spot{position:fixed;inset:0;z-index:75;background:radial-gradient(ellipse at 30% 40%,#2F3A8C,#171F5C 70%);color:#fff;display:grid;place-items:center;padding:2em;animation:fade .4s;overflow:hidden}
.spot::before{content:"";position:absolute;left:50%;top:-30%;width:70vw;height:130%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,255,255,.07) 175deg,rgba(255,255,255,.12) 180deg,rgba(255,255,255,.07) 185deg,transparent 200deg);pointer-events:none}
.spot-brand{position:absolute;left:2em;top:2em;background:#fff;border-radius:14px;padding:.5em .8em;z-index:1}.spot-brand img{height:3.4em;display:block}
body.has-demo .spot-brand{top:4.5em}
.spot-in{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3.5em;align-items:center;max-width:90em;width:100%}
.ring{width:22em;height:22em;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-family:var(--display);font-weight:800;font-size:7em;line-height:1;letter-spacing:-.05em}
.ring .rv span{font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#B9C2E6;font-size:.9em;margin-top:-1em;display:block}
.ring.warn .rv b{color:var(--orange)}
.live{display:inline-flex;align-items:center;gap:.6em;background:var(--orange);color:#fff;font-weight:800;letter-spacing:.2em;text-transform:uppercase;padding:.5em 1em;border-radius:99px;font-size:1em}
.live i{width:.7em;height:.7em;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.spot h1{font-family:var(--display);font-weight:800;font-size:5em;line-height:1;letter-spacing:-.04em;margin:.35em 0 .25em;text-wrap:balance}
.spot .pitchline{font-size:1.6em;color:#D5DBF3;max-width:30em}
.spot .presenter{display:flex;align-items:center;gap:.8em;margin-top:1.4em;font-size:1.25em;font-weight:700}
.spot .presenter .av{width:2.6em;height:2.6em;font-size:1em}
.spot .hint{margin-top:2em;color:#B9C2E6;font-weight:600;font-size:1.2em}
.ace-bars{display:flex;flex-direction:column;gap:1.1em;margin-top:1.6em;max-width:44em}
.ace-row{display:grid;grid-template-columns:11em minmax(0,1fr) 4em;gap:1em;align-items:center}
.ace-row b{font-size:1.25em}
.ace-row small{display:block;color:#B9C2E6;font-weight:600}
.ace-track{height:1.4em;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.ace-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),#FFC27D);width:0;transition:width .8s cubic-bezier(.2,.9,.2,1)}
.ace-row .num{font-size:1.6em;font-weight:700;text-align:right}
.ace-total{font-family:var(--display);font-weight:800;font-size:3em;color:var(--orange)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}

/* ================= PHONE ================= */
body.v-trade{padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.app{max-width:460px;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top,0px));position:relative}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:.8em;padding:.4em 0 .9em}
.p-head .brand b{font-size:1.1em}
.p-head .brand b small{display:block;font-family:var(--body);font-size:.62em;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:.2em}
.wallet{background:linear-gradient(140deg,var(--night),var(--navy));color:#fff;border-radius:26px;padding:1.2em 1.3em 1.1em;position:relative;overflow:hidden}
.wallet .glow{position:absolute;right:-18px;top:-26px;width:110px;opacity:.16;transform:rotate(12deg)}
.wallet .lbl{font-size:.75em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A9B3E0;position:relative}
.wallet .bal{font-family:var(--display);font-weight:800;font-size:2.7em;line-height:1.05;letter-spacing:-.04em;margin:.1em 0;position:relative}

function makeSymbol(name, taken) {
  const words = name.toUpperCase().replace(/[^A-Z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  let s = words.length >= 2 ? words.slice(0, 4).map(w => w[0]).join("") : (words[0] || "").slice(0, 4);
  if (s.length < 3 && words[0]) s = (s + words[0].slice(1)).slice(0, 4);
  if (s.length < 2) s = "IDEA";
  let out = s, n = 2;
  while (taken.has(out)) out = s.slice(0, 3) + n++;
  return out;
}

/* ---------------- data backends ---------------- */
function loadScript(src) {
  return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
}
function emptyState() { return {ideas: {}, investors: {}, trades: {}, ratings: {}, market: {status: "open"}}; }

function firebaseBackend(cfg) {
  firebase.initializeApp(cfg);
  const db = firebase.database(), root = db.ref("ix");
  let off = 0; db.ref(".info/serverTimeOffset").on("value", s => off = s.val() || 0);
  return {
    live: true,
    now: () => Date.now() + off,
    subscribe(cb) { root.on("value", s => cb(Object.assign(emptyState(), s.val() || {}))); },
    async join(uid, name, group) {
      await root.child("investors/" + uid).transaction(cur => cur ? cur : {name, group, balance: CONFIG.startBalance, ts: Date.now() + off});
    },
    async listIdea(idea) { const r = root.child("ideas").push(); await r.set({...idea, ts: Date.now() + off}); },
    async approve(id) { await root.child("ideas/" + id).update({status: "live", ts: Date.now() + off}); },
    async rate(ideaId, uid, r) { await root.child(`ratings/${ideaId}/${uid}`).set({...r, ts: Date.now() + off}); },
    async invest(inv, idea, amount) {
      const st = (await root.child("market/status").get()).val();
      if (st === "closed") throw new Error("The market is closed.");
      const r = await root.child("investors/" + inv.id + "/balance").transaction(b => {
        if (b === null) return null;
        if (b < amount) return;
        return b - amount;
      });
      if (!r.committed || r.snapshot.val() === null) throw new Error("Not enough UTAS Points.");
      const t = await root.child("ideas/" + idea.id + "/total").transaction(x => (x || 0) + amount);
      const after = t.snapshot.val(), price = priceOf(after - amount);
      const trade = {uid: inv.id, name: inv.name, group: inv.group, ideaId: idea.id, amount, price, shares: amount / price, ts: Date.now() + off};
      await root.child("trades").push(trade);
      return trade;
    },
    async setMarket(patch) { await root.child("market").update(patch); },
    async deleteIdea(id, trades) {
      for (const t of trades) {
        await root.child("investors/" + t.uid + "/balance").transaction(b => b === null ? null : b + t.amount);
        await root.child("trades/" + t.id).remove();
      }
      await root.child("ratings/" + id).remove();
      await root.child("ideas/" + id).remove();
    },
    async reset() { await root.set({market: {status: "open"}}); }
  };
}

function localBackend() {
  const KEY = "utas-ix-demo-v3";
  const load = () => { try { return Object.assign(emptyState(), JSON.parse(store.get(KEY)) || {}); } catch { return emptyState(); } };
  let st = load(), subs = [];
  const ch = "BroadcastChannel" in window ? new BroadcastChannel("utas-ix-demo") : null;
  const emit = () => subs.forEach(f => f(JSON.parse(JSON.stringify(st))));
  const save = () => { store.set(KEY, JSON.stringify(st)); ch && ch.postMessage(1); emit(); };
  if (ch) ch.onmessage = () => { st = load(); emit(); };
  addEventListener("storage", e => { if (e.key === KEY) { st = load(); emit(); } });
  return {
    live: false,
    now: () => Date.now(),
    subscribe(cb) { subs.push(cb); cb(JSON.parse(JSON.stringify(st))); },
    peek() { return st; },
    replace(s) { st = s; save(); },
    async join(uid, name, group, extra) { st = load(); if (!st.investors[uid]) st.investors[uid] = {name, group, balance: CONFIG.startBalance, ts: Date.now(), ...(extra || {})}; save(); },
    async listIdea(idea) { st = load(); st.ideas[rid()] = {...idea, ts: Date.now()}; save(); },
    async approve(id) { st = load(); if (st.ideas[id]) { st.ideas[id].status = "live"; st.ideas[id].ts = Date.now(); } save(); },
    async rate(ideaId, uid, r) { st = load(); (st.ratings[ideaId] ||= {})[uid] = {...r, ts: Date.now()}; save(); },
    async invest(inv, idea, amount, ts) {
      st = load();
      if (st.market.status === "closed") throw new Error("The market is closed.");
      const me = st.investors[inv.id], it = st.ideas[idea.id];
      if (!me || !it) throw new Error("Something changed. Try again.");
      if (me.balance < amount) throw new Error("Not enough UTAS Points.");
      const price = priceOf(it.total);
      me.balance -= amount; it.total = (it.total || 0) + amount;
      const trade = {uid: inv.id, name: me.name, group: me.group, ideaId: idea.id, amount, price, shares: amount / price, ts: ts || Date.now()};
      st.trades[rid()] = trade; save(); return trade;
    },
    async setMarket(patch) { st = load(); Object.assign(st.market, patch); save(); },
    async deleteIdea(id) {
      st = load();
      for (const [k, t] of Object.entries(st.trades)) if (t.ideaId === id) { if (st.investors[t.uid]) st.investors[t.uid].balance += t.amount; delete st.trades[k]; }
      delete st.ratings[id]; delete st.ideas[id]; save();
    },
    async reset(seed) { st = emptyState(); save(); if (seed) seedDemo(this); }
  };
}

/* ---------------- derived market numbers ---------------- */
function derive(st) {
  const all = Object.entries(st.ideas || {}).map(([id, v]) => ({id, ...v, total: v.total || 0, live: v.status !== "pending"}));
  const byId = Object.fromEntries(all.map(i => [i.id, i]));
  const ideas = all.filter(i => i.live), pending = all.filter(i => !i.live).sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const trades = Object.entries(st.trades || {}).map(([id, v]) => ({id, ...v})).filter(t => byId[t.ideaId]).sort((a, b) => a.ts - b.ts);
  all.forEach(i => { i.series = [{t: i.ts || 0, p: BASE}]; i.cum = 0; i.inv = new Set(); });
  const idx = []; let sT = 0, uT = 0;
  const hold = {};
  for (const t of trades) {
    const i = byId[t.ideaId];
    i.cum += t.amount; i.series.push({t: t.ts, p: priceOf(i.cum)}); i.inv.add(t.uid);
    if (i.group === "staff") sT += t.amount; else uT += t.amount;
    idx.push({t: t.ts, s: sT, u: uT});
    const h = (hold[t.uid] ||= {}); const x = (h[t.ideaId] ||= {shares: 0, cost: 0});
    x.shares += t.shares; x.cost += t.amount;
  }
  all.forEach(i => {
    i.price = priceOf(i.total);
    i.gain = (i.price - BASE) / BASE;
    i.investors = i.inv.size;
    const rs = Object.values((st.ratings || {})[i.id] || {});
    i.rCount = rs.length;
    const avg = k => rs.length ? rs.reduce((a, r) => a + (+r[k] || 0), 0) / rs.length : 0;
    i.aceA = avg("a"); i.aceC = avg("c"); i.aceE = avg("e");
    i.ace = rs.length ? (i.aceA + i.aceC + i.aceE) / 3 : 0;
  });
  ideas.sort((a, b) => b.total - a.total || (a.ts || 0) - (b.ts || 0));
  const investors = Object.entries(st.investors || {}).map(([id, v]) => {
    let val = 0; for (const [iid, h] of Object.entries(hold[id] || {})) if (byId[iid]) val += h.shares * byId[iid].price;
    return {id, ...v, portfolio: val, net: (v.balance || 0) + val};
  }).sort((a, b) => b.net - a.net);
  return {ideas, pending, byId, trades, investors, hold, idx, sT, uT, ratings: st.ratings || {}, market: st.market || {status: "open"}, raw: st};
}
function pitchInfo(D, now) {
  const p = D.market.pitch;
  if (!p || !p.ideaId || !D.byId[p.ideaId]) return null;
  const el = (now - p.startAt) / 1000, dur = p.dur || CONFIG.pitchSeconds, rate = p.rate || CONFIG.rateSeconds;
  if (el < 0) return {phase: "pitch", left: dur, idea: D.byId[p.ideaId], p};
  if (el < dur) return {phase: "pitch", left: Math.ceil(dur - el), frac: 1 - el / dur, idea: D.byId[p.ideaId], p};
  if (el < dur + rate) return {phase: "rate", left: Math.ceil(dur + rate - el), idea: D.byId[p.ideaId], p};
  return null;
}

const tweens = new WeakMap();
function countTo(el, to, fmt = f0, dur = 900) {
  if (!el) return;
  const from = el.dataset.v == null ? to : +el.dataset.v;
  el.dataset.v = to;
  cancelAnimationFrame(tweens.get(el));
  if (reduce || Math.abs(from - to) < 1e-9) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) tweens.set(el, requestAnimationFrame(step)); };
  tweens.set(el, requestAnimationFrame(step));
}
function sparkPath(series, w, h, pad = 3) {
  const pts = series.slice(-40); if (pts.length < 2) pts.unshift({p: BASE});
  const ps = pts.map(p => p.p), mn = Math.min(...ps), mx = Math.max(...ps), rg = mx - mn || 1;
  const xy = ps.map((p, i) => [pad + (i / (ps.length - 1)) * (w - pad * 2), h - pad - ((p - mn) / rg) * (h - pad * 2)]);
  return {line: "M" + xy.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L"), last: xy[xy.length - 1], up: ps[ps.length - 1] >= ps[0]};
}

}

function ding(times = 1) {

function confetti(ms = 5000, origin) {
  if (reduce) return;
  const cv = $("#confetti"); cv.hidden = false;
  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const cols = ["#F68922", "#3B56A8", "#E66926", "#2A338E", "#12A36B"];
  const burst = !!origin;
  const P = Array.from({length: burst ? 70 : 180}, () => burst ?
    {x: origin.x * dpr, y: origin.y * dpr, vx: (Math.random() - .5) * 14 * dpr, vy: (-Math.random() * 12 - 4) * dpr, r: Math.random() * 6, s: (5 + Math.random() * 6) * dpr, c: cols[Math.floor(Math.random() * 5)], g: .45 * dpr} :
    {x: Math.random() * cv.width, y: -Math.random() * cv.height, vx: (Math.random() - .5) * 2 * dpr, vy: (2 + Math.random() * 3) * dpr, r: Math.random() * 6, s: (6 + Math.random() * 7) * dpr, c: cols[Math.floor(Math.random() * 5)], g: 0});
  const end = Date.now() + ms;
  (function f() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += .1; if (!burst && p.y > cv.height && Date.now() < end) p.y = -10; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (Date.now() < end + (burst ? 0 : 3000)) requestAnimationFrame(f); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })();
}

        ${[["a", "Appropriate", "The right thing to do?"], ["c", "Consistent", "Fits people like us?"], ["e", "Effective", "Will it really work?"]].map(([k, l, q]) => `<div class="rate-row"><div><b>${l}</b><small>${q}</small></div><div class="stars" data-k="${k}">${[1, 2, 3].map(n => `<button type="button" data-n="${n}" aria-label="${l} ${n} of 3" class="${(sel[k] || 0) >= n ? "on" : ""}">${ICON.star}</button>`).join("")}</div></div>`).join("")}
        <button class="btn" id="rsend" ${sel.a && sel.c && sel.e ? "" : "disabled"}>Send my rating</button></div>`;
    box.innerHTML = `<div class="pitch-card"><div class="top"><span class="lv"><i></i>${P.phase === "pitch" ? "Live pitch" : "Rate the pitch"}</span><span class="cd" id="pcd">${fmtT(P.left)}</span></div>
      <h4>${esc(i.name)}</h4><p style="margin-bottom:.2em">by ${esc(i.ownerName)} · <b>${esc(i.sym)}</b></p>${inner}</div>`;
    box.querySelectorAll(".stars button").forEach(b => b.onclick = () => {
      const k = b.parentElement.dataset.k, n = +b.dataset.n; sel[k] = n; navigator.vibrate?.(15);
      b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.n <= n));
      $("#rsend").disabled = !(sel.a && sel.c && sel.e);
    });
    const send = $("#rsend");
    if (send) send.onclick = async () => {
      send.disabled = true;
      try { await be.rate(i.id, me.id, {a: sel.a, c: sel.c, e: sel.e}); confetti(0, {x: innerWidth / 2, y: send.getBoundingClientRect().top}); toast("Rating sent. Thank you!"); }
      catch { toast("Could not send. Try again.", true); send.disabled = false; }
    };
  }
  const fmtT = s => { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  setInterval(() => { if (D && me) renderPitch(); }, 500);

  function renderBody() {
    const body = $("#body");
    const closed = D.market.status === "closed";
    if (tab === "market") {
      body.dataset.tab = "market";
      body.innerHTML = `<div class="section-t"><h3>Market</h3><span>${D.ideas.length} ideas trading</span></div><div class="list">` + (D.ideas.length ? D.ideas.map((i, n) => {
        const own = i.ownerId === me.id, h = D.hold[me.id]?.[i.id];
        const dis = a => closed || own || busy || a <= 0 || me.balance < a;
        return `<article class="card stock">
          <div class="stock-h"><div style="min-width:0"><span class="tick">${esc(i.sym)}</span> <span class="chip ${i.group}">${i.group}</span><h4>${esc(i.name)}</h4><p>${esc(i.pitch)}</p></div>
            <div class="stock-r"><span class="num">${f2(i.price)}</span><span class="delta ${dir(i.gain)}">${arr(i.gain)} ${pct(i.gain)}</span>${spark(i.series)}</div></div>
          <div class="stock-meta"><span>#${n + 1} on the board</span><span>by ${esc(i.ownerName)}</span><span>${i.investors} backers</span>${aceChip(i)}</div>
          ${h ? `<div class="own">You own ${h.shares.toFixed(2)} shares, worth <b>${f0(h.shares * i.price)} pts</b></div>` : ""}
          ${own ? `<div class="own">This is your idea. Pitch it at the desk to attract backers.</div>` :
            `<div class="buys">${[100, 250, 500].map(a => `<button data-buy="${i.id}" data-amt="${a}" ${dis(a) ? "disabled" : ""}>${a}</button>`).join("")}<button class="all" data-buy="${i.id}" data-amt="${me.balance}" ${dis(me.balance) ? "disabled" : ""}>All in</button></div>`}
        </article>`;
      }).join("") : `<div class="card empty">${ICON.s1.replace("viewBox", 'width="56" height="56" viewBox')}<b>No ideas yet</b>Open “My idea” and list the first one.</div>`) + `</div>`;
      body.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => buy(b, b.dataset.buy, +b.dataset.amt));
    } else if (tab === "list") {
      const mine = Object.values(D.byId).find(i => i.ownerId === me.id);
      if (mine && !mine.live) {
        if (body.dataset.tab === "wait") return;
        body.dataset.tab = "wait";
        body.innerHTML = `<div class="section-t"><h3>My idea</h3><span>under review</span></div>
          <div class="card wait">${ICON.hour}<h4 style="font-family:var(--display);font-size:1.2em;margin:.6em 0 .2em">Waiting for approval</h4>
          <p style="color:var(--ink-2);margin:0">Our desk team checks every idea before it goes on the big screen. Show this screen at the desk to speed it up.</p>
          <div style="margin-top:1em"><span class="tick">${esc(mine.sym)}</span> <b>${esc(mine.name)}</b></div></div>`;
      } else if (mine) {
        body.dataset.tab = "mine";
        const rank = D.ideas.indexOf(mine) + 1;
        body.innerHTML = `<div class="section-t"><h3>My idea</h3><span>live</span></div>
          <div class="mine-hero"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1em"><div style="min-width:0"><span class="tick" style="background:var(--orange)">${esc(mine.sym)}</span><h4 style="margin:.6em 0 .2em;font-size:1.25em">${esc(mine.name)}</h4><div style="color:#C2CAEB;font-size:.92em">${esc(mine.pitch)}</div></div><div style="text-align:right"><div class="rk">#${rank}</div><div style="color:#A9B3E0;font-size:.8em;font-weight:700">of ${D.ideas.length}</div></div></div>
          <div class="kv"><div><span>Price</span><b>${f2(mine.price)}</b></div><div><span>Raised</span><b>${f0(mine.total)}</b></div><div><span>Backers</span><b>${mine.investors}</b></div><div><span>ACE</span><b>${mine.rCount ? f1(mine.ace) : "—"}</b></div></div></div>
          <button class="btn orange" id="mycert" style="width:100%;margin-top:.9em">${ICON.award}Get my certificate of appreciation</button>
          <div class="card tip" style="margin-top:.9em">${ICON.s2}<div><b>Now pitch it: 30 seconds</b><p>Ask the desk team to start your Live Pitch. Tell people why your idea is right, why it fits them and what they gain. The audience then rates you on Appropriate, Consistent and Effective.</p></div></div>`;
        $("#mycert").onclick = () => showCert(mine, D);
      } else if (body.dataset.tab !== "form") {
        body.dataset.tab = "form";
        body.innerHTML = `<div class="section-t"><h3>List your idea</h3><span>one per person</span></div>
          <form class="card form" id="lf" novalidate style="margin-top:0">
            <div class="field"><label for="in">Idea name</label><input id="in" maxlength="40" placeholder="e.g. Campus Coffee Cart"><div class="counter" id="inc">0 / 40</div></div>
            <div class="field"><label for="ip">One-line pitch</label><input id="ip" maxlength="90" placeholder="What it is and why people need it"><div class="counter" id="ipc">0 / 90</div></div>
            <div class="err" id="le"></div>
            <button class="btn blue" type="submit" ${closed ? "disabled" : ""}>List on the exchange</button>
          </form>
          <div class="section-t"><h3>Preview</h3><span>how others will see it</span></div>
          <article class="card stock preview" id="pv"></article>`;
        const taken = () => new Set(Object.values(D.byId).map(i => i.sym));
        const pv = () => {
          const n = $("#in").value.trim(), p = $("#ip").value.trim();
          $("#inc").textContent = `${$("#in").value.length} / 40`; $("#ipc").textContent = `${$("#ip").value.length} / 90`;
          $("#pv").innerHTML = `<div class="stock-h"><div style="min-width:0"><span class="tick">${n ? esc(makeSymbol(n, taken())) : "????"}</span> <span class="chip ${me.group}">${me.group}</span><h4>${esc(n) || "Your idea name"}</h4><p>${esc(p) || "Your one-line pitch"}</p></div>
            <div class="stock-r"><span class="num">10.00</span><span class="delta flat">• +0.0%</span></div></div><div class="stock-meta"><span>by ${esc(me.name)}</span><span>0 backers</span></div>`;
        };
        $("#in").oninput = pv; $("#ip").oninput = pv; pv();
        $("#lf").onsubmit = async e => {
          e.preventDefault();
          const name = $("#in").value.trim(), pitch = $("#ip").value.trim();
          if (name.length < 3) return $("#le").textContent = "Give your idea a name (at least 3 characters).";
          if (pitch.length < 5) return $("#le").textContent = "Add a one-line pitch.";
          if (D.market.status === "closed") return $("#le").textContent = "The market is closed.";
          try {
            await be.listIdea({name, pitch, sym: makeSymbol(name, taken()), ownerId: me.id, ownerName: me.name, group: me.group, total: 0, status: CONFIG.approveIdeas ? "pending" : "live"});
            navigator.vibrate?.(60); confetti(0, {x: innerWidth / 2, y: 220});
            toast(CONFIG.approveIdeas ? "Sent! The desk will approve it shortly." : "Listed! Your idea is now trading.");
          } catch { $("#le").textContent = "Could not list it. Check your internet and try again."; }
        };
      }
    } else {
      body.dataset.tab = "port";
      const h = Object.entries(D.hold[me.id] || {}).filter(([iid]) => D.byId[iid]).map(([iid, x]) => ({i: D.byId[iid], ...x, val: x.shares * D.byId[iid].price}));
      const cols = ["#3B56A8", "#E66926", "#12A36B", "#2A338E", "#8B5CF6", "#14B8C4"];
      const segs = [{label: "Cash", v: me.balance, c: "#F68922"}, ...h.map((x, n) => ({label: x.i.sym, v: x.val, c: cols[n % cols.length]}))];
      const tot = segs.reduce((a, s) => a + s.v, 0) || 1, C = 2 * Math.PI * 40; let off = 0;
      const circles = segs.map(s => { const len = s.v / tot * C; const el = `<circle cx="50" cy="50" r="40" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return el; }).join("");
      const rank = D.investors.findIndex(i => i.id === me.id) + 1;
      body.innerHTML = `<div class="section-t"><h3>Portfolio</h3><span>rank #${rank} of ${D.investors.length}</span></div>
        <div class="card donut-card"><svg class="donut" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--bg)" stroke-width="16"/>${circles}</svg>
          <div class="legend">${segs.map(s => `<div><i style="background:${s.c}"></i><span>${esc(s.label)}</span><b class="num">${f0(s.v)}</b></div>`).join("")}</div></div>
        <div class="list" style="margin-top:.8em">${h.length ? h.map(x => { const pl = x.val - x.cost; return `<div class="card hold"><div style="min-width:0"><strong><span class="tick">${esc(x.i.sym)}</span> ${esc(x.i.name)}</strong><small>${x.shares.toFixed(2)} shares · paid ${f0(x.cost)}</small></div><div class="v">${f0(x.val)}<div class="${dir(pl)}" style="font-size:.85em">${pl >= 0 ? "+" : ""}${f0(pl)}</div></div></div>`; }).join("") :
          `<div class="card empty">${ICON.s3.replace("viewBox", 'width="56" height="56" viewBox')}<b>No shares yet</b>Go to Market and back an idea you like.</div>`}</div>`;
    }
  }

  function flyCoin(fromEl) {
    if (reduce) return;
    const a = fromEl.getBoundingClientRect(), b = $("#wbal")?.getBoundingClientRect(); if (!b) return;
    for (let k = 0; k < 5; k++) {
      const c = document.createElement("div"); c.className = "fly"; c.innerHTML = ICON.mini; document.body.appendChild(c);
      const sx = a.left + a.width / 2 - 15, sy = a.top + a.height / 2 - 15, ex = b.left + b.width / 2 - 15, ey = b.top + b.height / 2 - 15;
      c.animate([{transform: `translate(${sx}px,${sy}px) scale(1)`, opacity: 1}, {transform: `translate(${(sx + ex) / 2 + (Math.random() - .5) * 120}px,${Math.min(sy, ey) - 80}px) scale(1.2)`, opacity: 1}, {transform: `translate(${ex}px,${ey}px) scale(.5)`, opacity: .2}],
        {duration: 700 + k * 90, easing: "cubic-bezier(.3,.6,.3,1)"}).onfinish = () => c.remove();
    }
    setTimeout(() => { const w = $(".wallet .bal"); w?.classList.remove("bump"); void w?.offsetWidth; w?.classList.add("bump"); }, 750);
  }
  async function buy(btn, ideaId, amt) {
    if (busy || amt <= 0) return;
    busy = true; flyCoin(btn); navigator.vibrate?.(30);
    try {
      const t = await be.invest(me, D.byId[ideaId], amt);
      toast(`You bought ${t.shares.toFixed(2)} shares of ${D.byId[ideaId]?.sym || ""}`);
    } catch (e) { toast(e.message || "Trade failed. Try again.", true); }
    busy = false; render(D.raw);
  }
  be.subscribe(render);
}

/* =====================================================================
   CONTROL DESK  (#admin)
   ===================================================================== */
function deskHeader(title) {
  return `<div class="p-head"><div class="brand">${EMBLEM()}<b>${title}<small>UTAS Idea Exchange</small></b></div><span id="ast"></span></div>`;
}
function pinGate(box, onOk) {
  if (sess.get("ix-admin") === "1") return true;
  if (!$("#pinf")) {
    box.innerHTML = `<form class="card form" id="pinf"><div class="field"><label for="pin">Desk PIN</label><input id="pin" inputmode="numeric" autocomplete="off" placeholder="••••"></div><div class="err" id="pe"></div><button class="btn">Unlock</button></form>`;
    $("#pinf").onsubmit = e => { e.preventDefault(); if ($("#pin").value === CONFIG.adminPin) { sess.set("ix-admin", "1"); onOk(); } else $("#pe").textContent = "Wrong PIN."; };
  }
  return false;
}
function Admin(be) {
  document.body.classList.add("v-admin");
  let D, pending = null;
  $("#app").innerHTML = `<div class="app">${deskHeader("Control desk")}<div id="ab"></div></div>`;
  function render(st) {
    D = derive(st);
    $("#ast").innerHTML = statusPill(D.market);
    const b = $("#ab");
    if (!pinGate(b, () => render(D.raw))) return;
    const closed = D.market.status === "closed", P = pitchInfo(D, be.now());
    b.innerHTML = `<div class="adm">
      <div class="card"><div class="stats"><div><span>Ideas</span><b>${D.ideas.length}</b></div><div><span>Players</span><b>${D.investors.length}</b></div><div><span>Trades</span><b>${D.trades.length}</b></div><div><span>Staff pts</span><b>${f0(D.sT)}</b></div><div><span>Student pts</span><b>${f0(D.uT)}</b></div><div><span>Leader</span><b>${esc(D.ideas[0]?.sym || "—")}</b></div></div></div>
      <div class="card"><h3>Approval queue ${D.pending.length ? `<span class="cnt">${D.pending.length}</span>` : ""}</h3><p>New ideas appear on the big screen only after you approve them.</p>
        <ul class="ilist">${D.pending.map(i => `<li><span class="tick">${esc(i.sym)}</span><span class="nm"><b>${esc(i.name)}</b><small>${esc(i.pitch)} · ${esc(i.ownerName)} (${i.group})</small></span><button class="ok" data-ok="${i.id}">Approve</button><button class="x" data-rej="${i.id}">Reject</button></li>`).join("") || `<li style="color:var(--ink-3)">Nothing waiting.</li>`}</ul></div>
      <div class="card"><h3>Live pitch</h3>
        ${P ? `<div class="livebox"><div><b>${P.phase === "pitch" ? "Pitching now" : "Audience is rating"}: ${esc(P.idea.name)}</b><span id="plt">${P.left}s left · ${P.idea.rCount} ratings</span></div><button class="btn ghost sm" id="p-end">End</button></div>` : ""}
        <p>Tap “Certificate” to open and print a thank-you certificate for that idea’s owner. Tap “Pitch” next to an idea when its owner steps up. The big screen shows a ${CONFIG.pitchSeconds}-second countdown, then opens ACE rating on every phone for ${CONFIG.rateSeconds} seconds.</p>
        <ul class="ilist">${D.ideas.map(i => `<li><span class="tick">${esc(i.sym)}</span><span class="nm"><b>${esc(i.name)}</b><small>${esc(i.ownerName)} · ${i.rCount ? `ACE ${f1(i.ace)} from ${i.rCount}` : "not pitched yet"}</small></span><button class="pt" data-pitch="${i.id}" ${P || closed ? "disabled" : ""}>Pitch</button><button class="ok" data-cert="${i.id}">Certificate</button><button class="x" data-del="${i.id}">Remove</button></li>`).join("") || `<li style="color:var(--ink-3)">No live ideas yet.</li>`}</ul></div>
      <div class="card"><h3>Ring the bell</h3><p>Shows the top 3 on the big screen and buzzes every phone. Ring it every 30–45 minutes.</p><div class="row-b"><button class="btn orange" id="b-up" ${closed ? "disabled" : ""}>Ring market update</button></div></div>
      <div class="card"><h3>Trading</h3><p>${closed ? "The market is closed. Reopen it to continue trading." : "The closing bell ends trading and crowns the winners with confetti."}</p><div class="row-b">${closed ? `<button class="btn" id="b-open">Reopen market</button>` : `<button class="btn red" id="b-close">Ring closing bell</button>`}</div><div id="cf"></div></div>
      <div class="card"><h3>End-of-day report</h3><p>Participants, the staff and student split, every idea with its price and ACE score, and the winners. Print it or save it as PDF and CSV.</p><div class="row-b"><a class="btn blue" href="#report" style="text-decoration:none">Open report</a></div></div>
      <div class="card"><h3>Reset</h3><p>Deletes every idea, player, rating and trade. Do this right before the event opens.</p><div class="row-b"><button class="btn ghost" id="b-reset">Reset everything</button>${!be.live ? `<button class="btn ghost" id="b-seed">Reload demo data</button>` : ""}</div><div id="cf2"></div></div>
      <div class="card"><h3>Links</h3><p>Big screen<span class="link">${esc(baseURL())}</span></p><p>Phones (the QR code opens this)<span class="link">${esc(baseURL())}#trade</span></p><p style="margin:0">Control desk<span class="link">${esc(baseURL())}#admin</span></p></div>
    </div>`;
    const bell = (type, extra = {}) => be.setMarket({...extra, bell: {type, at: be.now(), id: rid()}});
    $("#b-up").onclick = () => bell("update").then(() => toast("Bell rung."));
    $("#b-open") && ($("#b-open").onclick = () => bell("open", {status: "open"}).then(() => toast("Market reopened.")));
    $("#b-close") && ($("#b-close").onclick = () => ask("#cf", "Close the market and announce the winners?", "Ring closing bell", () => bell("close", {status: "closed", closedAt: be.now(), pitch: null})));
    $("#b-reset").onclick = () => ask("#cf2", "Delete all ideas, players, ratings and trades? This cannot be undone.", "Yes, reset", () => be.reset(false));
    $("#b-seed") && ($("#b-seed").onclick = () => be.reset(true));
    $("#p-end") && ($("#p-end").onclick = () => be.setMarket({pitch: null}).then(() => toast("Pitch ended.")));
    b.querySelectorAll("[data-cert]").forEach(x => x.onclick = () => showCert(D.byId[x.dataset.cert], D));
    b.querySelectorAll("[data-ok]").forEach(x => x.onclick = () => be.approve(x.dataset.ok).then(() => toast("Approved. It is live now.")));
    b.querySelectorAll("[data-rej]").forEach(x => x.onclick = () => be.deleteIdea(x.dataset.rej, []).then(() => toast("Idea rejected.")));
    b.querySelectorAll("[data-pitch]").forEach(x => x.onclick = () => be.setMarket({pitch: {ideaId: x.dataset.pitch, startAt: be.now() + 1500, dur: CONFIG.pitchSeconds, rate: CONFIG.rateSeconds, id: rid()}}).then(() => toast("Pitch spotlight is on the big screen.")));
    b.querySelectorAll("[data-del]").forEach(x => x.onclick = () => { const i = D.byId[x.dataset.del]; ask("#cf", `Remove ${i.sym} “${i.name}” and refund its ${i.investors} backers?`, "Remove", () => be.deleteIdea(i.id, D.trades.filter(t => t.ideaId === i.id))); });
    if (pending) showAsk();
  }
  function ask(slot, q, label, fn) { pending = {slot, q, label, fn}; showAsk(); }
  function showAsk() {
    const c = $(pending.slot); if (!c) return;
    c.innerHTML = `<div class="confirm">${esc(pending.q)}<div class="row-b"><button class="btn red" id="cy">${esc(pending.label)}</button><button class="btn ghost" id="cn">Cancel</button></div></div>`;
    c.scrollIntoView({behavior: "smooth", block: "center"});
    $("#cy").onclick = async () => { const p = pending; pending = null; await p.fn(); toast("Done."); };
    $("#cn").onclick = () => { pending = null; c.innerHTML = ""; };
  }
  be.subscribe(render);
  setInterval(() => { if (!D) return; const P = pitchInfo(D, be.now()), el = $("#plt"); if (!!P !== !!$(".livebox") || (P && !el)) render(D.raw); else if (P && el) el.textContent = `${P.left}s left · ${P.idea.rCount} ratings`; }, 1000);
}

/* =====================================================================
   END-OF-DAY REPORT  (#report)
   ===================================================================== */
function Report(be) {
  document.body.classList.add("v-report");
  let D;
  $("#app").innerHTML = `<div class="rep" id="rep"></div>`;
  function render(st) {
    D = derive(st);

    const staff = D.investors.filter(i => i.group === "staff").length, stud = D.investors.length - staff;
    const vol = D.sT + D.uT, sp = vol ? D.sT / vol * 100 : 50;
    const w = D.ideas[0], top = D.investors.filter(i => i.portfolio > 0)[0], bp = [...D.ideas].filter(i => i.rCount).sort((a, b) => b.ace - a.ace)[0];
    const day = new Date().toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
    box.innerHTML = `
      <div class="rep-head"><img src="${LOGO_SRC}" alt="UTAS Ibra"><div class="rep-actions"><a class="btn ghost sm" href="#admin" style="text-decoration:none">Back to desk</a><button class="btn blue sm" id="csv">Download CSV</button><button class="btn sm" id="prt">Print or save PDF</button></div></div>
      <h1>Idea Exchange: Open Day report</h1>
      <div class="sub">${esc(CONFIG.eventLine)} · ${day} · ${D.market.status === "closed" ? "final results" : "live snapshot, market still open"}</div>
      <div class="kpis">
        <div><span>Players</span><b>${D.investors.length}</b></div><div><span>Staff</span><b>${staff}</b></div><div><span>Students</span><b>${stud}</b></div>
        <div><span>Ideas listed</span><b>${D.ideas.length}</b></div><div><span>Trades</span><b>${D.trades.length}</b></div><div><span>Points invested</span><b>${f0(vol)}</b></div>
      </div>
      <h2>Staff vs Students</h2>
      <div class="split"><div style="width:${sp}%;background:var(--orange)">Staff ${f0(D.sT)}</div><div style="width:${100 - sp}%;background:var(--blue);justify-content:flex-end">Students ${f0(D.uT)}</div></div>
      <h2>Winners</h2>
      <div class="winners">
        <div class="card"><span>Winning idea (IPO)</span><b>${w ? esc(w.name) : "—"}</b>${w ? `${esc(w.ownerName)} (${w.group}) · ${f2(w.price)} per share · ${f0(w.total)} pts raised` : ""}</div>
        <div class="card"><span>Top investor</span><b>${top ? esc(top.name) : "—"}</b>${top ? `${top.group} · net worth ${f0(top.net)} pts (${pct(top.net / CONFIG.startBalance - 1)})` : ""}</div>
        <div class="card"><span>Best pitch (ACE)</span><b>${bp ? esc(bp.ownerName) : "—"}</b>${bp ? `${esc(bp.name)} · ${f1(bp.ace)} / 3 from ${bp.rCount} ratings` : "No pitches rated yet"}</div>
      </div>
      <h2>All ideas, ranked</h2>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th>Ticker</th><th>Idea</th><th>Owner</th><th class="n">Price</th><th class="n">Raised</th><th class="n">Backers</th><th class="n">ACE</th><th class="n">A / C / E</th></tr></thead><tbody>
        ${D.ideas.map((i, n) => `<tr><td>${n + 1}</td><td><span class="tick">${esc(i.sym)}</span></td><td><b>${esc(i.name)}</b><br><span style="color:var(--ink-2)">${esc(i.pitch)}</span></td><td>${esc(i.ownerName)}<br><span class="chip ${i.group}">${i.group}</span></td><td class="n">${f2(i.price)}</td><td class="n">${f0(i.total)}</td><td class="n">${i.investors}</td><td class="n">${i.rCount ? f1(i.ace) : "—"}</td><td class="n">${i.rCount ? `${f1(i.aceA)} / ${f1(i.aceC)} / ${f1(i.aceE)}` : "—"}</td></tr>`).join("") || `<tr><td colspan="9">No ideas listed.</td></tr>`}
      </tbody></table></div>
      <h2>Top 10 investors</h2>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th>Name</th><th>Group</th><th class="n">Cash</th><th class="n">Shares value</th><th class="n">Net worth</th><th class="n">Return</th></tr></thead><tbody>
        ${D.investors.slice(0, 10).map((v, n) => `<tr><td>${n + 1}</td><td><b>${esc(v.name)}</b></td><td><span class="chip ${v.group}">${v.group}</span></td><td class="n">${f0(v.balance)}</td><td class="n">${f0(v.portfolio)}</td><td class="n">${f0(v.net)}</td><td class="n ${dir(v.net / CONFIG.startBalance - 1)}">${pct(v.net / CONFIG.startBalance - 1)}</td></tr>`).join("") || `<tr><td colspan="7">No players yet.</td></tr>`}
      </tbody></table></div>
      <p class="rep-foot">Prepared by the MBA (Leadership and Innovation) postgraduate group, UTAS Ibra. Price rule: 10 × (1 + points invested ÷ 2,000). ACE = audience rating on Reardon's Appropriateness, Consistency and Effectiveness, 1–3 each.</p>`;
    $("#prt").onclick = () => { try { window.print(); } catch {} };
    $("#csv").onclick = () => {
      const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const lines = [["Rank", "Ticker", "Idea", "Pitch", "Owner", "Group", "Price", "Points raised", "Backers", "ACE", "Appropriate", "Consistent", "Effective", "Ratings"].map(q).join(",")]
        .concat(D.ideas.map((i, n) => [n + 1, i.sym, i.name, i.pitch, i.ownerName, i.group, i.price.toFixed(2), i.total, i.investors, i.rCount ? i.ace.toFixed(2) : "", i.rCount ? i.aceA.toFixed(2) : "", i.rCount ? i.aceC.toFixed(2) : "", i.rCount ? i.aceE.toFixed(2) : "", i.rCount].map(q).join(",")));
      const blob = new Blob(["﻿" + lines.join("\n")], {type: "text/csv"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "utas-idea-exchange-report.csv"; document.body.appendChild(a); a.click(); a.remove();
    };
  }
  be.subscribe(render);
}

/* ---------------- boot ---------------- */
(async function boot() {
  let be = null;
  if (CONFIG.firebase && CONFIG.firebase.databaseURL) {
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js");
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js");
      be = firebaseBackend(CONFIG.firebase);
    } catch (e) { console.warn("Firebase failed, using demo mode", e); }
  }
  const h = location.hash.replace("#", "");
  if (!be) {
    be = localBackend();
    if (!Object.keys(be.peek().ideas).length && store.get("utas-ix-seeded") !== "3") { store.set("utas-ix-seeded", "3"); seedDemo(be); }
    const sim = () => store.get("ix-sim") !== "off";
    const nav = document.createElement("nav"); nav.className = "demo"; nav.setAttribute("aria-label", "Demo views");
    const draw = () => nav.innerHTML = `<span>DEMO</span><a href="#" class="${!h ? "on" : ""}">Big screen</a><a href="#trade" class="${h === "trade" ? "on" : ""}">Phone</a><a href="#admin" class="${h === "admin" || h === "report" ? "on" : ""}">Desk</a>${!h ? `<button class="${sim() ? "on" : ""}" id="simb">${sim() ? "● Visitors on" : "○ Visitors off"}</button>` : ""}`;
    draw(); document.body.appendChild(nav); document.body.classList.add("has-demo");
    nav.addEventListener("click", e => { if (e.target.id === "simb") { store.set("ix-sim", sim() ? "off" : "on"); draw(); } });
  }
  if (h === "trade") Phone(be); else if (h === "admin") Admin(be); else if (h === "report") Report(be); else Screen(be);
  addEventListener("hashchange", () => location.reload());
})();
</script>
</body>
</html>
