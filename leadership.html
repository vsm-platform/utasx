<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UTAS Leadership Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#232C7A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sister app to Idea Exchange, same UTAS tokens. Big screen: a live "Leadership Map" of six style bubbles on the left,
   style of the day + staff vs students + latest leaders on the right. Phone: join, 10 scenario questions, result card.
   Desk: spotlight, challenge prompts, PDF cards, CSV. One committed light look. */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#1B2559; --ink-2:#5A6488; --ink-3:#8E96B3; --line:#E3E7F2;
  --blue:#3B56A8; --navy:#2A338E; --night:#222B78;
  --orange:#F68922; --orange-2:#E66926; --orange-soft:#FFF0E0; --blue-soft:#E8EDFA;
  --up:#12A36B; --down:#E5484D; --down-soft:#FDECEC; --up-soft:#E2F6EC;
  --display:"Lexend","Arial Rounded MT Bold","Segoe UI",sans-serif;
  --body:"Figtree","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute}
.deco .d1{width:46vmax;left:-14vmax;bottom:-20vmax;opacity:.07;animation:drift 18s ease-in-out infinite}
.deco .d2{width:36vmax;right:-10vmax;top:-14vmax;opacity:.06;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(2vmax,-2vmax) rotate(4deg)}}
#app{position:relative;z-index:1}
.card{background:var(--surface);border-radius:var(--r);box-shadow:0 1px 2px rgba(27,37,89,.04),0 10px 30px rgba(27,37,89,.07)}
.chip{display:inline-flex;align-items:center;gap:.35em;font-weight:700;font-size:.72em;letter-spacing:.06em;text-transform:uppercase;padding:.28em .65em;border-radius:99px;white-space:nowrap}
.chip.staff{background:var(--orange-soft);color:#B4500E}
.chip.student{background:var(--blue-soft);color:var(--navy)}
.schip{display:inline-flex;align-items:center;gap:.35em;font-weight:700;font-size:.8em;padding:.25em .7em;border-radius:99px;color:#fff;white-space:nowrap}
.schip svg{width:1.1em;height:1.1em}
.brand{display:flex;align-items:center;gap:.65em}
.brand b{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1}
.brand b small{display:block;font-family:var(--body);font-size:.62em;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:.2em}
.brand .em{width:1.6em;height:auto;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:14px;padding:.95em 1.3em;font-weight:800;background:var(--night);color:#fff;transition:transform .15s,filter .2s;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.orange{background:var(--orange)}
.btn.blue{background:var(--blue)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:var(--down)}
.btn.sm{padding:.5em .8em;border-radius:10px;font-size:.85em}
.btn:disabled{opacity:.35;cursor:not-allowed}
.status{display:inline-flex;align-items:center;gap:.5em;font-weight:700;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;padding:.45em .9em;border-radius:99px;background:var(--up-soft);color:#0A7A4E;white-space:nowrap}
.status i{width:.6em;height:.6em;border-radius:50%;background:var(--up);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(18,163,107,.5)}80%,100%{box-shadow:0 0 0 .55em rgba(18,163,107,0)}}
.av{width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9em;color:#fff;flex:none}
.av.staff{background:var(--orange)} .av.student{background:var(--blue)}

/* demo navigator */
.demo{position:fixed;z-index:90;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:var(--night);color:#fff;border-radius:99px;padding:4px;box-shadow:0 8px 24px rgba(27,37,89,.3);font-size:12.5px;max-width:calc(100% - 20px);overflow-x:auto}
.demo a,.demo button{color:#C9D0EC;text-decoration:none;border:0;background:none;padding:.45em .85em;border-radius:99px;font-weight:700;white-space:nowrap}
.demo a.on{background:#fff;color:var(--night)}
.demo button.on{color:var(--orange)}
.demo span{padding:0 .4em 0 .7em;color:var(--orange);font-weight:800;letter-spacing:.06em;font-size:.85em}
body.has-demo.v-screen{padding-top:58px}
body.has-demo .app{padding-top:calc(60px + env(safe-area-inset-top,0px))}

/* ================= BIG SCREEN ================= */
body.v-screen{font-size:clamp(10px,.7vw + .25vh,30px);padding-block:1.1em}
@media (min-width:821px){body.v-screen{height:100vh;overflow:hidden}body.v-screen #app,.scr{height:100%}.side .panel{overflow:hidden}}
.scr{display:grid;gap:1em;grid-template-rows:auto minmax(0,1fr) auto}
.s-head{display:flex;align-items:center;gap:1.4em;flex-wrap:wrap}
.logo-card{background:#fff;border-radius:18px;padding:.7em 1.1em;box-shadow:0 6px 20px rgba(27,37,89,.06);display:flex;align-items:center}
.logo-card img{height:4.4em;width:auto;display:block}
.title-block b{display:block;font-family:var(--display);font-weight:800;font-size:2.5em;letter-spacing:-.035em;line-height:1}
.title-block b span{color:var(--orange)}
.title-block small{display:block;font-weight:600;color:var(--ink-2);font-size:1em;margin-top:.4em}
.s-head .mid{margin-left:auto;display:flex;align-items:center;gap:1.2em}
.bigcount{text-align:right}
.bigcount b{display:block;font-family:var(--display);font-size:2.3em;line-height:1;letter-spacing:-.03em}
.bigcount span{font-size:.8em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.scan{display:flex;align-items:center;gap:1em;background:var(--night);color:#fff;border-radius:22px;padding:.6em .6em .6em 1.2em;position:relative;overflow:hidden}
.scan::before{content:"";position:absolute;left:-2em;bottom:-2.5em;width:6em;height:6em;border-radius:50%;background:var(--orange);opacity:.25}
.scan b{display:block;font-family:var(--display);font-size:1.35em;font-weight:700;line-height:1.1;position:relative}
.scan span{font-size:.9em;color:#B9C2E6;position:relative}
.scan .hl{color:var(--orange);font-weight:800}
.qr{width:7em;height:7em;background:#fff;border-radius:12px;padding:.4em;display:grid;place-items:center;flex:none;position:relative}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.s-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.1em;min-height:0}
.panel{padding:1.1em 1.3em;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel h2{margin:0 0 .6em;font-family:var(--display);font-weight:700;font-size:1.25em;letter-spacing:-.01em;display:flex;align-items:center;gap:.5em}
.panel h2 small{font-family:var(--body);font-weight:600;font-size:.62em;color:var(--ink-3);margin-left:auto;letter-spacing:0}
.map{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.map svg{width:100%;height:100%;max-height:100%;display:block;overflow:visible}
.map .links line{stroke:#CDD4E8;stroke-width:2;stroke-dasharray:2 10;stroke-linecap:round;animation:flow 5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-120}}
.map .parts circle{transform-box:fill-box;animation:drift2 var(--d) ease-in-out infinite alternate}
@keyframes drift2{to{transform:translate(var(--dx),var(--dy))}}
.map .flt{cursor:pointer;animation:bob 5.5s ease-in-out infinite alternate;transition:opacity .5s;outline:none}
@keyframes bob{to{transform:translateY(-9px)}}
.map.focusing .flt{opacity:.74}
.map .flt.on{opacity:1}
.map .halo{fill:none;stroke-width:3;stroke-dasharray:5 9;stroke-linecap:round;opacity:0;transition:opacity .5s;transform-box:fill-box;transform-origin:center;animation:spin2 14s linear infinite}
.map .flt.on .halo,.map .flt:focus-visible .halo{opacity:1}
@keyframes spin2{to{transform:rotate(360deg)}}
.map .ring{fill:none;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
.map .ring.go{animation:ring 1.4s ease-out}
@keyframes ring{0%{opacity:.8;stroke-width:8;transform:scale(1)}100%{opacity:0;stroke-width:1;transform:scale(1.7)}}
.focus{display:flex;align-items:center;gap:.9em;background:var(--bg);border-radius:16px;padding:.6em .9em;min-height:4.2em}
.focus.swap{animation:fswap .5s cubic-bezier(.2,.9,.2,1)}
@keyframes fswap{from{opacity:0;transform:translateY(8px)}}
.focus .fic{width:2.8em;height:2.8em;border-radius:12px;display:grid;place-items:center;flex:none}
.focus .fic svg{width:1.6em;height:1.6em;color:#fff}
.focus .ftx{min-width:0;flex:1}
.focus .ftx b{display:block;font-family:var(--display);font-size:1.15em;letter-spacing:-.01em}
.focus .ftx b small{font-family:var(--body);font-size:.68em;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:.4em}
.focus .ftx span{color:var(--ink-2);font-size:.95em}
.focus .fst{text-align:right;flex:none;max-width:40%}
.focus .fst b{display:block;font-family:var(--display);font-size:1.7em;line-height:1}
.focus .fst span{color:var(--ink-2);font-size:.8em;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:1.1em;min-height:0;min-width:0}
.sotd{background:var(--night);color:#fff;position:relative;overflow:hidden}
.sotd h2{color:#fff}.sotd h2 small{color:#9AA5D6}
.sotd .row{display:flex;align-items:center;gap:1em;position:relative}
.sotd .ic{width:4.4em;height:4.4em;border-radius:22px;display:grid;place-items:center;flex:none}
.sotd .ic svg{width:2.6em;height:2.6em;color:#fff}
.sotd .nm{font-family:var(--display);font-weight:800;font-size:2em;letter-spacing:-.03em;line-height:1}
.sotd .tg{color:#C2CAEB;margin-top:.3em}
.sotd .pc{margin-left:auto;text-align:right}
.sotd .pc b{display:block;font-family:var(--display);font-size:2.4em;line-height:1;color:var(--orange)}
.sotd .pc span{font-size:.75em;color:#9AA5D6;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:.45em .8em;align-items:center;font-size:.95em}
.cmp .h{font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.cmp .lb{display:flex;align-items:center;gap:.45em;font-weight:700;white-space:nowrap}
.cmp .lb i{width:.75em;height:.75em;border-radius:3px;flex:none}
.cmp .bar{height:1em;border-radius:99px;background:var(--bg);position:relative;overflow:hidden}
.cmp .bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width 1s cubic-bezier(.2,.9,.2,1)}
.cmp .bar.s i{background:var(--orange)} .cmp .bar.u i{background:var(--blue)}
.cmp .bar span{position:absolute;right:.5em;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.7em;font-weight:700;color:var(--ink-2)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em;overflow:hidden}
.feed li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:.75em;align-items:center}
.feed li.in{animation:feedin .6s cubic-bezier(.2,.9,.2,1)}
@keyframes feedin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.feed .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .t span{color:var(--ink-3);font-size:.82em}
.tape{overflow:hidden;background:var(--night);color:#fff;border-radius:14px;white-space:nowrap}
.tape-in{display:inline-flex;gap:3em;padding:.75em 1.2em;animation:tape var(--dur,90s) linear infinite}
.tape-in span{display:inline-flex;gap:.6em;align-items:baseline;font-weight:600}
.tape-in em{font-style:normal;color:var(--orange);font-weight:800;letter-spacing:.06em;font-size:.85em}
@keyframes tape{to{transform:translateX(-50%)}}
.empty-map{text-align:center;color:var(--ink-2)}
.empty-map b{display:block;font-family:var(--display);font-size:1.6em;color:var(--ink);margin:.3em 0}

/* spotlight */
.spot{position:fixed;inset:0;z-index:75;background:radial-gradient(ellipse at 30% 40%,#2F3A8C,#171F5C 70%);color:#fff;display:grid;place-items:center;padding:2em;animation:fade .4s;overflow:hidden}
@keyframes fade{from{opacity:0}}
.spot::before{content:"";position:absolute;left:50%;top:-30%;width:70vw;height:130%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,255,255,.07) 175deg,rgba(255,255,255,.12) 180deg,rgba(255,255,255,.07) 185deg,transparent 200deg);pointer-events:none}
.spot-in{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3em;align-items:center;max-width:88em;width:100%}
.spot .lbl{display:inline-flex;align-items:center;gap:.6em;background:var(--orange);color:#fff;font-weight:800;letter-spacing:.2em;text-transform:uppercase;padding:.5em 1em;border-radius:99px}
.spot h1{font-family:var(--display);font-weight:800;font-size:4.6em;line-height:1;letter-spacing:-.04em;margin:.4em 0 .15em}
.spot .stl{display:flex;align-items:center;gap:.6em;font-family:var(--display);font-size:2.4em;font-weight:700;letter-spacing:-.02em}
.spot .stl i{width:1.4em;height:1.4em;border-radius:12px;display:grid;place-items:center}
.spot .stl svg{width:.9em;height:.9em;color:#fff}
.spot p{font-size:1.5em;color:#D5DBF3;max-width:28em;margin:.6em 0}
.spot .str{display:flex;gap:.6em;flex-wrap:wrap;margin-top:1em}
.spot .str span{background:rgba(255,255,255,.12);padding:.45em .9em;border-radius:99px;font-weight:700;font-size:1.15em}
.spot .rad{width:30em;height:30em;background:#fff;border-radius:50%;padding:1.5em;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.spot .rad img{width:100%;height:100%}
.spot-brand{position:absolute;left:2em;top:2em;background:#fff;border-radius:14px;padding:.5em .8em;z-index:1}
.spot-brand img{height:3.4em;display:block}
body.has-demo .spot-brand{top:4.5em}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}

/* ================= PHONE ================= */
body.v-quiz{padding-block:0 calc(30px + env(safe-area-inset-bottom,0px))}
.app{max-width:460px;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top,0px));position:relative}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:.8em;padding:.4em 0 .9em}
.p-head .brand b{font-size:1.1em}
.hero{text-align:center;padding:.6em .4em .4em}
.orbit{width:12em;height:12em;margin:0 auto;position:relative}
.orbit svg{width:100%;height:100%}
.orbit .spin{transform-origin:100px 100px;animation:spin 18s linear infinite}
.orbit .spin circle{transition:r .3s}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-family:var(--display);font-weight:800;font-size:2.1em;line-height:1.05;letter-spacing:-.04em;margin:.3em 0 .3em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{color:var(--ink-2);margin:0 auto;max-width:24em}
.facts{display:flex;justify-content:center;gap:.5em;margin-top:.9em;flex-wrap:wrap}
.facts span{background:#fff;border-radius:99px;padding:.35em .8em;font-weight:700;font-size:.82em;color:var(--ink-2);box-shadow:0 2px 8px rgba(27,37,89,.06)}
.form{padding:1.2em;display:flex;flex-direction:column;gap:1em;margin-top:1.2em}
.field{display:flex;flex-direction:column;gap:.4em}
.field label{font-weight:700;font-size:.85em;color:var(--ink-2)}
.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:.9em 1em;font-size:1.02em;width:100%;transition:border-color .2s,background .2s}
.field input:focus{border-color:var(--blue);background:#fff;outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:.85em .5em;font-weight:800;display:flex;align-items:center;justify-content:center;gap:.5em;transition:all .2s}
.seg button svg{width:1.4em;height:1.4em}
.seg button.staff[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.seg button.student[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.err{color:var(--down);font-weight:600;font-size:.9em;min-height:1.2em;margin:-.3em 0}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6em}
.qtop b{font-weight:800;color:var(--ink-2);font-size:.9em;letter-spacing:.06em;text-transform:uppercase}
.qtop button{border:0;background:none;color:var(--blue);font-weight:700}
.prog{height:.55em;border-radius:99px;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--blue));transition:width .5s cubic-bezier(.2,.9,.2,1)}
.qcard{padding:1.3em 1.2em;margin-top:1em;animation:qin .45s cubic-bezier(.2,.9,.2,1)}
@keyframes qin{from{opacity:0;transform:translateX(30px)}}
.qcard.back{animation-name:qback}
@keyframes qback{from{opacity:0;transform:translateX(-30px)}}
.qcard h2{font-family:var(--display);font-weight:700;font-size:1.3em;line-height:1.25;letter-spacing:-.02em;margin:0 0 1em;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:.6em}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:.9em 1em;font-weight:600;display:grid;grid-template-columns:2em 1fr;gap:.7em;align-items:center;transition:all .18s}
.opts button b{width:2em;height:2em;border-radius:10px;background:#fff;display:grid;place-items:center;font-family:var(--display);color:var(--blue);box-shadow:0 1px 3px rgba(27,37,89,.1)}
.opts button:hover{border-color:var(--blue)}
.opts button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.opts button.sel b{background:var(--orange);color:#fff}
.calc{text-align:center;padding:3em 1em}
.calc .orbit{width:10em;height:10em}
.calc .orbit .spin{animation-duration:1.4s}
.calc h2{font-family:var(--display);font-size:1.4em;margin:.8em 0 .2em}
.calc p{color:var(--ink-2);margin:0}
.res-hero{border-radius:26px;padding:1.4em 1.3em;color:#fff;position:relative;overflow:hidden;animation:pop .7s cubic-bezier(.2,1.3,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.res-hero .bgic{position:absolute;right:-1.2em;bottom:-1.6em;width:9em;height:9em;opacity:.18;color:#fff}
.res-hero .k{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.75em;opacity:.85}
.res-hero h1{font-family:var(--display);font-weight:800;font-size:2.15em;line-height:1.02;letter-spacing:-.04em;margin:.25em 0 .2em}
.res-hero .nick{font-weight:700;opacity:.9}
.res-hero p{margin:.7em 0 0;position:relative;font-size:.98em}
.radar-card{padding:1em;margin-top:.9em}
.radar-card img{width:100%;display:block}
.bars{display:flex;flex-direction:column;gap:.5em;margin-top:.4em}
.bars div{display:grid;grid-template-columns:7.2em 1fr 3em;gap:.6em;align-items:center;font-size:.88em;font-weight:700}
.bars .tr{height:.7em;background:var(--bg);border-radius:99px;overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.9,.2,1)}
.bars .num{text-align:right;color:var(--ink-2)}
.sect{padding:1em 1.1em;margin-top:.9em}
.sect h3{margin:0 0 .5em;font-family:var(--display);font-size:1em;letter-spacing:-.01em}
.sect p{margin:0;color:var(--ink-2)}
.strs{display:flex;gap:.45em;flex-wrap:wrap}
.strs span{background:var(--bg);padding:.4em .8em;border-radius:99px;font-weight:700;font-size:.88em}
.room{display:flex;align-items:center;gap:.9em}
.room .rp{font-family:var(--display);font-weight:800;font-size:2em;line-height:1;flex:none}
.actions{display:flex;flex-direction:column;gap:.6em;margin-top:1em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:96;background:var(--night);color:#fff;padding:.85em 1.2em;border-radius:16px;font-weight:700;font-size:.92em;max-width:calc(100% - 32px);transition:transform .35s cubic-bezier(.2,1.3,.3,1),opacity .25s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.bad{background:var(--down)}

/* ================= DESK ================= */
body.v-admin{padding-block:0 40px}
.adm{display:flex;flex-direction:column;gap:.9em;margin-top:.4em}
.adm .card{padding:1.1em 1.2em}
.adm h3{margin:0 0 .25em;font-size:1.05em}
.adm p{margin:0 0 .8em;color:var(--ink-2);font-size:.92em}
.adm .row-b{display:flex;gap:.6em;flex-wrap:wrap}
.adm .row-b .btn{flex:1 1 10em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6em}
.stats div{background:var(--bg);border-radius:14px;padding:.7em}
.stats span{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stats b{font-family:var(--display);font-size:1.3em}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:.7em 0;border-top:1px solid var(--line)}
.plist .top{display:flex;align-items:center;gap:.6em}
.plist .top .nm{flex:1;min-width:0}
.plist .top .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .acts{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.5em}
.plist .acts button{border:0;border-radius:10px;padding:.5em .75em;font-size:.82em;font-weight:700;background:var(--bg);color:var(--ink)}
.plist .acts .a1{background:var(--orange-soft);color:#9A440C}
.plist .acts .a2{background:var(--blue-soft);color:var(--navy)}
.plist .acts .a3{background:var(--up-soft);color:#0A7A4E}
.plist .acts .a4{background:var(--down-soft);color:#A3262A}
.chal{margin-top:.6em;background:var(--night);color:#fff;border-radius:14px;padding:.8em .9em;font-weight:600;animation:fade .3s}
.chal small{display:block;color:var(--orange);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.72em;margin-bottom:.3em}
.confirm{margin-top:.8em;padding:.9em;border-radius:14px;background:var(--down-soft);display:flex;flex-direction:column;gap:.7em;font-weight:600}
.link{font-family:var(--mono);font-size:.82em;word-break:break-all;background:var(--bg);padding:.6em .7em;border-radius:10px;display:block;margin-top:.3em}
.search{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:.65em .9em;width:100%;margin-bottom:.4em}

/* ================= LEADERSHIP CARD (PDF) ================= */
.cert-view{position:fixed;inset:0;z-index:91;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .3s}
body.has-demo .cert-view{padding-top:calc(62px + env(safe-area-inset-top,0px))}
.cv-bar{max-width:980px;margin:0 auto 1em;display:flex;gap:.8em;align-items:end;flex-wrap:wrap;justify-content:space-between}
.cv-bar .field{flex:1 1 14em}
.cv-bar .field input{background:#fff}
.cv-bar .acts{display:flex;gap:.5em}
.cv-hint{max-width:980px;margin:.9em auto 0;color:var(--ink-2);font-size:.88em;text-align:center}
.sheet-wrap{max-width:980px;margin:0 auto;container-type:inline-size;box-shadow:0 20px 60px rgba(27,37,89,.18);border-radius:6px;overflow:hidden}
.sheet{position:relative;width:100%;aspect-ratio:297/210;background:#fff;color:var(--ink);font-size:1.55cqw;line-height:1.4;overflow:hidden}
.sheet .c-frame{position:absolute;inset:4.5%;border:.13em solid var(--navy);border-radius:.6em}
.sheet .c-frame::after{content:"";position:absolute;inset:.45em;border:.06em solid var(--orange);border-radius:.4em}
.sheet .c-or{position:absolute;left:-2.5%;bottom:-5%;width:13%;height:auto}
.sheet .c-bl{position:absolute;right:-2.5%;top:-7%;width:13%;height:auto}
.sheet .c-in{position:absolute;inset:8% 11% 7.5%;display:flex;flex-direction:column}
.c-head{display:flex;flex-direction:column;align-items:center;text-align:center}
.c-logo{height:3.9em;width:auto}
.c-k{font-family:var(--display);font-weight:800;font-size:2.4em;letter-spacing:-.035em;color:var(--navy);margin-top:.3em;line-height:1}
.c-k span{color:var(--orange)}
.c-body{display:grid;grid-template-columns:minmax(0,1fr) 21em;gap:1.6em;align-items:center;flex:1;min-height:0}
.c-lead{color:var(--ink-2);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.72em}
.c-name{font-family:var(--display);font-weight:700;font-size:2.2em;letter-spacing:-.03em;line-height:1.1;margin:.1em 0 .35em;overflow-wrap:anywhere}
.c-style{display:flex;align-items:center;gap:.55em;margin:.15em 0 .2em}
.c-style i{width:2.6em;height:2.6em;border-radius:.7em;display:grid;place-items:center;flex:none}
.c-style i img{width:1.6em;height:1.6em}
.c-style b{display:block;font-family:var(--display);font-weight:800;font-size:1.9em;letter-spacing:-.03em;line-height:1}
.c-style small{display:block;font-weight:700;color:var(--ink-2);font-size:.85em;margin-top:.15em}
.c-desc{color:var(--ink-2);margin:.5em 0 .7em;font-size:.95em}
.c-strs{display:flex;gap:.4em;flex-wrap:wrap}
.c-strs span{padding:.28em .7em;border-radius:99px;font-weight:700;font-size:.78em;background:var(--bg)}
.c-tip{margin-top:.7em;font-size:.85em;color:var(--ink-2)}
.c-tip b{color:var(--ink)}
.c-radar img{width:100%;display:block}
.c-foot{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2.5em}
.c-sig{border-top:.07em solid var(--ink);padding-top:.4em;font-size:.8em;font-weight:700;min-height:4.1em;line-height:1.3}
.c-sig.r{text-align:right}
.c-sig small{display:block;font-weight:500;color:var(--ink-2)}
.c-mid{display:flex;flex-direction:column;align-items:center;gap:.25em}
.c-seal{width:4.8em;height:4.8em;display:block}
.c-date{font-size:.8em;font-weight:700;color:var(--ink-2);white-space:nowrap}

@media (max-width:820px){
  body.v-screen{font-size:12px}
  .s-main{grid-template-columns:1fr}
  .map{min-height:28em}
  .s-head .mid{margin-left:0}
  .scan{width:100%}
  .spot-in{grid-template-columns:1fr;text-align:center}
  .spot .stl,.spot .str{justify-content:center}
  .spot .rad{width:18em;height:18em;margin:0 auto}
  .spot h1{font-size:2.8em}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

  g += ORDER.map((k, i) => { const [x, y] = pt(i, Math.max(.04, (pct[k] || 0) / scale)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${STYLES[k].color}" stroke="#fff" stroke-width="2"/>`; }).join("");

function firebaseBackend(cfg) {

function localBackend() {
  const KEY = "utas-ll-demo-v1";
  const load = () => { try { return norm(JSON.parse(store.get(KEY))); } catch { return norm(); } };
  let st = load(), subs = [];

  const save = () => { store.set(KEY, JSON.stringify(st)); ch && ch.postMessage(1); emit(); };
  if (ch) ch.onmessage = () => { st = load(); emit(); };
  addEventListener("storage", e => { if (e.key === KEY) { st = load(); emit(); } });

    live: false, now: () => Date.now(),
    subscribe(cb) { subs.push(cb); cb(JSON.parse(JSON.stringify(st))); },
    peek: () => st,
    async submit(uid, rec, ts) { st = load(); st.people[uid] = {...rec, ts: ts || Date.now()}; save(); },

  };
}

function derive(st) {

const tweens = new WeakMap();
function countTo(el, to, fmt = f0, dur = 900) {
  if (!el) return; const from = el.dataset.v == null ? to : +el.dataset.v; el.dataset.v = to; cancelAnimationFrame(tweens.get(el));
  if (reduce || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now(); const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) tweens.set(el, requestAnimationFrame(step)); };

}

  const end = Date.now() + 2600;

      if (!me) { const t = setInterval(() => { if (me) { clearInterval(t); draw(); } }, 200); } else draw();
      setTimeout(() => { confetti(0, {x: innerWidth / 2, y: 200}); navigator.vibrate?.([40, 40, 80]); }, 400);
    } catch { stage = "quiz"; draw(); toast("Could not save your result. Check your internet and try again.", true); }
  }
  const seeds = QUESTIONS.map((_, i) => { const a = [0, 1, 2, 3]; let s = (uid.charCodeAt(1) + i * 7) % 97; for (let j = 3; j > 0; j--) { s = (s * 31 + 17) % 97; const r = s % (j + 1); [a[j], a[r]] = [a[r], a[j]]; } return a; });
  const shuffleFor = i => seeds[i];
  draw();
  be.subscribe(render);
}
function shade(hex) { const n = parseInt(hex.slice(1), 16), f = .72; return "#" + [n >> 16, n >> 8 & 255, n & 255].map(c => Math.round(c * f).toString(16).padStart(2, "0")).join(""); }

/* =====================================================================
   CONTROL DESK  (#admin)
   ===================================================================== */
function Admin(be) {
  document.body.classList.add("v-admin");
  let D, q = "", pending = null, openCh = {};
  $("#app").innerHTML = `<div class="app"><div class="p-head"><div class="brand">${EMBLEM()}<b>Control desk<small>UTAS Leadership Lab</small></b></div><span class="status"><i></i>Live</span></div><div id="ab"></div></div>`;
  function gate() {
    if (sess.get("ll-admin") === "1") return true;
    if (!$("#pinf")) {
      $("#ab").innerHTML = `<form class="card form" id="pinf"><div class="field"><label for="pin">Desk PIN</label><input id="pin" inputmode="numeric" autocomplete="off" placeholder="••••"></div><div class="err" id="pe"></div><button class="btn">Unlock</button></form>`;
      $("#pinf").onsubmit = e => { e.preventDefault(); if ($("#pin").value === CONFIG.adminPin) { sess.set("ll-admin", "1"); render(); } else $("#pe").textContent = "Wrong PIN."; };
    }
    return false;
  }
  let raw;
  function render(st) {
    if (st) raw = st; if (!raw) return; D = derive(raw);
    if (!gate()) return;
    const focus = document.activeElement?.id === "srch";
    const list = D.people.filter(p => !q || p.name.toLowerCase().includes(q.toLowerCase()));
    $("#ab").innerHTML = `<div class="adm">
      <div class="card"><div class="stats"><div><span>Leaders</span><b>${D.n}</b></div><div><span>Top style</span><b>${D.top ? STYLES[D.top].name : "—"}</b></div><div><span>Staff</span><b>${D.nS}</b></div><div><span>Students</span><b>${D.nU}</b></div></div></div>
      <div class="card"><h3>Participants</h3><p><b>Spotlight</b> shows a person's profile on the big screen for ${CONFIG.spotlightSeconds} seconds. <b>Challenge</b> gives you a quick question for their style. <b>Card</b> opens their PDF Leadership Card. <b>Remove</b> lets them retake the quiz.</p>
        <input class="search" id="srch" placeholder="Search by name" value="${esc(q)}">
        <ul class="plist">${list.map(p => `<li><div class="top"><span class="av ${p.group}">${esc(initials(p.name))}</span><span class="nm"><b>${esc(p.name)}</b><small style="color:var(--ink-3)">${p.group} · ${ago(p.ts)}</small></span><span class="schip" style="background:${STYLES[p.style].color}">${icon(p.style)}${STYLES[p.style].name}</span></div>
          <div class="acts"><button class="a1" data-spot="${p.id}">Spotlight</button><button class="a2" data-ch="${p.id}">Challenge</button><button class="a3" data-card="${p.id}">Card</button><button class="a4" data-del="${p.id}">Remove</button></div>
          ${openCh[p.id] != null ? `<div class="chal"><small>Challenge for ${STYLES[p.style].name} leaders</small>${CHALLENGES[p.style][openCh[p.id] % 2]}</div>` : ""}</li>`).join("") || `<li style="color:var(--ink-3)">${D.n ? "No match." : "No one has finished the quiz yet."}</li>`}</ul></div>
      <div class="card"><h3>Export</h3><p>Download every result as a spreadsheet (CSV) for your report.</p><div class="row-b"><button class="btn blue" id="csv">Download CSV</button></div></div>
      <div class="card"><h3>Reset</h3><p>Deletes every result. Do this right before the Open Day starts.</p><div class="row-b"><button class="btn ghost" id="b-reset">Reset everything</button>${!be.live ? `<button class="btn ghost" id="b-seed">Reload demo data</button>` : ""}</div><div id="cf"></div></div>
      <div class="card"><h3>Links</h3><p>Big screen<span class="link">${esc(baseURL())}</span></p><p>Phones (the QR code opens this)<span class="link">${esc(baseURL())}#quiz</span></p><p style="margin:0">Control desk<span class="link">${esc(baseURL())}#admin</span></p></div></div>`;
    const s = $("#srch"); s.oninput = e => { q = e.target.value; render(); }; if (focus) { s.focus(); s.setSelectionRange(q.length, q.length); }
    $("#ab").querySelectorAll("[data-spot]").forEach(x => x.onclick = () => be.setControl({spot: {uid: x.dataset.spot, at: be.now(), id: rid()}}).then(() => toast("Spotlight is on the big screen.")));
    $("#ab").querySelectorAll("[data-ch]").forEach(x => x.onclick = () => { const id = x.dataset.ch; openCh[id] = openCh[id] == null ? 0 : openCh[id] + 1; render(); });
    $("#ab").querySelectorAll("[data-card]").forEach(x => x.onclick = () => showCard(D.people.find(p => p.id === x.dataset.card)));
    $("#ab").querySelectorAll("[data-del]").forEach(x => x.onclick = () => { const p = D.people.find(y => y.id === x.dataset.del); ask(`Remove ${p.name}'s result? They can then retake the quiz.`, "Remove", () => be.remove(p.id)); });
    $("#b-reset").onclick = () => ask("Delete every result? This cannot be undone.", "Yes, reset", () => be.reset(false));
    $("#b-seed") && ($("#b-seed").onclick = () => be.reset(true));
    $("#csv").onclick = () => {
      const qv = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const rows = [["Name", "Group", "Style", "Match %", ...ORDER.map(k => STYLES[k].name + " %"), "Time"].map(qv).join(",")]
        .concat(D.people.map(p => [p.name, p.group, STYLES[p.style].name, p.pct[p.style], ...ORDER.map(k => p.pct[k]), new Date(p.ts).toLocaleString("en-GB")].map(qv).join(",")));
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + rows.join("\n")], {type: "text/csv"})); a.download = "utas-leadership-lab.csv"; document.body.appendChild(a); a.click(); a.remove();
    };
    if (pending) showAsk();
  }
  function ask(qs, label, fn) { pending = {qs, label, fn}; showAsk(); }
  function showAsk() {
    const c = $("#cf"); if (!c) return;
    c.innerHTML = `<div class="confirm">${esc(pending.qs)}<div class="row-b"><button class="btn red" id="cy">${esc(pending.label)}</button><button class="btn ghost" id="cn">Cancel</button></div></div>`;
    c.scrollIntoView({behavior: "smooth", block: "center"});
    $("#cy").onclick = async () => { const p = pending; pending = null; await p.fn(); toast("Done."); };
    $("#cn").onclick = () => { pending = null; c.innerHTML = ""; };
  }
  be.subscribe(render);
}

/* ---------------- boot ---------------- */
(async function boot() {
  let be = null;
  if (CONFIG.firebase && CONFIG.firebase.databaseURL) {
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js");
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js");
      be = firebaseBackend(CONFIG.firebase);
    } catch (e) { console.warn("Firebase failed, using demo mode", e); }
  }
  const h = location.hash.replace("#", "");
  if (!be) {
    be = localBackend();
    if (!Object.keys(be.peek().people).length && store.get("utas-ll-seeded") !== "1") { store.set("utas-ll-seeded", "1"); seedDemo(be); }
    const sim = () => store.get("ll-sim") !== "off";
    const nav = document.createElement("nav"); nav.className = "demo"; nav.setAttribute("aria-label", "Demo views");
    const draw = () => nav.innerHTML = `<span>DEMO</span><a href="#" class="${!h ? "on" : ""}">Big screen</a><a href="#quiz" class="${h === "quiz" ? "on" : ""}">Phone</a><a href="#admin" class="${h === "admin" ? "on" : ""}">Desk</a>${!h ? `<button class="${sim() ? "on" : ""}" id="simb">${sim() ? "● Visitors on" : "○ Visitors off"}</button>` : ""}`;
    draw(); document.body.appendChild(nav); document.body.classList.add("has-demo");
    nav.addEventListener("click", e => { if (e.target.id === "simb") { store.set("ll-sim", sim() ? "off" : "on"); draw(); } });
  }
  if (h === "quiz") Quiz(be); else if (h === "admin") Admin(be); else Screen(be);
  addEventListener("hashchange", () => location.reload());
})();
</script>
