@keyframes up{from{transform:translateY(1em);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{width:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.35em)}}
.u{animation:up .7s cubic-bezier(.2,.8,.3,1) both}
.d1{animation-delay:.25s}.d2{animation-delay:.6s}.d3{animation-delay:.95s}.d4{animation-delay:1.3s}.d5{animation-delay:1.65s}

/* ============ PROJECTOR ============ */
.scr{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;font-size:clamp(14px,1.16vw,30px);overflow:hidden;
  background:radial-gradient(80em 40em at 50% 0%,#132a55 0%,transparent 60%),linear-gradient(180deg,#081329,#040a16)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:1.4vh 2vw}
.logo{display:flex;align-items:center;gap:.7em}
.logo svg{width:2.2em;height:2.2em}
.logo b{font-family:var(--D);font-weight:800;font-size:1.35em;letter-spacing:.04em;line-height:1}
.logo small{display:block;font-family:var(--M);font-weight:700;font-size:.6em;letter-spacing:.2em;color:var(--glow);margin-top:.35em}
.motion{font-weight:700;color:var(--mute);font-size:.85em;text-align:right;max-width:46em;line-height:1.35}
.motion b{color:#fff}
.chip{display:inline-flex;align-items:center;gap:.4em;border:1px solid var(--line);background:#ffffff0d;border-radius:.55em;padding:.35em .75em;font-family:var(--M);font-weight:800;font-size:.75em;margin-left:.6em}
.chip.on{border-color:var(--ok);color:var(--ok)}

/* route: the path of our case, always visible during our turns */
.route{display:flex;align-items:center;gap:.4em;padding:0 2vw 1.2vh;min-height:2.6em}
.rt{display:flex;align-items:center;gap:.5em;font-family:var(--M);font-weight:800;font-size:.72em;letter-spacing:.12em;color:#ffffff55;white-space:nowrap}
.rt i{width:1.9em;height:1.9em;border-radius:50%;border:2px solid #ffffff33;display:grid;place-items:center;font-style:normal;font-size:.95em}
.rt.done{color:#ffffffaa}.rt.done i{background:#ffffff22;border-color:transparent}
.rt.cur{color:var(--glow)}.rt.cur i{background:var(--glow);border-color:var(--glow);color:#04132a;box-shadow:0 0 0 .35em #4fd1ff33}
.rline{flex:1;height:2px;background:#ffffff1f;min-width:1em}
.rline.done{background:#ffffff66}

.main{padding:0 3vw;min-height:0;display:flex;align-items:center;justify-content:center}
.foot{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:1.2vh 2vw 1.8vh}
.who{display:flex;align-items:center;gap:.8em;font-weight:700;color:var(--mute)}
.who b{color:#fff}
.tag{font-family:var(--M);font-weight:800;font-size:.75em;letter-spacing:.16em;padding:.4em .8em;border-radius:.45em;background:var(--tc);color:#04132a}
.dots{display:flex;gap:.45em}
.dots i{width:.6em;height:.6em;border-radius:50%;background:#ffffff26}
.dots i.on{background:var(--tc);box-shadow:0 0 0 .25em color-mix(in srgb,var(--tc) 30%,transparent)}
.dots i.done{background:#ffffff66}

/* beat visuals */
.v{width:100%;max-width:72em;display:flex;flex-direction:column;align-items:center;gap:2.4vh;text-align:center}
.kick{font-family:var(--M);font-weight:800;color:var(--red);letter-spacing:.2em;font-size:.85em;display:inline-flex;align-items:center;gap:.6em}
.kick i{width:.6em;height:.6em;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.kick.b{color:var(--glow)}.kick.b i{background:var(--glow)}
.h{font-family:var(--D);font-weight:800;font-size:3.4em;line-height:1.05;letter-spacing:-.03em}
.h em{font-style:normal;color:var(--glow)} .h s{text-decoration:none;color:var(--red)}
.sub{color:var(--mute);font-weight:700;font-size:1.25em;line-height:1.45;max-width:40em}
.src{font-family:var(--M);font-weight:700;font-size:.8em;letter-spacing:.06em;color:var(--mute)}

.leaders{display:grid;grid-template-columns:1fr 1fr;gap:1.6em;width:100%}
.ld{background:var(--panel);border:1px solid var(--line);border-radius:1.2em;padding:1.6em 1.6em 1.8em;text-align:left;position:relative}
.ld small{font-family:var(--M);font-weight:800;font-size:.8em;letter-spacing:.18em;color:var(--mute)}
.ld p{font-family:var(--D);font-weight:800;font-size:1.9em;line-height:1.2;margin-top:.5em}
.ld.a{opacity:.55}
.ld.b{border-color:var(--glow);box-shadow:0 0 0 .3em #4fd1ff1f,0 20px 50px -20px #4fd1ff66}
.ld.b small{color:var(--glow)}
.stamp{position:absolute;top:-1em;right:1.2em;background:var(--glow);color:#04132a;font-family:var(--M);font-weight:800;font-size:.8em;letter-spacing:.14em;padding:.5em .9em;border-radius:.5em;animation:pop .6s 1s both}

.clocks{display:grid;grid-template-columns:1fr 1fr;gap:2em}
.dial{background:var(--panel);border:1px solid var(--line);border-radius:1.4em;padding:1.4em 2em;text-align:center}
.dial svg{width:min(14em,30vh);height:min(14em,30vh)}
.dial h5{font-family:var(--M);font-weight:800;font-size:.9em;letter-spacing:.18em;margin-top:.6em}
.dial p{color:var(--mute);font-weight:700;font-size:1em;margin-top:.3em}
.dial.inv h5{color:var(--amber)} .dial.pub h5{color:var(--red)}
.hand{transform-origin:60px 60px}
.inv .hand{animation:spin 120s linear infinite}
.pub .hand{animation:spin 3s linear infinite}
.pub .hand2{transform-origin:60px 60px;animation:spin 36s linear infinite}

.eq{display:flex;align-items:stretch;gap:1em;width:100%;justify-content:center}
.eq .op{font-family:var(--D);font-weight:800;font-size:2.4em;color:var(--mute);align-self:center}
.tile{flex:1;max-width:17em;background:var(--paper);color:var(--ink);border-radius:1.1em;padding:1.3em 1.2em 1.5em;border-top:.45em solid var(--cc);text-align:left}
.tile i{font-style:normal;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:.6em;background:var(--cc);color:#fff;font-family:var(--D);font-weight:800;font-size:1.2em}
.tile b{display:block;font-family:var(--D);font-weight:800;font-size:1.55em;line-height:1.15;margin-top:.6em}
.tile span{display:block;color:var(--ink2);font-weight:700;margin-top:.4em;line-height:1.35}
.tile.dash{background:transparent;border:2px dashed #ffffff33;border-top:.45em solid #ffffff22}
.tile.dash *{visibility:hidden}

.vac{position:relative;width:min(44em,90%);height:min(22em,42vh)}
.bub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15em;height:8em;border:3px dashed #ffffff55;border-radius:1.4em;display:grid;place-items:center;color:var(--mute);font-family:var(--M);font-weight:800;letter-spacing:.14em;font-size:.9em}
.bub::after{content:"";position:absolute;bottom:-1.3em;left:3em;border:.7em solid transparent;border-top-color:#ffffff55}
.rum{position:absolute;background:#ff3b4e1f;border:1px solid #ff3b4e88;color:#ffd0d5;font-weight:800;font-size:1.15em;padding:.5em .9em;border-radius:.8em;animation:pop .5s both,float 3s ease-in-out infinite}

.bars{width:min(52em,95%);display:flex;flex-direction:column;gap:1.4em;text-align:left}
.brow small{display:block;font-weight:800;font-size:1.1em;margin-bottom:.45em}
.brow small span{color:var(--mute);font-weight:700}
.btrack{height:2.6em;background:#ffffff10;border-radius:.6em;overflow:hidden}
.bfill{height:100%;border-radius:.6em;display:flex;align-items:center;justify-content:flex-end;padding:0 .9em;font-family:var(--M);font-weight:800;color:#04132a;animation:grow 1.4s cubic-bezier(.2,.8,.3,1) both}

.rule{display:flex;gap:1.2em;flex-wrap:wrap;justify-content:center}
.rule span{font-family:var(--D);font-weight:800;font-size:3.6em;letter-spacing:-.02em}
.rule span:nth-child(2){color:var(--glow)}

.quote{background:var(--paper);color:var(--ink);border-radius:1.4em;padding:1.8em 2.2em;max-width:50em;text-align:left;border-left:.5em solid var(--glow)}
.quote p{font-family:var(--D);font-weight:800;font-size:2em;line-height:1.25}
.quote p em{font-style:normal;color:#0a7fb0}
.quote .src{color:#5b6b87;margin-top:1em;display:block}

.bigq{font-family:var(--D);font-weight:800;font-size:12em;line-height:.9;color:var(--amber);animation:pop .7s both}

.phone{background:var(--paper);color:var(--ink);border-radius:1.4em;padding:1.3em 1.5em;max-width:40em;width:100%;text-align:left;box-shadow:0 30px 60px -25px #000}
.phone .ph{display:flex;align-items:center;gap:.6em;font-weight:800;color:var(--ink2);font-size:.9em}
.phone .ph i{width:1.6em;height:1.6em;border-radius:.45em;background:var(--red);display:grid;place-items:center;color:#fff;font-style:normal;font-family:var(--D);font-size:.9em}
.phone .ph span{margin-left:auto;font-family:var(--M);font-size:.85em;color:#6a7a96}
.phone .msg{margin-top:.8em;display:flex;flex-direction:column;gap:.55em}
.phone .ln{font-weight:700;font-size:1.3em;line-height:1.35;padding-left:.8em;border-left:.25em solid var(--cc)}
.phone .ln b{font-family:var(--M);font-size:.7em;letter-spacing:.14em;color:var(--cc);display:block}

.fork{display:grid;grid-template-columns:1fr 1fr;gap:1.6em;width:min(46em,95%)}
.fork div{border-radius:1em;padding:1.1em;font-family:var(--D);font-weight:800;font-size:2em}
.fork div:first-child{background:var(--glow);color:#04132a}
.fork div:last-child{background:#ffffff14;border:2px solid #ffffff33}

.checks{display:flex;flex-direction:column;gap:1em;text-align:left}
.ck1{display:flex;align-items:center;gap:.8em;font-family:var(--D);font-weight:800;font-size:2.1em}
.ck1 i{font-style:normal;width:1.4em;height:1.4em;border-radius:.4em;background:var(--ok);color:#04132a;display:grid;place-items:center;font-size:.8em}
.ck1 span{color:var(--mute);font-weight:700;font-size:.6em;font-family:var(--B)}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:1.2em;align-items:center;width:min(60em,96%)}
.vs div{border-radius:1em;padding:1.2em;font-family:var(--D);font-weight:800;font-size:1.7em;line-height:1.2}
.vs .x{background:#ffffff0d;border:2px solid #ffffff22;color:var(--mute);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:.12em}
.vs .y{background:var(--glow);color:#04132a}
.vs b{font-family:var(--M);color:var(--mute);font-size:1.1em}

.final3{display:flex;gap:.6em 1em;font-family:var(--D);font-weight:800;font-size:3.2em;flex-wrap:wrap;justify-content:center}
.final3 span{animation:up .7s both}
.final3 span:nth-child(2){animation-delay:.5s;color:var(--glow)} .final3 span:nth-child(3){animation-delay:1s}

.neutral .who2{font-family:var(--D);font-weight:800;font-size:4.6em;letter-spacing:-.03em;line-height:1}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:.5em;max-width:60em}
.seq span{font-weight:700;font-size:.85em;padding:.4em .8em;border-radius:99px;background:#ffffff0d;border:1px solid var(--line);color:var(--mute)}
.seq span.cur{background:var(--tc);color:#04132a;border-color:transparent}
.seq span.done{opacity:.4}

.welcome .teams{margin-top:min(1.4em,2.2vh)}.welcome .team{padding:min(1em,1.6vh) 1.2em}.welcome .course{margin-top:min(1em,1.6vh)}
.welcome{width:100%;display:grid;grid-template-columns:1.25fr 1fr;gap:2.4vw;align-items:center;text-align:left}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:1em;margin-top:1.4em}
.team{background:var(--panel);border:1px solid var(--line);border-top:.3em solid var(--tc);border-radius:1em;padding:1em 1.2em}
.team small{font-family:var(--M);font-weight:800;font-size:.7em;letter-spacing:.18em;color:var(--tc)}
.team b{display:block;font-family:var(--D);font-weight:800;font-size:1.5em;margin-top:.3em}
.team span{color:var(--mute);font-weight:700;font-size:.9em}
.pair{background:var(--paper);color:var(--ink);border-radius:1.1em;padding:1.2em;display:flex;gap:1.1em;align-items:center;justify-self:end;max-width:24em}
.pair #qr{width:min(7em,14vh);height:min(7em,14vh);flex:none;overflow:hidden;line-height:0}
.pair #qr img,.pair #qr canvas{width:100%!important;height:100%!important;display:block}
.pair #qr img+canvas,.pair #qr canvas:has(+img[style*="block"]){display:none!important}
.pair small{font-family:var(--M);font-weight:800;font-size:.66em;letter-spacing:.16em;color:#6a7a96}
.pair b{display:block;font-family:var(--M);font-weight:800;font-size:2.4em;letter-spacing:.12em;line-height:1.1}
.pair p{font-size:.78em;color:#6a7a96;font-weight:600;line-height:1.35}

.vid{width:100%;height:100%;position:relative;border-radius:1.2em;overflow:hidden;background:#000;border:1px solid var(--line)}
.vid video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.vid .miss{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--mute);font-weight:700;padding:2em}
.vid.missing .miss{display:grid}
.btn{display:inline-flex;align-items:center;gap:.6em;background:var(--red);color:#fff;font-weight:800;font-size:1.2em;padding:.85em 1.6em;border-radius:.8em;box-shadow:0 0 0 .3em #ff3b4e33,0 14px 30px -12px #ff3b4e99}
.arm{position:fixed;inset:0;z-index:50;background:#050d1cf2;display:grid;place-items:center;text-align:center;cursor:pointer}
.arm b{font-family:var(--D);font-size:2.2em;font-weight:800;display:block;margin-bottom:.4em}
.arm p{color:var(--mute);font-weight:700}

.fx{display:flex;align-items:center;gap:.4em;font-family:var(--D);font-weight:800;font-size:3.6em;flex-wrap:wrap;justify-content:center}
.fx b{color:var(--mute)} .fx .amb{color:var(--red);animation:up .7s .95s both,blink 1.2s 2.2s 3}
.rums{display:flex;gap:.7em;flex-wrap:wrap;justify-content:center}
.rum2{background:#ff3b4e1f;border:1px solid #ff3b4e88;color:#ffd0d5;font-weight:800;font-size:1.1em;padding:.45em .9em;border-radius:.8em;animation:pop .5s both}
.curve{width:min(40em,90%);height:auto}
.curve .cv{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.desk{display:flex;align-items:flex-end;gap:.5em;font-size:2.6em}
.desk>span{animation:pop .5s both}
.agent{margin-left:.6em;display:flex;flex-direction:column;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:.4em;padding:.15em .4em}
.agent small{font-size:.28em;font-weight:800;color:var(--amber);font-family:var(--B)}
.uni{display:inline-flex;align-items:center;gap:.15em;background:#fff;border-radius:1em;padding:.7em 1.3em .7em 1.1em;box-shadow:0 18px 40px -20px #000;position:relative;overflow:hidden}
.uni .ut{display:block;height:min(6.2em,12vh);width:auto;position:relative;z-index:4}
/* the U mark only: soft rays, a breathing halo, a light that glides over the mark, and a gentle 3D tilt that follows the mouse */
.um{position:relative;height:min(6.7em,13vh);aspect-ratio:232/316;perspective:600px;cursor:pointer}
.um .mk{position:relative;z-index:3;height:100%;width:100%;display:block;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s ease-out;animation:mfloat 6s ease-in-out infinite}
.um .rclip{position:absolute;top:-70%;bottom:-70%;left:-12%;right:-90%;overflow:hidden;z-index:1;pointer-events:none;
  -webkit-mask:linear-gradient(to right,transparent 0,#000 22%);mask:linear-gradient(to right,transparent 0,#000 22%)}
.um .rays{position:absolute;left:30.7%;top:50%;width:135%;aspect-ratio:1;translate:-50% -50%;
  background:repeating-conic-gradient(from 0deg,rgba(243,140,40,.20) 0 5deg,transparent 5deg 15deg,rgba(60,90,170,.14) 15deg 20deg,transparent 20deg 30deg);
  -webkit-mask:radial-gradient(circle closest-side,#000 18%,transparent 100%);mask:radial-gradient(circle closest-side,#000 18%,transparent 100%);
  animation:spin 40s linear infinite}
.um .halo{position:absolute;inset:-25% -30%;z-index:2;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(243,140,40,.22),rgba(60,90,170,.10) 55%,transparent 75%);animation:hpulse 4s ease-in-out infinite}
.um .shine{position:absolute;inset:0;z-index:4;pointer-events:none;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s ease-out;
  -webkit-mask:var(--mk) center/100% 100% no-repeat;mask:var(--mk) center/100% 100% no-repeat;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%) no-repeat;background-size:300% 100%;background-position:150% 0;animation:mshine 5s 1.2s ease-in-out infinite}
.um.burst .rays{animation-duration:3s}.um.burst .halo{animation:hburst .9s ease-out}

/* ---- logo effect options (U mark only) ---- */
.um .fx{display:none}
.fx-rays .rays{background:repeating-conic-gradient(from 0deg,rgba(243,140,40,.55) 0 5deg,transparent 5deg 15deg,rgba(60,90,170,.40) 15deg 20deg,transparent 20deg 30deg)!important;animation-duration:22s!important}
.fx-rays .halo{background:radial-gradient(closest-side,rgba(243,140,40,.45),rgba(60,90,170,.18) 55%,transparent 75%)!important}
.fx-orbit .rays,.fx-rings .rays,.fx-sparkle .rays,.fx-none .rays,.fx-none .halo,.fx-none .shine{display:none}
.fx-orbit .orb{display:block;position:absolute;left:50%;top:50%;width:165%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:1.5px dashed rgba(60,90,170,.25);z-index:2;animation:spin 5s linear infinite;pointer-events:none}
.fx-orbit .orb.o2{width:125%;border-color:rgba(243,140,40,.25);animation-duration:3.4s;animation-direction:reverse}
.orb::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#f38c28;box-shadow:0 0 10px 4px rgba(243,140,40,.7),-14px 4px 0 -3px rgba(243,140,40,.45),-26px 10px 0 -4px rgba(243,140,40,.25)}
.orb.o2::before{background:#3c5aaa;box-shadow:0 0 10px 4px rgba(60,90,170,.6),14px 4px 0 -3px rgba(60,90,170,.4),26px 10px 0 -4px rgba(60,90,170,.2)}
.fx-rings .ring{display:block;position:absolute;left:30.7%;top:50%;width:46%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:3px solid rgba(243,140,40,.8);animation:ringout 2.7s ease-out infinite;opacity:0}
.fx-rings .ring.r2{border-color:rgba(60,90,170,.75);animation-delay:.9s}.fx-rings .ring.r3{animation-delay:1.8s}
@keyframes ringout{0%{scale:.55;opacity:.9}100%{scale:2.4;opacity:0}}
.fx-sparkle .shine{background:linear-gradient(115deg,transparent 36%,#fff 50%,transparent 64%) no-repeat!important;background-size:300% 100%!important;animation-duration:3.2s!important}
.fx-sparkle .spk{display:block;position:absolute;z-index:5;color:#f5a623;font-size:1.1em;line-height:1;pointer-events:none;text-shadow:0 0 8px rgba(245,166,35,.8);animation:twinkle 2.4s ease-in-out infinite;opacity:0}
@keyframes twinkle{0%,100%{opacity:0;scale:.3;rotate:0deg}45%{opacity:1;scale:1;rotate:45deg}60%{opacity:.9}}
.logos{min-height:100vh;padding:4vh 4vw;display:grid;grid-template-columns:1fr 1fr;gap:4vh 4vw;align-content:center;font-size:clamp(14px,1.2vw,28px);background:linear-gradient(180deg,#081329,#040a16)}
.logos figure{display:flex;flex-direction:column;align-items:flex-start;gap:1em}
.logos figcaption{font-family:var(--D);font-weight:800;font-size:1.4em}.logos figcaption span{display:block;font-family:var(--B);font-weight:600;font-size:.62em;color:var(--mute);margin-top:.2em}
@keyframes mfloat{0%,100%{translate:0 0}50%{translate:0 -3%}}
@keyframes hpulse{0%,100%{opacity:.55;scale:.92}50%{opacity:1;scale:1.06}}
@keyframes hburst{0%{opacity:1;scale:.9}40%{opacity:1;scale:1.35}100%{opacity:.6;scale:1}}
@keyframes mshine{0%{background-position:150% 0}35%,100%{background-position:-50% 0}}
.course{margin-top:1em;line-height:1.35}.course b{display:block;font-family:var(--D);font-weight:800;font-size:1.35em;color:#fff}.course span{display:block;font-weight:700;font-size:1em;color:var(--glow)}

/* hand-over line on the final slide */
.handover{margin-top:1.6em;font-weight:700;font-size:1.35em;color:var(--mute)}
.handover b{color:var(--opp)}

/* subtle glint on main text boxes */
@property --ga{syntax:"<angle>";inherits:false;initial-value:0deg}
.glint{position:relative}
.glint::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(115deg,transparent 42%,rgba(255,206,110,.30) 50%,transparent 58%) no-repeat;background-size:300% 100%;background-position:150% 0;
  animation:gsweep 8s ease-in-out infinite;animation-delay:var(--gd,1.4s)}
.glint::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--ga),transparent 0 82%,rgba(255,200,90,.85) 90%,transparent 98%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:gring 9s linear infinite;animation-delay:var(--gd,1.4s);opacity:.9}
@keyframes gsweep{0%{background-position:150% 0}22%,100%{background-position:-50% 0}}
@keyframes gring{to{--ga:360deg}}
/* one gentle light pass over the university logo when the page opens */
@keyframes gsweep1{to{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){.glint::before,.glint::after{animation:none;display:none}.um *{animation:none!important;transition:none!important}}
@media print{.glint::before,.glint::after,.um .rclip,.um .halo,.um .shine{display:none}}
/* ============ COCKPIT ============ */
.ck{min-height:100vh;display:flex;flex-direction:column;font-size:16px;background:var(--night)}
.ck-top{display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.ck-top b{font-family:var(--D);font-size:15px}
.ck-top span{font-family:var(--M);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--mute)}
.ck-top .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.ck-top .dot.off{background:var(--amber)}
.ck-body{flex:1;padding:14px 16px 120px;display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.ck-head small{font-family:var(--M);font-weight:800;font-size:11px;letter-spacing:.14em;color:var(--tc)}
.ck-head h2{font-family:var(--D);font-weight:800;font-size:22px;line-height:1.15;margin-top:3px}
.ck-head p{color:var(--mute);font-weight:700;font-size:14px;margin-top:3px}
.ck-dots{display:flex;gap:6px;margin-top:8px}
.ck-dots i{flex:1;height:5px;border-radius:99px;background:#ffffff1f}
.ck-dots i.done{background:#ffffff66}.ck-dots i.on{background:var(--tc)}
.sayb{background:var(--paper);color:var(--ink);border-radius:16px;padding:16px 16px 18px;border-left:6px solid var(--tc)}
.sayb h4{font-family:var(--M);font-weight:800;font-size:10.5px;letter-spacing:.16em;color:#6a7a96;margin-bottom:8px}
.sayb p{font-size:21px;font-weight:600;line-height:1.5}
.sayb p b{font-weight:800;color:#0a5f86}
.cl{list-style:none;display:flex;flex-direction:column;gap:10px}
.cl li{font-size:21px;font-weight:800;line-height:1.3;padding-left:22px;position:relative}
.cl li::before{content:"";position:absolute;left:2px;top:.5em;width:9px;height:9px;border-radius:50%;background:var(--tc)}
.full summary{font-family:var(--M);font-weight:800;font-size:11px;letter-spacing:.14em;color:var(--mute);cursor:pointer}
.full p{margin-top:8px;font-weight:600;line-height:1.5;color:#dfe8f7}.full p b{color:#fff}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.box h4{font-family:var(--M);font-weight:800;font-size:10.5px;letter-spacing:.16em;color:var(--mute);margin-bottom:8px}
.box p{font-weight:700;line-height:1.45}
.job{border-color:#ffb54766;background:#ffb54714}
.pairs{display:flex;flex-direction:column;gap:10px}
.pairs div{font-size:15px;line-height:1.4}
.pairs b{display:block;color:var(--amber);font-size:13px}
.peek{color:var(--mute);font-weight:700;font-size:14px;line-height:1.4}
.peek b{color:#fff}
.ck-ctrl{position:fixed;left:0;right:0;bottom:0;background:#050d1cf2;border-top:1px solid var(--line);padding:10px 16px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 2.6fr;gap:10px;backdrop-filter:blur(6px)}
.ck-ctrl button{border-radius:14px;padding:18px 6px;font-weight:800;font-size:15px;background:#ffffff14;border:1px solid var(--line)}
.ck-ctrl .nx{background:var(--glow);color:#04132a;font-size:18px;border:0}
.land{min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:28px 18px;max-width:520px;margin:0 auto}
.land h1{font-family:var(--D);font-weight:800;font-size:30px;line-height:1.1}
.land p{color:var(--mute);font-weight:600;line-height:1.5}
.land a,.land button.big{display:block;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;font-weight:800;color:#fff;text-decoration:none}
.land a.pri{background:var(--glow);color:#04132a;border:0}
.inp{width:100%;border:1px solid var(--line);background:#ffffff0d;color:#fff;border-radius:12px;padding:14px;font-family:var(--M);font-weight:800;font-size:22px;letter-spacing:.25em;text-transform:uppercase;outline:none}
/* iPad-friendly cockpit */
.ck-top{padding:max(10px,env(safe-area-inset-top)) 20px 8px}
.ck-body{max-width:940px;padding:18px 22px 130px;gap:16px}
.ck-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ck-head h2{font-size:clamp(22px,3vw,34px);margin:0}
.whotag{font-family:var(--M);font-weight:800;font-size:clamp(12px,1.5vw,16px);letter-spacing:.12em;text-transform:uppercase;background:var(--tc);color:#04132a;padding:6px 12px;border-radius:8px}
.sayb{padding:clamp(18px,2.6vw,30px) clamp(18px,3vw,34px)}
.cl{gap:clamp(10px,1.6vw,18px)}
.cl li{font-size:clamp(22px,3.3vw,38px);line-height:1.25;padding-left:clamp(22px,2.8vw,32px)}
.cl li::before{width:clamp(9px,1.1vw,13px);height:clamp(9px,1.1vw,13px)}
.job p{font-size:clamp(16px,2vw,22px)}
.pairs div{font-size:clamp(15px,1.8vw,19px)}
.peek{font-size:clamp(14px,1.8vw,20px)}
.ck-ctrl{padding:12px 22px max(16px,env(safe-area-inset-bottom));max-width:100%}
.ck-ctrl button{padding:clamp(18px,2.4vw,26px) 6px;font-size:clamp(15px,2vw,22px)}
.ck-ctrl .nx{font-size:clamp(18px,2.5vw,28px)}
@media (min-width:700px){.ck-ctrl{grid-template-columns:1fr 3fr;padding-left:max(22px,calc(50vw - 470px));padding-right:max(22px,calc(50vw - 470px))}}


/* bigger reminder card, swipe and details */
html,body{overscroll-behavior-x:none}
.ck{touch-action:pan-y}
.ck-prog{height:4px;background:#ffffff14}.ck-prog i{display:block;height:100%;background:var(--tc);transition:width .3s}
.sayb.big{padding:clamp(22px,3.4vw,40px) clamp(22px,3.6vw,44px);border-left-width:8px;min-height:38vh;display:flex;align-items:center}
.sayb.big .cl{gap:clamp(10px,1.6vw,18px)}
.sayb.big .cl li{font-size:clamp(21px,3.3vw,36px);line-height:1.25;padding-left:clamp(24px,3vw,36px)}
.sayb.big .cl li::before{width:clamp(11px,1.4vw,16px);height:clamp(11px,1.4vw,16px);top:.45em}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip2{background:#ffffff0f;border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;font-size:clamp(14px,1.8vw,19px);line-height:1.3}
.chip2 em{display:block;font-style:normal;font-family:var(--M);font-weight:800;font-size:10.5px;letter-spacing:.16em;color:var(--mute);margin-bottom:2px}
.chip2.tip{border-color:#ffb54766;background:#ffb54714}.chip2.tip em{color:var(--amber)}
.hand{background:var(--glow);color:#04132a;font-weight:800;border-radius:12px;padding:12px 16px;font-size:clamp(15px,2vw,21px)}
.ck-ctrl{grid-template-columns:1fr auto 1.6fr!important;align-items:center}
.ck-ctrl .hint{color:var(--mute);font-weight:700;font-size:clamp(12px,1.5vw,16px);text-align:center;white-space:nowrap}.ck-ctrl .hint b{color:#fff}
.swipe-in-r{animation:inR .28s ease-out}.swipe-in-l{animation:inL .28s ease-out}
@keyframes inR{from{transform:translateX(40px);opacity:.2}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:.2}to{transform:none;opacity:1}}
</style>

    say:"Communicating quickly does **not** mean guessing. It means three things: share what is **verified**, say what is **still unknown**, and say **when the next update** will come. This is not only our opinion. The **World Health Organization** says: a lack of information is **not a reason to delay** an announcement. The benefits of early warning are **bigger than the risks**. Crisis expert **Seeger** agrees: if you wait until everything is certain, the warning comes **too late**."},
  {sec:"Opening", phase:OUR, team:"prop", who:"Ismail", r:1, v:{t:"levels"},
    say:"We will show that silence fails at **three levels**. It fails **the public**, because silence feeds rumours. It fails **the team**, because uncertainty creates anxiety. And it fails **the leader**, because trust goes to whoever speaks first."},

  /* ---------- ARGUMENT 1 · RUMOURS · Ismail ---------- */
  {sec:"① The public", phase:OUR, team:"prop", who:"Ismail", r:2, v:{t:"formula"},
    say:"Argument one: **silence feeds rumours.** In 1947, two psychologists, **Allport and Postman**, gave a famous formula: **rumour equals importance times ambiguity.** Ambiguity means unclear information. In a crisis, importance is always high. The leader cannot change that. But the leader can **reduce ambiguity**. Silence makes it bigger: were we hacked? Is it safe? How many days?"},
  {sec:"① The public", phase:OUR, team:"prop", who:"Ismail", r:2, v:{t:"case"},
    say:"This really happened. In **July 2024**, a faulty CrowdStrike update crashed computer systems **around the world**. Most airlines recovered in about **one day**. Delta took about **five days** and cancelled around **7,000 flights**. Many passengers said they could not get clear answers. The US Department of Transportation opened an investigation."},

  /* ---------- ARGUMENT 2 · ANXIETY · Ismail ---------- */
  {sec:"② The team", phase:OUR, team:"prop", who:"Ismail", r:3, v:{t:"stress"},
    say:"Argument two: **not knowing hurts more than bad news.** In 2016, researchers at **University College London** published a study in Nature Communications. Volunteers faced a possible small electric shock. Their stress was **highest** when they did **not know** if the shock would come. It was lower when they knew for sure. The researchers said: **it is the uncertainty that makes us anxious.**"},
  {sec:"② The team", phase:OUR, team:"prop", who:"Ismail", r:3, v:{t:"team"},
    say:"Now think of the airline's **own staff** at the check-in desk. Angry passengers are in front of them, and they have **no information**. Professor **Michelle Buck** from Kellogg School of Management says: leaders who wait for clarity **lose their teams** to anxiety and rumours. So silence is not only a communication problem. It is a **leadership failure**. Now Saif will show how leaders keep trust."},

  /* ---------- ARGUMENT 3 · TRUST · Saif ---------- */
  {sec:"③ The leader", phase:OUR, team:"prop", who:"Saif", r:4, v:{t:"cynefin"},
    say:"Some people will ask: **how can a leader act when they do not know?** A leadership model called **Cynefin** gives the answer. In a crisis, the situation is **chaotic**. In chaos, the leader must **act first** to create order. Then the leader can **sense and respond**. Waiting for complete information is the wrong model. A clear first message **is that first act**."},
  {sec:"③ The leader", phase:OUR, team:"prop", who:"Saif", r:4, v:{t:"quote", q:"Stating uncertainty caused only a <em>small</em> decrease in trust, and almost none when it was given as a clear range.", s:"van der Bles et al. (2020) · PNAS · five experiments · 5,780 people"},
    say:"Argument three: **honesty keeps trust.** In 2020, van der Bles and colleagues published a study in **PNAS**. They ran five experiments with almost **6,000 people**. They found that saying “we are not certain” caused only a **small drop** in trust. When the uncertainty was said clearly, there was **almost no drop**. People can accept honesty."},
  {sec:"③ The leader", phase:OUR, team:"prop", who:"Saif", r:4, v:{t:"quote", q:"When an organisation reveals bad news <em>itself</em>, people judge it as <em>more credible</em>.", s:"“Stealing thunder” · Arpan & Roskos-Ewoldsen (2005) · US Centers for Disease Control and Prevention (CDC): be first, be right, be credible"},
    say:"There is also a **reward for speaking first**. Research calls it **“stealing thunder.”** It means: share bad news **yourself** before others do. When an organisation does this, people see it as **more credible**. That is why the US **Centers for Disease Control and Prevention**, the CDC, has a rule: **be first, be right, be credible.** Be first, but not first with rumours."},

  /* ---------- THE MESSAGE · Saif ---------- */
  {sec:"The message", phase:OUR, team:"prop", who:"Saif", r:5, v:{t:"cards", n:3, all:true},
    say:"So what does a good first message look like? **Three cards.** **Known:** our booking system is down. Do not come to the airport unless your flight is confirmed. **Unknown:** the exact cause. We say this openly. We **do not guess**. **Next:** the next update in 30 minutes, **even if there is no news yet**."},
  {sec:"The message", phase:OUR, team:"prop", who:"Saif", r:5, v:{t:"message"},
    say:"And one **human** line: we know many of you are stranded, and **we are sorry**. Chapter 4 reminds us that persuasion needs **logic and emotion**. Nothing is invented. Nothing is hidden. **People feel seen.**"},
  {sec:"The message", phase:OUR, team:"prop", who:"Saif", r:5, v:{t:"oman"},
    say:"This is not only an airline idea. In **2020**, COVID-19 came to **Oman**. No one had complete information. The **Supreme Committee did not wait**. It held regular press conferences. It shared what was known. It told people that decisions could change. A **2023 study** by Al-Rubai'ey and Al-Sharafi looked at these press conferences. It found that they **built trust** because they were **honest and open**."},

  /* ---------- THEIR DOUBTS · Saif · inoculation theory, Chapter 4 ---------- */
  {sec:"Their doubts", phase:OUR, team:"prop", who:"Saif", r:6, v:{t:"doubt", q:"“We have nothing to say yet.”", a:"Leaders overestimate what others already know. This is the <em>illusion of transparency</em>.", s:"Gilovich, Savitsky & Medvec (1998) · Journal of Personality and Social Psychology"},
    say:"Our opponents speak after us. So we answer their likely doubts now. Chapter 4 calls this **inoculation**. They may say: **“We have nothing to say yet.”** But people who are waiting do not know **who is deciding**, or **when they will hear more**. **There is always something to say.**"},
  {sec:"Their doubts", phase:OUR, team:"prop", who:"Saif", r:6, v:{t:"doubt", q:"“Quick messages spread misinformation.”", a:"Only when guesses are presented as facts. We say <em>unknown</em> out loud, and correct as we learn."},

        <path class="cv" d="M50 190 C 180 190, 220 40, 310 40 S 440 190, 570 190" fill="none" stroke="#ffb547" stroke-width="6" stroke-linecap="round"/>

        <circle cx="50" cy="190" r="8" fill="#2ec4a6"/><circle cx="570" cy="190" r="8" fill="#2ec4a6"/>

    case "team": return `<div class="v"><div class="kick u"><i></i>THE TEAM IS WAITING TOO</div><div class="h u d1">The check-in desk has <s>no answers</s> either.</div>
      <div class="desk u d2">${["😟","😠","😟","😠","😟"].map((e,k) => `<span style="animation-delay:${.8 + k*.15}s">${e}</span>`).join("")}<div class="agent">🧑‍💼<small>“I don't know anything yet…”</small></div></div>

    case "global": return `<div class="v"><div class="kick u"><i></i>NOVEMBER 2008 · GLOBAL FINANCIAL CRISIS</div><div class="h u d1">Same three cards. <em>Global scale.</em></div>
      <div class="phone u d2" style="max-width:46em"><div class="msg">
        <div class="ln" style="--cc:#14957d"><b>KNOWN</b>“Here is what we know…”</div>

        <div class="ln" style="--cc:#0a7fb0"><b>NEXT</b>“…and here is what we need to do in the meantime.”</div></div></div>

    case "oman": return `<div class="v"><div class="kick u"><i></i>CLOSER TO HOME · OMAN · COVID-19 · 2020</div><div class="h u d1">Oman did not wait for <em>complete information</em>.</div>
      <div class="eq">${[["🎙️","Regular press conferences","The Supreme Committee spoke early","#4fd1ff"],["?","Honest about change","“Decisions may be revised”","#ffb547"],["✓","Credibility built","Honesty, candour, openness","#2ec4a6"]].map((x,k) => `<div class="tile u d${k+2}" style="--cc:${x[3]}"><i>${x[0]}</i><b>${x[1]}</b><span>${x[2]}</span></div>`).join("")}</div>
      <div class="src u d5">Al-Rubai'ey & Al-Sharafi (2023) · Ethos in COVID-19 crisis communication: evidence from Oman · Journal of Risk Research</div></div>`;
    case "message": return `<div class="v">${v.q ? `<div class="h u" style="font-size:2.6em">Which part is <s>misinformation</s>?</div>` : `<div class="kick b u"><i></i>THE FIRST MESSAGE · 20 MINUTES AFTER THE OUTAGE</div>`}
      <div class="phone u d1"><div class="ph"><i>S</i>Skyvale Airways<span>now</span></div><div class="msg">
        <div class="ln" style="--cc:#14957d"><b>KNOWN</b>Our booking system is down. Please don't come to the airport unless your flight is confirmed.</div>
        <div class="ln" style="--cc:#c98610"><b>UNKNOWN</b>The cause is under investigation.</div>
        <div class="ln" style="--cc:#0a7fb0"><b>NEXT</b>Next update at 10:30, even if there is no news.</div>
        <div class="ln" style="--cc:#d7263d"><b>HUMAN</b>We know many of you are stranded. We are sorry.</div></div></div>
      ${v.q ? "" : `<div class="h u d3" style="font-size:2em">Nothing invented. <em>Nothing hidden.</em></div>`}</div>`;
    case "vs": return `<div class="v"><div class="kick b u"><i></i>THE REAL CHOICE</div>
      <div class="vs"><div class="x u d1">Quick vs accurate</div><b class="u d2">→</b><div class="y u d3">Responsible early communication vs unnecessary silence</div></div></div>`;
    case "fork": return `<div class="v"><div class="kick u"><i></i>OUR QUESTION</div><div class="h u d1" style="font-size:2.6em">Booking system down. Cause unknown.</div>
      <div class="fork"><div class="u d2">Inform passengers now</div><div class="u d3">Wait for the full investigation</div></div></div>`;
    case "recap": return `<div class="v"><div class="kick b u"><i></i>SILENCE FAILS AT THREE LEVELS</div><div class="checks">
      ${[["Public","silence feeds rumours"],["Team","uncertainty creates anxiety"],["Leader","trust goes to whoever speaks first"]].map((x,k) => `<div class="ck1 u d${k+1}"><i>✓</i>${x[0]} <span>${x[1]}</span></div>`).join("")}</div>
      <div class="seq u d4" style="font-size:1.25em">${[["A","Appropriate · honest"],["C","Consistent · with expert practice"],["E","Effective · people know what to do"]].map(x => `<span style="color:#fff"><b style="color:var(--glow)">${x[0]}</b> ${x[1]}</span>`).join("")}</div></div>`;
    case "agree": return `<div class="v"><div class="h u">Accuracy matters. <em>We agree.</em></div><div class="sub u d2" style="font-size:1.6em">Speed and accuracy are not enemies.<br>Share what is verified <b style="color:#fff">and</b> keep investigating.</div></div>`;
    case "final": return `<div class="v"><div class="final3"><span>Communicate early.</span><span>Share verified facts.</span><span>Update continuously.</span></div>
      <div class="handover u" style="animation-delay:1.8s">Thank you. Our case is complete. <b>The floor is now yours, ${esc(CFG.opp.names)}.</b></div></div>`;
    case "format": return `<div class="v"><div class="kick b u"><i></i>HOW TODAY WORKS</div>
      <div class="eq">${PHASES.map((p,k) => `<div class="tile u d${k+1}" style="--cc:${p === OUR ? "var(--glow)" : p === OPP ? "var(--opp)" : p === GAME ? "var(--red)" : "var(--mod)"}"><i>${k+1}</i><b>${p}</b><span>${p === OUR ? "Ismail & Saif · for the motion" : p === DISC ? "Questions from both teams" : p === OPP ? "Against the motion" : "Everyone plays on their phone"}</span></div>`).join("")}</div></div>`;
    case "doubt": return `<div class="v"><div class="kick u"><i></i>THEY MAY SAY</div><div class="h u d1" style="font-size:2.8em;color:var(--mute)">${esc(v.q)}</div>
      <div class="quote u d3" style="border-left-color:var(--ok)"><p>${v.a}</p>${v.s ? `<span class="src">${esc(v.s)}</span>` : ""}</div></div>`;
    case "neutral": {
      const cur = PHASES.indexOf(b.phase);
      return `<div class="v neutral" style="--tc:${teamCol(b.team)}"><div class="kick u" style="color:${teamCol(b.team)}">${teamName(b.team)}</div>
        <div class="who2 u d1">${esc(b.who)}</div><div class="sub u d2">${esc(v.line)}</div>
        <div class="seq u d3">${PHASES.map((s,k) => `<span class="${k === cur ? "cur" : k < cur ? "done" : ""}">${esc(s)}</span>`).join("")}</div></div>`;
    }
  }
  return "";
}

/* UTAS logo: the text stays still, only the U mark carries the effect */
function uniLogo(fx, id){
  const spk = [[-6,8],[92,-4],[104,58],[70,96],[-10,70],[40,-12]].map((p,k) => `<i class="fx spk" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${k * .4}s">✦</i>`).join("");
  return `<div class="uni"><img class="ut" src="${UTAS_TEXT}" alt="University of Technology and Applied Sciences, Ibra"><div class="um fx-${fx}" ${id ? `id="${id}"` : ""} style="--mk:url('${UTAS_MARK}')">
    <div class="rclip"><i class="rays"></i><i class="fx ring"></i><i class="fx ring r2"></i><i class="fx ring r3"></i></div><i class="halo"></i>
    <i class="fx orb"></i><i class="fx orb o2"></i><img class="mk" src="${UTAS_MARK}" alt=""><i class="shine"></i>${spk}</div></div>`;
}

/* =========================================================
   PROJECTOR
   ========================================================= */
async function projector(){
  let c = (P.get("room") || "").toUpperCase();
  if (!/^[A-Z]{4}$/.test(c)) c = Array.from({length:4}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");
  await connect(c);
  if (ONLINE){ const ex = await readRoom(); if (ex) S = {...S, ...ex}; else commit({i:0}); }
  let lastI = -1, lastPaired = null, armed = false, localVid = null, localName = "";
  const ckUrl = location.origin + location.pathname + "?cockpit&room=" + code;

  function routeHTML(b){
    if (b.team !== "prop" || b.r == null) return `<div class="route"></div>`;
    return `<div class="route">${ROUTE.map((x,k) => `${k ? `<div class="rline ${k <= b.r ? "done" : ""}"></div>` : ""}<div class="rt ${k < b.r ? "done" : k === b.r ? "cur" : ""}"><i>${k < b.r ? "✓" : ""}</i>${x}</div>`).join("")}</div>`;
  }
  function footHTML(b){
    if (!b.team) return `<div class="foot"></div>`;
    const ks = inSec(S.i);
    return `<div class="foot" style="--tc:${teamCol(b.team)}"><div class="who"><span class="tag">${teamName(b.team)}</span>${esc(b.sec)} · <b>${esc(b.who)}</b></div>
      ${ks.length > 1 ? `<div class="dots">${ks.map(k => `<i class="${k < S.i ? "done" : k === S.i ? "on" : ""}"></i>`).join("")}</div>` : ""}</div>`;
  }
  function render(){
    const b = BEATS[S.i];
    let inner = "";
    if (b.type === "welcome"){
      inner = `<div class="welcome"><div>
          ${uniLogo(CFG.logoFx, "um")}
          <div class="course">${CFG.course.split(" · ").map((x,k) => k ? `<span>${esc(x)}</span>` : `<b>${esc(x)}</b>`).join("")}</div>
          <div class="kick" style="margin-top:1.2em"><i></i>TODAY'S DEBATE</div>
          <div class="h" style="margin-top:.3em;font-size:min(3em,5.6vh)">${esc(CFG.motion.replace(/\.$/,""))}<em>?</em></div>
          <div class="teams"><div class="team" style="--tc:var(--glow)"><small>${esc(CFG.prop.label)}</small><b>${esc(CFG.prop.names)}</b><span>Communicate early, with verified facts</span></div>
            <div class="team" style="--tc:var(--opp)"><small>${esc(CFG.opp.label)}</small><b>${esc(CFG.opp.names)}</b><span>Wait for complete information</span></div></div></div>
        ${S.paired ? `<div class="pair"><div><small>COCKPIT</small><b style="font-size:1.6em;letter-spacing:.04em;color:#14957d">Connected ✓</b><p>The phone controls the debate.</p></div></div>`
          : `<div class="pair"><div id="qr"></div><div><small>COCKPIT FOR THE PROPOSITION TEAM</small><b>${code}</b><p>${ONLINE ? "Scan with the phone that will control the debate." : "Offline: control with the clicker or arrow keys."}</p></div></div>`}</div>`;
    } else if (b.type === "video"){
      inner = `<div class="vid" id="vw"><video id="v" src="${localVid || esc(CFG.video)}" playsinline preload="auto"></video><div class="miss"><div>Video not found online.<br><br><button class="btn pickv" style="font-size:1em">Choose the video from this laptop</button></div></div></div>`;
    } else if (b.type === "game"){
      inner = `<div class="v"><div class="kick"><i></i>THE CRISIS ROOM · YOUR TURN</div><div class="h">The video asked:<br><s>what would you do?</s></div><div class="sub">Now everyone answers it. Five questions, thirty-five seconds each.</div><button class="btn" id="gm">Start The Crisis Room ${svgI(ARROW)}</button></div>`;
    } else if (b.type === "end"){
      inner = `<div class="v"><div class="final3"><span>Communicate early.</span><span>Share verified facts.</span><span>Update continuously.</span></div><div class="sub u d4">Thank you to our respected opponents and to our lecturer.</div></div>`;
    } else inner = visual(b);

    app.innerHTML = `<div class="scr">
      <div class="bar"><div class="logo">${LOGO}<div><b>THE CRISIS ROOM</b><small>LEADERSHIP &amp; INNOVATION · DEBATE</small></div></div>
        <div class="motion"><b>Motion:</b> ${esc(CFG.motion)}<span class="chip ${ONLINE && NET ? "on" : ""}">${!ONLINE ? "LOCAL" : !NET ? "○ CONNECTING…" : S.paired ? "● IPAD LINKED" : "● " + code}</span></div></div>
      ${routeHTML(b)}<div class="main">${inner}</div>${footHTML(b)}
    </div>${armed ? "" : `<div class="arm" id="arm"><div><b>Click once to start</b><p>This lets the video play with sound. Then use your phone, the clicker or the arrow keys.</p>
      <button class="btn pickv" style="margin-top:1.4em;font-size:1em;background:var(--panel);box-shadow:none;border:1px solid var(--line)">${localVid ? "✓ Video ready: " + esc(localName) : "Choose the video from this laptop"}</button></div></div>`}<input type="file" id="vf" accept="video/*" hidden>`;
    document.querySelectorAll(".main .quote, .main .tile:not(.dash), .main .ld.b, .main .phone").forEach((el, k) => { el.classList.add("glint"); el.style.setProperty("--gd", (1.6 + k * .7) + "s"); });
    const a = $("#arm"); if (a) a.onclick = () => { armed = true; a.remove(); const v = $("#v"); if (v) v.play().catch(() => {}); };
    const um = $("#um");
    if (um){
      document.onmousemove = e => { const r = um.getBoundingClientRect(), dx = (e.clientX - (r.left + r.width/2)) / innerWidth, dy = (e.clientY - (r.top + r.height/2)) / innerHeight;
        um.style.setProperty("--ry", (dx * 28).toFixed(1) + "deg"); um.style.setProperty("--rx", (-dy * 22).toFixed(1) + "deg"); };
      um.onclick = e => { e.stopPropagation(); um.classList.remove("burst"); void um.offsetWidth; um.classList.add("burst"); setTimeout(() => um.classList.remove("burst"), 1600); };
    } else document.onmousemove = null;
    if (b.type === "welcome" && ONLINE && !S.paired) try { new QRCode($("#qr"), {text:ckUrl, width:200, height:200, colorDark:"#0a1730", colorLight:"#ffffff"}); } catch(e){}
    const vf = $("#vf");
    document.querySelectorAll(".pickv").forEach(p => p.onclick = e => { e.stopPropagation(); vf.click(); });
    vf.onchange = () => { const f = vf.files[0]; if (!f) return; if (localVid) URL.revokeObjectURL(localVid); localVid = URL.createObjectURL(f); localName = f.name; render(); };
    if (b.type === "video"){ const v = $("#v"); v.onerror = () => $("#vw")?.classList.add("missing"); if (armed) v.play().catch(() => {}); }
    if (b.type === "game") $("#gm").onclick = () => window.open(CFG.game, "_blank");
    lastI = S.i; lastPaired = S.paired;
  }
  let lastNet = NET;
  listeners.push(() => { if (S.i !== lastI || S.paired !== lastPaired || NET !== lastNet){ lastNet = NET; render(); } });
  document.addEventListener("keydown", e => {
    if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); act.next(); }
    else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); act.back(); }
  });
  render();
}

function peekText(b){
  if (!b) return "";
  if (b.cue) return `<b>${esc(b.who)}:</b> ${esc(b.cue[0])}`;
  if (b.say) return `<b>${esc(b.who)}:</b> ${esc(b.say.replace(/\*\*/g,"").split(/(?<=[.?!:])\s/)[0])}`;
  return `<b>${esc(b.sec)}</b>${b.who ? " · " + esc(b.who) : ""}`;
}
async function cockpit(){

  await connect(c);
  if (ONLINE){ const ex = await readRoom(); if (ex) S = {...S, ...ex}; commit({paired:true}); }
  let lastI = -1;
  try { await navigator.wakeLock?.request("screen"); } catch(e){}

  let dir = 0;   // 1 = moved forward, -1 = moved back (for the slide-in direction)
  function render(){
    const b = BEATS[S.i], nx = BEATS[S.i + 1], col = b.team ? teamCol(b.team) : "var(--glow)";

    const handover = nx && nx.who && b.who && nx.who !== b.who && nx.team === "prop" && b.team === "prop";
    app.innerHTML = `<div class="ck" style="--tc:${col}">
      <div class="ck-top"><span><i class="dot ${ONLINE && NET ? "" : "off"}"></i>${!ONLINE ? "SOLO (not linked)" : NET ? "ONLINE · ROOM " + code : "CONNECTING… taps will send when online"}</span><span>${S.i + 1} / ${BEATS.length}</span></div>
      <div class="ck-prog"><i style="width:${(S.i / (BEATS.length - 1) * 100).toFixed(1)}%"></i></div>
      <div class="ck-body swipe-${dir > 0 ? "in-r" : dir < 0 ? "in-l" : "none"}">
        <div class="ck-head">${who}<h2>${esc(b.sec)}</h2></div>
        ${b.cue ? `<div class="sayb big"><ul class="cl">${b.cue.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : b.say ? `<div class="sayb big"><p>${md(b.say)}</p></div>` : ""}
        ${b.cue || screen ? `<div class="chips">${screen ? `<span class="chip2"><em>ON SCREEN</em>${esc(screen)}</span>` : ""}${b.ev ? `<span class="chip2"><em>EVIDENCE</em>${esc(b.ev)}</span>` : ""}${b.tip ? `<span class="chip2 tip"><em>TIP</em>${esc(b.tip)}</span>` : ""}</div>` : ""}
        ${b.job ? `<div class="box job"><p>${esc(b.job)}</p></div>` : ""}
        ${b.qs ? `<div class="box"><h4>OUR QUESTIONS</h4><div class="pairs"><div><b>ISMAIL</b>${esc(QS.ismail)}</div><div><b>SAIF</b>${esc(QS.saif)}</div><div><b>IF THEY AGREE</b>${esc(QS.agree)}</div></div></div>` : ""}
        ${b.rebut ? `<div class="box"><h4>IF THEY SAY → WE ANSWER</h4><div class="pairs">${REBUT.map(r => `<div><b>${esc(r[0])}</b>${esc(r[1])}</div>`).join("")}</div></div>` : ""}
        ${handover ? `<div class="hand">Next: <b>${esc(nx.who)}</b> speaks. Hand over with eye contact.</div>` : ""}
        ${nx ? `<div class="peek">Next → ${peekText(nx)}</div>` : ""}
      </div>
      <div class="ck-ctrl"><button id="bk">◀ Back</button><div class="hint">Swipe <b>←</b> next · <b>→</b> back</div><button class="nx" id="nx">${nx ? "NEXT ▶" : "Done"}</button></div>
    </div>`;
    $("#bk").onclick = () => go2(-1); $("#nx").onclick = () => nx && go2(1);
    window.scrollTo(0, 0);
    lastI = S.i;
  }
  function go2(d){
    if (d > 0 && S.i >= BEATS.length - 1) return;
    if (d < 0 && S.i <= 0) return;
    dir = d; try { navigator.vibrate?.(15); } catch(e){}
    d > 0 ? act.next() : act.back();
  }
  /* swipe: finger moves right-to-left = next, left-to-right = back. Vertical scrolling still works. */
  let sx = 0, sy = 0, st = 0, tracking = false;
  document.addEventListener("touchstart", e => { if (e.touches.length !== 1) return; tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, {passive:true});
  document.addEventListener("touchend", e => {
    if (!tracking) return; tracking = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4 && Date.now() - st < 900){ dx < 0 ? go2(1) : go2(-1); }
  }, {passive:true});
  /* if the browser's own "back" swipe fires, stay on the page and treat it as Back */
  try { history.pushState({ck:1}, ""); addEventListener("popstate", () => { history.pushState({ck:1}, ""); go2(-1); }); } catch(e){}
  let lastNet = NET;
  listeners.push(() => { if (S.i !== lastI || NET !== lastNet){ lastNet = NET; render(); } });
  render();
}

/* =========================================================
   START
   ========================================================= */
function showError(msg){
  let d = document.getElementById("errbox");
  if (!d){ d = document.createElement("div"); d.id = "errbox"; d.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:99;max-width:520px;background:#ff3b4e;color:#fff;font:600 13px/1.4 system-ui;padding:10px 14px;border-radius:10px"; document.body.appendChild(d); }
  d.textContent = "Problem: " + msg + " — send a photo of this message.";
}
window.addEventListener("error", e => showError(e.message || "script error"));
window.addEventListener("unhandledrejection", e => showError(String(e.reason?.message || e.reason)));
if (P.has("cockpit")) cockpit().catch(e => showError(e.message));
else if (P.has("screen")) projector().catch(e => showError(e.message));
else if (P.has("logos")) app.innerHTML = `<div class="logos">${[["rays","A · Sunburst rays","Orange and blue rays turn behind the U"],["orbit","B · Orbit","Two glowing dots circle the U, like satellites"],["rings","C · Signal rings","Rings pulse out from the U, like a broadcast (fits “communicate early”)"],["sparkle","D · Shine & sparkles","A bright light glides over the U, small stars twinkle"]].map(x => `<figure><figcaption>${x[1]}<span>${x[2]}</span></figcaption>${uniLogo(x[0])}</figure>`).join("")}</div>`;
else {
  app.innerHTML = `<div class="land"><div class="logo">${LOGO}<div><b>THE CRISIS ROOM</b><small>DEBATE GUIDE</small></div></div>
    <h1>Which screen is this?</h1><p>Open the projector view on the laptop, and the cockpit on the phone that controls the debate.</p>
    <a class="pri" href="?screen">Projector view</a><a href="?cockpit">Cockpit (phone)</a><a href="?cockpit&room=SOLO&local">Rehearse alone (phone)</a></div>`;
}
</script>
