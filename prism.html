<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRISM Live · Desk Ratings</title>
<meta name="theme-color" content="#141A4D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* PRISM desk ratings. Default view = PRISM Live big screen; #d1..#d4 = rate that desk on a phone;
   #pass = the visitor's PRISM Pass; #admin = control desk (PIN); #qr = printable desk QR posters. */
:root{
  --bg:#F4F6FB; --ink:#1B2559; --ink-2:#5A6488; --ink-3:#8E96B3; --line:#E3E7F2; --night:#0B0F33; --navy:#232C7A;
  --c1:#F68922; --c2:#3B56A8; --c3:#E5484D; --c4:#12A36B;
  --display:"Lexend","Tajawal",sans-serif; --body:"Figtree","Tajawal",sans-serif; color-scheme:light;
}
html[lang=ar]{--display:"Tajawal","Lexend",sans-serif;--body:"Tajawal","Figtree",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.ar{font-family:"Tajawal",sans-serif;font-weight:700;letter-spacing:0}
.spec{background:linear-gradient(90deg,#fff 0%,#fff 40%,var(--c1) 56%,#7F9BFF 71%,#FF7A7E 85%,#3FD69A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .35s;z-index:99;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.demo{position:fixed;top:8px;inset-inline-end:8px;z-index:90;display:flex;gap:4px;background:#FFF4DB;border-radius:99px;padding:4px 6px;font:700 12px var(--body)}
.demo a{color:#8A5A00;text-decoration:none;padding:2px 8px;border-radius:99px}.demo a.on{background:#8A5A00;color:#fff}

/* =============== BIG SCREEN =============== */
.scr{position:fixed;inset:0;background:radial-gradient(120% 90% at 20% 0%,#26308A 0%,#141A4D 50%,#0B0F33 100%);color:#fff;display:grid;grid-template-rows:auto 1fr auto;font-size:clamp(12px,1.05vw,22px);overflow:hidden}
.sh{display:flex;align-items:center;gap:1.4em;padding:1.2em 2em .6em}
.sh .logo{background:#fff;border-radius:.8em;padding:.4em .7em;display:flex}.sh .logo img{height:3.4em;display:block}
.sh h1{margin:0;font-family:Lexend;font-weight:800;font-size:3.2em;letter-spacing:-.04em;line-height:1}
.sh h1 small{display:block;font-family:var(--body);font-weight:600;font-size:.3em;letter-spacing:0;opacity:.8;margin-top:.35em}
.sh .kp{margin-inline-start:auto;display:flex;gap:2.2em}
.sh .kp div{text-align:center}
.sh .kp b{display:block;font-family:Lexend;font-size:2.6em;line-height:1}
.sh .kp span{font-size:.78em;font-weight:800;letter-spacing:.12em;opacity:.7;text-transform:uppercase}
.sh .kp span i{display:block;font-style:normal;font-family:Tajawal;letter-spacing:0;text-transform:none;font-size:1.1em}
.live{display:inline-flex;align-items:center;gap:.4em;font-weight:800;font-size:.85em;color:#3FD69A;letter-spacing:.12em}
.live i{width:.6em;height:.6em;border-radius:50%;background:#3FD69A;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.sm{display:grid;grid-template-columns:minmax(0,1fr) 28em;gap:1.6em;padding:.6em 2em 1em;min-height:0}
.stage{position:relative;min-height:0;display:flex;align-items:stretch}
.prism-col{width:13em;flex:none;position:relative}
.prism-col svg{position:absolute;inset:0;width:100%;height:100%}
.beams{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:1em;padding:1em 0}
.bm{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:.35em}
.bm .lbl{display:flex;align-items:baseline;gap:.8em;padding-inline-start:.2em}
.bm .lbl b{font-family:Lexend;font-size:1.9em;letter-spacing:-.02em}
.bm .lbl .ar{font-size:1.5em;opacity:.85}
.bm .lbl .rk{margin-inline-start:auto;font-family:Lexend;font-weight:800;font-size:1.1em;padding:.15em .7em;border-radius:99px;background:rgba(255,255,255,.12)}
.bm.top .lbl .rk{background:var(--c1);color:#fff}
.bm .track{position:relative;height:3.6em;border-radius:0 99px 99px 0;background:rgba(255,255,255,.06);overflow:visible}
html[dir=rtl] .bm .track{border-radius:99px 0 0 99px}
.bm .ray{position:absolute;inset-block:0;inset-inline-start:0;border-radius:0 99px 99px 0;background:linear-gradient(90deg,transparent 0%,var(--c) 30%,var(--c) 100%);box-shadow:0 0 2.4em var(--c),0 0 .6em var(--c);transition:width 1.4s cubic-bezier(.2,.9,.2,1);min-width:.5em}
.bm .ray::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:shine 3.5s infinite}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.bm .sc{position:absolute;inset-inline-end:.8em;top:50%;transform:translateY(-50%);font-family:Lexend;font-weight:800;font-size:2em;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.bm .meta{display:flex;gap:1.4em;font-size:.95em;opacity:.8;font-weight:600;padding-inline-start:.2em}
.bm .meta b{font-family:Lexend}
.bm.top .crown{position:absolute;inset-inline-start:-1.6em;top:-.2em;font-size:1.6em;animation:bob 2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-.25em)}}
.side{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:1em;min-height:0}
.pnl{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:1.2em;padding:1em 1.2em}
.pnl h2{margin:0 0 .6em;font-family:Lexend;font-size:1.15em;display:flex;justify-content:space-between;align-items:baseline;gap:.6em}
.pnl h2 .ar{font-size:.9em;opacity:.75}
.cat{display:grid;grid-template-columns:1fr auto;gap:.5em .8em;align-items:center;font-size:.98em}
.cat .k{font-weight:700;opacity:.85}.cat .k i{font-style:normal;font-family:Tajawal;opacity:.7;margin-inline-start:.4em}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.25em .75em;border-radius:99px;font-weight:800;font-size:.9em;color:#fff;background:var(--c);white-space:nowrap}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.vs div{background:rgba(255,255,255,.06);border-radius:.9em;padding:.7em .8em}
.vs small{display:block;font-weight:800;font-size:.75em;letter-spacing:.12em;opacity:.7;margin-bottom:.4em}
.wall{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.cm{font-family:var(--body);font-size:1.25em;line-height:1.4;font-weight:600;animation:cmIn .7s cubic-bezier(.2,.9,.2,1)}
.cm::before{content:"“";font-family:Lexend;color:var(--c1);font-size:1.6em;line-height:0;vertical-align:-.35em;margin-inline-end:.1em}
.cm small{display:block;margin-top:.6em}
@keyframes cmIn{from{opacity:0;transform:translateY(12px)}}
.tape{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));padding:.7em 0;overflow:hidden;white-space:nowrap;font-weight:800;font-size:1.05em}
.tape-in{display:inline-block;animation:tp var(--dur,60s) linear infinite;padding-inline-start:100%}
.tape-in span{margin:0 2.2em}
@keyframes tp{to{transform:translateX(-100%)}}
html[dir=rtl] .tape-in{animation-name:tpr}@keyframes tpr{to{transform:translateX(100%)}}
.frozen{position:fixed;inset:0;z-index:50;background:radial-gradient(70% 60% at 50% 45%,rgba(20,26,77,.92),rgba(5,7,31,.97));display:grid;place-items:center;text-align:center;color:#fff;font-size:clamp(12px,1.05vw,22px)}
.frozen .w{animation:pop 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.frozen small{font-weight:800;letter-spacing:.3em;font-size:1.3em;opacity:.8}
.frozen h2{margin:.3em 0 0;font-family:Lexend;font-size:6em;letter-spacing:-.04em;line-height:1}
.frozen .ar{font-size:3.2em;margin-top:.2em}
.frozen .sc{display:inline-block;margin-top:.8em;font-family:Lexend;font-size:2.4em;padding:.2em 1em;border-radius:99px;background:var(--c)}
.frozen .rest{margin-top:1.8em;display:flex;gap:1.2em;justify-content:center;font-size:1.2em;opacity:.85}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60}

/* =============== PHONE =============== */
.ph{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
.pbar{display:flex;gap:3px;height:5px;border-radius:9px;overflow:hidden;margin-bottom:12px}
.pbar i{flex:1;opacity:.3}.pbar i.on{opacity:1}
.phd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.phd .br{display:flex;align-items:center;gap:10px}
.phd .br b{font-family:Lexend;font-weight:800;font-size:20px;letter-spacing:-.02em;display:block;line-height:1}
.phd .br small{font-size:12px;color:var(--ink-3);font-weight:700}
.pz{width:34px;height:34px;flex:none}
.lng{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px;color:var(--navy);font-family:Tajawal,var(--body)}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 2px 10px rgba(27,37,89,.06);margin-bottom:14px}
.dh{border-radius:22px;padding:20px 18px;color:#fff;background:linear-gradient(140deg,var(--c),var(--d));margin-bottom:14px;position:relative;overflow:hidden}
.dh::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.15)}
.dh small{font-weight:800;letter-spacing:.14em;font-size:12px;opacity:.9}
html[lang=ar] .dh small{letter-spacing:0;font-size:14px}
.dh h1{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.dh p{margin:6px 0 0;opacity:.9;font-weight:600}
.cr{padding:12px 0;border-bottom:1px solid var(--line)}
.cr:last-of-type{border-bottom:0}
.cr .q{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cr .q b{font-size:16px}
.cr .q span{font-size:13px;color:var(--ink-3)}
.stars{display:flex;gap:6px;margin-top:8px}
.stars button{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:24px;line-height:1;color:#D2D7E6;transition:transform .12s}
.stars button.on{background:#FFF6DB;border-color:#F5B301;color:#F5B301}
.stars button:active{transform:scale(.92)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;min-height:72px;resize:vertical;background:var(--bg)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:17px;background:var(--navy);color:#fff;margin-top:12px}
.btn[disabled]{opacity:.4}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-weight:800}
.seg button[aria-pressed=true]{border-color:var(--navy);background:var(--navy);color:#fff}
.lab{display:block;font-weight:800;font-size:14px;margin:14px 0 8px}
select{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);font:inherit;background:#fff}
.err{color:#C42B30;font-weight:700;font-size:14px;min-height:1em;margin-top:8px}
.pass{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps{border-radius:18px;padding:14px;border:2px dashed var(--line);background:#fff;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ps .o{width:46px;height:46px;border-radius:50%;border:3px dashed #C9D0E3;display:grid;place-items:center;font-size:22px;color:#fff}
.ps.ok{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.ps.ok .o{background:var(--c);border:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.ps b{font-size:14px}.ps span{font-size:12px;color:var(--ink-3);font-weight:600}
.full{margin-top:14px;border-radius:22px;padding:20px;text-align:center;color:#fff;background:#141A4D;position:relative;overflow:hidden}
.full::before{content:"";position:absolute;inset:-40%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));animation:spin 6s linear infinite;opacity:.55}
@keyframes spin{to{transform:rotate(1turn)}}
.full>*{position:relative}
.full b{font-family:var(--display);font-size:28px;display:block}
.note{background:#FFF4DB;color:#8A5A00;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:14px}
.mini{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-weight:700;margin-top:10px}

/* =============== ADMIN / QR =============== */
.adm{max-width:760px;margin:0 auto;padding:16px}
.adm h3{font-family:Lexend;margin:0 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{width:auto;flex:1;min-width:150px}
.cq{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.cq p{margin:0 0 8px;font-weight:600}
.cq .row button{border:0;border-radius:10px;padding:8px 12px;font-weight:800}
.qrp{width:210mm;min-height:297mm;margin:0 auto 10mm;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;page-break-after:always}
.qrp .top{position:absolute;inset:0 0 auto;height:28mm;background:linear-gradient(135deg,var(--d),var(--c))}
.qrp .bot{position:absolute;inset:auto 0 0;height:10mm;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4))}
.qrp img.lg{height:22mm;margin-top:36mm;background:#fff;border-radius:4mm;padding:2mm 4mm}
.qrp h1{font-family:Lexend;font-size:44pt;margin:8mm 0 0;letter-spacing:-.03em;color:var(--d)}
.qrp h2{font-family:Tajawal;font-size:34pt;margin:2mm 0 8mm;color:var(--ink)}
.qrp .k{font-weight:800;letter-spacing:.2em;font-size:13pt;color:var(--c)}
.qrp .qr{padding:6mm;border:2mm solid var(--c);border-radius:8mm}
.qrp .qr img,.qrp .qr canvas{width:110mm!important;height:110mm!important;display:block}
.qrp p{font-size:18pt;font-weight:800;margin:8mm 0 0}
.qrp p.ar{font-size:20pt}
@media print{body{background:#fff}.noprint{display:none!important}.qrp{margin:0}@page{size:A4;margin:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const norm = v => ({ratings: (v && v.ratings) || {}, state: (v && v.state) || {}});
function fbBackend(cfg) {
  firebase.initializeApp(cfg);
  const root = firebase.database().ref("pr");
  return {live: true,
    subscribe(cb) { root.on("value", s => cb(norm(s.val()))); },
    rate(id, rec) { return root.child("ratings/" + id).set({...rec, ts: firebase.database.ServerValue.TIMESTAMP}); },
    patch(id, p) { return root.child("ratings/" + id).update(p); },
    setState(p) { return root.child("state").update(p); },
    reset() { return root.set({}); }};
}
function localBackend() {
  const K = "utas-pr-demo", subs = [];
  const load = () => { try { return norm(JSON.parse(store.get(K))); } catch { return norm(); } };
  const ch = "BroadcastChannel" in window ? new BroadcastChannel("utas-pr") : null;
  const emit = () => subs.forEach(f => f(load()));
  const save = v => { store.set(K, JSON.stringify(v)); ch && ch.postMessage(1); emit(); };
  if (ch) ch.onmessage = emit;
  addEventListener("storage", e => { if (e.key === K) emit(); });
  return {live: false, peek: load,
    subscribe(cb) { subs.push(cb); cb(load()); },
    async rate(id, rec) { const v = load(); v.ratings[id] = {...rec, ts: Date.now()}; save(v); },
    async patch(id, p) { const v = load(); if (v.ratings[id]) Object.assign(v.ratings[id], p); save(v); },
    async setState(p) { const v = load(); Object.assign(v.state, p); save(v); },
    async reset(seed) { save(norm()); if (seed) seedDemo(this); }};
}
const DEMO_C = ["Loved the live market, very creative!", "أسلوب ممتع ومفيد جدًا", "The crisis timer was intense!", "Great design and friendly team", "فكرة رائعة، تعلّمت الكثير", "Fun way to learn leadership"];
function seedDemo(be) {
  const bias = [4.4, 4.1, 4.3, 3.7];
  for (let i = 0; i < 46; i++) {
    const g = Math.random() < .75 ? "student" : "staff";
    const desks = [1, 2, 3, 4].filter(() => Math.random() < .75);
    desks.forEach(n => {
      const s = {}; CRIT.forEach(([k]) => s[k] = Math.max(1, Math.min(5, Math.round(bias[n - 1] + (Math.random() - .45) * 1.8))));
      const c = Math.random() < .12 ? DEMO_C[Math.floor(Math.random() * DEMO_C.length)] : "";
      be.rate(`demo${i}_${n}`, {dev: "demo" + i, d: n, g, team: 0, s, c, cs: c ? (Math.random() < .7 ? "approved" : "pending") : ""});
    });
  }
}
/* scoring: every criterion 1-5; desk score = average of the 4 criteria, shown out of 100.
   Students and staff count 50/50; if only one group has rated a desk, that group's score is used.
   A team member's rating of their own desk is not counted. */
function tally(st) {
  const R = Object.entries(st.ratings || {}).map(([id, v]) => ({id, ...v})).filter(r => r && r.d >= 1 && r.d <= 4 && r.s);
  const valid = R.filter(r => Number(r.team) !== r.d);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const desks = CONFIG.desks.map(D => {
    const rs = valid.filter(r => r.d === D.n), byG = g => rs.filter(r => r.g === g);
    const crit = list => Object.fromEntries(CRIT.map(([k]) => [k, avg(list.map(r => +r.s[k] || 0))]));
    const sc = list => { if (!list.length) return null; const c = crit(list); return avg(Object.values(c)) / 5 * 100; };
    const S = sc(byG("staff")), U = sc(byG("student"));
    const score = S != null && U != null ? (S + U) / 2 : (S ?? U ?? 0);
    const cS = crit(byG("staff")), cU = crit(byG("student"));
    const critMix = Object.fromEntries(CRIT.map(([k]) => { const a = cS[k], b = cU[k]; return [k, a != null && b != null ? (a + b) / 2 : (a ?? b ?? 0)]; }));
    return {...D, n: D.n, count: rs.length, nS: byG("staff").length, nU: byG("student").length, score, S, U, crit: critMix};
  });
  const rank = [...desks].sort((a, b) => b.score - a.score || b.count - a.count || b.crit.i - a.crit.i);
  rank.forEach((d, i) => d.rank = d.count ? i + 1 : null);
  const devs = {}; valid.forEach(r => (devs[r.dev] = devs[r.dev] || new Set()).add(r.d));
  const full = Object.values(devs).filter(s => s.size === 4).length;
  const best = Object.fromEntries(CRIT.map(([k]) => [k, [...desks].filter(d => d.count).sort((a, b) => b.crit[k] - a.crit[k])[0] || null]));
  const fav = g => { const ds = desks.map(d => ({d, v: g === "staff" ? d.S : d.U})).filter(x => x.v != null).sort((a, b) => b.v - a.v); return ds[0] || null; };
  const comments = R.filter(r => r.c && r.cs === "approved").sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const pending = R.filter(r => r.c && r.cs === "pending").sort((a, b) => (a.ts || 0) - (b.ts || 0));
  return {R, valid, desks, rank, total: valid.length, people: Object.keys(devs).length, full, best, favS: fav("staff"), favU: fav("student"), comments, pending, frozen: !!(st.state && st.state.frozen)};
}

    drawWall();
    const sig = D.total + "|" + D.rank.map(d => d.n).join();
    if (sig !== tapeSig) { tapeSig = sig;
      const items = [`<span>✦ Scan the QR at each desk to rate it · امسح رمز QR في كل طاولة لتقييمها</span>`, `<span>✦ Rate all 4 desks for the Full Spectrum · قيّم الطاولات الأربع لتحصل على الطيف الكامل</span>`,
        ...D.rank.filter(d => d.count).map(d => `<span>#${d.rank} ${esc(d.en)} · ${esc(d.ar)} — ${Math.round(d.score)}/100</span>`)];
      let h = items.join(""); while (h.length < 2000) h += h; $("#tape").innerHTML = h + h;
      requestAnimationFrame(() => $("#tape").style.setProperty("--dur", Math.max(50, $("#tape").scrollWidth / 2 / 60) + "s")); }
    frozen();
  }
  function drawWall() {
    const C = D.comments; const box = $("#wall");
    if (!C.length) { box.innerHTML = `<div class="cm" style="opacity:.7">Leave a short comment when you rate a desk.<small class="ar">اترك تعليقًا قصيرًا عند تقييم الطاولة</small></div>`; return; }
    const c = C[wi % C.length], d = DK(c.d);
    box.innerHTML = `<div class="cm" dir="auto">${esc(c.c)}<small><span class="chip" style="--c:${d.c}">${esc(d.en)}</span></small></div>`;
  }
  setInterval(() => { if (D && D.comments.length > 1) { wi++; drawWall(); } }, 7000);
  let lastFrozen = false;
  function frozen() {
    if (!D.frozen) { $("#fz").innerHTML = ""; lastFrozen = false; return; }
    const w = D.rank[0]; if (!w || !w.count) { $("#fz").innerHTML = ""; return; }
    $("#fz").innerHTML = `<div class="frozen"><div class="w"><small>BEST DESK · أفضل طاولة</small><h2 class="spec">${esc(w.en)}</h2><div class="ar">${esc(w.ar)}</div><span class="sc" style="--c:${w.c}">${Math.round(w.score)} / 100</span>
      <div class="rest">${D.rank.slice(1).filter(d => d.count).map(d => `<span class="chip" style="--c:${d.c}">#${d.rank} ${esc(d.en)} · ${Math.round(d.score)}</span>`).join("")}</div></div></div>`;
    if (!lastFrozen) { lastFrozen = true; confetti(); }
  }
  be.subscribe(render);
  addEventListener("keydown", e => { if (e.key === "f") { try { document.documentElement.requestFullscreen(); } catch {} } });
  if (!be.live) setInterval(() => { if (store.get("pr-sim") === "off") return; const i = 100 + Math.floor(Math.random() * 900), n = 1 + Math.floor(Math.random() * 4), s = {}; CRIT.forEach(([k]) => s[k] = 3 + Math.floor(Math.random() * 3)); be.rate(`sim${i}_${n}`, {dev: "sim" + i, d: n, g: Math.random() < .7 ? "student" : "staff", team: 0, s, c: "", cs: ""}); }, 5000);
}
function confetti() {
  const cv = $("#conf"); cv.hidden = false; const x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = CONFIG.desks.map(d => d.c).concat(["#fff"]);
  const P = Array.from({length: 220}, () => ({x: Math.random() * cv.width, y: -20 - Math.random() * cv.height, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, s: 6 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)]}));
  const end = Date.now() + 7000;
  (function f() { x.clearRect(0, 0, cv.width, cv.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .08; if (p.y > cv.height + 20 && Date.now() < end - 2000) p.y = -20; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (Date.now() < end) requestAnimationFrame(f); else { x.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; } })();
}

/* ================== PHONE: rate a desk / pass ================== */
function Phone(be, desk) {
  setLang(store.get("prism-lang") || store.get("ix-lang") || ((navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en"));
  let dev = store.get("pr-dev"); if (!dev) { dev = "v" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set("pr-dev", dev); }
  let me = null; try { me = JSON.parse(store.get("pr-me")); } catch {}
  let D = null, stage = me ? (desk ? "rate" : "pass") : "setup", sel = {}, comment = "", setupG = me?.g || null, setupT = me?.team ?? 0;
  const mine = () => D ? Object.fromEntries(D.R.filter(r => r.dev === dev).map(r => [r.d, r])) : {};
  function head() {
    const on = desk || 0;
    return `<div class="pbar">${CONFIG.desks.map(d => `<i class="${d.n === on || !on ? "on" : ""}" style="background:${d.c}"></i>`).join("")}</div>
      <div class="phd"><div class="br">${PRISM_ICON()}<div><b>PRISM</b><small>${L("Rate the desks", "قيّم الطاولات")} · UTAS Ibra</small></div></div><button class="lng" data-lang>${LANG === "ar" ? "English" : "عربي"}</button></div>`;
  }
  function draw() {
    const box = $("#app"), M = mine();
    if (D && D.frozen) { box.innerHTML = `<div class="ph">${head()}<div class="card" style="text-align:center"><h2 style="font-family:var(--display);margin:.2em 0">${L("Voting is closed", "انتهى التصويت")}</h2><p style="color:var(--ink-2)">${L("Look at the big screen for the Best Desk!", "تابع الشاشة الكبيرة لمعرفة أفضل طاولة!")}</p></div>${passHTML(M)}</div>`; return; }
    if (stage === "setup") {
      box.innerHTML = `<div class="ph">${head()}
        <div class="card"><h2 style="font-family:var(--display);margin:0 0 4px;font-size:24px">${L("Welcome to PRISM", "مرحبًا بك في PRISM")}</h2><p style="margin:0;color:var(--ink-2)">${L("Rate each desk you visit. It takes 20 seconds and it's anonymous.", "قيّم كل طاولة تزورها. يستغرق ذلك 20 ثانية وهو بدون اسم.")}</p>
          <span class="lab">${L("I am…", "أنا…")}</span><div class="seg"><button data-g="student" aria-pressed="${setupG === "student"}">${L("Student", "طالب")}</button><button data-g="staff" aria-pressed="${setupG === "staff"}">${L("Staff", "موظف")}</button></div>
          <span class="lab">${L("Are you on a desk team?", "هل أنت ضمن فريق إحدى الطاولات؟")}</span>
          <select id="team"><option value="0">${L("No, I'm a visitor", "لا، أنا زائر")}</option>${CONFIG.desks.map(d => `<option value="${d.n}" ${+setupT === d.n ? "selected" : ""}>${L("Yes, desk", "نعم، الطاولة")} ${d.n}: ${esc(dName(d.n))}</option>`).join("")}</select>
          <div class="err" id="se"></div><button class="btn" id="go">${L("Continue", "متابعة")}</button></div></div>`;
      box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { setupG = b.dataset.g; box.querySelectorAll("[data-g]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
      $("#team").onchange = e => setupT = +e.target.value;
      $("#go").onclick = () => { if (!setupG) return $("#se").textContent = L("Choose Student or Staff.", "اختر: طالب أو موظف."); me = {g: setupG, team: +setupT}; store.set("pr-me", JSON.stringify(me)); stage = desk ? "rate" : "pass"; draw(); };
      return;
    }
    if (stage === "rate" && desk) {
      const Dk = DK(desk), prev = M[desk];
      if (prev && !Object.keys(sel).length) { sel = {...prev.s}; comment = prev.c || ""; }
      if (me.team === desk) {
        box.innerHTML = `<div class="ph">${head()}<div class="dh" style="--c:${Dk.c};--d:${Dk.d}"><small>PRISM · ${L("DESK", "الطاولة")} ${desk}</small><h1>${esc(dName(desk))}</h1></div>
          <div class="note">${L("This is your own desk, so you can't rate it. Visit the other desks and rate them!", "هذه طاولتك، لذا لا يمكنك تقييمها. زر الطاولات الأخرى وقيّمها!")}</div>${passHTML(M)}</div>`; return;
      }
      const all = CRIT.every(([k]) => sel[k]);
      box.innerHTML = `<div class="ph">${head()}
        <div class="dh" style="--c:${Dk.c};--d:${Dk.d}"><small>PRISM · ${L("DESK", "الطاولة")} ${desk}</small><h1>${esc(dName(desk))}</h1><p>${prev ? L("You rated this desk. You can update it.", "قيّمت هذه الطاولة، ويمكنك تعديل تقييمك.") : L("Rate this desk: 4 quick stars", "قيّم هذه الطاولة: 4 تقييمات سريعة")}</p></div>
        <div class="card">${CRIT.map(([k, en, ar, qen, qar]) => `<div class="cr"><div class="q"><b>${L(en, ar)}</b><span>${L(qen, qar)}</span></div>
            <div class="stars" role="radiogroup" aria-label="${L(en, ar)}">${[1, 2, 3, 4, 5].map(v => `<button data-k="${k}" data-v="${v}" class="${sel[k] >= v ? "on" : ""}" aria-label="${v}">★</button>`).join("")}</div></div>`).join("")}
          <span class="lab">${L("Comment (optional)", "تعليق (اختياري)")}</span><textarea id="cm" maxlength="140" placeholder="${L("What did you like?", "ما الذي أعجبك؟")}">${esc(comment)}</textarea>
          <button class="btn" id="sub" style="background:${Dk.c}" ${all ? "" : "disabled"}>${all ? (prev ? L("Update my rating", "حدّث تقييمي") : L("Submit rating", "أرسل التقييم")) : L("Tap the stars for all 4", "اختر النجوم للمعايير الأربعة")}</button>
          <div class="mini"><span>${L("Anonymous · one rating per desk", "بدون اسم · تقييم واحد لكل طاولة")}</span><span>${me.g === "staff" ? L("Staff", "موظف") : L("Student", "طالب")} · <a href="#" id="chg" style="color:inherit">${L("change", "تغيير")}</a></span></div></div>
        ${passHTML(M)}</div>`;
      box.querySelectorAll(".stars button").forEach(b => b.onclick = () => { sel[b.dataset.k] = +b.dataset.v; comment = $("#cm").value; navigator.vibrate?.(10); draw(); });
      $("#cm").oninput = e => comment = e.target.value;
      $("#chg").onclick = e => { e.preventDefault(); stage = "setup"; draw(); };
      $("#sub").onclick = async () => {
        const b = $("#sub"); b.disabled = true; b.textContent = L("Sending…", "جارٍ الإرسال…");
        const c = ($("#cm").value || "").trim().slice(0, 140);
        try {
          await be.rate(dev + "_" + desk, {dev, d: desk, g: me.g, team: me.team || 0, s: {...sel}, c, cs: c ? (prev && prev.c === c ? prev.cs : "pending") : ""});
          const n = Object.keys({...M, [desk]: 1}).length;
          toast(n >= 4 ? L("Full Spectrum! You rated all 4 desks 🌈", "الطيف الكامل! قيّمت الطاولات الأربع 🌈") : L(`Thank you! ${n} of 4 colours collected`, `شكرًا! جمعت ${n} من 4 ألوان`));
          stage = "done"; draw(); scrollTo({top: 0, behavior: "smooth"});
        } catch { b.disabled = false; b.textContent = L("Try again", "حاول مرة أخرى"); toast(L("Could not send. Check your internet.", "تعذّر الإرسال. تحقّق من الإنترنت.")); }
      };
      return;
    }
    // done / pass
    box.innerHTML = `<div class="ph">${head()}${stage === "done" && desk ? `<div class="dh" style="--c:${DK(desk).c};--d:${DK(desk).d}"><small>✓ ${L("RATED", "تم التقييم")}</small><h1>${esc(dName(desk))}</h1><p>${L("Thank you! Your rating is live on the big screen.", "شكرًا! تقييمك يظهر الآن على الشاشة الكبيرة.")}</p></div>` : ""}
      ${passHTML(M)}${stage === "done" && desk ? `<button class="btn ghost" id="edit">${L("Edit my rating", "عدّل تقييمي")}</button>` : ""}</div>`;
    $("#edit") && ($("#edit").onclick = () => { stage = "rate"; draw(); });
  }
  function passHTML(M) {
    const n = Object.keys(M).length;
    return `<div class="card"><h3 style="margin:0 0 4px;font-family:var(--display)">${L("My PRISM Pass", "بطاقة PRISM الخاصة بي")}</h3>
      <p style="margin:0 0 12px;color:var(--ink-2);font-size:14px">${n >= 4 ? L("All 4 colours collected!", "جمعت الألوان الأربعة!") : L(`${n} of 4 colours · scan the QR at each desk to rate it`, `${n} من 4 ألوان · امسح رمز QR في كل طاولة لتقييمها`)}</p>
      <div class="pass">${CONFIG.desks.map(d => { const ok = M[d.n] || (me && me.team === d.n); return `<div class="ps${ok ? " ok" : ""}" style="--c:${d.c}"><span class="o">${ok ? "✓" : ""}</span><b>${esc(dName(d.n))}</b><span>${M[d.n] ? L("Rated", "تم التقييم") : me && me.team === d.n ? L("Your desk", "طاولتك") : L("Scan its QR", "امسح رمزها")}</span></div>`; }).join("")}</div>
      ${n >= 4 || (n >= 3 && me && me.team) ? `<div class="full"><b>${L("Full Spectrum!", "الطيف الكامل!")}</b><span>${L("Show this screen at the PRISM banner", "اعرض هذه الشاشة عند لوحة PRISM")}</span></div>` : ""}</div>`;
  }
  $("#app").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) { setLang(LANG === "ar" ? "en" : "ar"); draw(); } });
  be.subscribe(st => { D = tally(st); if (!(stage === "rate" && document.activeElement && document.activeElement.id === "cm")) draw(); });
  draw();
}

/* ================== ADMIN ================== */
function Admin(be) {
  setLang("en"); let raw;
  function render(st) {
    if (st) raw = st; if (!raw) return; const D = tally(raw), box = $("#app");
    if (sess.get("pr-admin") !== "1") {
      if (!$("#pinf")) { box.innerHTML = `<div class="adm"><div class="card"><h3>PRISM control desk</h3><form id="pinf"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit"><button class="btn">Unlock</button></form><div class="err" id="pe"></div></div></div>`;
        $("#pinf").onsubmit = e => { e.preventDefault(); if ($("#pin").value === CONFIG.pin) { sess.set("pr-admin", "1"); render(); } else $("#pe").textContent = "Wrong PIN."; }; }
      return;
    }
    box.innerHTML = `<div class="adm">
      <div class="card"><h3>PRISM ratings ${D.frozen ? `<span class="chip" style="--c:#C42B30">CLOSED</span>` : `<span class="chip" style="--c:#12A36B">OPEN</span>`}</h3>
        <table class="tbl"><thead><tr><th>#</th><th>Desk</th><th class="n">Score</th><th class="n">Students</th><th class="n">Staff</th><th class="n">Ratings</th></tr></thead><tbody>
        ${D.rank.map(d => `<tr><td>${d.rank || "–"}</td><td><span class="chip" style="--c:${d.c}">${esc(d.en)}</span></td><td class="n"><b>${d.count ? Math.round(d.score) : "–"}</b></td><td class="n">${d.U != null ? Math.round(d.U) + ` (${d.nU})` : "–"}</td><td class="n">${d.S != null ? Math.round(d.S) + ` (${d.nS})` : "–"}</td><td class="n">${d.count}</td></tr>`).join("")}</tbody></table>
        <p style="color:var(--ink-2);font-size:14px">${D.total} valid ratings · ${D.people} visitors · ${D.full} Full Spectrum · ${D.R.length - D.valid.length} own-desk ratings ignored</p>
        <div class="row">${D.frozen ? `<button class="btn" id="unf" style="background:#12A36B">Re-open voting</button>` : `<button class="btn" id="frz" style="background:#C42B30">Close voting &amp; announce Best Desk</button>`}<button class="btn ghost" id="csv">Download CSV</button></div></div>
      <div class="card"><h3>Comments waiting (${D.pending.length})</h3><p style="color:var(--ink-2);font-size:14px;margin:0">Approved comments scroll on the big screen.</p>
        ${D.pending.map(r => `<div class="cq"><p dir="auto">${esc(r.c)}</p><div class="row"><span class="chip" style="--c:${DK(r.d).c}">${esc(DK(r.d).en)}</span><button data-ok="${r.id}" style="background:#E3F7EE;color:#0A7A4E">Approve</button><button data-no="${r.id}" style="background:#FDE7E8;color:#A3262A">Hide</button></div></div>`).join("") || `<p style="color:var(--ink-3)">Nothing waiting.</p>`}</div>
      <div class="card"><h3>Desk QR posters</h3><p style="color:var(--ink-2);font-size:14px">Print one A4 poster per desk: each QR opens the rating page for that desk.</p><div class="row"><a class="btn" href="#qr" style="text-align:center;text-decoration:none">Open QR posters</a></div>
        <p style="font-size:13px;color:var(--ink-3);word-break:break-all">${CONFIG.desks.map(d => `Desk ${d.n}: ${esc(baseURL())}#d${d.n}`).join("<br>")}<br>Big screen: ${esc(baseURL())}</p></div>
      <div class="card"><h3>Reset</h3><p style="color:var(--ink-2);font-size:14px">Deletes every rating. Do this right before the Open Day starts.</p><div class="row"><input id="rp" type="password" inputmode="numeric" placeholder="Type PIN to confirm" style="flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit"><button class="btn ghost" id="rst">Reset all ratings</button>${!be.live ? `<button class="btn ghost" id="seed">Reload demo data</button>` : ""}</div></div></div>`;
    $("#frz") && ($("#frz").onclick = async () => { await be.setState({frozen: true, at: Date.now()}); toast("Voting closed. The big screen shows the Best Desk."); });
    $("#unf") && ($("#unf").onclick = async () => { await be.setState({frozen: false}); toast("Voting is open again."); });
    box.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => be.patch(b.dataset.ok, {cs: "approved"}));
    box.querySelectorAll("[data-no]").forEach(b => b.onclick = () => be.patch(b.dataset.no, {cs: "hidden"}));
    $("#rst").onclick = async () => { if ($("#rp").value !== CONFIG.pin) return toast("Type the PIN first."); await be.reset(false); toast("All ratings deleted."); };
    $("#seed") && ($("#seed").onclick = () => be.reset(true));
    $("#csv").onclick = () => {
      const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const rows = [["Desk", "Group", "Team member of desk", "Innovation", "Engagement", "Learning", "Presentation", "Comment", "Comment status", "Counted", "Time"],
        ...D.R.map(r => [DK(r.d).en, r.g, r.team || "", r.s.i, r.s.e, r.s.l, r.s.p, r.c || "", r.cs || "", Number(r.team) === r.d ? "no (own desk)" : "yes", r.ts ? new Date(r.ts).toLocaleString("en-GB") : ""])];
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + rows.map(r => r.map(q).join(",")).join("\n")], {type: "text/csv"})); a.download = "prism-desk-ratings.csv"; document.body.appendChild(a); a.click(); a.remove();
    };
  }
  be.subscribe(render);
}

/* ================== QR POSTERS ================== */
function Posters() {
  setLang("en");
  $("#app").innerHTML = `<div class="noprint" style="max-width:210mm;margin:12px auto;display:flex;gap:8px"><button class="btn" onclick="window.print()">Print or save as PDF</button><a class="btn ghost" href="#admin" style="text-align:center;text-decoration:none">Back</a></div>` +
    CONFIG.desks.map(d => `<section class="qrp" style="--c:${d.c};--d:${d.d}"><div class="top"></div><img class="lg" src="${LOGO}" alt="UTAS Ibra">
      <div class="k" style="margin-top:8mm">PRISM · DESK ${d.n} · الطاولة ${d.n}</div><h1>${esc(d.en)}</h1><h2>${esc(d.ar)}</h2>
      <div class="qr" id="q${d.n}"></div><p>Scan to rate this desk</p><p class="ar">امسح الرمز لتقييم هذه الطاولة</p><div class="bot"></div></section>`).join("");
  CONFIG.desks.forEach(d => { try { new QRCode($("#q" + d.n), {text: baseURL() + "#d" + d.n, width: 600, height: 600, colorDark: "#1B2559", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M}); } catch { $("#q" + d.n).textContent = baseURL() + "#d" + d.n; } });
}

/* ================== boot ================== */
(async () => {
  let be = null;
  if (CONFIG.firebase && CONFIG.firebase.databaseURL) {
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js");
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js");
      be = fbBackend(CONFIG.firebase);
    } catch (e) { console.warn(e); }
  }
  const h = location.hash.replace("#", "");
  if (!be) {
    be = localBackend();
    if (!Object.keys(be.peek().ratings).length && store.get("pr-seeded") !== "1") { store.set("pr-seeded", "1"); seedDemo(be); }
    const n = document.createElement("nav"); n.className = "demo noprint";
    n.innerHTML = `<a href="#" class="${!h ? "on" : ""}">Screen</a><a href="#d2" class="${/^d\d$/.test(h) ? "on" : ""}">Phone</a><a href="#admin" class="${h === "admin" ? "on" : ""}">Desk</a><a href="#qr" class="${h === "qr" ? "on" : ""}">QR</a>`;
    document.body.appendChild(n);
  }
  const m = h.match(/^d([1-4])$/);
  if (m) Phone(be, +m[1]); else if (h === "pass") Phone(be, 0); else if (h === "admin") Admin(be); else if (h === "qr") Posters(); else Screen(be);
  addEventListener("hashchange", () => location.reload());
})();
</script>
