<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Tools in Your Medical Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7F5;--card:#fff;--ink:#14312B;--soft:#5B736D;--line:#DCE7E2;--pri:#0E7C66;--pri2:#0A5E4E;--tint:#E3F3EE;--hi:#1E9E6A;--av:#D99A00;--lo:#D9603B;--r:18px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:5;background:rgba(243,247,245,.94);backdrop-filter:blur(6px);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto}
.top-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),#35B58F);border-radius:99px;transition:width .4s}
h1{font-size:30px;line-height:1.15;margin:28px 0 8px;font-weight:800;letter-spacing:-.3px}
h2{font-size:23px;margin:26px 0 4px;font-weight:800}
.lead{color:var(--soft);margin:0 0 18px}
.hero{background:linear-gradient(150deg,#0E7C66,#0A5E4E);color:#fff;border-radius:24px;padding:26px 22px;margin-top:20px}
.hero h1{margin:6px 0 10px;color:#fff}
.hero p{margin:0;opacity:.93}
.tag{display:inline-block;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.fact{background:var(--card);border-radius:var(--r);padding:14px 8px;text-align:center;border:1px solid var(--line)}
.fact b{display:block;font-size:20px;color:var(--pri)}
.fact span{font-size:13px;color:var(--soft);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin:12px 0;transition:border-color .2s,box-shadow .2s}
.card.miss{border-color:var(--lo);box-shadow:0 0 0 3px rgba(217,96,59,.15)}
.card.done{border-color:#BFE0D5}
.q{font-weight:700;margin:0 0 12px}
.q small{display:block;font-weight:600;color:var(--soft);font-size:14px;margin-top:2px}
.num{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;background:var(--tint);color:var(--pri2);border-radius:99px;font-size:13px;font-weight:800;margin-right:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{flex:1 1 auto}
.opts.col label{flex:1 1 100%}
.opts input,.lik input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:block;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font-weight:700;text-align:center;cursor:pointer;min-height:48px;transition:all .15s}
.opts.col span{text-align:left}
.opts input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.opts input:focus-visible+span,.lik input:focus-visible+span{outline:3px solid #7FD1BA;outline-offset:2px}
.lik{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lik label{cursor:pointer;text-align:center}
.lik span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border:2px solid var(--line);border-radius:14px;font-size:11.5px;line-height:1.15;font-weight:700;color:var(--soft);min-height:74px;transition:all .15s}
.lik span::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid #B9CCC5;background:#fff;flex:none}
.lik input:checked+span{border-color:var(--pri);background:var(--tint);color:var(--pri2)}
.lik input:checked+span::before{background:var(--pri);border-color:var(--pri);box-shadow:inset 0 0 0 4px #fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 16px;z-index:6}
.nav-in{max-width:680px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:15px 20px;cursor:pointer;min-height:52px}
.btn{background:var(--pri);color:#fff;flex:1}
.btn:active{background:var(--pri2)}
.btn[disabled]{opacity:.6}
.ghost{background:var(--tint);color:var(--pri2)}
.link{background:none;color:var(--soft);padding:10px;font-weight:700;text-decoration:underline;min-height:0}
.note{font-size:14px;color:var(--soft)}
.warn{color:var(--lo);font-weight:700;font-size:15px;margin:8px 0 0;min-height:22px}
.consent{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin:14px 0}
.consent p{margin:0 0 10px}
.hide{display:none!important}
/* results */
.overall{border-radius:24px;padding:24px 20px;color:#fff;margin-top:18px}
.overall .big{font-size:34px;font-weight:800;line-height:1.1;margin:6px 0}
.overall p{margin:6px 0 0;opacity:.95}
.b-hi{background:linear-gradient(150deg,#1E9E6A,#147A52)}
.b-av{background:linear-gradient(150deg,#D99A00,#B07A00)}
.b-lo{background:linear-gradient(150deg,#D9603B,#B44A29)}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:800;color:#fff;white-space:nowrap}
.c-hi{background:var(--hi)}.c-av{background:var(--av)}.c-lo{background:var(--lo)}
.res-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.res-h b{font-size:17px}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 8px}
.meter i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s}
.sc{font-size:14px;color:var(--soft);font-weight:700}
.exp{font-size:15px;margin:4px 0 0}
.chart{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:6px;background:linear-gradient(to top,rgba(217,96,59,.07) 0 30%,rgba(217,154,0,.07) 30% 60%,rgba(30,158,106,.07) 60% 100%) no-repeat 0 0/100% 150px;border-radius:10px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cb i{display:block;width:70%;border-radius:8px 8px 0 0;height:0;transition:height .9s}
.cb span{font-weight:800;font-size:15px}
.cb em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--soft);height:34px;line-height:1.15;text-align:center;padding-top:5px}
.copy{font-size:12.5px;color:var(--soft);margin-top:18px}
.ar{font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;direction:rtl;text-align:right;line-height:1.8}
.hero .ar{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.28)}
.hero .ar b{display:block;font-size:24px;font-weight:800;margin-bottom:4px}
.consent .ar{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.fact em{display:block;font-style:normal;font-family:Tajawal,sans-serif;font-size:13px;color:var(--soft);direction:rtl}
.wf .fact{padding:14px 6px 12px}.wf .fact b{font-size:15px;color:var(--ink);margin-top:6px}.wf .fact span{display:block;font-size:12px;line-height:1.3;margin:2px 0}
.ic{display:inline-flex;width:40px;height:40px;border-radius:50%;background:var(--tint);align-items:center;justify-content:center}.ic svg{width:22px;height:22px;fill:none;stroke:var(--pri);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gift{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF6E0,#E3F3EE);border:2px solid #F2C14E;border-radius:22px;padding:18px 16px;margin:4px 0 16px;box-shadow:0 6px 18px rgba(217,154,0,.15)}
.gift h2{margin:6px 0 6px;font-size:20px;color:var(--ink)}.gift p{margin:0 0 6px;font-size:14px;color:var(--ink)}
.gift .ar{font-family:Tajawal,sans-serif;direction:rtl;text-align:right;color:var(--soft);margin:0}
.badge{display:inline-block;background:#D99A00;color:#fff;font-weight:800;font-size:11px;letter-spacing:.5px;padding:3px 9px;border-radius:99px}
.gift-t{flex:1 1 auto}.gift-v{flex:0 0 92px;background:#fff;border-radius:14px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.mini i{display:block;height:7px;border-radius:4px;margin:5px 0}.gift-v small{font-size:11px;color:var(--soft);font-weight:700}
.fld{display:block;width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:14px;margin:6px 0 12px;background:#fff}
.fld:focus{outline:3px solid #7FD1BA;border-color:var(--pri)}
.cov td{font-size:14px}.cov th{font-size:12px;color:var(--soft);text-align:right;padding:4px;font-weight:700}.cov th:first-child{text-align:left}.cov td:not(:first-child){text-align:right}.fl{display:inline-block;min-width:46px;padding:2px 6px;border-radius:99px;color:#fff;font-weight:800;font-size:13px;text-align:center}.fl.r{background:var(--lo)}.fl.a{background:var(--av)}.fl.g{background:var(--hi)}.dy{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.dy span{width:70px;color:var(--soft)}.dy i{display:block;height:12px;background:var(--pri);border-radius:6px}.stf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0;font-size:14px}.stf input{width:90px;padding:6px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}.tbl td:last-child{text-align:right;font-weight:800}
@media (min-width:560px){.lik span{font-size:13px}}
@media print{#dlr,.nav,header.top,.link{display:none!important}.meter i{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
.del{background:#FBE9E3;color:#B44A29;padding:8px 12px;min-height:40px;font-size:14px;border-radius:10px}
.rec td{font-size:14px;vertical-align:middle}.rec td:last-child{font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
.oth{margin-top:10px;width:100%}
</style>
</head>
<body>
<header class="top hide" id="top"><div class="top-in">
  <div class="top-row"><span id="stepName"></span><span id="stepNum"></span></div>
  <div class="bar"><i id="barFill"></i></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="nav hide" id="nav"><div class="nav-in">
  <button class="ghost" id="back" type="button">Back</button>
  <button class="btn" id="next" type="button">Continue</button>
</div></div>

<script>
/* ---------- settings ---------- */
const DB_URL = "https://utasx-f7719-default-rtdb.europe-west1.firebasedatabase.app";
const DB_PATH = "wq";
const KEY = "wq_v4";
const VER = 4;
const ADMIN_USER = "admin@worklife-survey.app"; // fixed admin account; the PIN is its password in Firebase Authentication
const API_KEY = "AIzaSyDKVw0oMUqD5iaQBQM9aT0zRGE3b1LxXw8"; // public web key of the Firebase project (not a password)

/* ---------- content ---------- */
const AG = ["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"];
/* time-anchored frequency options of the GAIES Use Frequency subscale (Zhang et al., 2025) */
const FQ = ["Never","Rarely (once or twice in the month)","Occasionally (about once a week)","Frequently (several times a week)","Very frequently (nearly daily)"];
const IFUSER = {id:"B1",not:0};
const A = [
 {id:"A1",t:"Gender",o:["Male","Female"]},
 {id:"A2",t:"Age group",o:["Under 30","30–39","40–49","50 or above"]},
 {id:"A3",t:"Your current grade",col:1,o:["General Practitioner / Medical Officer","Resident (OMSB trainee)","Specialist / Senior Specialist","Consultant / Senior Consultant"]},
 {id:"A4",t:"Your main area of practice",col:1,o:["Family medicine / General practice","Internal medicine or its subspecialties","Surgery or surgical specialties","Paediatrics","Obstetrics and gynaecology","Emergency medicine","Anaesthesia or intensive care","Radiology, pathology or laboratory medicine","Administration or public health","Other"]},
 {id:"A5",t:"Years of experience as a doctor",o:["Less than 5","5–9","10–19","20 or more"]},
 {id:"A6",t:"Workplace",col:1,o:["Ibra Hospital","Sinaw Hospital","Local Hospital","Health Center","Directorate General"]},
 {id:"A7",t:"Nationality",o:["Omani","Non-Omani"]}
];
const B = [
 {id:"B1",t:"In the past month, how often did you use AI tools for any work-related task?",col:1,o:FQ},
 {id:"B2",t:"Which AI tools have you used for work?",h:"Select all that apply",wh:"Skip if you answered Never to B1; select all that apply",multi:1,col:1,showIf:IFUSER,other:"Other AI tools",o:["ChatGPT","Gemini","Microsoft Copilot","Claude","DeepSeek","Perplexity","Meta AI","Grok","OpenEvidence or other medical AI tools","Other AI tools"]},
 {id:"B3",t:"Apart from patient care, what else do you use AI tools for in your work?",h:"Select all that apply",wh:"Skip if you answered Never to B1; select all that apply",multi:1,col:1,showIf:IFUSER,none:"None of these",other:"Other",o:["Searching for medical or scientific information","Summarising articles or guidelines","Writing reports, letters or emails (not patient records)","Research (literature review, study design or writing papers)","Learning, training or exams","Preparing presentations or teaching material","Data analysis or calculations","Translation","None of these","Other"]},
 {id:"B4",t:"Have you received any formal training on AI tools (a course, workshop or session)?",col:1,o:["Yes, from the Ministry of Health or my workplace","Yes, from other sources (university, conference or online course)","No"]}
];
/* clinical use: tasks adapted from Bagla et al. (2026) and Blease et al. (2025); response format from GAIES */
const CU = [
 {id:"CU1",t:"In the past month, how often did you use AI tools to suggest a differential diagnosis?",col:1,showIf:IFUSER,o:FQ},
 {id:"CU2",t:"In the past month, how often did you use AI tools to confirm a diagnosis you suspected?",col:1,showIf:IFUSER,o:FQ},
 {id:"CU3",t:"In the past month, how often did you use AI tools to answer clinical questions, such as drug doses, side effects or guidelines?",col:1,showIf:IFUSER,o:FQ},
 {id:"CU4",t:"In the past month, how often did you use AI tools to decide on investigations or treatment options?",col:1,showIf:IFUSER,o:FQ},
 {id:"CU5",t:"In the past month, how often did you use AI tools to prepare patient education or counselling material?",col:1,showIf:IFUSER,o:FQ},
 {id:"DOC",t:"In the past month, did you use AI tools to help write clinical documents, such as patient notes, referral letters or discharge summaries?",showIf:IFUSER,o:["Yes","No"]}
];
const OPTQ = [...A,...B,...CU];
/* TAM2 four-item scales (Venkatesh & Davis, 2000), conditional wording so non-users answer from expectation */
const PU = ["Using AI tools would improve my performance in my job.","Using AI tools in my job would increase my productivity.","Using AI tools would enhance my effectiveness in my job.","I would find AI tools useful in my job."];
const PE = ["My interaction with AI tools would be clear and understandable.","Interacting with AI tools would not require a lot of my mental effort.","I would find AI tools easy to use.","I would find it easy to get AI tools to do what I want them to do."];
/* perceived risk, adapted from Dai et al. (2025) */
const RK = ["I am concerned that AI tools may provide incorrect information, leading to adverse outcomes.","I am concerned that using AI tools may lead to medical disputes, making it difficult to determine responsibility.","I am concerned that the lack of transparency and explainability of AI tools may negatively affect the medical process.","I am concerned that the use of AI tools may increase inequities in health care services.","I am concerned that my job might eventually be replaced by AI."];
const BI = ["Assuming I have access to AI tools, I intend to use them in my work.","Given that I have access to AI tools, I predict that I would use them in my work."];

const VIEW = "If you use AI tools, answer from your experience. If you have never used them, tell us what you expect.";
const STEPS = [
 {name:"Welcome"},
 {name:"About you",title:"A little about you",lead:"A few quick taps. Nothing here can identify you.",kind:"opt",items:A},
 {name:"AI use",title:"How you use AI tools",lead:"AI tools here means programs that answer questions or produce text, such as ChatGPT, Gemini, Claude, Microsoft Copilot or OpenEvidence. Count only your use for work, not personal use such as help with children's homework or shopping. This is not a check on any policy.",kind:"opt",items:B},
 {name:"Patient care",title:"AI tools in patient care",lead:"Think of the patients you saw in the past month. Your answers are anonymous, so please answer as it really is.",kind:"opt",items:CU},
 {name:"Usefulness",title:"Would AI tools be useful in your work?",lead:VIEW,kind:"lik",pre:"PU",items:PU,from:0},
 {name:"Ease of use",title:"Would AI tools be easy to use?",lead:VIEW,kind:"lik",pre:"PE",items:PE,from:0},
 {name:"Concerns",title:"Your concerns about AI tools",lead:"Tell us how far you agree with each statement.",kind:"lik",pre:"RK",items:RK,from:0},
 {name:"Your plans",title:"Your plans for AI tools",lead:"Two short statements. Your results are next.",kind:"lik",pre:"BI",items:BI,from:0}
];

/* ---------- scoring ---------- */
const mean=(ans,p,n)=>+(Array.from({length:n},(_,i)=>ans[p+(i+1)]).reduce((s,v)=>s+v,0)/n).toFixed(2);
function score(ans){
  const user=ans.B1!==undefined&&ans.B1!==0;
  const cu=k=>user?ans["CU"+k]+1:1; // 1 = Never ... 5 = Very frequently; non-users scored 1
  const cuAll=[1,2,3,4,5].map(cu);
  return {pu:mean(ans,"PU",4),pe:mean(ans,"PE",4),rk:mean(ans,"RK",5),bi:mean(ans,"BI",2),
    use:(ans.B1??0)+1,cu:+(cuAll.reduce((a,b)=>a+b,0)/5).toFixed(2),cudt:+(cuAll.slice(0,4).reduce((a,b)=>a+b,0)/4).toFixed(2),
    cuany:cuAll.some(v=>v>1)?1:0,user:user?1:0};
}
const band=v=>v<2.5?"lo":(v>3.5?"hi":"av");
const BL={hi:"Higher",av:"Average",lo:"Lower"};

/* ---------- state ---------- */
let S={step:0,ans:{},sent:false,res:null};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ans)S=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const app=$("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

/* ---------- render ---------- */
let scrollT=0;
function toTop(){clearTimeout(scrollT);window.scrollTo({top:0,left:0,behavior:"instant"});document.documentElement.scrollTop=0;document.body.scrollTop=0}
const shown=q=>{if(!q.showIf)return true;const v=S.ans[q.showIf.id];if(v===undefined)return false;return q.showIf.in?q.showIf.in.includes(v):v!==q.showIf.not};
const stepOn=i=>{const st=STEPS[i];return !(st.kind==="opt"&&!st.items.some(q=>shown(q)||(q.showIf&&S.ans[q.showIf.id]===undefined)))};
const visSteps=()=>STEPS.map((_,i)=>i).filter(i=>i>0&&stepOn(i));
function render(){
  if(S.sent&&S.res)return results();
  if(S.step===0)return welcome();
  if(!stepOn(S.step)){S.step=Math.min(STEPS.length-1,S.step+1);return render()}
  const st=STEPS[S.step],vs=visSteps(),pos=vs.indexOf(S.step)+1;
  $("top").classList.remove("hide");$("nav").classList.remove("hide");
  $("stepName").textContent=st.name;$("stepNum").textContent="Step "+pos+" of "+vs.length;
  $("barFill").style.width=((pos-1)/vs.length*100+4)+"%";
  $("next").textContent=S.step===STEPS.length-1?"See my results":"Continue";
  let h=`<h2>${st.title}</h2><p class="lead">${st.lead}</p>`;
  if(st.kind==="opt")st.items.forEach(q=>{
    const cur=S.ans[q.id],oi=q.other?q.o.indexOf(q.other):-1,oOn=q.multi&&(cur||[]).includes(oi);
    h+=`<div class="card${shown(q)?"":" hide"}" data-q="${q.id}"><p class="q">${esc(q.t)}${q.h?`<small>${q.h}</small>`:""}</p><div class="opts ${q.col?"col":""}">`+
      q.o.map((o,i)=>{const on=q.multi?(cur||[]).includes(i):cur===i;
        return `<label><input type="${q.multi?"checkbox":"radio"}" name="${q.id}" value="${i}" ${on?"checked":""}><span>${esc(o)}</span></label>`}).join("")+`</div>`+
      (q.other?`<input class="fld oth${oOn?"":" hide"}" data-oth="${q.id}" type="text" maxlength="120" placeholder="Please specify (optional)" aria-label="${esc(q.other)}: please specify" value="${esc(S.ans[q.id+"_other"]||"")}">`:"")+`</div>`;
  });
  else st.items.forEach((t,k)=>{
    const id=st.pre+(st.from+k+1),cur=S.ans[id];
    h+=`<div class="card" data-q="${id}"><p class="q"><span class="num">${st.from+k+1}</span>${esc(t)}</p><div class="lik">`+
      AG.map((a,i)=>`<label><input type="radio" name="${id}" value="${i+1}" ${cur===i+1?"checked":""}><span>${a}</span></label>`).join("")+`</div></div>`;
  });
  h+=`<p class="warn" id="warn" role="alert"></p>`;
  app.innerHTML=h;mark();toTop();
}
function mark(){app.querySelectorAll(".card[data-q]").forEach(c=>c.classList.toggle("done",answered(c.dataset.q)))}
function answered(id){const v=S.ans[id];return Array.isArray(v)?v.length>0:v!==undefined}

app.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.oth){S.ans[el.dataset.oth+"_other"]=el.value.slice(0,120);save()}});
app.addEventListener("change",e=>{
  const el=e.target;if(!el.name)return;
  const q=OPTQ.find(x=>x.id===el.name);
  if(q&&q.multi){
    const boxes=[...app.querySelectorAll(`input[name="${q.id}"]`)];
    if(q.none){const ni=q.o.indexOf(q.none);
      if(+el.value===ni&&el.checked)boxes.forEach(b=>{if(+b.value!==ni)b.checked=false});
      else if(el.checked)boxes[ni].checked=false}
    S.ans[q.id]=boxes.filter(b=>b.checked).map(b=>+b.value);
    if(q.other){const oi=q.o.indexOf(q.other),on=S.ans[q.id].includes(oi),f=app.querySelector(`[data-oth="${q.id}"]`);

    box.querySelectorAll("input[data-k]").forEach(x=>{if(x.value!=="")c.staff[x.dataset.k][qOf(x.dataset.k).o[+x.dataset.o]]=+x.value});
    CFG=mergeCfg(c);try{localStorage.setItem("wq_cfg4",JSON.stringify(c))}catch(e){}
    let ok=false;try{const r=await fetch(`${DB_URL}/${CFG_PATH}.json?auth=${TOKEN}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)});ok=r.ok}catch(e){}
    adminData(ADATA);if(!ok)$("mw").textContent="Saved on this device only. Add the wqcfg rule in Firebase to save it online."};
}
function adminView(){
  $("top").classList.add("hide");$("nav").classList.add("hide");
  app.innerHTML=`<h1>Survey monitor</h1><p class="lead">Researcher access only.</p>
  <form class="card" id="af"><label class="q" for="pw">PIN</label><input class="fld" id="pw" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" required autofocus>
  <button class="btn" style="width:100%" id="ab">Open</button><p class="warn" id="aw" role="alert"></p></form><div id="ad"></div>`;
  $("af").onsubmit=async e=>{e.preventDefault();const b=$("ab"),w=$("aw");b.disabled=true;b.textContent="Checking...";w.textContent="";
    try{
      let r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+API_KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:ADMIN_USER,password:$("pw").value,returnSecureToken:true})});
      let j=await r.json();if(!r.ok)throw new Error(j.error&&/TOO_MANY/.test(j.error.message)?"Too many attempts. Please wait a few minutes.":"Wrong PIN.");
      r=await fetch(`${DB_URL}/${DB_PATH}.json?auth=${j.idToken}`);
      if(!r.ok)throw new Error("PIN accepted, but the database rule does not allow reading yet. Check the wq rule.");
      TOKEN=j.idToken;ADATA=await r.json()||{};await loadCfg();adminData(ADATA);$("af").classList.add("hide");
    }catch(err){w.textContent=err.message;b.disabled=false;b.textContent="Open"}
  };
}
const COLS=[...A.map(q=>q.id),"B1","B2","B2_other","B3","B3_other","B4",...CU.map(q=>q.id),...[1,2,3,4].map(i=>"PU"+i),...[1,2,3,4].map(i=>"PE"+i),...[1,2,3,4,5].map(i=>"RK"+i),"BI1","BI2"];
const fq=v=>{const i=FQ.indexOf(v);return i<0?"":i+1};
function toRows(data){
  return Object.entries(data).filter(([_,r])=>r&&r.v===VER).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0)).map(([id,r],n)=>{
    const d=r.d||{},s=r.s||{},o={No:n+1,ID:id,Submitted:r.ts?new Date(r.ts).toLocaleString("en-GB",{timeZone:"Asia/Muscat"}):""};
    COLS.forEach(c=>o[c]=d[c]??"");
    o.AI_use_score=fq(d.B1);
    o.AI_group=d.B1===FQ[0]?"Non-user":(d.B1===FQ[1]||d.B1===FQ[2]?"Occasional user":(d.B1?"Regular user":""));
    o.Tools_count=d.B2&&d.B2!=="Not applicable"?String(d.B2).split(" | ").length:0;
    o.NonClinical_count=d.B3&&d.B3!=="Not applicable"&&d.B3!=="None of these"?String(d.B3).split(" | ").length:0;
    o.Training_any=/^Yes/.test(d.B4||"")?1:(d.B4?0:"");
    const cu=[1,2,3,4,5].map(i=>fq(d["CU"+i])||1);
    o.CU_mean=+(cu.reduce((a,b)=>a+b,0)/5).toFixed(2);
    o.CU_dx_tx_mean=+(cu.slice(0,4).reduce((a,b)=>a+b,0)/4).toFixed(2);
    o.CU_any=cu.some(v=>v>1)?1:0;
    o.Doc_use=d.DOC==="Yes"?1:0;
    Object.assign(o,{PU_mean:s.pu,PEOU_mean:s.pe,RISK_mean:s.rk,BI_mean:s.bi});
    Object.defineProperty(o,"_ts",{value:r.ts,enumerable:false});
    return o});
}
function adminData(data){
  const rows=toRows(data),n=rows.length,old=Object.entries(data).filter(([_,r])=>!r||r.v!==VER);
  const avg=k=>n?(rows.reduce((s,r)=>s+(+r[k]||0),0)/n).toFixed(2):"-";
  $("ad").innerHTML=`<div class="facts"><div class="fact"><b>${n}</b><span>responses</span></div><div class="fact"><b>${avg("PU_mean")} / ${avg("PEOU_mean")}</b><span>useful / easy</span></div><div class="fact"><b>${avg("RISK_mean")}</b><span>mean concern</span></div></div>
   <p class="warn" id="mw" role="alert"></p>${old.length?`<p class="warn">${old.length} record(s) from an earlier version of the survey are not counted. Delete them below before the pilot.</p>`:""}${monitor(rows,data)}
   <button class="btn" id="xl" style="width:100%" ${n?"":"disabled"}>Download Excel</button>
   <div style="text-align:center"><button class="link" id="cs" ${n?"":"disabled"}>Download CSV instead</button></div>
   <div class="card"><p class="q">All records<small>Tap Delete twice to remove a test or pilot record. This cannot be undone.</small></p>
    <table class="tbl rec">${rows.slice().reverse().map(r=>`<tr><td>${r.No}</td><td>${r.Submitted}<br>${esc(r.A3)}, ${esc(r.A6)}</td><td><button class="del" data-id="${r.ID}" type="button">Delete</button></td></tr>`).join("")}${old.map(([id,r])=>`<tr><td>old</td><td>${r&&r.ts?new Date(r.ts).toLocaleString("en-GB",{timeZone:"Asia/Muscat"}):""}<br>earlier version</td><td><button class="del" data-id="${id}" type="button">Delete</button></td></tr>`).join("")||(n?"":"<tr><td>No records</td><td></td><td></td></tr>")}</table><p class="warn" id="dw" role="alert"></p></div>`;
  $("ed").onclick=editCfg;
  $("ad").querySelectorAll(".del").forEach(b=>b.onclick=async()=>{
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Confirm delete";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="Delete"}},4000);return}
    b.disabled=true;b.textContent="Deleting...";
    try{const r=await fetch(`${DB_URL}/${DB_PATH}/${b.dataset.id}.json?auth=${TOKEN}`,{method:"DELETE"});if(!r.ok)throw 0;
      delete ADATA[b.dataset.id];adminData(ADATA)}
    catch(e){b.disabled=false;b.textContent="Delete";$("dw").textContent="Could not delete. Check that the database rule allows the admin to delete, or sign in again."}});
  const stamp=new Date().toISOString().slice(0,10);
  const dl=(blob,name)=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()};
  const csv=()=>{const h=Object.keys(rows[0]);const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    dl(new Blob(["﻿"+[h.join(","),...rows.map(r=>h.map(k=>q(r[k])).join(","))].join("\r\n")],{type:"text/csv"}),`ai_doctors_data_${stamp}.csv`)};
  $("cs").onclick=csv;
  $("xl").onclick=()=>{const go=()=>{const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Data");
      const cb=[["Column","Meaning"],["A1-A7","Background: gender, age group, grade, area of practice, years as a doctor, workplace, nationality (text)"],
        ["B1","Overall frequency of AI tool use for work in the past month (GAIES Use Frequency format)"],["AI_use_score","B1 coded 1 = Never to 5 = Very frequently (nearly daily)"],["AI_group","Non-user (Never), Occasional user (Rarely or Occasionally), Regular user (Frequently or Very frequently)"],
        ["B2, B2_other","AI tools used (multiple answers separated by |) and the text typed for Other; Not applicable for non-users"],["Tools_count","Number of AI tools used"],
        ["B3, B3_other","Non-clinical purposes (multiple answers separated by |) and the text typed for Other; Not applicable for non-users"],["NonClinical_count","Number of non-clinical purposes (0 if None of these)"],
        ["B4","Formal AI training (text)"],["Training_any","1 = any formal AI training (either Yes option), 0 = No (for H8)"],
        ["CU1-CU5","Clinical use frequency in the past month: differential diagnosis, confirming a diagnosis, clinical questions, investigations or treatment, patient education. Tasks adapted from Bagla et al. (2026) and Blease et al. (2025); non-users (B1 = Never) recorded as Never"],
        ["CU_mean","Mean of CU1-CU5 coded 1 to 5 (clinical use score)"],["CU_dx_tx_mean","Mean of CU1-CU4 (diagnosis and treatment use only)"],["CU_any","1 = any clinical use (any CU item above Never), 0 = none. Step 1 outcome (logistic regression)"],
        ["DOC, Doc_use","AI help with clinical documents (Yes/No; 1/0); separate item, not part of the clinical use score"],
        ["PU1-PU4","Perceived usefulness (TAM2, Venkatesh & Davis, 2000), 1 = Strongly disagree to 5 = Strongly agree"],["PE1-PE4","Perceived ease of use (TAM2), 1 to 5"],
        ["RK1-RK5","Perceived risk (adapted from Dai et al., 2025), 1 to 5; higher = more concern"],["BI1-BI2","Intention to use (TAM2), 1 to 5"],
        ["PU_mean, PEOU_mean, RISK_mean, BI_mean","Mean of the items of each scale"],
        ...CU.slice(0,5).map(q=>[q.id,q.t]),...PU.map((t,i)=>["PU"+(i+1),t]),...PE.map((t,i)=>["PE"+(i+1),t]),...RK.map((t,i)=>["RK"+(i+1),t]),...BI.map((t,i)=>["BI"+(i+1),t])];
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cb),"Codebook");
      XLSX.writeFile(wb,`ai_doctors_data_${stamp}.xlsx`)};
    if(window.XLSX)return go();
    const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload=go;sc.onerror=csv;document.head.appendChild(sc)};
}
const start=()=>location.hash==="#admin"?adminView():render();
window.addEventListener("hashchange",start);
start();
</script>
