<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UTAS Grow Your Company</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#232C7A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: fourth desk in the UTAS family (Strategic Management, chapters 2 and 3). Big screen: "Strategy City", a skyline where
   every CEO's company rises as a building, beside strategy-fit bars (staff vs students), a vision wall and the top CEOs.
   Phone: pick a company, six yearly decisions with a coach reveal, result and Strategy Card. Each company re-tints the phone (--sc). */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#1B2559; --ink-2:#5A6488; --ink-3:#8E96B3; --line:#E3E7F2;
  --blue:#3B56A8; --navy:#2A338E; --night:#222B78;
  --orange:#F68922; --orange-2:#E66926; --orange-soft:#FFF0E0; --blue-soft:#E8EDFA;
  --up:#12A36B; --down:#E5484D; --down-soft:#FDECEC; --up-soft:#E2F6EC; --warn:#E8A317;
  --sc:#2A338E; --sc-dark:#222B78; --sc-soft:#E8EDFA;
  --display:"Lexend","Arial Rounded MT Bold","Segoe UI",sans-serif;
  --body:"Figtree","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute}
.deco .d1{width:46vmax;left:-14vmax;bottom:-20vmax;opacity:.07;animation:drift 18s ease-in-out infinite}
.deco .d2{width:36vmax;right:-10vmax;top:-14vmax;opacity:.06;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(2vmax,-2vmax) rotate(4deg)}}
#app{position:relative;z-index:1}
.card{background:var(--surface);border-radius:var(--r);box-shadow:0 1px 2px rgba(27,37,89,.04),0 10px 30px rgba(27,37,89,.07)}
.chip{display:inline-flex;align-items:center;gap:.35em;font-weight:700;font-size:.72em;letter-spacing:.06em;text-transform:uppercase;padding:.28em .65em;border-radius:99px;white-space:nowrap}
.chip.staff{background:var(--orange-soft);color:#B4500E}
.chip.student{background:var(--blue-soft);color:var(--navy)}
.oc{display:inline-flex;align-items:center;gap:.3em;font-weight:800;font-size:.75em;padding:.25em .7em;border-radius:99px;white-space:nowrap}
.oc.Thriving{background:var(--up-soft);color:#0A7A4E}
.oc.Survived{background:#FFF4DB;color:#8A5A00}
.oc.Collapsed{background:var(--down-soft);color:#A3262A}
.sc-chip{display:inline-flex;align-items:center;gap:.35em;font-weight:700;font-size:.78em;padding:.25em .7em;border-radius:99px;color:#fff;white-space:nowrap}
.sc-chip svg{width:1.1em;height:1.1em}
.brand{display:flex;align-items:center;gap:.65em}
.brand b{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1}
.brand b small{display:block;font-family:var(--body);font-size:.62em;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:.2em}
.brand .em{width:1.6em;height:auto;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:14px;padding:.95em 1.3em;font-weight:800;background:var(--night);color:#fff;transition:transform .15s,filter .2s;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.orange{background:var(--orange)}
.btn.blue{background:var(--blue)}
.btn.sc{background:var(--sc)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:var(--down)}
.btn.sm{padding:.5em .8em;border-radius:10px;font-size:.85em}
.btn:disabled{opacity:.35;cursor:not-allowed}
.status{display:inline-flex;align-items:center;gap:.5em;font-weight:700;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;padding:.45em .9em;border-radius:99px;background:var(--up-soft);color:#0A7A4E;white-space:nowrap}
.status i{width:.6em;height:.6em;border-radius:50%;background:var(--up);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(18,163,107,.5)}80%,100%{box-shadow:0 0 0 .55em rgba(18,163,107,0)}}
.av{width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9em;color:#fff;flex:none}
.av.staff{background:var(--orange)} .av.student{background:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:96;background:var(--night);color:#fff;padding:.85em 1.2em;border-radius:16px;font-weight:700;font-size:.92em;max-width:calc(100% - 32px);transition:transform .35s cubic-bezier(.2,1.3,.3,1),opacity .25s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.bad{background:var(--down)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
.flyer{position:fixed;left:0;top:0;z-index:80;pointer-events:none;display:flex;align-items:center;gap:.4em;font-weight:800;font-size:15px}
.flyer i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;border:3px solid #fff;box-shadow:0 6px 16px rgba(27,37,89,.25)}
.flyer span{background:#fff;padding:.2em .6em;border-radius:99px;box-shadow:0 4px 12px rgba(27,37,89,.15)}

/* demo navigator */
.demo{position:fixed;z-index:90;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:var(--night);color:#fff;border-radius:99px;padding:4px;box-shadow:0 8px 24px rgba(27,37,89,.3);font-size:12.5px;max-width:calc(100% - 20px);overflow-x:auto}
.demo a,.demo button{color:#C9D0EC;text-decoration:none;border:0;background:none;padding:.45em .85em;border-radius:99px;font-weight:700;white-space:nowrap}
.demo a.on{background:#fff;color:var(--night)}
.demo button.on{color:var(--orange)}
.demo span{padding:0 .4em 0 .7em;color:var(--orange);font-weight:800;letter-spacing:.06em;font-size:.85em}
body.has-demo.v-screen{padding-top:58px}
body.has-demo .app,body.has-demo .rep{padding-top:calc(60px + env(safe-area-inset-top,0px))}

/* ================= BIG SCREEN ================= */
body.v-screen{font-size:clamp(10px,.7vw + .25vh,30px);padding-block:1.1em}
@media (min-width:821px){body.v-screen{height:100vh;overflow:hidden}body.v-screen #app,.scr{height:100%}.side .panel,.board{overflow:hidden}}
.scr{display:grid;gap:1em;grid-template-rows:auto minmax(0,1fr) auto}
.s-head{display:flex;align-items:center;gap:1.4em;flex-wrap:wrap}
.logo-card{background:#fff;border-radius:18px;padding:.7em 1.1em;box-shadow:0 6px 20px rgba(27,37,89,.06);display:flex;align-items:center}
.logo-card img{height:4.4em;width:auto;display:block}
.title-block b{display:block;font-family:var(--display);font-weight:800;font-size:2.5em;letter-spacing:-.035em;line-height:1}
.title-block b span{color:var(--up)}
.title-block small{display:block;font-weight:600;color:var(--ink-2);font-size:1em;margin-top:.4em}
.s-head .mid{margin-left:auto;display:flex;align-items:center;gap:1.2em}
.bigcount{text-align:right}
.bigcount b{display:block;font-family:var(--display);font-size:2.3em;line-height:1;letter-spacing:-.03em}
.bigcount span{font-size:.8em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.scan{display:flex;align-items:center;gap:1em;background:var(--night);color:#fff;border-radius:22px;padding:.6em .6em .6em 1.2em;position:relative;overflow:hidden}
.scan::before{content:"";position:absolute;left:-2em;bottom:-2.5em;width:6em;height:6em;border-radius:50%;background:var(--up);opacity:.3}
.scan b{display:block;font-family:var(--display);font-size:1.35em;font-weight:700;line-height:1.1;position:relative}
.scan span{font-size:.9em;color:#B9C2E6;position:relative}
.scan .hl{color:var(--orange);font-weight:800}
.qr{width:7em;height:7em;background:#fff;border-radius:12px;padding:.4em;display:grid;place-items:center;flex:none;position:relative}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.s-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.1em;min-height:0}
.panel{padding:1.1em 1.3em;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel h2{margin:0 0 .6em;font-family:var(--display);font-weight:700;font-size:1.25em;letter-spacing:-.01em;display:flex;align-items:center;gap:.5em}
.panel h2 small{font-family:var(--body);font-weight:600;font-size:.62em;color:var(--ink-3);margin-left:auto;letter-spacing:0}
.b-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--ink-2);padding:2em}
.b-empty b{display:block;font-family:var(--display);font-size:1.5em;color:var(--ink);margin-bottom:.3em}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em;overflow:hidden;flex:1;min-height:0}
.feed li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:.75em;align-items:center}
.feed li.in{animation:feedin .6s cubic-bezier(.2,.9,.2,1)}
@keyframes feedin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.feed .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .t span{color:var(--ink-3);font-size:.82em}
.feed .rt{text-align:right}
.feed .rt .num{display:block;font-weight:700;font-size:.9em;margin-top:.2em}
.tape{overflow:hidden;background:var(--night);color:#fff;border-radius:14px;white-space:nowrap}
.tape-in{display:inline-flex;gap:3em;padding:.75em 1.2em;animation:tape var(--dur,90s) linear infinite}
.tape-in span{display:inline-flex;gap:.6em;align-items:baseline;font-weight:600}
.tape-in em{font-style:normal;color:var(--orange);font-weight:800;letter-spacing:.06em;font-size:.85em}
@keyframes tape{to{transform:translateX(-50%)}}
/* strategy city */
.city-card{padding:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.city-top{display:flex;align-items:center;gap:1.4em;padding:1em 1.3em .6em;flex-wrap:wrap}
.city-top h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.25em}
.city-top .kp{display:flex;gap:1.6em;margin-left:auto}
.city-top .kp div{text-align:right}
.city-top .kp b{display:block;font-family:var(--mono);font-size:1.35em;line-height:1.1}
.city-top .kp span{font-size:.7em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.city-legend{display:flex;gap:1em;padding:0 1.3em .4em;font-size:.82em;font-weight:700;color:var(--ink-2);flex-wrap:wrap}
.city-legend i{display:inline-block;width:.9em;height:.9em;border-radius:3px;margin-right:.35em;vertical-align:-.1em}
.city{flex:1;min-height:0;position:relative;background:linear-gradient(#EAF2FF,#F7FAFF 70%,#fff)}
.city svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.city .cloud{animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(-260px)}to{transform:translateX(1460px)}}
.city .bwrap{transition:transform 1.2s cubic-bezier(.2,.9,.2,1)}
.city .bld{transform-box:fill-box;transform-origin:50% 100%}
.city .bld.rise{animation:rise 1.6s cubic-bezier(.2,1.1,.3,1) both}
@keyframes rise{from{transform:scaleY(0)}}
.city .win{animation:tw var(--d,4s) ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
.city .tag{animation:tag 5s ease-out forwards}
@keyframes tag{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.city .crown{animation:bobc 2.4s ease-in-out infinite alternate}
@keyframes bobc{to{transform:translateY(-6px)}}
.city .empty{font-family:var(--display);font-size:26px;font-weight:700;fill:#8E96B3}
.side{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.1em;min-height:0;min-width:0}
.fit{display:grid;grid-template-columns:auto 1fr 1fr;gap:.45em .8em;align-items:center;font-size:.92em}
.fit .h{font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.fit .lb{font-weight:700;white-space:nowrap}
.fit .bar{height:1em;border-radius:99px;background:var(--bg);position:relative;overflow:hidden}
.fit .bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width 1s cubic-bezier(.2,.9,.2,1)}
.fit .bar.s i{background:var(--orange)} .fit .bar.u i{background:var(--blue)}
.fit .bar span{position:absolute;right:.5em;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.7em;font-weight:700;color:var(--ink-2)}
.vwall{flex:1;min-height:0;display:grid;place-items:center;text-align:center;padding:.4em .6em}
.vwall .vq{font-family:var(--display);font-weight:700;font-size:1.35em;line-height:1.3;letter-spacing:-.01em;animation:vq .8s cubic-bezier(.2,.9,.2,1);text-wrap:balance}
@keyframes vq{from{opacity:0;transform:translateY(10px)}}
.vwall .vq::before{content:"“";color:var(--up);font-size:1.4em;line-height:0;vertical-align:-.35em;margin-right:.08em}
.vwall .vq::after{content:"”";color:var(--up);font-size:1.4em;line-height:0;vertical-align:-.35em;margin-left:.05em}
.vwall .vb{margin-top:.6em;color:var(--ink-2);font-weight:600;font-size:.9em}
.tops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45em}
.tops li{display:grid;grid-template-columns:1.8em 2.2em minmax(0,1fr) auto;gap:.6em;align-items:center}
.tops .rk{font-family:var(--display);font-weight:800;color:var(--ink-3);text-align:center}
.tops li:first-child .rk{color:var(--orange)}
.tops .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95em}
.tops .t span{font-size:.78em;color:var(--ink-3)}
.tops .iq{font-family:var(--mono);font-weight:700;text-align:right}
.tops .iq small{display:block;font-family:var(--body);font-size:.7em;color:var(--ink-3);font-weight:700}
.tops .av{width:2.2em;height:2.2em;font-size:.8em}
/* ================= PHONE ================= */
/* phone game */
.yrs{display:flex;gap:.3em;align-items:center}
.yrs i{flex:1;height:.45em;border-radius:99px;background:#DCE1EE}
.yrs i.on{background:var(--sc)} .yrs i.dn{background:var(--sc);opacity:.45}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:1em;background:#fff;border-radius:16px;padding:.7em .9em;box-shadow:0 2px 8px rgba(27,37,89,.06);margin:.8em 0 .6em}
.vbar .lbl{font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.vbar b{font-family:var(--mono);font-size:1.3em}
.vbar .dl{font-family:var(--mono);font-weight:800;font-size:.85em;opacity:0}
.vbar .dl.go{animation:dd 1.8s ease-out}
@keyframes dd{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.scard{padding:1.2em 1.15em;animation:qin .45s cubic-bezier(.2,.9,.2,1)}
.ytag{display:inline-flex;align-items:center;gap:.4em;background:var(--sc);color:#fff;font-weight:800;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;padding:.3em .7em;border-radius:6px}
.scard .sit{margin:.7em 0 .2em;color:var(--ink-2)}
.scard h2{font-family:var(--display);font-weight:800;font-size:1.3em;line-height:1.2;letter-spacing:-.02em;margin:.2em 0 .9em}
.rev{margin-top:1em;border-radius:16px;padding:.95em 1em;animation:qin .4s}
.rev.g2{background:var(--up-soft)} .rev.g1{background:#FFF4DB} .rev.g0{background:var(--down-soft)}
.rev .vd{font-weight:800;font-size:.8em;letter-spacing:.1em;text-transform:uppercase}
.rev.g2 .vd{color:#0A7A4E} .rev.g1 .vd{color:#8A5A00} .rev.g0 .vd{color:#A3262A}
.rev .term{display:inline-block;margin:.45em 0 .35em;background:#fff;border-radius:10px;padding:.35em .7em;font-weight:800;font-family:var(--display)}
.rev p{margin:.2em 0;color:var(--ink)}
.rev .best{font-size:.88em;color:var(--ink-2);margin-top:.4em}
.rev .btn{width:100%;margin-top:.8em}
.own{margin-top:.8em;background:#fff;border-radius:14px;padding:.8em;border:1.5px dashed var(--line)}
.own textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:.7em .8em;font:inherit;min-height:4.5em;resize:vertical;background:var(--bg)}
.own textarea:focus{outline:none;border-color:var(--sc);background:#fff}
.chk{list-style:none;margin:.5em 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.3em .6em;font-size:.85em;font-weight:600}
.chk li{color:var(--ink-3)} .chk li.ok{color:#0A7A4E}
.chk li::before{content:"○ ";} .chk li.ok::before{content:"✓ ";}
.res-hero .iq{display:flex;align-items:baseline;gap:.5em;margin-top:.3em}
.res-hero .iq b{font-family:var(--display);font-size:3.2em;line-height:1;letter-spacing:-.04em}
.growth{padding:1em 1.1em;margin-top:.9em}
.growth img{width:100%;display:block}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em}
.tl li{display:grid;grid-template-columns:1.9em 1fr;gap:.6em;align-items:start}
.tl li i{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;font-size:.85em}
.tl li b{display:block;font-size:.93em}
.tl li span{display:block;color:var(--ink-2);font-size:.85em}
.tl li small{display:block;color:var(--ink-3);font-size:.78em}
.mk2{background:var(--up)} .mk1{background:var(--warn)} .mk0{background:var(--down)}

body.v-play{padding-block:0 calc(30px + env(safe-area-inset-bottom,0px))}
.app{max-width:460px;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top,0px));position:relative}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:.8em;padding:.4em 0 .9em}
.p-head .brand b{font-size:1.1em}
.hero{text-align:center;padding:.4em .4em .2em}
.siren{width:7em;height:7em;margin:0 auto}
.siren .glow{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.25}}
.hero h1{font-family:var(--display);font-weight:800;font-size:2.1em;line-height:1.05;letter-spacing:-.04em;margin:.3em 0 .3em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--down)}
.hero p{color:var(--ink-2);margin:0 auto;max-width:24em}
.facts{display:flex;justify-content:center;gap:.5em;margin-top:.9em;flex-wrap:wrap}
.facts span{background:#fff;border-radius:99px;padding:.35em .8em;font-weight:700;font-size:.82em;color:var(--ink-2);box-shadow:0 2px 8px rgba(27,37,89,.06)}
.form{padding:1.2em;display:flex;flex-direction:column;gap:1em;margin-top:1.2em}
.field{display:flex;flex-direction:column;gap:.4em}
.field label{font-weight:700;font-size:.85em;color:var(--ink-2)}
.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:.9em 1em;font-size:1.02em;width:100%;transition:border-color .2s,background .2s}
.field input:focus{border-color:var(--blue);background:#fff;outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:.85em .5em;font-weight:800;display:flex;align-items:center;justify-content:center;gap:.5em;transition:all .2s}
.seg button svg{width:1.4em;height:1.4em}
.seg button.staff[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.seg button.student[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.err{color:var(--down);font-weight:600;font-size:.9em;min-height:1.2em;margin:-.3em 0}
.sect-t{display:flex;justify-content:space-between;align-items:baseline;margin:1em 0 .7em}
.sect-t h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.1em}

.intro{border-radius:24px;color:#fff;padding:1.4em 1.3em;position:relative;overflow:hidden;background:linear-gradient(140deg,var(--sc),var(--sc-dark))}

.intro .k{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.72em;opacity:.85}

.rules{padding:1em 1.1em;margin-top:.9em}

.rules b{color:var(--ink)}
.dials{display:grid;grid-template-columns:repeat(4,1fr);gap:.45em}
.dial{background:#fff;border-radius:14px;padding:.5em .5em .55em;box-shadow:0 2px 8px rgba(27,37,89,.06);position:relative;min-width:0}
.dial .dh{display:flex;align-items:center;gap:.3em;font-size:.68em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.dial .dh svg{width:1.3em;height:1.3em;flex:none;color:var(--sc)}
.dial .dv{font-family:var(--mono);font-weight:700;font-size:1.15em;margin-top:.15em}
.dial .dt{height:.38em;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:.25em}
.dial .dt i{display:block;height:100%;border-radius:99px;background:var(--up);transition:width .9s cubic-bezier(.2,.9,.2,1),background .6s}
.dial .dd{position:absolute;right:.4em;top:.35em;font-family:var(--mono);font-size:.78em;font-weight:800;opacity:0}
.dial .dd.go{animation:dd 1.8s ease-out}
@keyframes dd{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.ptop{display:flex;align-items:center;justify-content:space-between;margin:.9em 0 .6em}
.ptop .step{display:flex;gap:.3em}

.ptop .step i.dn{background:var(--sc);opacity:.45}
.timer{width:3.4em;height:3.4em;position:relative}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:1.05em}
.timer.warn b{color:var(--down)}
.ccard{padding:1.2em 1.15em;animation:qin .45s cubic-bezier(.2,.9,.2,1)}

@keyframes blink{50%{opacity:.2}}

.opts{display:flex;flex-direction:column;gap:.6em}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:.9em 1em;font-weight:600;display:grid;grid-template-columns:2em 1fr;gap:.7em;align-items:center;transition:all .18s}
.opts button b{width:2em;height:2em;border-radius:10px;background:#fff;display:grid;place-items:center;font-family:var(--display);color:var(--sc);box-shadow:0 1px 3px rgba(27,37,89,.1)}

.opts button:disabled:not(.sel){opacity:.4}
.fx{margin-top:1em;border-radius:16px;padding:.9em 1em;background:var(--sc-soft);animation:qin .4s}

.fx p{margin:0 0 .6em;font-weight:600}
.fxc{display:flex;gap:.35em;flex-wrap:wrap}

.res-hero .k{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.72em;opacity:.85}
.res-hero h1{font-family:var(--display);font-weight:800;font-size:2.3em;line-height:1;letter-spacing:-.04em;margin:.2em 0 .15em}

.sect p{margin:0;color:var(--ink-2)}

.actions{display:flex;flex-direction:column;gap:.6em;margin-top:1em}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.7em;margin:1.2em 0}

.insight{background:var(--surface);border-radius:16px;padding:.9em 1.1em;box-shadow:0 4px 14px rgba(27,37,89,.05);margin:.6em 0;border-left:0}

function derive(st) {
  const plays = Object.entries(st.plays || {}).map(([id, v]) => ({id, ...v})).filter(p => CO[p.co] && Array.isArray(p.answers)).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const best = (p, i) => { const o = CO[p.co].steps[i].o[p.answers[i]]; return o ? o[2] : 0; };
  const fitOf = list => TKEYS.map((k, i) => list.length ? list.filter(p => best(p, i) === 2).length / list.length * 100 : 0);
  const staff = plays.filter(p => p.group === "staff"), stud = plays.filter(p => p.group !== "staff");
  const fitS = fitOf(staff), fitU = fitOf(stud), fitA = fitOf(plays);
  const C = {};
  CKEYS.forEach(k => {
    const ps = plays.filter(p => p.co === k), s = ps.filter(p => p.group === "staff"), u = ps.filter(p => p.group !== "staff");
    const dist = list => CO[k].steps.map((_, i) => [0, 1, 2].map(o => list.length ? list.filter(p => p.answers[i] === o).length / list.length * 100 : 0));
    C[k] = {n: ps.length, nS: s.length, nU: u.length, avg: ps.length ? ps.reduce((a, p) => a + p.iq, 0) / ps.length : 0, val: ps.length ? ps.reduce((a, p) => a + p.value, 0) / ps.length : 0, dS: dist(s), dU: dist(u), dA: dist(ps)};
  });
  const top = [...plays].sort((a, b) => b.iq - a.iq || b.value - a.value || a.ts - b.ts).slice(0, 10);
  const visions = plays.filter(p => p.vision && p.vstatus === "approved");
  const pending = plays.filter(p => p.vision && p.vstatus === "pending").reverse();
  const miss = plays.length ? TKEYS.map((k, i) => i).sort((a, b) => fitA[a] - fitA[b])[0] : -1;
  const gapI = staff.length && stud.length ? TKEYS.map((k, i) => i).sort((a, b) => Math.abs(fitS[b] - fitU[b]) - Math.abs(fitS[a] - fitU[a]))[0] : -1;
  return {plays, n: plays.length, nS: staff.length, nU: stud.length, fitS, fitU, fitA, C, top, visions, pending, miss, gapI,
    avg: plays.length ? plays.reduce((a, p) => a + p.iq, 0) / plays.length : 0, total: plays.reduce((a, p) => a + (p.value || 0), 0),
    avgS: staff.length ? staff.reduce((a, p) => a + p.iq, 0) / staff.length : 0, avgU: stud.length ? stud.reduce((a, p) => a + p.iq, 0) / stud.length : 0};
}

      ${p < 2 ? `<p class="best">Best fit here: <b>${esc(bst[1])}</b>, “${esc(bst[0])}”</p>` : ""}
      ${si === 0 ? `<div class="own" id="own"><b style="font-size:.95em">Bonus: write your own vision</b><p style="margin:.2em 0 .5em;color:var(--ink-2);font-size:.88em">Optional. Each check you pass adds 2% to your company value, and good visions appear on the big screen.</p>
        <textarea id="vt" maxlength="200" placeholder="To be…"></textarea><ul class="chk" id="chk">${Object.keys(CHK_LBL).map(k => `<li data-c="${k}">${CHK_LBL[k]}</li>`).join("")}</ul></div>` : ""}
      <button class="btn sc" id="nx">${last ? "See my results" : "Next year ›"}</button></div>`;
    if (si === 0) {
      const t = $("#vt"); t.value = vtext;
      const upd = () => { vtext = t.value; const c = visionChecks(vtext, co); $("#chk").querySelectorAll("li").forEach(li => li.classList.toggle("ok", !!vtext.trim() && c[li.dataset.c])); };
      t.oninput = upd; upd();
    }
    $("#nx").onclick = next;
    $("#rv").scrollIntoView({behavior: "smooth", block: "nearest"});
  }
  async function next() {
    if (si === 0 && vtext.trim()) {
      const n = passedOf(visionChecks(vtext, co));
      if (n) { value *= 1 + .02 * n; }
    }
    if (si < 5) { si++; const v0 = value; draw(); scrollTo({top: 0}); if (si === 1 && vtext.trim()) { const n = passedOf(visionChecks(vtext, co)); if (n) { $("#vv").dataset.v = v0 / (1 + .02 * n); bump(2 * n); toast(`Vision bonus: +${2 * n}% company value`); } } return; }
    const vision = words(vtext).length >= 3 ? vtext.trim().replace(/\s+/g, " ") : "";
    const vchecks = vision ? passedOf(visionChecks(vision, co)) : 0;
    const res = simulate(co, answers, vchecks);
    const rec = {uid, name, group, co, answers, vision, vchecks, vstatus: vision ? "pending" : "", ...res};
    $("#nx").disabled = true; $("#nx").textContent = "Saving…";
    try {
      await be.submit(uid + "_" + co, rec);
      lastRes = {...rec, id: uid + "_" + co, ts: Date.now()}; stage = "result"; draw(); scrollTo({top: 0});
      if (res.iq >= 50) setTimeout(() => confetti({x: innerWidth / 2, y: 160}), 300);
    } catch { $("#nx").disabled = false; $("#nx").textContent = "Try again"; toast("Could not save your result. Check your internet.", true); }
  }
  draw();
  be.subscribe(render);
}

/* =====================================================================
   CONTROL DESK  (#admin)  and  REPORT  (#report)
   ===================================================================== */
function gate(box, again) {
  if (sess.get("gc-admin") === "1") return true;
  if (!$("#pinf")) {
    box.innerHTML = `<form class="card form" id="pinf"><div class="field"><label for="pin">Desk PIN</label><input id="pin" inputmode="numeric" autocomplete="off" placeholder="••••"></div><div class="err" id="pe"></div><button class="btn">Unlock</button></form>`;
    $("#pinf").onsubmit = e => { e.preventDefault(); if ($("#pin").value === CONFIG.adminPin) { sess.set("gc-admin", "1"); again(); } else $("#pe").textContent = "Wrong PIN."; };
  }
  return false;
}
function csvOf(D) {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["Name", "Group", "Company", "Strategy IQ", "Rank", "Final value (OMR K)", ...TKEYS.map(k => TSHORT[k] + " (choice)"), ...TKEYS.map(k => TSHORT[k] + " (fit 0-2)"), "Own vision", "Vision checks (of 4)", "Vision status", "Time"];
  const rows = D.plays.map(p => { const S = CO[p.co]; const o = S.steps.map((st, i) => st.o[p.answers[i]] || ["", "", 0]); return [p.name, p.group, S.name, p.iq, p.rank || rankOf(p.iq), p.value, ...o.map(x => x[1]), ...o.map(x => x[2]), p.vision || "", p.vision ? p.vchecks : "", p.vstatus || "", new Date(p.ts).toLocaleString("en-GB")]; });
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\n")], {type: "text/csv"})); a.download = "utas-grow-your-company.csv"; document.body.appendChild(a); a.click(); a.remove();
}
function Admin(be) {
  document.body.classList.add("v-admin");
  let D, raw, q = "", pending = null;
  $("#app").innerHTML = `<div class="app"><div class="p-head"><div class="brand">${EMBLEM()}<b>Control desk<small>UTAS Grow Your Company</small></b></div><span class="status"><i></i>Live</span></div><div id="ab"></div></div>`;
  function render(st) {
    if (st) raw = st; if (!raw) return; D = derive(raw);
    if (!gate($("#ab"), render)) return;
    const focus = document.activeElement?.id === "srch";
    const list = D.plays.filter(p => !q || p.name.toLowerCase().includes(q.toLowerCase()));
    $("#ab").innerHTML = `<div class="adm">
      <div class="card"><div class="stats"><div><span>CEOs</span><b>${D.n}</b></div><div><span>Staff / Students</span><b>${D.nS} / ${D.nU}</b></div><div><span>Avg Strategy IQ</span><b>${Math.round(D.avg)}</b></div>${CKEYS.map(k => `<div><span>${CO[k].name}</span><b>${D.C[k].n} · IQ ${Math.round(D.C[k].avg)}</b></div>`).join("")}</div></div>
      <div class="card"><h3>Vision Wall approvals ${D.pending.length ? `<span class="oc" style="background:#FFF4DB;color:#8A5A00">${D.pending.length} waiting</span>` : ""}</h3><p>Visitors' own visions appear on the big screen only after you approve them.</p>
        <ul class="plist">${D.pending.map(p => `<li><div class="top"><span class="av ${p.group}">${esc(initials(p.name))}</span><span class="nm"><b>${esc(p.name)}</b><small style="color:var(--ink-3)">${CO[p.co].name} · ${p.vchecks}/4 checks · ${ago(p.ts)}</small></span></div>
          <p style="margin:.5em 0 0;font-weight:700;color:var(--ink)">“${esc(p.vision)}”</p><div class="acts"><button class="a3" data-ok="${p.id}">Approve</button><button class="a4" data-no="${p.id}">Reject</button></div></li>`).join("") || `<li style="color:var(--ink-3)">Nothing waiting.</li>`}</ul></div>
      <div class="card"><h3>Analysis report</h3><p>Strategy fit by topic for staff and students, every option chosen, the visitors' visions and the top CEOs. Print it, save it as PDF, or download a CSV.</p><div class="row-b"><a class="btn blue" href="#report">Open report</a><button class="btn ghost" id="csv">Download CSV</button></div></div>
      <div class="card"><h3>CEOs</h3><p><b>Card</b> opens a player's PDF Strategy Card. <b>Remove</b> deletes a result so they can play that company again.</p>
        <input class="search" id="srch" placeholder="Search by name" value="${esc(q)}">
        <ul class="plist">${list.map(p => `<li><div class="top"><span class="av ${p.group}">${esc(initials(p.name))}</span><span class="nm"><b>${esc(p.name)}</b><small style="color:var(--ink-3)">${CO[p.co].name} · ${ago(p.ts)}${p.vision ? ` · vision ${p.vstatus}` : ""}</small></span><span class="oc" style="background:${CO[p.co].soft};color:${CO[p.co].dark}">IQ ${p.iq}</span></div>
          <div class="acts"><button class="a3" data-cert="${p.id}">Card</button>${p.vision && p.vstatus === "approved" ? `<button class="a4" data-no="${p.id}">Hide vision</button>` : ""}${p.vision && p.vstatus === "rejected" ? `<button class="a3" data-ok="${p.id}">Show vision</button>` : ""}<button class="a4" data-del="${p.id}">Remove</button></div></li>`).join("") || `<li style="color:var(--ink-3)">${D.n ? "No match." : "No one has finished yet."}</li>`}</ul></div>
      <div class="card"><h3>Reset</h3><p>Deletes every result. Do this right before the Open Day starts.</p><div class="row-b"><button class="btn ghost" id="b-reset">Reset everything</button>${!be.live ? `<button class="btn ghost" id="b-seed">Reload demo data</button>` : ""}</div><div id="cf"></div></div>
      <div class="card"><h3>Links</h3><p>Big screen<span class="link">${esc(baseURL())}</span></p><p>Phones (the QR code opens this)<span class="link">${esc(baseURL())}#play</span></p><p style="margin:0">Control desk<span class="link">${esc(baseURL())}#admin</span></p></div></div>`;
    const s = $("#srch"); s.oninput = e => { q = e.target.value; render(); }; if (focus) { s.focus(); s.setSelectionRange(q.length, q.length); }
    $("#csv").onclick = () => csvOf(D);
    $("#ab").querySelectorAll("[data-ok]").forEach(x => x.onclick = async () => { await be.update(x.dataset.ok, {vstatus: "approved"}); toast("Vision is on the wall."); });
    $("#ab").querySelectorAll("[data-no]").forEach(x => x.onclick = async () => { await be.update(x.dataset.no, {vstatus: "rejected"}); toast("Vision hidden."); });
    $("#ab").querySelectorAll("[data-cert]").forEach(x => x.onclick = () => showCert(D.plays.find(p => p.id === x.dataset.cert)));
    $("#ab").querySelectorAll("[data-del]").forEach(x => x.onclick = () => { const p = D.plays.find(y => y.id === x.dataset.del); ask(`Remove ${p.name}'s ${CO[p.co].name} result?`, "Remove", () => be.remove(p.id)); });
    $("#b-reset").onclick = () => ask("Delete every result? This cannot be undone.", "Yes, reset", () => be.reset(false));
    $("#b-seed") && ($("#b-seed").onclick = () => be.reset(true));
    if (pending) showAsk();
  }
  function ask(qs, label, fn) { pending = {qs, label, fn}; showAsk(); }
  function showAsk() {
    const c = $("#cf"); if (!c) return;
    c.innerHTML = `<div class="confirm">${esc(pending.qs)}<div class="row-b"><button class="btn red" id="cy">${esc(pending.label)}</button><button class="btn ghost" id="cn">Cancel</button></div></div>`;
    c.scrollIntoView({behavior: "smooth", block: "center"});
    $("#cy").onclick = async () => { const p = pending; pending = null; await p.fn(); toast("Done."); };
    $("#cn").onclick = () => { pending = null; c.innerHTML = ""; };
  }
  be.subscribe(render);
}
function Report(be) {
  document.body.classList.add("v-report");
  let raw;
  $("#app").innerHTML = `<div class="rep" id="rep"></div>`;
  function render(st) {
    if (st) raw = st; if (!raw) return; const D = derive(raw), box = $("#rep");
    if (sess.get("gc-admin") !== "1") { if (!$("#pinf")) box.innerHTML = `<div class="app" style="padding-top:0"><div id="rb"></div></div>`; gate($("#rb"), render); return; }
    const day = new Date().toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
    const r = v => Math.round(v) + "%";
    let html = `<div class="rep-head"><img src="${LOGO_SRC}" alt="UTAS Ibra"><div class="rep-actions"><a class="btn ghost sm" href="#admin">Back to desk</a><button class="btn blue sm" id="csv">Download CSV</button><button class="btn sm" id="prt">Print or save PDF</button></div></div>
      <h1>Grow Your Company: strategy analysis</h1><div class="sub">${esc(CONFIG.eventLine)} · ${day}</div>
      <div class="kpis"><div><span>CEOs</span><b>${D.n}</b></div><div><span>Staff</span><b>${D.nS}</b></div><div><span>Students</span><b>${D.nU}</b></div><div><span>Avg Strategy IQ</span><b>${Math.round(D.avg)}</b></div><div><span>Staff IQ</span><b>${Math.round(D.avgS)}</b></div><div><span>Students IQ</span><b>${Math.round(D.avgU)}</b></div><div><span>Own visions</span><b>${D.plays.filter(p => p.vision).length}</b></div></div>`;
    if (D.miss >= 0) html += `<div class="insight"><b>Hardest topic:</b> ${TOPICS[TKEYS[D.miss]]}. Only ${r(D.fitA[D.miss])} chose the best-fit strategy.</div>`;
    if (D.gapI >= 0) html += `<div class="insight"><b>Biggest staff–student gap:</b> ${TOPICS[TKEYS[D.gapI]]}. ${r(D.fitS[D.gapI])} of staff vs ${r(D.fitU[D.gapI])} of students chose the best fit.</div>`;
    html += `<h2>Strategy fit by topic (Chapters 2 and 3)</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>Topic</th><th class="n">Staff</th><th class="n">Students</th><th class="n">All</th></tr></thead><tbody>${TKEYS.map((k, i) => `<tr><td><b>${TOPICS[k]}</b></td><td class="n">${D.nS ? r(D.fitS[i]) : "–"}</td><td class="n">${D.nU ? r(D.fitU[i]) : "–"}</td><td class="n">${D.n ? r(D.fitA[i]) : "–"}</td></tr>`).join("")}</tbody></table></div>`;
    CKEYS.forEach(k => {
      const S = CO[k], A = D.C[k];
      html += `<h2><i style="background:${S.color}">${coIcon(k)}</i>${S.name}</h2>`;
      if (!A.n) { html += `<p class="sub">No CEOs played this company yet.</p>`; return; }
      html += `<div class="kpis"><div><span>CEOs</span><b>${A.n}</b></div><div><span>Staff / Students</span><b>${A.nS} / ${A.nU}</b></div><div><span>Avg Strategy IQ</span><b>${Math.round(A.avg)}</b></div><div><span>Avg final value</span><b>${money(A.val)}</b></div></div>`;
      html += `<div class="tbl-wrap"><table class="t"><thead><tr><th>Decision and options (★ = best fit)</th><th class="n">Staff</th><th class="n">Students</th><th class="n">All</th></tr></thead><tbody>${S.steps.map((st, i) => `<tr class="cr"><td colspan="4">${st.y}. ${esc(st.q)} <span style="font-weight:600;color:var(--ink-3)">(${TOPICS[st.k]})</span></td></tr>` + st.o.map((o, oi) => `<tr><td>${o[2] === 2 ? "★ " : ""}<b>${esc(o[1])}</b><br><span style="color:var(--ink-2)">${esc(o[0])}</span></td><td class="n">${A.nS ? r(A.dS[i][oi]) : "–"}</td><td class="n">${A.nU ? r(A.dU[i][oi]) : "–"}</td><td class="n">${r(A.dA[i][oi])}</td></tr>`).join("")).join("")}</tbody></table></div>`;
    });
    const vis = D.plays.filter(p => p.vision);
    html += `<h2>Visions written by visitors</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>Vision</th><th>Name</th><th>Company</th><th class="n">Checks</th><th>Status</th></tr></thead><tbody>${vis.map(p => `<tr><td><b>“${esc(p.vision)}”</b></td><td>${esc(p.name)}</td><td>${CO[p.co].name}</td><td class="n">${p.vchecks}/4</td><td>${p.vstatus}</td></tr>`).join("") || `<tr><td colspan="5">No visions written yet.</td></tr>`}</tbody></table></div>`;
    html += `<h2>Top 10 CEOs</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th>Name</th><th>Group</th><th>Company</th><th>Rank</th><th class="n">Strategy IQ</th><th class="n">Value</th></tr></thead><tbody>${D.top.map((p, i) => `<tr><td>${i + 1}</td><td><b>${esc(p.name)}</b></td><td><span class="chip ${p.group}">${p.group}</span></td><td>${CO[p.co].name}</td><td>${esc(p.rank || rankOf(p.iq))}</td><td class="n">${p.iq}</td><td class="n">${money(p.value)}</td></tr>`).join("") || `<tr><td colspan="7">No CEOs yet.</td></tr>`}</tbody></table></div>
      <p class="rep-foot">Prepared by the MBA (Leadership and Innovation) postgraduate group, UTAS Ibra. Each decision scores 2 (best fit), 1 (partly right) or 0 (weak fit); Strategy IQ = points out of 12 × 100. Company value starts at OMR 100K and changes by +25%, +8% or −12% per decision, plus up to 8% for an own vision that passes the four checks (one sentence, 4–25 words, no numbers, shows the business).</p>`;
    box.innerHTML = html;
    $("#csv").onclick = () => csvOf(D);
    $("#prt").onclick = () => { try { window.print(); } catch {} };
  }
  be.subscribe(render);
}

/* ---------------- boot ---------------- */
(async function boot() {
  let be = null;
  if (CONFIG.firebase && CONFIG.firebase.databaseURL) {
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js");
      await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js");
      be = firebaseBackend(CONFIG.firebase);
    } catch (e) { console.warn("Firebase failed, using demo mode", e); }
  }
  const h = location.hash.replace("#", "");
  if (!be) {
    be = localBackend();
    if (!Object.keys(be.peek().plays).length && store.get("utas-gc-seeded") !== "1") { store.set("utas-gc-seeded", "1"); seedDemo(be); }
    const sim = () => store.get("gc-sim") !== "off";
    const nav = document.createElement("nav"); nav.className = "demo"; nav.setAttribute("aria-label", "Demo views");
    const draw = () => nav.innerHTML = `<span>DEMO</span><a href="#" class="${!h ? "on" : ""}">Big screen</a><a href="#play" class="${h === "play" ? "on" : ""}">Phone</a><a href="#admin" class="${h === "admin" || h === "report" ? "on" : ""}">Desk</a>${!h ? `<button class="${sim() ? "on" : ""}" id="simb">${sim() ? "● Visitors on" : "○ Visitors off"}</button>` : ""}`;
    draw(); document.body.appendChild(nav); document.body.classList.add("has-demo");
    nav.addEventListener("click", e => { if (e.target.id === "simb") { store.set("gc-sim", sim() ? "off" : "on"); draw(); } });
  }
  if (h === "play") Play(be); else if (h === "admin") Admin(be); else if (h === "report") Report(be); else Screen(be);
  addEventListener("hashchange", () => location.reload());
})();
